function formatHuman(num) {
    if (num >= 1e9) return "$" + (num/1e9).toFixed(2) + "B";
    if (num >= 1e6) return "$" + (num/1e6).toFixed(2) + "M";
    if (num >= 1e3) return "$" + (num/1e3).toFixed(2) + "K";
    return "$" + num.toFixed(0);
}

function render() {
    const container = document.getElementById('labels');
    container.innerHTML = "";
    const grouped = {}
    data.forEach(r => {
        if (!grouped[r.label]) grouped[r.label] = [];
        grouped[r.label].push(r);
    });
    Object.keys(grouped).forEach(label => {
        let artists = grouped[label];
        let totalRev = artists.reduce((a,c) => a+c.revenue_total,0);
        let totalDebt = artists.reduce((a,c) => a+c.debt,0);
        let totalNet = artists.reduce((a,c) => a+c.net,0);
        let html = `
          <div class="bg-gray-800 p-6 rounded-2xl shadow mb-6">
            <h2 class="text-2xl font-bold text-cyan-400 mb-2">${label}</h2>
            <p><strong>Artists:</strong> ${artists.length}</p>
            <p><strong>Total Revenue:</strong> ${formatHuman(totalRev)}</p>
            <p><strong>Total Debt:</strong> ${formatHuman(totalDebt)}</p>
            <p><strong>Net:</strong> ${formatHuman(totalNet)}</p>
            <div class="overflow-x-auto mt-4">
              <table class="min-w-full text-sm">
                <thead class="bg-gray-700">
                  <tr>
                    <th class="px-2 py-1">Artist</th>
                    <th class="px-2 py-1">Sales (M)</th>
                    <th class="px-2 py-1">Plays (M)</th>
                    <th class="px-2 py-1">Revenue</th>
                    <th class="px-2 py-1">Debt</th>
                    <th class="px-2 py-1">Net</th>
                  </tr>
                </thead>
                <tbody>`;
        artists.forEach(a => {
            html += `<tr class="border-b border-gray-700">
              <td class="px-2 py-1">${a.artist}</td>
              <td class="px-2 py-1 text-right">${a.sales_m.toLocaleString()}</td>
              <td class="px-2 py-1 text-right">${a.plays_m.toLocaleString()}</td>
              <td class="px-2 py-1 text-right">${formatHuman(a.revenue_total)}</td>
              <td class="px-2 py-1 text-right">${formatHuman(a.debt)}</td>
              <td class="px-2 py-1 text-right">${formatHuman(a.net)}</td>
            </tr>`;
        });
        html += `</tbody></table></div></div>`;
        container.innerHTML += html;
    });
}
