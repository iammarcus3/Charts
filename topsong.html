<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Top Songs</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0d0d0d;
      color: #eaeaea;
      padding: 2rem;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 1.5rem;
      color: #ffffff;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #333;
    }

    .tab-button {
      padding: 0.75rem 1.25rem;
      background: transparent;
      color: #aaa;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
    }

    .tab-button:hover {
      color: #ffffff;
    }

    .tab-button.active {
      color: #4db8ff;
      border-bottom-color: #4db8ff;
    }

    .year-controls {
      margin-bottom: 1.5rem;
    }

    .year-controls.hidden {
      display: none;
    }

    label,
    select {
      font-size: 1rem;
    }

    select {
      padding: 0.5rem;
      background-color: #1e1e1e;
      color: #ffffff;
      border: 1px solid #444;
      border-radius: 5px;
      margin-left: 0.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      background-color: #161616;
      border-radius: 8px;
      overflow: hidden;
    }

    th,
    td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid #333;
    }

    th {
      background-color: #222;
      font-weight: bold;
      color: #ddd;
    }

    tr:hover {
      background-color: #1f1f1f;
    }

    a {
      color: #4db8ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .number {
      text-align: right;
    }

    .empty-message {
      padding: 2rem;
      text-align: center;
      color: #999;
    }

    @media (max-width: 900px) {
      body {
        padding: 1rem;
      }

      table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
      }
    }
  </style>
</head>

<body>
  <h1 id="pageTitle">Top 30 Songs of All Time</h1>

  <div class="tabs">
    <button
      type="button"
      class="tab-button active"
      id="allTimeTab"
      data-view="allTime"
    >
      All Time
    </button>

    <button
      type="button"
      class="tab-button"
      id="yearTab"
      data-view="year"
    >
      By Year
    </button>
  </div>

  <div class="year-controls hidden" id="yearControls">
    <label for="yearSelect">Select Year:</label>
    <select id="yearSelect"></select>
  </div>

  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>Song</th>
        <th>Artist</th>
        <th class="number" id="salesColumnHeading">All-Time Sales</th>
        <th class="number">Sales to Date</th>
        <th class="number">Weeks</th>
        <th class="number">Peak</th>
      </tr>
    </thead>

    <tbody id="songTable"></tbody>
  </table>

  <script src="weekdata.js"></script>

  <script>
    const yearSelect = document.getElementById('yearSelect');
    const yearControls = document.getElementById('yearControls');
    const tableBody = document.getElementById('songTable');
    const pageTitle = document.getElementById('pageTitle');
    const salesColumnHeading = document.getElementById(
      'salesColumnHeading'
    );

    const tabButtons = document.querySelectorAll('.tab-button');

    let currentView = 'allTime';

    /*
     * Normalises the title so minor title formatting differences
     * do not automatically create separate song entries.
     */
    function normalizeSong(name) {
      if (typeof name !== 'string') return '';

      return name
        .toLowerCase()
        .replace(/\s*[\(\[].*?[\)\]]/g, ' ')
        .replace(/\b(feat|ft|featuring)\.?\b.*$/i, ' ')
        .replace(/[-–—_]/g, ' ')
        .replace(/[^a-z0-9 ]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    /*
     * Normalises artist formatting to reduce duplicate entries caused by:
     * &, "and", featuring, commas and repeated spacing.
     */
    function normalizeArtist(name) {
      if (typeof name !== 'string') return '';

      return name
        .toLowerCase()
        .replace(/\b(feat|ft|featuring)\.?\b/g, '&')
        .replace(/\band\b/g, '&')
        .replace(/[,+/]/g, '&')
        .replace(/[^a-z0-9& ]/g, ' ')
        .replace(/\s*&\s*/g, '&')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function encodeParam(param) {
      return encodeURIComponent(
        String(param || '').replace(/\s+/g, '_')
      );
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatNumber(number) {
      const n = Number(number) || 0;

      if (n >= 1_000_000_000) {
        return (n / 1_000_000_000)
          .toFixed(1)
          .replace('.0', '') + 'B';
      }

      if (n >= 1_000_000) {
        return (n / 1_000_000)
          .toFixed(1)
          .replace('.0', '') + 'M';
      }

      if (n >= 1_000) {
        return (n / 1_000)
          .toFixed(1)
          .replace('.0', '') + 'K';
      }

      return Math.round(n).toLocaleString();
    }

    const weekStartDate = new Date(2018, 1, 23);
    const msPerWeek = 7 * 24 * 60 * 60 * 1000;

    function getWeekYear(weekNum, entry) {
      if (entry && entry.date) {
        const date = new Date(entry.date);

        if (!Number.isNaN(date.getTime())) {
          return date.getFullYear();
        }
      }

      const calculatedDate = new Date(
        weekStartDate.getTime() + (weekNum - 1) * msPerWeek
      );

      return calculatedDate.getFullYear();
    }

    function getUniqueYears() {
      const years = [];

      for (const [weekKey, entries] of Object.entries(weekData || {})) {
        if (!Array.isArray(entries) || entries.length === 0) continue;

        const weekNum = Number(weekKey);
        const year = getWeekYear(weekNum, entries[0]);

        if (year && !years.includes(year)) {
          years.push(year);
        }
      }

      return years.sort((a, b) => b - a);
    }

    const uniqueYears = getUniqueYears();

    uniqueYears.forEach(year => {
      const option = document.createElement('option');
      option.value = year;
      option.textContent = year;
      yearSelect.appendChild(option);
    });

    /*
     * Creates the main song database once.
     *
     * Each song contains:
     * - Total all-time sales
     * - Total all-time weeks
     * - All-time peak
     * - Sales and weeks for each individual year
     */
    function buildSongDatabase() {
      const songMap = new Map();

      for (const [weekKey, entries] of Object.entries(weekData || {})) {
        if (!Array.isArray(entries)) continue;

        const weekNum = Number(weekKey);

        for (const entry of entries) {
          if (!entry || !entry.title || !entry.artist) continue;

          const entryYear = getWeekYear(weekNum, entry);
          const normalizedTitle = normalizeSong(entry.title);
          const normalizedArtist = normalizeArtist(entry.artist);

          if (!normalizedTitle || !normalizedArtist) continue;

          const key =
            normalizedTitle + '___' + normalizedArtist;

          const rank = Number(entry.rank);
          const rawSales = Number(entry.sales) || 0;
          const weekSales = rawSales * 1750;

          const songInfo = songMap.get(key) || {
            song: entry.title,
            artist: entry.artist,
            totalSales: 0,
            totalWeeks: 0,
            peak: Number.isFinite(rank) ? rank : 999,
            yearlyData: {}
          };

          songInfo.totalSales += weekSales;
          songInfo.totalWeeks += 1;

          if (
            Number.isFinite(rank) &&
            rank > 0 &&
            rank < songInfo.peak
          ) {
            songInfo.peak = rank;
          }

          if (!songInfo.yearlyData[entryYear]) {
            songInfo.yearlyData[entryYear] = {
              sales: 0,
              weeks: 0,
              peak: Number.isFinite(rank) ? rank : 999
            };
          }

          const yearlyInfo = songInfo.yearlyData[entryYear];

          yearlyInfo.sales += weekSales;
          yearlyInfo.weeks += 1;

          if (
            Number.isFinite(rank) &&
            rank > 0 &&
            rank < yearlyInfo.peak
          ) {
            yearlyInfo.peak = rank;
          }

          songMap.set(key, songInfo);
        }
      }

      return songMap;
    }

    const songDatabase = buildSongDatabase();

    function getAllTimeTopSongs() {
      return [...songDatabase.values()]
        .filter(song => song.totalSales > 0)
        .sort((a, b) => {
          if (b.totalSales !== a.totalSales) {
            return b.totalSales - a.totalSales;
          }

          if (a.peak !== b.peak) {
            return a.peak - b.peak;
          }

          return b.totalWeeks - a.totalWeeks;
        })
        .slice(0, 50)
        .map(song => ({
          song: song.song,
          artist: song.artist,
          selectedSales: song.totalSales,
          totalSales: song.totalSales,
          weeks: song.totalWeeks,
          peak: song.peak
        }));
    }

    function getTopSongsByYear(year) {
      const selectedYear = Number(year);

      return [...songDatabase.values()]
        .filter(song => {
          return (
            song.yearlyData[selectedYear] &&
            song.yearlyData[selectedYear].sales > 0
          );
        })
        .sort((a, b) => {
          const aYear = a.yearlyData[selectedYear];
          const bYear = b.yearlyData[selectedYear];

          if (bYear.sales !== aYear.sales) {
            return bYear.sales - aYear.sales;
          }

          if (aYear.peak !== bYear.peak) {
            return aYear.peak - bYear.peak;
          }

          return bYear.weeks - aYear.weeks;
        })
        .slice(0, 50)
        .map(song => {
          const yearlyInfo = song.yearlyData[selectedYear];

          return {
            song: song.song,
            artist: song.artist,
            selectedSales: yearlyInfo.sales,
            totalSales: song.totalSales,
            weeks: yearlyInfo.weeks,
            peak: yearlyInfo.peak
          };
        });
    }

    function renderTable(songs) {
      tableBody.innerHTML = '';

      if (!songs.length) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="7" class="empty-message">
              No song data was found.
            </td>
          </tr>
        `;

        return;
      }

      songs.forEach((song, index) => {
        const songLink =
          `song_data.html?song=${encodeParam(song.song)}`;

        const artistLink =
          `artist.html?artist=${encodeParam(song.artist)}`;

        const peak =
          Number.isFinite(song.peak) && song.peak !== 999
            ? song.peak
            : '—';

        const row = document.createElement('tr');

        row.innerHTML = `
          <td>${index + 1}</td>

          <td>
            <a
              href="${songLink}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${escapeHtml(song.song)}
            </a>
          </td>

          <td>
            <a
              href="${artistLink}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${escapeHtml(song.artist)}
            </a>
          </td>

          <td class="number">
            ${formatNumber(song.selectedSales)}
          </td>

          <td class="number">
            ${formatNumber(song.totalSales)}
          </td>

          <td class="number">
            ${song.weeks}
          </td>

          <td class="number">
            ${peak}
          </td>
        `;

        tableBody.appendChild(row);
      });
    }

    function renderCurrentView() {
      if (currentView === 'allTime') {
        pageTitle.textContent = 'Top 50 Songs of All Time';
        salesColumnHeading.textContent = 'All-Time Sales';
        yearControls.classList.add('hidden');

        renderTable(getAllTimeTopSongs());
        return;
      }

      const selectedYear =
        Number(yearSelect.value) || uniqueYears[0];

      pageTitle.textContent =
        `Top 30 Songs by Sales in ${selectedYear}`;

      salesColumnHeading.textContent =
        `Sales in ${selectedYear}`;

      yearControls.classList.remove('hidden');

      renderTable(getTopSongsByYear(selectedYear));
    }

    function changeTab(view) {
      currentView = view;

      tabButtons.forEach(button => {
        button.classList.toggle(
          'active',
          button.dataset.view === view
        );
      });

      renderCurrentView();
    }

    tabButtons.forEach(button => {
      button.addEventListener('click', () => {
        changeTab(button.dataset.view);
      });
    });

    yearSelect.addEventListener('change', () => {
      if (currentView === 'year') {
        renderCurrentView();
      }
    });

    if (uniqueYears.length > 0) {
      yearSelect.value = uniqueYears[0];
    }

    renderCurrentView();
  </script>
</body>
</html>
