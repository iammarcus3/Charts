name: scheduled-week.js

on:
  schedule:
    - cron: "0 12 * * FRI"   # every Friday at 12:00 UTC
  workflow_dispatch:          # allow manual run

jobs:
  update-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # ✅ allow git push from actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scheduled-week.js
        run: DRY_RUN=false node .github/scripts/scheduled-week.js
