on:
  schedule:
    - cron: "0 12 * * FRI"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only?"
        required: false
        default: "true"

jobs:
  update-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Run scheduled-week.js
        run: node .github/scripts/scheduled-week.js
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
