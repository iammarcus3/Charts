name: Weekly Chart Update

on:
  schedule:
    # Runs every Friday at 02:00 UTC (04:00 South Africa time)
    - cron: "0 2 * * 5"

  # Optional: lets you manually trigger workflow from GitHub Actions tab
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repo
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Install dependencies (if you use any)
      - name: Install dependencies
        run: npm install

      # 4. Run your scheduled-week.js script
      - name: Run weekly chart update
        run: node .github/scripts/scheduled-week.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: iammarcus3/Charts
          GITHUB_BRANCH: main
          WEEKDATA_PATH: weekdata.js
