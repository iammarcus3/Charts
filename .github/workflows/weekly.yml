name: scheduled-week.js

on:
  schedule:
    - cron: "0 12 * * FRI"   # every Friday at 12:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only?"
        default: "false"

jobs:
  update-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scheduled-week.js
        run: node .github/scripts/scheduled-week.js
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
