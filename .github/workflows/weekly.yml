name: scheduled-week.js

on:
  schedule:
    - cron: "0 12 * * FRI"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only?"
        default: "false"
      target_week:
        description: "Force overwrite this week (leave blank to append)"
        default: ""

jobs:
  update-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scheduled-week.js
        run: node .github/scripts/scheduled-week.js
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TARGET_WEEK: ${{ github.event.inputs.target_week || '' }}
