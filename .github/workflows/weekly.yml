name: Weekly Chart Update

on:
  schedule:
    # Runs every Friday at 06:00 UTC
    - cron: "0 6 * * 5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: dry-run (just preview) or publish (write & commit)"
        required: true
        default: "dry-run"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0      # required for pushing commits
          ref: main           # ensure we're on main branch

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install node-fetch@2

      - name: Run weekly update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: "iammarcus3/Charts"
          GITHUB_BRANCH: "main"
          DRY_RUN: ${{ github.event.inputs.mode == 'dry-run' && 'true' || 'false' }}
        run: |
          echo "Running scheduled-week.js..."
          node .github/scripts/scheduled-week.js

      - name: Push changes
        if: github.event.inputs.mode == 'publish'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin main
