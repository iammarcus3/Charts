name: Build Music Vault

on:
  push:
    paths:
      - 'raw/**'
      - 'scripts/**'
  workflow_dispatch: # Allows manual rebuilds

concurrency:
  group: build-music-vault
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Repair only a trailing literal newline escape in raw history
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("raw/listening_history").glob("*.json")):
              raw = path.read_bytes()
              try:
                  json.loads(raw.decode("utf-8"))
                  print(f"RAW_JSON_VALID {path.name}")
                  continue
              except json.JSONDecodeError as original_error:
                  pass

              if not raw.endswith(b"\\\\n"):
                  raise original_error
              repaired = raw[:-2]
              parsed = json.loads(repaired.decode("utf-8"))
              rows = parsed if isinstance(parsed, list) else parsed.get("scrobbles", [])
              if not isinstance(rows, list):
                  raise RuntimeError(f"Refusing repair: invalid scrobbles array in {path}")
              path.write_bytes(repaired + b"\\n")
              json.loads(path.read_text(encoding="utf-8"))
              print(f"RAW_JSON_REPAIRED {path.name}: preserved {len(rows)} scrobbles; removed only trailing literal \\\\n")
          PY

      - name: Diagnose Unknown Track source records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("raw/listening_history").glob("*.json"))
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              rows = data if isinstance(data, list) else data.get("scrobbles", [])
              missing = []
              for i, row in enumerate(rows):
                  if not isinstance(row, dict):
                      continue
                  title = next((row.get(k) for k in ("track", "track_name", "title", "name") if row.get(k) not in (None, "")), None)
                  if title is None:
                      missing.append((i, sorted(row.keys()), {k: row.get(k) for k in ("artist", "artist_name", "album", "album_title", "track", "track_name", "title", "name") if k in row}))
              print(f"DIAGNOSTIC {path.name}: records={len(rows)} missing_track_title={len(missing)}")
              for i, keys, values in missing[:8]:
                  print(f"DIAGNOSTIC sample index={i} keys={keys} values={json.dumps(values, ensure_ascii=False)[:700]}")
          PY

      - name: Canonicalize confirmed Q artist in raw listening history
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          changed = 0
          for path in sorted(Path("raw/listening_history").glob("*.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              rows = data if isinstance(data, list) else data.get("scrobbles", [])
              file_changed = 0
              for row in rows:
                  if not isinstance(row, dict):
                      continue
                  for key in ("artist", "artist_name", "album_artist"):
                      value = row.get(key)
                      if isinstance(value, str) and value.strip().casefold() == "q":
                          row[key] = "Q Marsden"
                          changed += 1
                          file_changed += 1
                      elif isinstance(value, dict):
                          for text_key in ("#text", "#TEXT", "text", "name", "title", "value"):
                              candidate = value.get(text_key)
                              if isinstance(candidate, str) and candidate.strip().casefold() == "q":
                                  value[text_key] = "Q Marsden"
                                  changed += 1
                                  file_changed += 1
                                  break
              if file_changed:
                  path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          print(f"RAW_ARTIST_CANONICALIZATION replacements={changed}")
          PY

      - name: Run Unit Tests
        run: python scripts/test_eligibility.py

      - name: Run Music Vault Pipeline
        run: python scripts/build_vault.py

      - name: Verify recovered track titles
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          tracks = json.loads(Path("vault/tracks.json").read_text(encoding="utf-8"))
          history_path = Path("vault/listening_history.jsonl")
          unknown_ids = {t.get("id") for t in tracks if str(t.get("title", "")).strip().casefold() in {"", "unknown track"}}
          linked_unknown_events = 0
          event_count = 0
          with history_path.open(encoding="utf-8") as handle:
              for line in handle:
                  if not line.strip():
                      continue
                  event = json.loads(line)
                  event_count += 1
                  if event.get("track_id") in unknown_ids:
                      linked_unknown_events += 1
          print(f"VAULT_DIAGNOSTIC tracks={len(tracks)} unknown_title_tracks={len(unknown_ids)} listening_events={event_count} events_linked_to_unknown_titles={linked_unknown_events}")
          PY

      - name: Validate Vault Integrity
        run: python scripts/validate_vault.py

      - name: Commit Generated Vault
        if: success()
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Rebuild from the latest main on every attempt instead of rebasing generated
          # JSON/JSONL outputs, which can conflict when another build commits first.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("raw/listening_history").glob("*.json")):
              raw = path.read_bytes()
              try:
                  json.loads(raw.decode("utf-8"))
              except json.JSONDecodeError as error:
                  if not raw.endswith(b"\\\\n"):
                      raise error
                  candidate = raw[:-2]
                  parsed = json.loads(candidate.decode("utf-8"))
                  rows = parsed if isinstance(parsed, list) else parsed.get("scrobbles", [])
                  if not isinstance(rows, list):
                      raise RuntimeError(f"Refusing repair: invalid scrobbles array in {path}")
                  path.write_bytes(candidate + b"\\n")
                  print(f"RAW_JSON_REPAIRED {path.name}: preserved {len(rows)} scrobbles")
          
          changed = 0
          for path in sorted(Path("raw/listening_history").glob("*.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              rows = data if isinstance(data, list) else data.get("scrobbles", [])
              file_changed = 0
              for row in rows:
                  if not isinstance(row, dict):
                      continue
                  for key in ("artist", "artist_name", "album_artist"):
                      value = row.get(key)
                      if isinstance(value, str) and value.strip().casefold() == "q":
                          row[key] = "Q Marsden"
                          changed += 1
                          file_changed += 1
                      elif isinstance(value, dict):
                          for text_key in ("#text", "#TEXT", "text", "name", "title", "value"):
                              candidate = value.get(text_key)
                              if isinstance(candidate, str) and candidate.strip().casefold() == "q":
                                  value[text_key] = "Q Marsden"
                                  changed += 1
                                  file_changed += 1
                                  break
              if file_changed:
                  path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\\\\n", encoding="utf-8")
          print(f"RAW_ARTIST_CANONICALIZATION replacements={changed}")
          PY
            python scripts/build_vault.py
            python scripts/validate_vault.py
            git add vault/ reports/ raw/listening_history/
            if git diff --cached --quiet; then
              echo "Vault outputs are already up to date."
              exit 0
            fi
            git commit -m "chore: update canonical music vault"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another main commit; rebuilding from latest main (attempt $attempt/3)."
          done
          exit 1

      - name: Print Vault Validation Diagnostics
        if: always()
        run: |
          for report in reports/validation_report.json reports/input_errors.json reports/integrity_issues.json reports/invalid_events.json; do
            if [ -f "$report" ]; then
              echo "===== $report ====="
              cat "$report"
            else
              echo "===== $report not generated ====="
            fi
          done

      - name: Upload Vault Validation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vault-validation-diagnostics
          path: reports/
          if-no-files-found: ignore
