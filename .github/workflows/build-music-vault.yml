name: Build Music Vault

on:
  push:
    paths:
      - 'raw/**'
      - 'scripts/**'
  workflow_dispatch: # Allows manual rebuilds

concurrency:
  group: build-music-vault
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Diagnose Unknown Track source records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("raw/listening_history").glob("*.json"))
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              rows = data if isinstance(data, list) else data.get("scrobbles", [])
              missing = []
              for i, row in enumerate(rows):
                  if not isinstance(row, dict):
                      continue
                  title = next((row.get(k) for k in ("track", "track_name", "title", "name") if row.get(k) not in (None, "")), None)
                  if title is None:
                      missing.append((i, sorted(row.keys()), {k: row.get(k) for k in ("artist", "artist_name", "album", "album_title", "track", "track_name", "title", "name") if k in row}))
              print(f"DIAGNOSTIC {path.name}: records={len(rows)} missing_track_title={len(missing)}")
              for i, keys, values in missing[:8]:
                  print(f"DIAGNOSTIC sample index={i} keys={keys} values={json.dumps(values, ensure_ascii=False)[:700]}")
          PY

      - name: Run Unit Tests
        run: python scripts/test_eligibility.py

      - name: Run Music Vault Pipeline
        run: python scripts/build_vault.py

      - name: Validate Vault Integrity
        run: python scripts/validate_vault.py

      - name: Commit Generated Vault
        if: success()
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add vault/ reports/
          # Prevent failing if there are no changes
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update canonical music vault"
          # Another commit may land while the vault is building; rebase before pushing.
          git pull --rebase origin main
          git push
