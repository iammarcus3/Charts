name: Fetch New Last.fm Scrobbles

on:
  schedule:
    # Runs at 00:00 UTC every Friday
    - cron: '0 0 * * 5'
  workflow_dispatch: # Allows you to manually trigger the update anytime

permissions:
  contents: write
  actions: write # Allows this workflow to dispatch the Music Vault builder

jobs:
  update-scrobbles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        # Installs node-fetch v2 which is required for the require() syntax in your script
        run: npm install node-fetch@2

      - name: Run Fetch Script
        run: node scripts/update_scrobbles.js
        env:
          # Automatically uses the built-in GitHub token to authenticate the file update
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: main

      - name: Trigger Music Vault Build
        # Commits made with GITHUB_TOKEN do not trigger push-based workflows.
        # Explicit workflow_dispatch is the supported handoff to the next workflow.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            repos/${{ github.repository }}/actions/workflows/build-music-vault.yml/dispatches \
            -f ref=main
