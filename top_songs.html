<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weekly Song Certifications</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#121212; color:#f0f0f0; margin:0; padding:2rem; }
    h1 { text-align:center; font-size:3rem; margin-bottom:1.5rem; color:#fff; }
    #nav { text-align:center; margin-bottom:2rem; }
    button { background:#2a2a2a; border:none; color:#66ccff; font-size:2rem; margin:0 1.5rem; padding:0.5rem 1.5rem; border-radius:8px; cursor:pointer; transition:background .3s ease; }
    button:hover:not(:disabled){ background:#66ccff; color:#121212; }
    button:disabled { color:#444; cursor:default; }
    .week { background:#1e1e1e; border-radius:12px; padding:2rem; box-shadow:0 0 12px rgba(255,255,255,.1); max-width:820px; margin:0 auto; }
    .week h2 { margin-top:0; color:#66ccff; border-bottom:2px solid #333; padding-bottom:.75rem; text-align:center; font-size:2rem; }
    .cert { padding:1rem 1.5rem; margin:1rem 0; background:#2a2a2a; border-left:8px solid #666; border-radius:7px; font-size:1.2rem; display:flex; align-items:center; gap:1rem; line-height:1.3; }
    .gold { border-color: gold; }
    .platinum { border-color: #c0c0c0; }
    .diamond { border-color: deepskyblue; }
    .cert img { height:48px; width:auto; flex-shrink:0; cursor:pointer; }
    a { color:#66ccff; text-decoration:none; }
    a:hover { text-decoration:underline; }
    .meta { margin-left:auto; opacity:.8; font-size:.95rem; }
    @media (max-width:600px){
      body{ padding:1rem; } h1{ font-size:2.2rem; } button{ font-size:1.5rem; margin:0 .5rem; padding:.4rem 1rem; }
      .week{ padding:1.25rem; } .week h2{ font-size:1.5rem; } .cert{ font-size:1.05rem; } .cert img{ height:28px; }
    }
    .modal{ display:none; position:fixed; z-index:1000; inset:0; background:rgba(0,0,0,.7); overflow:auto; }
    .modal-content{ background:#1e1e1e; color:#f0f0f0; margin:10% auto; padding:2rem; border-radius:12px; max-width:500px; text-align:center; box-shadow:0 0 15px rgba(255,255,255,.2); position:relative; }
    .modal-content h2{ color:#66ccff; }
    .close{ position:absolute; top:12px; right:16px; font-size:2rem; font-weight:bold; cursor:pointer; color:#aaa; }
    .close:hover{ color:#fff; }

    .badge { display:inline-block; font-size:.8rem; padding:.15rem .5rem; border-radius:6px; background:#333; color:#bbb; margin-left:.5rem; border:1px solid #444; }
    .badge.album   { color:#ffd166; border-color:#665500; }
    .badge.single  { color:#9ccaff; border-color:#224a66; }

    /* top banner for ambiguous items */
    .banner { max-width:820px; margin:0 auto 1rem auto; padding:.75rem 1rem; border-radius:8px; background:#2a2a2a; border-left:6px solid #665500; }
  </style>
</head>
<body>
  <h1>Weekly Song Certifications</h1>

  <div id="nav">
    <button id="prevBtn" title="Previous Week">⬅️</button>
    <span id="weekLabel"></span>
    <button id="nextBtn" title="Next Week">➡️</button>
  </div>

  <div id="output"></div>

  <!-- Modal -->
  <div id="salesModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2 id="modalTitle">Certification Sales Info</h2>
      <p id="modalBody"></p>
    </div>
  </div>

  <script src="weekdata.js"></script>
  <script>
    // ───────────────── CONFIG ─────────────────
    // Singles/tracks use your existing 2000 rule; albums use 500.
    const UNITS_PER_SALE_TRACK  = 1750; // set to 1750 if that's your track rule
    const UNITS_PER_SALE_ALBUM  = 500;  // album rule
    const EPS = 0.000001;

    // Force type per Title|Artist (canonical). Values: "album" | "single"
    // Example:
    // "midnights|taylor swift": "album",
    // "drivers license|olivia rodrigo": "single",
    const FORCE_TYPE = {
      // "standing on the sun|beyoncé": "single",
    };

    const thresholds = [
      { level: "🥇 Gold",      value: 500000,   class: "gold"     },
      { level: "💿 Platinum",  value: 1000000,  class: "platinum" },
      { level: "💿 x2",        value: 2000000,  class: "platinum" },
      { level: "💿 x3",        value: 3000000,  class: "platinum" },
      { level: "💿 x4",        value: 4000000,  class: "platinum" },
      { level: "💿 x5",        value: 5000000,  class: "platinum" },
      { level: "💿 x6",        value: 6000000,  class: "platinum" },
      { level: "💿 x7",        value: 7000000,  class: "platinum" },
      { level: "💿 x8",        value: 8000000,  class: "platinum" },
      { level: "💿 x9",        value: 9000000,  class: "platinum" },
      { level: "💎 Diamond",   value: 10000000, class: "diamond"  }
    ];

    // Field priority (first match wins)
    // If you want points to drive certs, move 'points' to the front.
    const WEEKLY_FIELDS = ['sales','units','weeklySales','weekSales','week_units','weekUnits','thisWeekSales','points'];
    const CUME_FIELDS   = ['totalSales','total_units','cumulativeSales','cume','total','unitsTotal','lifetimeSales','runningTotal','cumUnits'];

    // ─────────────── Helpers ───────────────
    function num(x){ const n = Number(x); return Number.isFinite(n) ? n : 0; }
    function pick(obj, fields){ for (const f of fields) if (obj != null && obj[f] != null) return obj[f]; return undefined; }

    function canonicalize(str){
      return String(str || '')
        .toLowerCase()
        .replace(/\s+/g,' ')
        .replace(/[’‘']/g,"'")
        .replace(/&/g,'and')
        .replace(/\s*\((feat\.|ft\.|featuring|with)[^)]+\)/g,'') // remove (feat. X)
        .replace(/\s*-\s*(feat\.|ft\.|featuring|with)\s.+$/,'')  // remove - feat. X
        .trim();
    }
    function keyFor(title, artist){
      return `${canonicalize(title)}|${canonicalize(artist)}`;
    }

    // Detect Album vs Single (true = album, false = single)
    function isAlbumEntry(entry){
      if (entry?.isAlbum === true)  return true;
      if (entry?.isSingle === true) return false;

      const k = keyFor(entry?.title, entry?.artist);
      if (FORCE_TYPE[k] === 'album')  return true;
      if (FORCE_TYPE[k] === 'single') return false;

      const fmt = String(entry?.format || '').toLowerCase();
      if (/(^|\s)(album|lp|long\s*play)\b/.test(fmt))  return true;
      if (/(^|\s)(single|song|track)\b/.test(fmt))     return false;

      if ('albumUnits' in entry || 'albumSales' in entry) return true;

      // default to single if unknown
      return false;
    }

    function getCertImage(level) {
      const images = {
        "🥇 Gold": "Gold.png",
        "💿 Platinum": "Platinum.png",
        "💿 x2": "2x Platinum.png",
        "💿 x3": "3x Platinum.png",
        "💿 x4": "4x Platinum.png",
        "💿 x5": "5x Platinum.png",
        "💿 x6": "6x Platinum.png",
        "💿 x7": "7x Platinum.png",
        "💿 x8": "8x Platinum.png",
        "💿 x9": "9x Platinum.png",
        "💎 Diamond": "Diamond.png"
      };
      const src = images[level];
      return src ? `<img src="${src}" alt="${level}" title="${level}">` : "";
    }

    function getDateRange(weekNum) {
      const start = new Date(2018, 1, 23); // 23 Feb 2018
      start.setDate(start.getDate() + (weekNum - 1) * 7);
      const end = new Date(start); end.setDate(start.getDate() + 6);
      const opt = { day: 'numeric', month: 'short', year: 'numeric' };
      return `${start.toLocaleDateString('en-GB', opt)} – ${end.toLocaleDateString('en-GB', opt)}`;
    }
    function fmt(n){
      if (n >= 1e9) return (n/1e9).toFixed(2).replace(/\.00$/,'')+'B';
      if (n >= 1e6) return (n/1e6).toFixed(2).replace(/\.00$/,'')+'M';
      if (n >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'')+'K';
      return Math.round(n).toLocaleString();
    }

    // ─────────────── Data Prep ───────────────
    const wk = (typeof weekData === 'object' && weekData) ? weekData : {};
    const weeksAsc  = Object.keys(wk).map(Number).sort((a,b)=>a-b);
    const weeksDesc = weeksAsc.slice().reverse();

    const certMaxByKey   = Object.create(null); // highest cert value previously reached
    const runningTotals  = Object.create(null); // if cume missing, build from weekly
    const newCertsByWeek = Object.create(null);

    // Debug tracking
    const ambiguousType = [];
    const debugCounts = { albums: 0, singles: 0 };

    weeksAsc.forEach(weekNum => {
      const entries = Array.isArray(wk[weekNum]) ? wk[weekNum] : [];
      const seenThisWeek = new Set(); // merge duplicates within the same week
      const newCerts = [];

      for (const song of entries) {
        const title  = String(song?.title ?? '').trim();
        const artist = String(song?.artist ?? '').trim();
        if (!title || !artist) continue;

        const k = keyFor(title, artist);
        if (seenThisWeek.has(k)) continue; // avoid double-processing same track in week
        seenThisWeek.add(k);

        // Weekly and cumulative bases
        const weeklyBaseRaw = pick(song, WEEKLY_FIELDS);
        const cumeBaseRaw   = pick(song, CUME_FIELDS);

        const weeklyBase = num(weeklyBaseRaw);
        let cumeBase = (cumeBaseRaw !== undefined) ? num(cumeBaseRaw) : undefined;

        if (cumeBase === undefined) {
          runningTotals[k] = (runningTotals[k] || 0) + weeklyBase;
          cumeBase = runningTotals[k];
        } else {
          const last = runningTotals[k] || 0;
          if (cumeBase + EPS < last) {
            cumeBase = last + weeklyBase; // repair: stale cume
          }
          runningTotals[k] = cumeBase;
        }

        // Album vs Single
        const album = isAlbumEntry(song);
        if (album) debugCounts.albums++; else debugCounts.singles++;

        const hadExplicitType = (song?.isAlbum === true || song?.isSingle === true);
        const kfmt = String(song?.format || '').toLowerCase();
        const hasTypeHints =
          hadExplicitType ||
          /(album|lp|long\s*play|single|song|track)\b/.test(kfmt) ||
          ('albumUnits' in song) || ('albumSales' in song) ||
          (FORCE_TYPE[k] != null);

        if (!album && !hasTypeHints) {
          ambiguousType.push({ title, artist, reason: 'no type hints → defaulted to single' });
        }

        const UNITS_PER_SALE = album ? UNITS_PER_SALE_ALBUM : UNITS_PER_SALE_TRACK;
        const cumeUnits   = cumeBase   * UNITS_PER_SALE;
        const weeklyUnits = weeklyBase * UNITS_PER_SALE;

        const prevMax = certMaxByKey[k] || 0;

        if (cumeUnits > prevMax + EPS) {
          // thresholds newly crossed this week
          const crossed = thresholds
            .filter(t => t.value - EPS > prevMax && t.value <= cumeUnits + EPS)
            .sort((a,b) => a.value - b.value);

          // Only the most recent/highest plaque this week (one entry per week)
          if (crossed.length){
            const t = crossed[crossed.length - 1];
            newCerts.push({
              title, artist,
              certLevel: t.level,
              certClass: t.class,
              weeklyUnits,
              cumulativeUnitsAtCert: Math.max(t.value, cumeUnits),
              isAlbum: album
            });
            certMaxByKey[k] = t.value;
          }
        }
      }

      // Order: highest award first, then title
      newCerts.sort((a,b) => b.cumulativeUnitsAtCert - a.cumulativeUnitsAtCert || a.title.localeCompare(b.title));
      newCertsByWeek[weekNum] = newCerts;
    });

    // Debug summary + optional banner
    console.log('[Cert Debug] Type counts:', debugCounts);
    if (ambiguousType.length){
      console.group('[Cert Debug] Ambiguous entries (defaulted to single)');
      console.table(ambiguousType);
      console.groupEnd();
    }
    (function(){
      if (!ambiguousType.length) return;
      const banner = document.createElement('div');
      banner.className = 'banner';
      banner.innerHTML = `
        <strong>${ambiguousType.length}</strong> item(s) defaulted to <em>Single</em> due to missing type hints.
        <br>Fix by adding <code>isAlbum:true</code> / <code>isSingle:true</code> in weekdata.js,
        setting <code>format:"Album"</code>, or adding a key in <code>FORCE_TYPE</code>.
      `;
      document.body.insertBefore(banner, document.getElementById('nav'));
    })();

    // ─────────────── UI ───────────────
    const output    = document.getElementById('output');
    const weekLabel = document.getElementById('weekLabel');
    const prevBtn   = document.getElementById('prevBtn');
    const nextBtn   = document.getElementById('nextBtn');
    let currentWeekIndex = 0;

    function renderWeek(idx){
      output.innerHTML = '';
      if (!weeksDesc.length){
        output.innerHTML = `<div class="week"><h2>No data</h2><p>weekdata.js not loaded or empty.</p></div>`;
        weekLabel.textContent = '';
        prevBtn.disabled = nextBtn.disabled = true;
        return;
      }
      const weekNum = weeksDesc[idx];
      const certs = newCertsByWeek[weekNum] || [];

      weekLabel.textContent = `Week ${weekNum} (${getDateRange(weekNum)})`;

      const div = document.createElement('div');
      div.className = 'week';
      div.innerHTML = `<h2>New Certifications in Week ${weekNum}</h2>`;

      if (certs.length){
        for (const c of certs){
          const trackLink  = `track_detail.html?title=${encodeURIComponent(c.title)}&artist=${encodeURIComponent(c.artist)}`;
          const artistLink = `artist.html?name=${encodeURIComponent(c.artist)}`;
          const img = getCertImage(c.certLevel);
          const typeBadge = c.isAlbum
            ? `<span class="badge album" title="Album">Album</span>`
            : `<span class="badge single" title="Single">Single</span>`;

          const el = document.createElement('div');
          el.className = `cert ${c.certClass}`;
          el.innerHTML = `
            <a href="javascript:void(0)"
               onclick="showSalesModal('${c.title.replace(/'/g,"&#39;")}', '${c.artist.replace(/'/g,"&#39;")}', '${c.certLevel}', ${Math.round(c.weeklyUnits)}, ${Math.round(c.cumulativeUnitsAtCert)}, ${c.isAlbum})">
               ${img}
            </a>
            <a href="${trackLink}">${c.title}</a> by
            <a href="${artistLink}">${c.artist}</a>
            ${typeBadge}
            <span class="meta">${c.certLevel}</span>
          `;
          div.appendChild(el);
        }
      } else {
        div.innerHTML += `<p style="font-size:1.15rem; text-align:center; margin-top:1rem;">No new certifications this week.</p>`;
      }
      output.appendChild(div);

      prevBtn.disabled = (idx === weeksDesc.length - 1);
      nextBtn.disabled = (idx === 0);
    }

    prevBtn.addEventListener('click', () => { if (currentWeekIndex < weeksDesc.length - 1){ currentWeekIndex++; renderWeek(currentWeekIndex);} });
    nextBtn.addEventListener('click', () => { if (currentWeekIndex > 0){ currentWeekIndex--; renderWeek(currentWeekIndex);} });

    function showSalesModal(title, artist, certLevel, weeklyUnits, cumulativeUnits, isAlbum = false) {
      const modal = document.getElementById('salesModal');
      document.getElementById('modalTitle').textContent = `${title} — ${artist}`;
      document.getElementById('modalBody').innerHTML = `
        <strong>Type:</strong> ${isAlbum ? 'Album' : 'Single'}<br>
        <strong>Certification:</strong> ${certLevel}<br>
        <strong>Sales this week:</strong> ${fmt(weeklyUnits)} units<br>
        <strong>Total certified units:</strong> ${fmt(cumulativeUnits)}
      `;
      modal.style.display = 'block';
    }
    document.querySelector('.close').onclick = () => { document.getElementById('salesModal').style.display = 'none'; };
    window.onclick = (e) => { if (e.target === document.getElementById('salesModal')) document.getElementById('salesModal').style.display = 'none'; };

    // Initial render
    renderWeek(currentWeekIndex);
  </script>
</body>
</html>
