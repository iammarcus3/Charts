<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weekly Song Certifications</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #121212;
      color: #f0f0f0;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      font-size: 3rem; /* larger title */
      margin-bottom: 1.5rem;
      color: #ffffff;
    }
    #nav {
      text-align: center;
      margin-bottom: 2rem;
    }
    button {
      background: #2a2a2a;
      border: none;
      color: #66ccff;
      font-size: 2rem; /* bigger buttons */
      margin: 0 1.5rem;
      padding: 0.5rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover:not(:disabled) {
      background: #66ccff;
      color: #121212;
    }
    button:disabled {
      color: #444;
      cursor: default;
    }
    .week {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.1);
      max-width: 750px;
      margin: 0 auto;
    }
    .week h2 {
      margin-top: 0;
      color: #66ccff;
      border-bottom: 2px solid #333;
      padding-bottom: 0.75rem;
      text-align: center;
      font-size: 2rem; /* bigger heading */
    }
    .cert {
      padding: 1rem 1.5rem;
      margin: 1rem 0;
      background: #2a2a2a;
      border-left: 8px solid #666;
      border-radius: 7px;
      font-size: 1.4rem; /* bigger font */
      display: flex;
      align-items: center;
      gap: 1rem;
      line-height: 1.3;
    }
    .gold { border-color: gold; }
    .platinum { border-color: #c0c0c0; }
    .diamond { border-color: deepskyblue; }
    .cert img {
      height: 90px; /* bigger image */
      width: auto;
      vertical-align: middle;
      flex-shrink: 0;
    }
    a {
      color: #66ccff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    @media (max-width: 600px) {
      body { padding: 1rem; }
      h1 { font-size: 2.2rem; }
      button { font-size: 1.5rem; margin: 0 0.5rem; padding: 0.4rem 1rem; }
      .week { padding: 1.5rem; max-width: 100%; }
      .week h2 { font-size: 1.5rem; }
      .cert { font-size: 1.1rem; padding: 0.75rem 1rem; margin: 0.75rem 0; }
      .cert img { height: 28px; }
    }
  </style>
</head>
<body>
  <h1>Weekly Song Certifications</h1>

  <div id="nav">
    <button id="prevBtn" title="Previous Week">⬅️</button>
    <span id="weekLabel"></span>
    <button id="nextBtn" title="Next Week">➡️</button>
  </div>

  <div id="output"></div>

  <script src="weekdata.js"></script>
  <script>
    const thresholds = [
      { level: "🥇 Gold", value: 500000, class: "gold" },
      { level: "💿 Platinum", value: 1000000, class: "platinum" },
      { level: "💿 x2", value: 2000000, class: "platinum" },
      { level: "💿 x3", value: 3000000, class: "platinum" },
      { level: "💿 x4", value: 4000000, class: "platinum" },
      { level: "💿 x5", value: 5000000, class: "platinum" },
      { level: "💿 x6", value: 6000000, class: "platinum" },
      { level: "💿 x7", value: 7000000, class: "platinum" },
      { level: "💿 x8", value: 8000000, class: "platinum" },
      { level: "💿 x9", value: 9000000, class: "platinum" },
      { level: "💎 Diamond", value: 10000000, class: "diamond" }
    ];

    function getCertImage(level) {
      const images = {
        "🥇 Gold": "Gold.png",
        "💿 Platinum": "Platinum.png",
        "💿 x2": "2x Platinum.png",
        "💿 x3": "3x Platinum.png",
        "💿 x4": "4x Platinum.png",
        "💿 x5": "5x Platinum.png",
        "💿 x6": "6x Platinum.png",
        "💿 x7": "7x Platinum.png",
        "💿 x8": "8x Platinum.png",
        "💿 x9": "9x Platinum.png",
        "💎 Diamond": "Diamond.png"
      };
      const src = images[level];
      return src ? `<img src="${src}" title="${level}">` : "";
    }

    function normalizeKey(title, artist) {
      return `${title.trim().toLowerCase()}|${artist.trim().toLowerCase()}`;
    }

    function getDateRange(weekNum) {
      const start = new Date(2018, 1, 23);
      start.setDate(start.getDate() + (weekNum - 1) * 7);
      const end = new Date(start);
      end.setDate(start.getDate() + 6);
      const options = { day: 'numeric', month: 'short', year: 'numeric' };
      return `${start.toLocaleDateString('en-GB', options)} – ${end.toLocaleDateString('en-GB', options)}`;
    }

    // Sort weeks ascending to compute certs cumulatively
    const weeksAsc = Object.keys(weekData)
      .map(Number)
      .sort((a,b) => a - b);

    // We'll store for each song (key), the highest cert achieved so far
    // For each week, store certifications newly achieved that week
    const certHistory = {};
    const newCertsByWeek = {};

    weeksAsc.forEach(weekNum => {
      const entries = weekData[weekNum];
      const newCerts = [];

      entries.forEach(song => {
        const key = normalizeKey(song.title, song.artist);
        const totalSales = song.totalSales || 0;
        const scaled = totalSales * 1500;

        // Find highest cert level for this totalSales
        let certForThisSales = null;
        for (let i = thresholds.length - 1; i >= 0; i--) {
          if (scaled >= thresholds[i].value) {
            certForThisSales = thresholds[i];
            break;
          }
        }

        if (!certForThisSales) return; // no cert at all

        const prevCertValue = certHistory[key] ? certHistory[key].value : 0;

        // Only show cert if this week crosses a new certification level strictly higher than previous
        if (certForThisSales.value > prevCertValue) {
          newCerts.push({
            title: song.title,
            artist: song.artist,
            certLevel: certForThisSales.level,
            certClass: certForThisSales.class,
            totalSales: totalSales
          });
          certHistory[key] = certForThisSales;
        }
      });

      newCertsByWeek[weekNum] = newCerts;
    });

    // Sort weeks descending for display newest first
    const weeksDesc = weeksAsc.slice().reverse();

    const output = document.getElementById("output");
    const weekLabel = document.getElementById("weekLabel");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let currentWeekIndex = 0;

    function renderWeek(idx) {
      output.innerHTML = "";
      const weekNum = weeksDesc[idx];
      const certs = newCertsByWeek[weekNum] || [];

      weekLabel.textContent = `Week ${weekNum} (${getDateRange(weekNum)})`;

      const div = document.createElement("div");
      div.className = "week";
      div.innerHTML = `<h2>New Certifications in Week ${weekNum}</h2>`;

      if (certs.length > 0) {
        certs.forEach(c => {
          const trackLink = `track_detail.html?title=${encodeURIComponent(c.title)}&artist=${encodeURIComponent(c.artist)}`;
          const artistLink = `artist.html?name=${encodeURIComponent(c.artist)}`;
          const certImageHTML = getCertImage(c.certLevel);

          const line = document.createElement("div");
          line.className = `cert ${c.certClass}`;
          line.innerHTML = `
            ${certImageHTML}
            <a href="${trackLink}">${c.title}</a> by
            <a href="${artistLink}">${c.artist}</a>
          `;
          div.appendChild(line);
        });
      } else {
        div.innerHTML += `<p style="font-size:1.3rem; text-align:center; margin-top:1rem;">No new certifications this week.</p>`;
      }

      output.appendChild(div);

      prevBtn.disabled = (idx === weeksDesc.length - 1);
      nextBtn.disabled = (idx === 0);
    }

    prevBtn.addEventListener("click", () => {
      if (currentWeekIndex < weeksDesc.length - 1) {
        currentWeekIndex++;
        renderWeek(currentWeekIndex);
      }
    });

    nextBtn.addEventListener("click", () => {
      if (currentWeekIndex > 0) {
        currentWeekIndex--;
        renderWeek(currentWeekIndex);
      }
    });

    // Initial render
    renderWeek(currentWeekIndex);
  </script>
</body>
</html>
