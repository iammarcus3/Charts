<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weekly Song Certifications</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #121212;
      color: #f0f0f0;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #ffffff;
    }
    #nav {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    button {
      background: #2a2a2a;
      border: none;
      color: #66ccff;
      font-size: 1.5rem;
      margin: 0 1rem;
      padding: 0.3rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover:not(:disabled) {
      background: #66ccff;
      color: #121212;
    }
    button:disabled {
      color: #444;
      cursor: default;
    }
    .week {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 1.5rem;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.05);
      max-width: 700px;
      margin: 0 auto;
    }
    .week h2 {
      margin-top: 0;
      color: #66ccff;
      border-bottom: 1px solid #333;
      padding-bottom: 0.5rem;
      text-align: center;
    }
    .cert {
      padding: 0.75rem 1rem;
      margin: 0.5rem 0;
      background: #2a2a2a;
      border-left: 6px solid #666;
      border-radius: 5px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .gold { border-color: gold; }
    .platinum { border-color: #c0c0c0; }
    .diamond { border-color: deepskyblue; }
    .cert img {
      height: 24px;
      width: auto;
      vertical-align: middle;
    }
    a {
      color: #66ccff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    @media (max-width: 600px) {
      body { padding: 1rem; }
      h1 { font-size: 2rem; }
      button { font-size: 1.2rem; margin: 0 0.5rem; }
      .week { padding: 1rem; }
    }
  </style>
</head>
<body>
  <h1>Weekly Song Certifications</h1>

  <div id="nav">
    <button id="prevBtn" title="Previous Week">⬅️</button>
    <span id="weekLabel"></span>
    <button id="nextBtn" title="Next Week">➡️</button>
  </div>

  <div id="output"></div>

  <script src="weekdata.js"></script>
  <script>
    const thresholds = [
      { level: "🥇 Gold", value: 50000, class: "gold" },
      { level: "💿 Platinum", value: 100000, class: "platinum" },
      { level: "💿 x2", value: 200000, class: "platinum" },
      { level: "💿 x3", value: 300000, class: "platinum" },
      { level: "💿 x4", value: 400000, class: "platinum" },
      { level: "💿 x5", value: 500000, class: "platinum" },
      { level: "💿 x6", value: 600000, class: "platinum" },
      { level: "💿 x7", value: 700000, class: "platinum" },
      { level: "💿 x8", value: 800000, class: "platinum" },
      { level: "💿 x9", value: 900000, class: "platinum" },
      { level: "💎 Diamond", value: 1000000, class: "diamond" }
    ];

    function getCertImage(totalSales) {
      const scaled = totalSales * 745;
      if (scaled >= 1_000_000) return `<img src="Diamond.png" title="Diamond">`;
      if (scaled >= 900_000) return `<img src="9x Platinum.png" title="9× Platinum">`;
      if (scaled >= 800_000) return `<img src="8x Platinum.png" title="8× Platinum">`;
      if (scaled >= 700_000) return `<img src="7x Platinum.png" title="7× Platinum">`;
      if (scaled >= 600_000) return `<img src="6x Platinum.png" title="6× Platinum">`;
      if (scaled >= 500_000) return `<img src="5x Platinum.png" title="5× Platinum">`;
      if (scaled >= 400_000) return `<img src="4x Platinum.png" title="4× Platinum">`;
      if (scaled >= 300_000) return `<img src="3x Platinum.png" title="3× Platinum">`;
      if (scaled >= 200_000) return `<img src="2x Platinum.png" title="2× Platinum">`;
      if (scaled >= 100_000) return `<img src="Platinum.png" title="Platinum">`;
      if (scaled >= 50_000) return `<img src="Gold.png" title="Gold">`;
      return "";
    }

    function normalizeKey(title, artist) {
      return `${title.trim().toLowerCase()}|${artist.trim().toLowerCase()}`;
    }

    function getDateRange(weekNum) {
      const start = new Date(2018, 1, 23);
      start.setDate(start.getDate() + (weekNum - 1) * 7);
      const end = new Date(start);
      end.setDate(start.getDate() + 6);
      const options = { day: 'numeric', month: 'short', year: 'numeric' };
      return `${start.toLocaleDateString('en-GB', options)} – ${end.toLocaleDateString('en-GB', options)}`;
    }

    // Sort weeks descending (latest first)
    const weeks = Object.keys(weekData)
      .map(Number)
      .sort((a, b) => b - a);

    const previousCerts = {};

    const output = document.getElementById("output");
    const weekLabel = document.getElementById("weekLabel");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let currentWeekIndex = 0; // start at latest week (weeks[0])

    function renderWeek(index) {
      output.innerHTML = "";
      const weekNum = weeks[index];
      const weekEntries = weekData[weekNum];
      const newCerts = [];

      weekEntries.forEach(song => {
        const key = normalizeKey(song.title, song.artist);
        const totalSales = song.totalSales || 0;
        const prevHighest = previousCerts[key] || 0;

        const scaled = totalSales * 745;

        let currentCertValue = 0;
        let currentCertClass = "";
        let currentCertLevel = "";

        for (let i = thresholds.length - 1; i >= 0; i--) {
          if (scaled >= thresholds[i].value) {
            currentCertValue = thresholds[i].value;
            currentCertClass = thresholds[i].class;
            currentCertLevel = thresholds[i].level;
            break;
          }
        }

        if (currentCertValue > prevHighest) {
          newCerts.push({
            title: song.title,
            artist: song.artist,
            certLevel: currentCertLevel,
            certClass: currentCertClass,
            certValue: currentCertValue,
            totalSales: totalSales
          });
          previousCerts[key] = currentCertValue;
        }
      });

      weekLabel.textContent = `Week ${weekNum} (${getDateRange(weekNum)})`;

      const div = document.createElement("div");
      div.className = "week";
      div.innerHTML = `<h2>Certifications for Week ${weekNum}</h2>`;

      if (newCerts.length > 0) {
        newCerts.forEach(c => {
          const trackLink = `track_detail.html?title=${encodeURIComponent(c.title)}&artist=${encodeURIComponent(c.artist)}`;
          const artistLink = `artist.html?name=${encodeURIComponent(c.artist)}`;
          const certImageHTML = getCertImage(c.totalSales);

          const line = document.createElement("div");
          line.className = `cert ${c.certClass}`;
          line.innerHTML = `
            ${certImageHTML}
            <a href="${trackLink}">${c.title}</a> by
            <a href="${artistLink}">${c.artist}</a>
          `;
          div.appendChild(line);
        });
      } else {
        div.innerHTML += `<p>No new certifications this week.</p>`;
      }

      output.appendChild(div);

      // Enable/disable buttons
      prevBtn.disabled = (index === weeks.length - 1);
      nextBtn.disabled = (index === 0);
    }

    prevBtn.addEventListener("click", () => {
      if (currentWeekIndex < weeks.length - 1) {
        currentWeekIndex++;
        renderWeek(currentWeekIndex);
      }
    });

    nextBtn.addEventListener("click", () => {
      if (currentWeekIndex > 0) {
        currentWeekIndex--;
        renderWeek(currentWeekIndex);
      }
    });

    // Initial render
    renderWeek(currentWeekIndex);
  </script>
</body>
</html>
