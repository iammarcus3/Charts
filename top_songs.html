<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weekly Certifications</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #121212;
      color: #f0f0f0;
      margin: 0;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 2rem;
      color: #ffffff;
    }

    .week {
      background: #1e1e1e;
      margin-bottom: 2rem;
      border-radius: 10px;
      padding: 1.5rem;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.05);
    }

    .week h2 {
      margin-top: 0;
      color: #66ccff;
      border-bottom: 1px solid #333;
      padding-bottom: 0.5rem;
    }

    .cert {
      padding: 0.75rem 1rem;
      margin: 0.5rem 0;
      background: #2a2a2a;
      border-left: 6px solid #666;
      border-radius: 5px;
      font-size: 1rem;
    }

    .gold { border-color: gold; }
    .platinum { border-color: #c0c0c0; }
    .diamond { border-color: deepskyblue; }

    .cert span.cert-label {
      font-weight: bold;
      margin-right: 1rem;
      color: #ffd700;
    }

    a {
      color: #66ccff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }

      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <h1>Weekly Song Certifications</h1>
  <div id="output"></div>

  <script src="weekdata.js"></script>
  <script>
    const thresholds = [
      { level: "🥇 Gold", value: 50000, class: "gold" },
      { level: "💿 Platinum", value: 100000, class: "platinum" },
      { level: "💿 x2", value: 200000, class: "platinum" },
      { level: "💿 x3", value: 300000, class: "platinum" },
      { level: "💿 x4", value: 400000, class: "platinum" },
      { level: "💿 x5", value: 500000, class: "platinum" },
      { level: "💿 x6", value: 600000, class: "platinum" },
      { level: "💿 x7", value: 700000, class: "platinum" },
      { level: "💿 x8", value: 800000, class: "platinum" },
      { level: "💿 x9", value: 900000, class: "platinum" },
      { level: "💎 Diamond", value: 1000000, class: "diamond" }
    ];

    const output = document.getElementById("output");
    const previousCerts = {}; // key: title|artist → highest value crossed

    const encode = str => encodeURIComponent(str);

    const weeks = Object.keys(weekData)
      .map(w => parseInt(w))
      .sort((a, b) => b - a); // newest to oldest

    weeks.forEach(weekNum => {
      const weekEntries = weekData[weekNum];
      const newCerts = [];

      weekEntries.forEach(song => {
        const key = `${song.title}|${song.artist}`;
        const total = song.totalSales || 0;

        for (let i = thresholds.length - 1; i >= 0; i--) {
          const { value, level, class: className } = thresholds[i];
          if (total >= value && (!previousCerts[key] || previousCerts[key] < value)) {
            newCerts.push({
              title: song.title,
              artist: song.artist,
              cert: level,
              className
            });
            previousCerts[key] = value;
            break;
          }
        }
      });

      if (newCerts.length > 0) {
        const div = document.createElement("div");
        div.className = "week";
        div.innerHTML = `<h2>Week ${weekNum}</h2>`;

        newCerts.forEach(c => {
          const trackLink = `track_detail.html?title=${encode(c.title)}&artist=${encode(c.artist)}`;
          const artistLink = `artist.html?name=${encode(c.artist)}`;

          const line = document.createElement("div");
          line.className = `cert ${c.className}`;
          line.innerHTML = `
            <span class="cert-label">${c.cert}</span>
            <a href="${trackLink}">${c.title}</a> by
            <a href="${artistLink}">${c.artist}</a>
          `;
          div.appendChild(line);
        });

        output.appendChild(div);
      }
    });
  </script>
</body>
</html>
