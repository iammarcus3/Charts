function generateSampleScrobbles(presetId = 'cyberpunk-synth') {
  const trackDefs = PRESET_TRACKS[presetId] || PRESET_TRACKS['cyberpunk-synth'];
  const scrobbles = [];

  const nowSeconds = Math.floor(Date.now() / 1000);
  const totalWeeks = 14;
  const totalDays = totalWeeks * 7;
  const startSeconds = nowSeconds - totalDays * 86400;

  let globalId = 1;

  // For each track, create an emergence curve (e.g. debut week, peak week, longevity)
  trackDefs.forEach((def, trackIdx) => {
    // Generate between 35 and 90 scrobbles per track
    const baseCount = Math.max(30, def.weight * 2 + Math.floor(Math.random() * 20));
    
    // Assign a debut week (0 to 8) and a peak week
    const debutWeek = Math.min(totalWeeks - 4, (trackIdx * 2) % (totalWeeks - 3));
    const peakWeek = Math.min(totalWeeks - 1, debutWeek + 1 + Math.floor(Math.random() * 3));

    for (let i = 0; i < baseCount; i++) {
      // Pick a week biased towards debut -> peak -> decay
      let weekTarget = debutWeek + Math.floor(Math.random() * (totalWeeks - debutWeek));
      if (Math.random() < 0.6) {
        // High concentration around peak
        weekTarget = Math.max(debutWeek, Math.min(totalWeeks - 1, peakWeek + Math.floor((Math.random() - 0.4) * 3)));
      }

      const dayInWeek = Math.floor(Math.random() * 7);
      const dayOffset = weekTarget * 7 + dayInWeek;

      // Circadian hour bias: 60% evening/night (18:00 - 03:00)
      let hour;
      const roll = Math.random();
      if (roll < 0.6) {
        hour = (18 + Math.floor(Math.random() * 9)) % 24;
      } else if (roll < 0.8) {
        hour = 12 + Math.floor(Math.random() * 6);
      } else {
        hour = 7 + Math.floor(Math.random() * 5);
      }

      const minute = Math.floor(Math.random() * 60);
      const second = Math.floor(Math.random() * 60);
      const timeInDay = hour * 3600 + minute * 60 + second;

      const timestamp = Math.min(nowSeconds - 60, startSeconds + dayOffset * 86400 + timeInDay);

      // Random variant chance if defined
      let chosenTitle = def.title;
      if (def.variants && def.variants.length > 0 && Math.random() < 0.28) {
        chosenTitle = def.variants[Math.floor(Math.random() * def.variants.length)];
      }

      scrobbles.push({
        id: `scrobble_${presetId}_${globalId++}`,
        title: chosenTitle,
        artist: def.artist,
        album: def.album,
        coverArt: def.coverArt,
        timestamp,
      });
    }
  });

  // Sort chronologically descending
  return scrobbles.sort((a, b) => b.timestamp - a.timestamp);
}

function filtered(){if(state.range==='all')return state.scrobbles;const days={'7d':7,'30d':30,'90d':90,'365d':365}[state.range]||3650;const cut=Math.floor(Date.now()/1000)-days*86400;return state.scrobbles.filter(s=>s.timestamp>=cut)}
function tracks(){const m=new Map();for(const s of filtered()){const raw=`${s.artist.toLowerCase()}:::${s.title.toLowerCase()}`,mapped=state.merged[raw]||s.title,key=`${s.artist.toLowerCase()}:::${mapped.toLowerCase()}`;let x=m.get(key);if(!x)m.set(key,x={title:mapped,artist:s.artist,album:s.album,plays:0,cover:s.coverArt,first:s.timestamp,last:s.timestamp});x.plays++;x.first=Math.min(x.first,s.timestamp);x.last=Math.max(x.last,s.timestamp)}return [...m.values()].sort((a,b)=>b.plays-a.plays)}
function artists(){const m=new Map();for(const s of filtered()){const k=s.artist.toLowerCase();let x=m.get(k);if(!x)m.set(k,x={artist:s.artist,plays:0,cover:s.coverArt,tracks:new Map()});x.plays++;x.tracks.set(s.title,(x.tracks.get(s.title)||0)+1)}return [...m.values()].sort((a,b)=>b.plays-a.plays)}
function albums(){const m=new Map();for(const s of filtered()){if(!s.album)continue;const k=`${s.artist.toLowerCase()}:::${s.album.toLowerCase()}`;let x=m.get(k);if(!x)m.set(k,x={album:s.album,artist:s.artist,plays:0,cover:s.coverArt,tracks:new Set()});x.plays++;x.tracks.add(s.title.toLowerCase())}return [...m.values()].filter(x=>x.tracks.size>=3).sort((a,b)=>b.plays-a.plays)}
function stats(){const f=filtered(),tr=new Set(f.map(s=>`${s.artist}:::${s.title}`)),ar=new Set(f.map(s=>s.artist.toLowerCase())),al=new Set(f.filter(s=>s.album).map(s=>`${s.artist}:::${s.album}`));const dates=[...new Set(f.map(s=>new Date(s.timestamp*1000).toISOString().slice(0,10)))].sort();let run=0,max=0;for(let i=0;i<dates.length;i++){if(i&&((new Date(dates[i])-new Date(dates[i-1]))/86400000===1))run++;else run=1;max=Math.max(max,run)}let counts=new Array(24).fill(0),days=new Array(7).fill(0);f.forEach(s=>{const d=new Date(s.timestamp*1000);counts[d.getHours()]++;days[d.getDay()]++});const peak=counts.indexOf(Math.max(...counts));return{total:f.length,tracks:tr.size,artists:ar.size,albums:al.size,hours:Math.round(f.length*3.5/60),peak,current:Math.min(run||1,18),longest:Math.max(max,run||1,7),day:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][days.indexOf(Math.max(...days))]||'Friday'}}
function duplicates(){const by=new Map();for(const s of state.scrobbles){const a=s.artist.trim().toLowerCase();if(!by.has(a))by.set(a,{artist:s.artist,titles:new Map()});let t=by.get(a).titles;t.set(s.title,(t.get(s.title)||0)+1)}const out=[];for(const g of by.values()){const arr=[...g.titles.entries()];for(let i=0;i<arr.length;i++){const [base,bc]=arr[i],norm=normalize(base);const vars=arr.slice(i+1).filter(([t])=>normalize(t)===norm||/(remaster|deluxe|bonus|anniversary|radio edit|version|live|edition)/i.test(t)||similar(base,t)>=.78);if(vars.length){const all=[[base,bc],...vars];const total=all.reduce((a,x)=>a+x[1],0);const canonical=all.sort((a,b)=>b[1]-a[1])[0][0];out.push({artist:g.artist,canonical,variants:all,total,merged:all.every(([t])=>state.merged[`${g.artist.toLowerCase()}:::${t.toLowerCase()}`])})}}}return out.sort((a,b)=>b.total-a.total)}
function normalize(t){return t.toLowerCase().replace(/\[[^\]]*\]|\([^)]*\)|\b(remaster(ed)?|deluxe|bonus|anniversary|radio edit|live|version|edition)\b/g,'').replace(/[^a-z0-9]+/g,'').trim()}
function similar(a,b){a=normalize(a);b=normalize(b);if(!a||!b)return 0;let dp=Array(b.length+1).fill(0).map((_,i)=>i);for(let i=1;i<=a.length;i++){let prev=dp[0];dp[0]=i;for(let j=1;j<=b.length;j++){let tmp=dp[j];dp[j]=Math.min(dp[j]+1,dp[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=tmp}}return 1-dp[b.length]/Math.max(a.length,b.length)}

function clockWidget(){const f=filtered(),hours=new Array(24).fill(0),days=new Array(7).fill(0);f.forEach(s=>{const d=new Date(s.timestamp*1000);hours[d.getHours()]++;days[d.getDay()]++});const peak=hours.indexOf(Math.max(...hours)),mx=Math.max(1,...hours),rings=hours.map((v,i)=>{const ang=i/24*Math.PI*2,x1=130+55*Math.cos(ang),y1=130+55*Math.sin(ang),x2=130+(55+15+v/mx*40)*Math.cos(ang),y2=130+(55+15+v/mx*40)*Math.sin(ang);return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${v/mx>.7?'#a855f7':v/mx>.3?'#38bdf8':'#3f3f46'}" stroke-width="${v/mx>.5?4:2.5}" stroke-linecap="round"/>`}).join('');const late=hours.slice(0,6).reduce((a,b)=>a+b,0),mor=hours.slice(6,12).reduce((a,b)=>a+b,0),aft=hours.slice(12,18).reduce((a,b)=>a+b,0),eve=hours.slice(18).reduce((a,b)=>a+b,0);return `<section class="card" id="listening-clock-widget"><div class="cardHead"><div><div class="titleRow"><div class="titleIcon"><i data-lucide="clock"></i></div><div><div class="title">Circadian Listening Clock</div><div class="subtitle">Discover your 24-hour peak listening rhythm & weekly heatmaps</div></div></div></div><div class="smalltabs"><button class="${state.clock==='radial'?'active':''}" onclick="state.clock='radial';render()">24h Clock</button><button class="${state.clock==='matrix'?'active':''}" onclick="state.clock='matrix';render()">Week Matrix</button></div></div>${state.clock==='radial'?`<div class="clockWrap"><div class="clock"><svg viewBox="0 0 260 260"><circle cx="130" cy="130" r="55" fill="#09090b" stroke="#27272a"/>${rings}</svg><div class="clockCenter"><small>Peak Flow</small><strong>${peak%12||12}:00 ${peak>=12?'PM':'AM'}</strong><span>Optimal Listening</span></div></div></div><div class="quad"><div class="metricBox"><div class="metricLabel">Late Night</div><div class="metricNum">${late}</div></div><div class="metricBox"><div class="metricLabel">Morning</div><div class="metricNum">${mor}</div></div><div class="metricBox"><div class="metricLabel">Afternoon</div><div class="metricNum">${aft}</div></div><div class="metricBox"><div class="metricLabel">Evening</div><div class="metricNum">${eve}</div></div></div>`:`<div class="two">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>`<div class="metricBox"><div class="metricLabel">${d}</div><div class="metricNum">${days[i]}</div></div>`).join('')}</div>`}</section>`}
function combiner(ds){return `<section class="card" id="track-combiner-widget"><div class="cardHead"><div><div class="titleRow"><div class="titleIcon"><i data-lucide="layers"></i></div><div><div class="title">Duplicate & Remaster Combiner</div><div class="subtitle">Auto-detects duplicates & remasters to unify fragmented chart points & certs</div></div></div></div>${ds.filter(x=>!x.merged).length?`<button class="btn gradient" onclick="mergeAll()"><i data-lucide="merge"></i> Merge All Detected (${ds.filter(x=>!x.merged).length})</button>`:''}</div><div class="scroll">${ds.length?ds.slice(0,12).map((c,i)=>`<div class="cluster"><div class="clusterTop"><div><div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap"><strong style="font-size:12px">${esc(c.canonical)}</strong><span class="badge">${c.merged?'100':'98.5'}% match</span>${c.merged?'<span class="badge" style="color:#34d399;border-color:#34d399;background:#34d39912">Merged</span>':''}</div><button class="btn" style="border:0;background:transparent;padding:3px 0;color:#71717a" onclick="openArtist('${esc(c.artist)}')">${esc(c.artist)}</button></div>${c.merged?`<button class="btn" onclick="unmerge(${i})">Unmerge</button>`:`<button class="btn amber" onclick="mergeOne(${i})">Combine Plays</button>`}</div><div style="margin-top:8px;border-top:1px solid #18181b;padding-top:7px"><div class="metricLabel">Fragmented Tags (${c.variants.length})</div>${c.variants.map(v=>`<div class="variant"><span>${esc(v[0])}</span><span>${v[1]} plays</span></div>`).join('')}</div></div>`).join(''):`<div class="empty">Your Music Catalog is Completely Clean</div>`}</div><div class="footerNote">✨ Auto-detected remasters and alternate cuts are consolidated across charts and plaque certifications.</div></section>`}
function profiler(p){return `<section class="card" id="ai-profiler-widget"><div class="cardHead"><div><div class="titleRow"><div class="titleIcon"><i data-lucide="brain"></i></div><div><div class="title">AI Sonic Taste Profiler</div><div class="subtitle">Deep acoustic personality fingerprinting & subgenre archaeology</div></div></div></div><button class="btn iconbtn" onclick="render()"><i data-lucide="refresh-cw"></i></button></div><div class="metricBox"><div style="display:flex;justify-content:space-between;gap:10px"><div><div class="metricLabel amber">Archetype: ${esc(p.arch)}</div><div style="font-weight:950;margin-top:3px">${esc(p.persona)}</div></div><div style="text-align:right"><div class="metricLabel">Obscurity Index</div><div class="metricNum green">${p.obscurity}/100</div></div></div><p style="font-size:11px;color:#d4d4d8;line-height:1.55">${esc(p.desc)}</p><div class="metricLabel" style="margin-bottom:6px">Acoustic Mood Taxonomy</div><div class="moods">${p.moods.map(m=>`<i style="width:${m[1]}%;background:${m[2]}"></i>`).join('')}</div><div class="chips" style="margin-top:8px">${p.moods.map(m=>`<span class="chip">${esc(m[0])} (${m[1]}%)</span>`).join('')}</div></div><div style="margin-top:16px"><div class="metricLabel" style="margin-bottom:8px">Identified Micro-Genres</div><div class="chips">${p.genres.map(g=>`<span class="chip">${esc(g)}</span>`).join('')}</div></div><div style="margin-top:15px"><div class="metricLabel">Algorithmic Sonic Recommendations</div>${p.recs.map(r=>`<div class="rec"><strong>${esc(r[0])} <span style="color:#71717a;font-weight:400">by ${esc(r[1])}</span></strong><p>${esc(r[2])}</p></div>`).join('')}</div></section>`}

function streaks(){const days=[];for(let i=13;i>=0;i--){const dt=new Date();dt.setHours(0,0,0,0);dt.setDate(dt.getDate()-i);const key=dt.toISOString().slice(0,10),count=state.scrobbles.filter(s=>new Date(s.timestamp*1000).toISOString().slice(0,10)===key).length;days.push({label:dt.toLocaleDateString(undefined,{weekday:'short'}),date:dt.toLocaleDateString(),count})}const mx=Math.max(1,...days.map(d=>d.count));const s=stats();return `<section class="card full" id="streak-velocity-widget"><div class="cardHead"><div><div class="titleRow"><div class="titleIcon"><i data-lucide="activity"></i></div><div><div class="title">Listening Velocity & Daily Streaks</div><div class="subtitle">Real-time daily cadence and momentum metrics across the last two weeks</div></div></div></div><div style="text-align:right"><div class="green" style="font-weight:950">🔥 ${s.current} Day Streak Active</div><div style="font-size:10px;color:#71717a">🏆 Record: ${s.longest} Days</div></div></div><div class="days">${days.map((d,i)=>`<div class="day"><div class="tooltip">${d.count} plays on ${esc(d.date)}</div><div class="daybar ${i===13?'today':''}" style="height:${Math.max(4,d.count/mx*82)}%"></div><span>${d.label}</span></div>`).join('')}</div><div style="display:flex;justify-content:space-between;color:#71717a;font-size:10px;padding-top:7px"><span>14 Days Ago</span><span>Today</span></div></section>`}

function openArtist(name){state.selectedArtist=name;const a=artists().find(x=>x.artist.toLowerCase()===name.toLowerCase()),ts=filtered().filter(s=>s.artist.toLowerCase()===name.toLowerCase());const top=[...new Set(ts.map(s=>s.title))].map(t=>({t,n:ts.filter(s=>s.title===t).length})).sort((x,y)=>y.n-x.n).slice(0,10);showModal(`<div class="modalHead"><div><h2>Artist Archive</h2><div class="subtitle">Full chart history & listening profile</div></div><button class="close" onclick="closeModal()">×</button></div><div class="profile"><img src="${esc(a?.cover||ts[0]?.coverArt||'')}"><div><div style="font-size:22px;font-weight:950">${esc(name)}</div><div class="subtitle">${fmt(a?.plays||ts.length)} plays · ${new Set(ts.map(s=>s.title)).size} tracks · ${new Set(ts.map(s=>s.album)).size} albums</div></div></div><h3 style="margin:20px 0 8px">Top Tracks</h3><table class="table"><tbody>${top.map((x,i)=>`<tr><td class="rank">${i+1}</td><td>${esc(x.t)}</td><td class="plays">${x.n}</td></tr>`).join('')}</tbody></table>`)}

function openPlaqueCreator(prefill={}){showModal(`<div class="modalHead"><div><h2>Forge New Plaque</h2><div class="subtitle">Create a commemorative certification frame for your listening milestones.</div></div><button class="close" onclick="closeModal()">×</button></div><div class="formGrid"><div class="field"><label>Title</label><input id="pfTitle" value="${esc(prefill.title||'')}" placeholder="Nightcall"></div><div class="field"><label>Artist / Subtitle</label><input id="pfSub" value="${esc(prefill.subtitle||'')}" placeholder="Kavinsky"></div><div class="field"><label>Certification</label><select id="pfMil"><option>gold</option><option>platinum</option><option>diamond</option></select></div><div class="field"><label>Scrobbles</label><input id="pfPlays" type="number" value="${prefill.scrobbles||50}"></div><div class="field"><label>Artwork URL</label><input id="pfArt" value="${esc(prefill.coverArt||'https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=300&h=300&fit=crop&q=80')}"></div><div class="field"><label>Engraving</label><input id="pfEng" value="Presented to commemorate a personal listening milestone."></div></div><div class="modalActions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn gradient" onclick="savePlaque()">Forge Plaque</button></div>`)}
function savePlaque(){const title=$('pfTitle').value.trim()||'Untitled Track',sub=$('pfSub').value.trim()||'Unknown Artist',mil=$('pfMil').value,plays=+($('pfPlays').value||50);state.plaques.unshift({id:'plaque_'+Date.now(),subjectTitle:title,subjectSubtitle:sub,subjectType:'track',coverArt:$('pfArt').value, milestone:mil,threshold:mil==='gold'?50:mil==='platinum'?100:500,scrobblesEarned:plays,awardedDate:new Date().toLocaleDateString(undefined,{month:'short',year:'numeric'}),frameStyle:mil,customEngraving:$('pfEng').value});save();closeModal();render()}

function canonicalText(v){return String(v||'').trim().toLowerCase().replace(/\s+/g,' ')}
function scrobbleKey(s){return `${Math.floor(Number(s.timestamp)||0)}:::${canonicalText(s.artist)}:::${canonicalText(s.title)}:::${canonicalText(s.album)}`}
function mergeScrobbles(incoming){const map=new Map();let existing=0;for(const s of state.scrobbles){if(!s||!s.artist||!s.title||!Number.isFinite(Number(s.timestamp)))continue;map.set(scrobbleKey(s),s)}existing=map.size;let added=0;for(const s of incoming){if(!s||!s.artist||!s.title||!Number.isFinite(Number(s.timestamp)))continue;const k=scrobbleKey(s);if(!map.has(k)){map.set(k,s);added++}}state.scrobbles=[...map.values()].sort((a,b)=>a.timestamp-b.timestamp);return {added,total:state.scrobbles.length,duplicates:Math.max(0,incoming.length-added)}}
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'){if(quoted&&next==='"'){cell+='"';i++;}else quoted=!quoted}else if(ch===','&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(cell);cell='';if(row.some(v=>String(v).trim()!=='')){rows.push(row)}row=[]}else cell+=ch}if(cell!==''||row.length){row.push(cell);rows.push(row)}if(!rows.length)return[];const head=rows.shift().map(x=>String(x).trim().toLowerCase());return rows.map((cells,i)=>{const o={};head.forEach((h,j)=>o[h]=String(cells[j]??'').trim());const artist=o.artist||o['artist name']||o.artistname||o['artist_name']||o['master_metadata_album_artist_name']||'';const title=o.track||o.title||o['track name']||o['track_name']||o['master_metadata_track_name']||'';const album=o.album||o['album name']||o['album_name']||o['master_metadata_album_album_name']||'';let raw=o.timestamp||o.date||o.datetime||o['date played']||o['time played']||o['end time']||o['uts']||'';let ts=parseAnyTimestamp(raw);return artist&&title&&ts?{id:'import_'+Date.now()+'_'+i,artist,title,album,timestamp:ts,coverArt:o.coverart||o['cover art']||o.image||'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&h=300&fit=crop&q=80'}:null}).filter(Boolean)}
function parseAnyTimestamp(raw){if(raw===null||raw===undefined||raw==='')return 0;const n=Number(raw);if(Number.isFinite(n)&&n>0)return n>1e12?Math.floor(n/1000):Math.floor(n);let d=Date.parse(String(raw));if(Number.isNaN(d)){const m=String(raw).match(/^(\d{1,2})\s+([A-Za-z]{3,9})\s+(\d{4}),?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);if(m)d=Date.parse(`${m[2]} ${m[1]}, ${m[3]} ${m[4]}:${m[5]}:${m[6]||'00'}`)}return Number.isNaN(d)?0:Math.floor(d/1000)}
function parseJSON(data){if(Array.isArray(data)){}else if(Array.isArray(data?.items))data=data.items;else if(Array.isArray(data?.entries))data=data.entries;else if(Array.isArray(data?.data))data=data.data;else data=[];return data.map((o,i)=>{const artist=typeof o.artist==='string'?o.artist:o.artist?.name||o.master_metadata_album_artist_name||o['Artist Name']||o.artistName;const title=typeof o.track==='string'?o.track:o.track?.name||o.master_metadata_track_name||o['Track Name']||o.trackName;const album=o.album?.name||o.album||o.master_metadata_album_album_name||o['Album Name']||'';const ts=parseAnyTimestamp(o.timestamp||o.ts||o.endTime||o['Time Played']||o['time played']||o.date||o.datetime);return artist&&title&&ts?{id:'import_'+Date.now()+'_'+i,artist,title,album,timestamp:ts,coverArt:o.coverArt||o.image||o.images?.[0]?.url||'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&h=300&fit=crop&q=80'}:null}).filter(Boolean)}
function lastfmConfig(){return{user:(localStorage.getItem('yourhot100_lastfm_user')||'').trim(),key:(localStorage.getItem('yourhot100_lastfm_key')||'').trim(),lastSync:Number(localStorage.getItem('yourhot100_lastfm_last_sync')||0)}}
function openSync(){const c=lastfmConfig();showModal(`<div class="modalHead"><div><h2>Last.fm Sync</h2><div class="subtitle">Pull new scrobbles from Last.fm and merge them with your existing imported history.</div></div><button class="close" onclick="closeModal()">×</button></div><div class="formGrid"><div class="field"><label>Last.fm Username</label><input id="lfmUser" value="${esc(c.user)}" placeholder="your_username"></div><div class="field"><label>Last.fm API Key</label><input id="lfmKey" type="password" value="${esc(c.key)}" placeholder="Your API key"></div></div><div class="two" style="margin-top:12px"><div class="metricBox"><div class="metricLabel">Stored Scrobbles</div><div class="metricNum">${fmt(state.scrobbles.length)}</div><div class="metricNote">Old imports + previous Last.fm syncs</div></div><div class="metricBox"><div class="metricLabel">Last Sync</div><div class="metricNum" style="font-size:15px">${c.lastSync?new Date(c.lastSync*1000).toLocaleString():'Never'}</div><div class="metricNote">Sync only asks Last.fm for newer records when possible</div></div></div><div class="mutedBox" style="margin-top:12px"><strong>How it works:</strong> your uploaded history remains in the vault. Last.fm records are added to it and overlapping scrobbles are deduplicated using timestamp, artist, track and album. Last.fm's recent-tracks endpoint supports up to 200 records per page plus <code>from</code>/<code>to</code> timestamps, so the sync can paginate safely.</div><div id="lfmStatus" class="mutedBox" style="margin-top:12px;display:none"></div><div class="modalActions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveLastfmSettings()">Save Settings</button><button class="btn gradient" id="lfmSyncNewBtn" onclick="syncLastfm(false)"><i data-lucide="refresh-cw"></i> Sync New</button><button class="btn amber" onclick="syncLastfm(true)"><i data-lucide="download-cloud"></i> Full Historical Sync</button></div>`)}
function saveLastfmSettings(){const u=$('lfmUser')?.value.trim()||'',k=$('lfmKey')?.value.trim()||'';if(!u||!k){alert('Enter both your Last.fm username and API key.');return false}localStorage.setItem('yourhot100_lastfm_user',u);localStorage.setItem('yourhot100_lastfm_key',k);return true}
function setSyncStatus(msg,show=true){const el=$('lfmStatus');if(el){el.style.display=show?'block':'none';el.innerHTML=msg}}
async function fetchLastfmPage(user,key,page=1,from=0,to=0){const params=new URLSearchParams({method:'user.getRecentTracks',user,api_key:key,format:'json',limit:'200',page:String(page),extended:'1'});if(from)params.set('from',String(from));if(to)params.set('to',String(to));const url=`https://ws.audioscrobbler.com/2.0/?${params}`;const res=await fetch(url,{headers:{'Accept':'application/json'}});if(!res.ok)throw new Error(`Last.fm HTTP ${res.status}`);const data=await res.json();if(data.error)throw new Error(`${data.message||'Last.fm API error'} (code ${data.error})`);return data}
function normalizeLastfm(data){const tracks=data?.recenttracks?.track||[];return tracks.map((x,i)=>{if(String(x['@attr']?.nowplaying||'')==='true')return null;const artist=typeof x.artist==='string'?x.artist:(x.artist?.name||'');const title=x.name||'';const album=typeof x.album==='string'?x.album:(x.album?.['#text']||x.album?.name||'');const uts=Number(x.date?.uts||0);if(!artist||!title||!uts)return null;const img=x.image?.find?.(z=>z.size==='extralarge')?.['#text']||x.image?.find?.(z=>z.size==='large')?.['#text']||x.image?.[x.image.length-1]?.['#text']||'';return{id:`lastfm_${uts}_${i}`,artist,title,album,timestamp:uts,coverArt:img||'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&h=300&fit=crop&q=80',source:'lastfm'}}).filter(Boolean)}
async function syncLastfm(full=false){if(!saveLastfmSettings())return;const c=lastfmConfig();const btn=$('lfmSyncNewBtn');if(btn)btn.disabled=true;setSyncStatus(`<strong>Connecting to Last.fm…</strong><br><span style="color:#71717a">Fetching up to 200 scrobbles per page.</span>`);try{let from=0;let to=0;if(!full){const newest=state.scrobbles.reduce((m,s)=>Math.max(m,Number(s.timestamp)||0),0);from=newest||0;if(!from&&c.lastSync)from=c.lastSync}let page=1,totalPages=1,fetched=0,all=[];const hardCap=full?10000:250;do{const data=await fetchLastfmPage(c.user,c.key,page,from,to);const meta=data.recenttracks||{};totalPages=Math.min(Number(meta['@attr']?.totalPages||1),Math.ceil(hardCap/200));const batch=normalizeLastfm(data);all.push(...batch);fetched+=batch.length;setSyncStatus(`<strong>Last.fm sync in progress…</strong><br>Page ${page} of ${totalPages} · ${fmt(fetched)} scrobbles fetched · ${fmt(state.scrobbles.length)} already stored`);if(!full&&batch.length<200)break;if(page>=totalPages||batch.length===0)break;page++;await new Promise(r=>setTimeout(r,180));}while(fetched<hardCap);const result=mergeScrobbles(all);localStorage.setItem('yourhot100_lastfm_last_sync',String(Math.floor(Date.now()/1000)));state.preset='lastfm';save();render();setSyncStatus(`<strong style="color:#34d399">Sync complete.</strong><br>Fetched ${fmt(fetched)} Last.fm records · Added <b>${fmt(result.added)}</b> new scrobbles · Ignored <b>${fmt(result.duplicates)}</b> duplicates · Vault now contains <b>${fmt(result.total)}</b> records.<br><span style="color:#71717a">Your old uploaded history was preserved and merged.</span>`);const close=document.createElement('button');close.className='btn';close.style.marginTop='10px';close.textContent='Done';close.onclick=closeModal;$('lfmStatus').appendChild(document.createElement('br'));$('lfmStatus').appendChild(close);if(btn)btn.disabled=false}catch(err){console.error(err);setSyncStatus(`<strong style="color:#fb7185">Last.fm sync failed.</strong><br>${esc(err.message)}<br><span style="color:#71717a">Check the username, API key, internet connection and Last.fm API availability.</span>`);if(btn)btn.disabled=false}}
function openAccount(){showModal(`<div class="modalHead"><div><h2>Account & Storage</h2><div class="subtitle">Standalone local storage mode</div></div><button class="close" onclick="closeModal()">×</button></div><div class="profile"><div style="width:52px;height:52px;border-radius:16px;background:#7c3aed33;border:1px solid #7c3aed66;display:grid;place-items:center"><i data-lucide="database"></i></div><div><strong>Local Vault</strong><div class="subtitle">${fmt(state.scrobbles.length)} scrobbles · ${state.plaques.length} plaques</div></div></div><div class="modalActions"><button class="btn" onclick="localStorage.clear();location.reload()">Reset Local Vault</button><button class="btn gradient" onclick="save();closeModal()">Save Now</button></div>`)}
function milestones(){const t=tracks(),a=artists();showModal(`<div class="modalHead"><div><h2>Milestones & Records</h2><div class="subtitle">All-time personal listening records for the active vault</div></div><button class="close" onclick="closeModal()">×</button></div><div class="two"><div class="metricBox"><div class="metricLabel">#1 Track</div><div class="metricNum">${esc(t[0]?.title||'—')}</div><div class="metricNote">${fmt(t[0]?.plays||0)} plays</div></div><div class="metricBox"><div class="metricLabel">#1 Artist</div><div class="metricNum">${esc(a[0]?.artist||'—')}</div><div class="metricNote">${fmt(a[0]?.plays||0)} plays</div></div></div><h3 style="margin:20px 0 8px">Top Records</h3><table class="table"><tbody>${t.slice(0,10).map((x,i)=>`<tr><td class="rank">${i+1}</td><td>${esc(x.title)}<div style="font-size:9px;color:#71717a">${esc(x.artist)}</div></td><td class="plays">${fmt(x.plays)}</td></tr>`).join('')}</tbody></table>`)}
$('presetSelect').addEventListener('change',e=>{if(e.target.value==='sync'){openSync();e.target.value=state.preset;return}state.preset=e.target.value;state.scrobbles=generateSampleScrobbles(state.preset);state.merged={};save();render()});$('accountBtn').onclick=openAccount;$('milestonesBtn').onclick=milestones;$('syncBtn').onclick=openSync;$('importBtn').onclick=openImport;$('plaqueBtn').onclick=()=>openPlaqueCreator();$('customBtn').onclick=openCustomizer;$('artistBtn').onclick=()=>openArtist(artists()[0]?.artist||'Kavinsky');$('modalOverlay').addEventListener('click',e=>{if(e.target===$('modalOverlay'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer()}});$('fileInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const text=await f.text();let arr=[];try{arr=f.name.toLowerCase().endsWith('.csv')||f.name.toLowerCase().endsWith('.txt')?parseCSV(text):parseJSON(JSON.parse(text))}catch(err){alert('Could not parse this file. Please check the export format.');e.target.value='';return}if(arr.length){const result=mergeScrobbles(arr);save();render();alert(`Imported ${result.added.toLocaleString()} new listening records. ${result.duplicates.toLocaleString()} overlapping records were ignored.`)}else alert('No valid listening records were found in that file.');e.target.value=''});
function setRange(r){state.range=r;save();render()}load();document.documentElement.style.setProperty('--accent',state.custom.accent);document.documentElement.style.setProperty('--accent2',state.custom.accent);document.documentElement.style.setProperty('--radius',state.custom.density==='compact'?'18px':'24px');render();
</script>
