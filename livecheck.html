<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Last.fm Weekly Charts — Billboard Style</title>
  <style>
    :root{
      --bg:#0b0b0c; --card:#141417; --muted:#9aa0a6; --text:#e8eaed; --accent:#4f8cff; --accent-2:#7ba6ff; --border:#2b2b30;
      --up:#22c55e; --down:#ef4444; --new:#f59e0b;
    }
    *{box-sizing:border-box}
    body{margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color:var(--text); background:linear-gradient(180deg,#0b0b0c 0%, #0f1116 100%);}    
    header{padding:20px 16px; border-bottom:1px solid var(--border); position:sticky; top:0; backdrop-filter:blur(8px); background:rgba(11,11,12,.7)}
    h1{margin:0; font-size:20px}
    .container{max-width:1100px; margin:0 auto; padding:16px}
    .row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
    .card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px}
    label{font-size:12px; color:var(--muted); display:block; margin-bottom:6px}
    input, select{padding:10px 12px; background:#0f1014; color:var(--text); border:1px solid var(--border); border-radius:12px;}
    button{padding:10px 14px; border:1px solid var(--border); border-radius:12px; background:linear-gradient(180deg,#1a1b20,#13141a); color:var(--text); cursor:pointer}
    button:hover{border-color:#3b3b42}
    button.primary{background:linear-gradient(180deg,var(--accent),var(--accent-2)); color:#0b0b0c; border:0}
    button:disabled{opacity:.6; cursor:default}
    .muted{color:var(--muted); font-size:12px}
    .controls{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
    .spacer{flex:1}

    .table-wrap{margin-top:12px; overflow:auto; border:1px solid var(--border); border-radius:14px}
    table{width:100%; border-collapse:collapse; min-width:760px}
    th,td{padding:10px 12px; border-bottom:1px solid var(--border); text-align:left; font-size:14px}
    th{position:sticky; top:0; background:#121216; z-index:1; font-weight:600}
    td.num, th.num{text-align:center; width:90px}
    td.rank{font-weight:700}
    .badge{display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px}
    .badge.up{background:rgba(34,197,94,.15); color:var(--up)}
    .badge.down{background:rgba(239,68,68,.15); color:var(--down)}
    .badge.new{background:rgba(245,158,11,.15); color:var(--new)}
    .pill{display:inline-block; padding:4px 10px; border:1px solid var(--border); border-radius:999px; font-size:12px; color:var(--muted)}
    .footer{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-top:10px}
    .progress{height:6px; background:#0f1014; border:1px solid var(--border); border-radius:6px; width:180px; overflow:hidden}
    .progress>i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); width:0%}
    .loading{display:inline-block; width:14px; height:14px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; vertical-align:-2px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <header>
    <div class="container row">
      <h1 class="spacer">Last.fm Weekly Charts — Billboard Style</h1>
      <div class="row">
        <div>
          <label for="user">Last.fm username</label>
          <input id="user" placeholder="yourusername" />
        </div>
        <div>
          <label>&nbsp;</label>
          <button id="load" class="primary">Load</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="panel" class="card" style="display:none">
      <div class="controls">
        <div>
          <label for="weekSelect">Week</label>
          <select id="weekSelect"></select>
        </div>
        <div class="row">
          <label>&nbsp;</label>
          <div class="row">
            <button id="first">⟪ First</button>
            <button id="prev">⟨ Prev</button>
            <button id="next">Next ⟩</button>
            <button id="last">Last ⟫</button>
          </div>
        </div>
        <div class="spacer"></div>
        <div>
          <label>&nbsp;</label>
          <button id="loadOlder">Load older weeks</button>
        </div>
      </div>
      <div class="footer" style="margin-top:8px">
        <div class="muted" id="status"></div>
        <div class="row">
          <span class="pill" id="summary"></span>
          <div class="progress" title="Background prefetch progress"><i id="bar"></i></div>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="num">Rank</th>
              <th>Title</th>
              <th>Artist</th>
              <th class="num">Last Week</th>
              <th class="num">Peak</th>
              <th class="num">Weeks</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
  (function(){
    // ==== CONFIG ====
    const API_KEY = 'ed9c6dcac73ea1adcd3750efeea9b822'; // user provided key
    const BASE = 'https://ws.audioscrobbler.com/2.0/';
    const LIMIT_PER_WEEK = 100;        // Hot 100
    const INITIAL_WEEKS_TO_SHOW = 20;  // show this many newest weeks first
    const OLDER_BATCH = 30;            // when clicking "Load older weeks"
    const THROTTLE_MS = 220;           // delay between API calls

    // ==== DOM ====
    const elUser = document.getElementById('user');
    const elLoad = document.getElementById('load');
    const elPanel = document.getElementById('panel');
    const elWeek = document.getElementById('weekSelect');
    const elPrev = document.getElementById('prev');
    const elNext = document.getElementById('next');
    const elFirst= document.getElementById('first');
    const elLast = document.getElementById('last');
    const elOlder= document.getElementById('loadOlder');
    const elStatus = document.getElementById('status');
    const elSummary = document.getElementById('summary');
    const elBar = document.getElementById('bar');
    const elBody = document.getElementById('tbody');

    // ==== STATE ====
    let WEEK_LIST = []; // [{from,to,label}] oldest..newest
    let WEEK_MAP = new Map(); // key `${from}-${to}` -> {tracks:[{rank,name,artist}], loaded:boolean}
    let currentIndex = -1; // index into WEEK_LIST
    let username = '';

    // ==== UTIL ====
    const sleep = (ms)=> new Promise(r=>setTimeout(r,ms));
    const qs = (o)=> new URLSearchParams(o).toString();
    function fmtWeekLabel(from,to){
      const d = new Date(Number(to)*1000);
      return `Week ending ${d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}`;
    }
    function cacheKey(u){ return `lfm.weekcache.v1::${u}`; }

    function showError(msg){ elStatus.textContent = msg; }

    // Load / save cache in localStorage
    function loadCache(u){
      try{
        const raw = localStorage.getItem(cacheKey(u));
        if(!raw) return null;
        const obj = JSON.parse(raw);
        return obj;
      }catch{return null}
    }
    function saveCache(u){
      try{
        const payload = {
          weekList: WEEK_LIST,
          weeks: [...WEEK_MAP.entries()],
          ts: Date.now()
        };
        localStorage.setItem(cacheKey(u), JSON.stringify(payload));
      }catch{}
    }

    // ==== API ====
    async function fetchLastFM(params){
      if(!API_KEY){ throw new Error('Missing Last.fm API key.'); }
      const url = `${BASE}?${qs({...params, api_key:API_KEY, format:'json'})}`;
      let attempt=0;
      while(true){
        attempt++;
        const res = await fetch(url);
        let j=null; try{ j = await res.json(); }catch{}
        if(!res.ok || j?.error){
          const status = res.status;
          const msg = j?.message || `HTTP ${status}`;
          if((status===429 || status===503 || status===403) && attempt<3){ await sleep(400*attempt); continue; }
          throw new Error(msg);
        }
        return j;
      }
    }

    async function getWeeklyChartList(user){
      const j = await fetchLastFM({ method:'user.getWeeklyChartList', user });
      let list = j?.weeklychartlist?.chart || [];
      if(!Array.isArray(list)) list = [list];
      // normalize to oldest..newest
      list.sort((a,b)=> Number(a.from)-Number(b.from));
      return list.map(x=>({from:x.from, to:x.to, label:fmtWeekLabel(x.from,x.to)}));
    }

    async function getWeeklyTrackChart(user, from, to){
      const j = await fetchLastFM({ method:'user.getWeeklyTrackChart', user, from, to, limit: LIMIT_PER_WEEK });
      let arr = j?.weeklytrackchart?.track || [];
      if(!Array.isArray(arr)) arr = arr? [arr]: [];
      const rows = arr.map(t=>({
        rank: Number(t['@attr']?.rank ?? t.rank ?? 0),
        name: t.name || '',
        artist: (t.artist?.name ?? t.artist?.['#text'] ?? t.artist ?? '')
      })).filter(r=>r.rank>0).sort((a,b)=> a.rank-b.rank);
      return rows;
    }

    // Find first week that actually has tracks, trim older empty weeks
    async function trimLeadingEmptyWeeks(){
      let firstWithData = -1;
      for(let i=0;i<WEEK_LIST.length;i++){
        await ensureWeekLoaded(i, true);
        const w = WEEK_LIST[i];
        const k = `${w.from}-${w.to}`;
        const rows = WEEK_MAP.get(k)?.tracks || [];
        if(rows.length>0){ firstWithData = i; break; }
      }
      if(firstWithData>0){
        // drop weeks before firstWithData
        const drop = WEEK_LIST.slice(0, firstWithData);
        WEEK_LIST = WEEK_LIST.slice(firstWithData);
        // remove dropped from map
        for(const w of drop){ WEEK_MAP.delete(`${w.from}-${w.to}`); }
        saveCache(username);
      }
    }

    // Lazy load a week if not loaded yet
    async function ensureWeekLoaded(idx, throttle=true){
      const w = WEEK_LIST[idx]; if(!w) return;
      const key = `${w.from}-${w.to}`;
      const state = WEEK_MAP.get(key) || { tracks:[], loaded:false };
      if(state.loaded) return; // already loaded
      if(throttle) await sleep(THROTTLE_MS);
      elStatus.innerHTML = `<span class="loading"></span> Loading ${w.label} …`;
      const tracks = await getWeeklyTrackChart(username, w.from, w.to);
      WEEK_MAP.set(key, { tracks, loaded:true });
      saveCache(username);
      elStatus.textContent = `Loaded ${w.label}`;
    }

    // Background prefetch older weeks (progress bar updates)
    async function prefetchRange(startIdx, endIdx){
      const total = Math.max(0, endIdx-startIdx+1);
      if(total===0) return;
      let done=0;
      for(let i=startIdx;i<=endIdx;i++){
        const key = `${WEEK_LIST[i].from}-${WEEK_LIST[i].to}`;
        const s = WEEK_MAP.get(key);
        if(!s || !s.loaded){
          try{ await ensureWeekLoaded(i,true);}catch(e){ /* ignore and continue */ }
        }
        done++;
        elBar.style.width = `${Math.round(100*done/total)}%`;
      }
      elStatus.textContent = `Prefetch complete.`;
      setTimeout(()=>{ elBar.style.width='0%'; }, 1200);
    }

    // Compute stats for a specific week index using all LOADED weeks
    function computeStatsForWeek(idx){
      const w = WEEK_LIST[idx]; if(!w) return [];
      const key = `${w.from}-${w.to}`;
      const cur = WEEK_MAP.get(key)?.tracks || [];
      const lastIdx = idx-1;

      // Build quick lookups for previous ranks and historical peak/weeks
      const prevMap = new Map();
      if(lastIdx>=0){
        const pw = WEEK_LIST[lastIdx];
        const pkey = `${pw.from}-${pw.to}`;
        const prev = WEEK_MAP.get(pkey)?.tracks || [];
        for(const t of prev){ prevMap.set((t.name+'||'+t.artist).toLowerCase(), t.rank); }
      }

      // Build history map across all LOADED weeks up to current idx
      const hist = new Map(); // id -> {weeks:Number, peak:Number}
      for(let i=0;i<=idx;i++){
        const ww = WEEK_LIST[i];
        const k = `${ww.from}-${ww.to}`;
        const rows = WEEK_MAP.get(k)?.tracks || [];
        for(const t of rows){
          const id = (t.name+'||'+t.artist).toLowerCase();
          const obj = hist.get(id) || { weeks:0, peak:Infinity };
          obj.weeks += 1;
          obj.peak = Math.min(obj.peak, t.rank);
          hist.set(id, obj);
        }
      }

      // Merge into current week rows
      const out = cur.map(t=>{
        const id = (t.name+'||'+t.artist).toLowerCase();
        const h = hist.get(id) || { weeks:1, peak:t.rank };
        const prev = prevMap.get(id);
        return {
          rank: t.rank,
          name: t.name,
          artist: t.artist,
          lastWeek: (prev? String(prev): '—'),
          peak: (isFinite(h.peak)? h.peak: t.rank),
          weeks: h.weeks
        };
      });
      // Already sorted by rank
      return out;
    }

    function renderWeekSelector(){
      elWeek.innerHTML = '';
      WEEK_LIST.forEach((w,i)=>{
        const opt = document.createElement('option');
        opt.value = String(i);
        opt.textContent = w.label;
        elWeek.appendChild(opt);
      });
      elWeek.value = String(currentIndex);
    }

    function renderTable(idx){
      const rows = computeStatsForWeek(idx);
      elBody.innerHTML = '';
      if(rows.length===0){
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="6" style="text-align:center; padding:18px; color:#9aa0a6">No tracks for this week.</td>`;
        elBody.appendChild(tr);
      }
      for(const r of rows){
        // Movement badge vs last week
        let moveHtml = '';
        if(r.lastWeek==='—'){ moveHtml = '<span class="badge new">NEW</span>'; }
        else {
          const diff = Number(r.lastWeek) - r.rank; // positive = up
          if(diff>0) moveHtml = `<span class="badge up">+${diff}</span>`;
          else if(diff<0) moveHtml = `<span class="badge down">${diff}</span>`;
          else moveHtml = '<span class="badge">—</span>';
        }
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="num rank">${r.rank}</td>
          <td><div style="display:flex; gap:8px; align-items:center"><div>${r.name}</div>${moveHtml}</div></td>
          <td>${r.artist}</td>
          <td class="num">${r.lastWeek}</td>
          <td class="num">${r.peak}</td>
          <td class="num">${r.weeks}</td>`;
        elBody.appendChild(tr);
      }
      const loadedCount = [...WEEK_MAP.values()].filter(s=>s.loaded).length;
      elSummary.textContent = `${loadedCount}/${WEEK_LIST.length} weeks loaded`;
    }

    async function selectWeek(idx){
      currentIndex = Math.max(0, Math.min(idx, WEEK_LIST.length-1));
      renderWeekSelector();
      await ensureWeekLoaded(currentIndex, false);
      // prefetch neighbors for smooth nav
      const toPrefetch = [currentIndex-1, currentIndex+1].filter(i=> i>=0 && i<WEEK_LIST.length);
      for(const i of toPrefetch){ ensureWeekLoaded(i, true).catch(()=>{}); }
      renderTable(currentIndex);
      // enable/disable nav
      elPrev.disabled = (currentIndex<=0);
      elFirst.disabled= (currentIndex<=0);
      elNext.disabled = (currentIndex>=WEEK_LIST.length-1);
      elLast.disabled = (currentIndex>=WEEK_LIST.length-1);
    }

    // Load initial data flow
    async function handleLoad(){
      username = elUser.value.trim();
      if(!username){ showError('Enter a Last.fm username.'); return; }
      elPanel.style.display='none';
      elStatus.textContent = '';
      WEEK_LIST = []; WEEK_MAP = new Map(); currentIndex = -1;

      // Try cache
      const cached = loadCache(username);
      if(cached){
        WEEK_LIST = cached.weekList || [];
        WEEK_MAP = new Map(cached.weeks || []);
      }

      // Always refresh chart list (in case new weeks exist)
      elStatus.innerHTML = `<span class="loading"></span> Fetching weekly chart list …`;
      try{
        const list = await getWeeklyChartList(username);
        if(!list || list.length===0){ throw new Error('No weekly charts available for this user.'); }
        WEEK_LIST = list; // overwrite with fresh list (old cache content is still in WEEK_MAP if keys match)
        saveCache(username);
      }catch(e){ showError(e.message || 'Failed to load chart list.'); return; }

      // Show panel
      elPanel.style.display='block';

      // Ensure we don't include weeks before user's first actual scrobble week
      await trimLeadingEmptyWeeks();

      // Choose the newest week as default (after trimming)
      const newest = WEEK_LIST.length-1;
      const startIdx = Math.max(0, WEEK_LIST.length-INITIAL_WEEKS_TO_SHOW);
      // Prefetch a window of recent weeks in background
      selectWeek(newest);
      // kick off background prefetch of recent window
      prefetchRange(startIdx, newest).catch(()=>{});
    }

    // Load older in batches
    async function handleLoadOlder(){
      // Prefetch a batch of older weeks starting before the currently selected cluster
      const start = Math.max(0, (currentIndex - INITIAL_WEEKS_TO_SHOW) - OLDER_BATCH + 1);
      const end = Math.max(0, (currentIndex - INITIAL_WEEKS_TO_SHOW));
      await prefetchRange(start, end);
      renderTable(currentIndex);
    }

    // ==== EVENTS ====
    elLoad.addEventListener('click', handleLoad);
    elWeek.addEventListener('change', (e)=> selectWeek(Number(e.target.value)));
    elPrev.addEventListener('click', ()=> selectWeek(currentIndex-1));
    elNext.addEventListener('click', ()=> selectWeek(currentIndex+1));
    elFirst.addEventListener('click',()=> selectWeek(0));
    elLast.addEventListener('click', ()=> selectWeek(WEEK_LIST.length-1));
    elOlder.addEventListener('click', handleLoadOlder);

    // Allow Enter to submit
    elUser.addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleLoad(); });
  })();
  </script>
</body>
</html>
