<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Weekly Last.fm Chart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; }
    h1 { margin-bottom: 8px; }
    .input-group { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
    label { font-size: 14px; }
    input { padding: 8px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
    button { padding: 10px 16px; border: 0; border-radius: 8px; background: #111; color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: default; }
    .muted { color: #666; font-size: 13px; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #eee; font-size: 14px; text-align: left; }
    th { background: #f5f5f5; position: sticky; top: 0; }
  </style>
</head>
<body>
  <h1>Last.fm Weekly Chart</h1>
  <p class="muted">Enter your Last.fm username to see your top tracks from the last full week (Friday to Thursday).</p>

  <div class="input-group">
    <label for="user">Username:</label>
    <input id="user" placeholder="yourusername" />
    <button id="run">Get Weekly Chart</button>
  </div>

  <div class="muted" id="rangeText"></div>
  <div id="status" class="muted"></div>
  <div id="results"></div>

  <script>
    const API_KEY = "ed9c6dcac73ea1adcd3750efeea9b822"; // embedded securely in code
    const STREAMS_FACTORS = [
      [1,1,48.50],[2,2,46.78],[3,5,30.90],[6,6,20.90],[7,10,22.90],
      [11,15,27.85],[16,25,25.90],[26,30,42.70],[31,50,33.95],
      [51,70,50.90],[71,85,46.50],[86,200,70.00],
    ];
    const RADIO_FACTORS = [
      [1,1,186.90],[2,2,450.10],[3,5,620.20],[6,6,930.30],
      [7,10,1840.40],[11,15,800.50],[16,25,700.60],[26,30,650.70],
      [31,50,400.80],[51,70,150.90],[71,85,90.10],[86,200,60.11],
    ];
    function getMultiplierForRank(rank) {
      if (rank === 1) return 39.45;
      else if (rank <= 5) return 35.89;
      else if (rank <= 10) return 32.16;
      else if (rank <= 20) return 30.99;
      else if (rank <= 40) return 28.98;
      else if (rank <= 50) return 26.10;
      else if (rank <= 60) return 23.78;
      else if (rank <= 70) return 21.06;
      else if (rank <= 80) return 20.99;
      else return 10.9;
    }
    function getFactor(table, weeks) {
      for (const [s, e, f] of table) {
        if (s <= weeks && weeks <= e) return f;
      }
      return table[table.length - 1][2];
    }
    function calcSales(plays, m) {
      return plays * m;
    }
    function calcStreams(sales, weeks) {
      return sales * getFactor(STREAMS_FACTORS, weeks) * 8500;
    }
    function calcRadio(sales, weeks) {
      return sales * getFactor(RADIO_FACTORS, weeks) * 1000;
    }
    function calcPoints(sales, streams, radio, maxS, maxSt, maxR) {
      if (!maxS) maxS = 1; if (!maxSt) maxSt = 1; if (!maxR) maxR = 1;
      return Math.round(200 * (0.3 * (sales / maxS) + 0.3 * (streams / maxSt) + 0.4 * (radio / maxR)));
    }
    function keyOf(t, a) {
      return String(t).toLowerCase().trim() + "||" + String(a).toLowerCase().trim();
    }
    function weekRange() {
      const TZ = 2 * 3600;
      const now = Math.floor(Date.now() / 1000) + TZ;
      const d = new Date(now * 1000);
      const localMidnight = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
      const dow = localMidnight.getUTCDay();
      const sinceFri = (dow - 5 + 7) % 7;
      const thisFri = new Date(localMidnight.getTime() - sinceFri * 86400 * 1000);
      const prevFri = new Date(thisFri.getTime() - 7 * 86400 * 1000);
      const from = Math.floor((prevFri.getTime() - TZ * 1000) / 1000);
      const to = Math.floor((thisFri.getTime() - TZ * 1000) / 1000);
      return { from, to, start: prevFri, end: thisFri };
    }
    function fmt(d) {
      return d.toISOString().slice(0, 10);
    }
    async function fetchScrobbles(user, from, to) {
      let page = 1, totalPages = 1, all = [];
      while (page <= totalPages) {
        const url = `https://ws.audioscrobbler.com/2.0/?method=user.getRecentTracks&user=${encodeURIComponent(user)}&api_key=${API_KEY}&format=json&from=${from}&to=${to}&limit=200&page=${page}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`Last.fm ${res.status}`);
        const j = await res.json();
        const arr = (j.recenttracks && j.recenttracks.track) || [];
        for (const t of arr) {
          if (t.date) all.push(t);
        }
        const attr = j.recenttracks && j.recenttracks['@attr'];
        totalPages = attr ? parseInt(attr.totalPages || "1", 10) : 1;
        page++;
      }
      return all;
    }
    function aggregatePlays(scrobbles) {
      const m = new Map();
      for (const t of scrobbles) {
        const title = t.name;
        const artist = t.artist?.['#text'] || t.artist?.name || '';
        const album = t.album?.['#text'] || 'Unknown';
        const k = keyOf(title, artist);
        const cur = m.get(k) || { title, artist, album, plays: 0 };
        cur.plays++;
        m.set(k, cur);
      }
      return [...m.values()];
    }
    function scoreWeek(rows, topN = 100) {
      rows.sort((a, b) => b.plays - a.plays);
      let maxS = 0, maxSt = 0, maxR = 0;
      const provisional = rows.slice(0, Math.max(topN, rows.length)).map((r, i) => {
        const rank = i + 1, weeks = 1, mult = getMultiplierForRank(rank);
        const sales = calcSales(r.plays, mult);
        const streams = calcStreams(sales, weeks);
        const radio = calcRadio(sales, weeks);
        maxS = Math.max(maxS, sales); maxSt = Math.max(maxSt, streams); maxR = Math.max(maxR, radio);
        return { ...r, rank, weeks, sales, streams, radio };
      });
      const final = provisional.map(e => ({
        rank: e.rank, movement: "NEW", title: e.title, artist: e.artist, album: e.album, plays: e.plays,
        sales: e.sales, totalSales: e.sales, weeks: e.weeks, peak: e.rank,
        streams: Math.trunc(e.streams), radio: e.radio,
        points: calcPoints(e.sales, e.streams, e.radio, maxS, maxSt, maxR)
      })).sort((a, b) => b.points - a.points);
      return final.map((e, i) => ({ ...e, rank: i + 1 }));
    }
    function renderTable(target, week, rows) {
      const cols = ["rank", "movement", "title", "artist", "plays", "sales", "streams", "radio", "points"];
      let html = `<h2>Chart for ${fmt(week.start)} to ${fmt(week.end)}</h2>`;
      html += `<table><thead><tr>${cols.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>`;
      for (const r of rows) {
        html += `<tr>${cols.map(c => `<td>${typeof r[c] === "number" ? r[c].toLocaleString() : r[c]}</td>`).join("")}</tr>`;
      }
      html += `</tbody></table>`;
      target.innerHTML = html;
    }

    document.getElementById('run').addEventListener('click', async () => {
      const user = document.getElementById('user').value.trim();
      const status = document.getElementById('status');
      const results = document.getElementById('results');
      status.textContent = ''; results.innerHTML = ''; document.getElementById('run').disabled = true;
      if (!user) {
        status.textContent = "Please enter a Last.fm username.";
        document.getElementById('run').disabled = false;
        return;
      }

      const { from, to, start, end } = weekRange();
      document.getElementById('rangeText').textContent = `Week: ${fmt(start)} to ${fmt(end)}`;

      try {
        status.textContent = 'Fetching scrobbles…';
        const scrobbles = await fetchScrobbles(user, from, to);
        status.textContent = `Fetched ${scrobbles.length.toLocaleString()} scrobbles. Processing…`;
        const rows = aggregatePlays(scrobbles);
        const scored = scoreWeek(rows);
        status.textContent = `Done. Showing top ${Math.min(100, scored.length)}.`;
        renderTable(results, { start, end }, scored.slice(0, 100));
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
      } finally {
        document.getElementById('run').disabled = false;
      }
    });
  </script>
</body>
</html>
