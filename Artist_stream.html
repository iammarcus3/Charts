<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Artist Stream Stats</title>
  <style>
    body { background-color: #000; color: white; font-family: sans-serif; padding: 20px; }
    h1 { text-align: center; font-size: 2em; margin-bottom: 0.5em; }
    h2 { margin-top: 2em; font-size: 1.5em; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
    th { background-color: #111; text-transform: uppercase; font-size: 0.9em; }
    .highlight { color: #e60000; font-weight: bold; }
    .rank-icon { font-size: 1.5em; font-weight: bold; color: #e60000; }
  </style>
</head>
<body>
  <h1 id="artistName">Artist Stats</h1>
  <p id="monthlyListeners"></p>
  <p id="billionSongs"></p>
  <p id="globalRank"></p>

  <h2>Top 10 Songs (Last 6 Months)</h2>
  <table id="recentTopSongs">
    <thead><tr><th>#</th><th>Title</th><th>Streams</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>Top 10 Songs (All Time)</h2>
  <table id="topSongs">
    <thead><tr><th>#</th><th>Title</th><th>Streams</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>Top 5 Albums (All Time)</h2>
  <table id="topAlbums">
    <thead><tr><th>#</th><th>Album</th><th>Streams</th></tr></thead>
    <tbody></tbody>
  </table>

  <script src="weekdata.js"></script>
  <script>
    const STREAM_MULTIPLIER = 0.927124 * 1_000_000;
    const formatNumber = n => (
      n >= 1e9 ? (n / 1e9).toFixed(2) + 'B' :
      n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' :
      (n / 1e3).toFixed(1) + 'K'
    );

    const urlParams = new URLSearchParams(window.location.search);
    const artistParam = decodeURIComponent(urlParams.get("name") || "").toLowerCase();
    document.getElementById("artistName").textContent = artistParam.toUpperCase();

    const allWeeks = Object.keys(weekData).map(Number).sort((a, b) => b - a);
    const last6MonthsWeeks = allWeeks.slice(0, 26);
    const last45DaysWeeks = allWeeks.slice(0, 7);

    const allEntries = Object.values(weekData).flat().filter(e =>
      e.artist && e.artist.toLowerCase() === artistParam
    );

    const songMap = {};
    const songMap6M = {};
    const albumMap = {};
    let totalStreams45Days = 0;

    allEntries.forEach(entry => {
      const sales = parseFloat(entry.sales) || 0;
      const streams = sales * STREAM_MULTIPLIER;
      const songKey = (entry.title || "Unknown").trim();
      const albumKey = String(entry.album || "Unknown").trim();
      const week = Number(entry.week);

      songMap[songKey] = (songMap[songKey] || 0) + streams;
      albumMap[albumKey] = (albumMap[albumKey] || 0) + streams;

      if (last6MonthsWeeks.includes(week)) {
        songMap6M[songKey] = (songMap6M[songKey] || 0) + streams;
      }

      if (last45DaysWeeks.includes(week)) {
        totalStreams45Days += streams;
      }
    });

    const monthlyListeners = ((totalStreams45Days / 1_000_000_000) * 150).toFixed(2);
    document.getElementById("monthlyListeners").textContent = `Monthly Listeners: ${monthlyListeners}M`;

    const topSongs = Object.entries(songMap).sort((a, b) => b[1] - a[1]).slice(0, 10);
    const topAlbums = Object.entries(albumMap).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const topRecent = Object.entries(songMap6M).sort((a, b) => b[1] - a[1]).slice(0, 10);
    const billionSongs = Object.entries(songMap).filter(([_, v]) => v >= 1_000_000_000).length;
    document.getElementById("billionSongs").textContent = `Songs Over 1B Streams: ${billionSongs}`;

    // Global Top 20 Ranking
    const artistStreamMap = {};
    Object.values(weekData).flat().forEach(entry => {
      const sales = parseFloat(entry.sales) || 0;
      const streams = sales * STREAM_MULTIPLIER;
      const week = Number(entry.week);
      const name = entry.artist;
      if (!name || !last45DaysWeeks.includes(week)) return;
      artistStreamMap[name] = (artistStreamMap[name] || 0) + streams;
    });

    const ranked = Object.entries(artistStreamMap)
      .map(([name, streams]) => [name, (streams / 1_000_000_000) * 150])
      .sort((a, b) => b[1] - a[1]);

    const rankIndex = ranked.findIndex(([n]) => n.toLowerCase() === artistParam);
    if (rankIndex >= 0 && rankIndex < 20) {
      document.getElementById("globalRank").innerHTML =
        `Ranking: <span class="rank-icon">#${rankIndex + 1}</span> (Top 20 by Monthly Listeners)`;
    }

    function fillTable(id, data) {
      const tbody = document.getElementById(id).querySelector("tbody");
      tbody.innerHTML = "";
      data.forEach(([name, streams], i) => {
        const row = `<tr><td>${i + 1}</td><td>${name}</td><td>${formatNumber(streams)}</td></tr>`;
        tbody.innerHTML += row;
      });
    }

    fillTable("topSongs", topSongs);
    fillTable("topAlbums", topAlbums);
    fillTable("recentTopSongs", topRecent);
  </script>
</body>
</html>
