<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Artist Streaming Profile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
      padding: 2rem;
    }
    h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    .section { margin-top: 2rem; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
    }
    th, td {
      padding: 0.6rem;
      text-align: left;
      border-bottom: 1px solid #333;
    }
    th { background: #1f1f1f; }
    .rank-badge {
      background: gold;
      color: black;
      font-weight: bold;
      padding: 0.3rem 0.6rem;
      border-radius: 5px;
      margin-left: 1rem;
    }
    .up { color: #00e676; }
    .down { color: #ff1744; }
  </style>
</head>
<body>
  <h1 id="artistName">Loading...</h1>
  <div id="summary"></div>

  <div class="section">
    <h2>Top 10 Songs (Last 6 Months)</h2>
    <table id="recentSongs">
      <thead><tr><th>Title</th><th>Streams</th><th>Change</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section">
    <h2>Top 10 Songs (All Time)</h2>
    <table id="allTimeSongs">
      <thead><tr><th>Title</th><th>Total Streams</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section">
    <h2>Top 5 Albums (All Time)</h2>
    <table id="topAlbums">
      <thead><tr><th>Album</th><th>Total Streams</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="weekdata.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const targetArtist = decodeURIComponent(params.get("name") || "").toLowerCase();
    document.getElementById("artistName").textContent = targetArtist || "Artist Profile";

    const formatNumber = (num) => {
      if (num >= 1_000_000_000) return (num / 1_000_000_000).toFixed(1) + "B";
      if (num >= 1_000_000) return (num / 1_000_000).toFixed(1) + "M";
      if (num >= 1_000) return (num / 1_000).toFixed(1) + "K";
      return Math.round(num);
    };

    const daysAgo = (dateStr) => {
      const today = new Date();
      const d = new Date(dateStr);
      return (today - d) / (1000 * 60 * 60 * 24);
    };

    const sixMonthsAgo = Date.now() - 1000 * 60 * 60 * 24 * 180;
    const fortyFiveDaysAgo = Date.now() - 1000 * 60 * 60 * 24 * 45;

    let allArtistData = {};
    let albumStreams = {};
    let monthlyListenerMap = {};
    let topSongs6mo = {};
    let billionCount = 0;

    Object.entries(weekData).forEach(([week, entries]) => {
      const weekDate = new Date(week);
      entries.forEach(entry => {
        if (!entry.artist || entry.artist.toLowerCase() !== targetArtist) return;

        const key = entry.title.toLowerCase();
        const album = String(entry.album || "Unknown").trim().toLowerCase();
        const weekTimestamp = weekDate.getTime();
        const streams = entry.sales * 0.927124 * 1_000_000;

        // Monthly listeners (last 45 days)
        if (weekTimestamp >= fortyFiveDaysAgo) {
          monthlyListenerMap[key] = (monthlyListenerMap[key] || 0) + streams;
        }

        // Last 6 months song data
        if (weekTimestamp >= sixMonthsAgo) {
          topSongs6mo[key] = topSongs6mo[key] || { title: entry.title, total: 0, history: [] };
          topSongs6mo[key].total += streams;
          topSongs6mo[key].history.push({ week: weekTimestamp, streams });
        }

        // All-time song data
        allArtistData[key] = allArtistData[key] || { title: entry.title, total: 0 };
        allArtistData[key].total += streams;
        if (allArtistData[key].total >= 1_000_000_000) billionCount++;

        // Album data
        albumStreams[album] = albumStreams[album] || { name: entry.album || "Unknown", total: 0 };
        albumStreams[album].total += streams;
      });
    });

    // Monthly Listeners
    const totalRecentStreams = Object.values(monthlyListenerMap).reduce((a, b) => a + b, 0);
    const monthlyListeners = totalRecentStreams / (1_000_000_000 * 150);
    const summaryDiv = document.getElementById("summary");
    summaryDiv.innerHTML = `
      <p><strong>Monthly Listeners:</strong> ${formatNumber(monthlyListeners * 1_000_000)} </p>
      <p><strong>Songs with over 1B streams:</strong> ${billionCount}</p>
    `;

    // Top Songs - Last 6 Months
    const recentTop = Object.values(topSongs6mo)
      .sort((a, b) => b.total - a.total)
      .slice(0, 10);

    const recentTable = document.querySelector("#recentSongs tbody");
    recentTop.forEach(song => {
      const weeks = song.history.sort((a, b) => b.week - a.week);
      const change = weeks.length > 1
        ? Math.min(100, ((weeks[0].streams - weeks[1].streams) / weeks[1].streams) * 100)
        : 0;
      const trend = change > 0
        ? `<span class="up">+${change.toFixed(1)}%</span>`
        : `<span class="down">${change.toFixed(1)}%</span>`;
      recentTable.innerHTML += `
        <tr>
          <td>${song.title}</td>
          <td>${formatNumber(song.total)}</td>
          <td>${trend}</td>
        </tr>
      `;
    });

    // Top Songs - All Time
    const topAllTime = Object.values(allArtistData)
      .sort((a, b) => b.total - a.total)
      .slice(0, 10);

    const allTimeTable = document.querySelector("#allTimeSongs tbody");
    topAllTime.forEach(song => {
      allTimeTable.innerHTML += `
        <tr>
          <td>${song.title}</td>
          <td>${formatNumber(song.total)}</td>
        </tr>
      `;
    });

    // Top Albums
    const topAlbums = Object.values(albumStreams)
      .sort((a, b) => b.total - a.total)
      .slice(0, 5);

    const albumsTable = document.querySelector("#topAlbums tbody");
    topAlbums.forEach(album => {
      albumsTable.innerHTML += `
        <tr>
          <td>${album.name}</td>
          <td>${formatNumber(album.total)}</td>
        </tr>
      `;
    });

    // Global Rank (Top 20)
    const artistMonthlyMap = {};
    Object.entries(weekData).forEach(([week, entries]) => {
      const weekDate = new Date(week);
      if (weekDate.getTime() < fortyFiveDaysAgo) return;
      entries.forEach(entry => {
        const key = entry.artist?.toLowerCase();
        if (!key) return;
        const streams = entry.sales * 0.927124 * 1_000_000;
        artistMonthlyMap[key] = (artistMonthlyMap[key] || 0) + streams;
      });
    });

    const rankedArtists = Object.entries(artistMonthlyMap)
      .map(([artist, streams]) => ({
        artist,
        monthly: streams / (1_000_000_000 * 150)
      }))
      .sort((a, b) => b.monthly - a.monthly)
      .slice(0, 20);

    const artistRank = rankedArtists.findIndex(a => a.artist === targetArtist);
    if (artistRank >= 0) {
      summaryDiv.innerHTML += `
        <p><strong>Rank:</strong> <span class="rank-badge">#${artistRank + 1}</span> among top 20 most streamed artists</p>
      `;
    }
  </script>
</body>
</html>
