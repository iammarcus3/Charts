<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Artist Stream Profile</title>
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 2rem;
    }
    h1 {
      font-size: 2.5rem;
    }
    .section {
      margin-top: 2rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      padding: 0.5rem;
      border-bottom: 1px solid #333;
    }
    th {
      text-align: left;
      background-color: #222;
    }
    .highlight {
      color: #0f0;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1 id="artistName">Artist Profile</h1>

  <div class="section">
    <p><strong>Monthly Listeners:</strong> <span id="monthlyListeners">-</span></p>
    <p id="rankInfo"></p>
    <p><strong>Songs with over 1 Billion Streams:</strong> <span id="billionCount">-</span></p>
  </div>

  <div class="section">
    <h2>Top 10 Songs (All-Time)</h2>
    <table id="topSongs">
      <thead>
        <tr><th>Title</th><th>Total Streams</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="section">
    <h2>Top 10 Albums (All-Time)</h2>
    <table id="topAlbums">
      <thead>
        <tr><th>Album</th><th>Total Streams</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="weekdata.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const artistName = decodeURIComponent(params.get("artist") || "").toLowerCase();
    document.getElementById("artistName").textContent = params.get("artist") || "Unknown Artist";

    const allEntries = Object.values(weekData).flat();

    // 1. Filter only this artist's entries
    const artistEntries = allEntries.filter(e => e.artist && e.artist.toLowerCase() === artistName);

    // 2. Calculate monthly listeners (last 45 days)
    const now = new Date();
    const cutoff = new Date(now);
    cutoff.setDate(now.getDate() - 45);
    const recentEntries = Object.entries(weekData).flatMap(([weekNum, entries]) => {
      const weekDate = new Date(2018, 1, 23 + (7 * (parseInt(weekNum) - 1))); // Feb 23, 2018 base
      if (weekDate >= cutoff) {
        return entries.filter(e => e.artist && e.artist.toLowerCase() === artistName);
      }
      return [];
    });
    const monthlyListeners = recentEntries.reduce((sum, e) => sum + (e.plays || 0), 0);
    document.getElementById("monthlyListeners").textContent = monthlyListeners.toLocaleString();

    // 3. Billion-stream songs
    const billionSet = new Set();
    const songTotals = {};
    artistEntries.forEach(e => {
      const key = e.title.trim().toLowerCase();
      songTotals[key] = (songTotals[key] || 0) + (e.plays || 0);
    });
    Object.values(songTotals).forEach(v => {
      if (v >= 1_000_000_000) billionSet.add(v);
    });
    document.getElementById("billionCount").textContent = billionSet.size;

    // 4. Top 10 songs
    const topSongs = Object.entries(songTotals)
      .map(([title, plays]) => ({ title, plays }))
      .sort((a, b) => b.plays - a.plays)
      .slice(0, 10);
    const songTable = document.querySelector("#topSongs tbody");
    topSongs.forEach(row => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${row.title}</td><td>${row.plays.toLocaleString()}</td>`;
      songTable.appendChild(tr);
    });

    // 5. Top 10 albums
    const albumTotals = {};
    artistEntries.forEach(e => {
      const album = (e.album || "Unknown").toString().trim().toLowerCase();
      albumTotals[album] = (albumTotals[album] || 0) + (e.plays || 0);
    });
    const topAlbums = Object.entries(albumTotals)
      .map(([album, plays]) => ({ album, plays }))
      .sort((a, b) => b.plays - a.plays)
      .slice(0, 10);
    const albumTable = document.querySelector("#topAlbums tbody");
    topAlbums.forEach(row => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${row.album}</td><td>${row.plays.toLocaleString()}</td>`;
      albumTable.appendChild(tr);
    });

    // 6. Ranking vs other artists (only if in top 20)
    const artistTotals = {};
    allEntries.forEach(e => {
      const a = e.artist ? e.artist.toLowerCase() : "unknown";
      artistTotals[a] = (artistTotals[a] || 0) + (e.plays || 0);
    });

    // Monthly listeners per artist (last 45 days)
    const recentArtistTotals = {};
    Object.entries(weekData).forEach(([weekNum, entries]) => {
      const weekDate = new Date(2018, 1, 23 + (7 * (parseInt(weekNum) - 1)));
      if (weekDate >= cutoff) {
        entries.forEach(e => {
          if (!e.artist) return;
          const a = e.artist.toLowerCase();
          recentArtistTotals[a] = (recentArtistTotals[a] || 0) + (e.plays || 0);
        });
      }
    });

    const ranked = Object.entries(recentArtistTotals)
      .map(([artist, plays]) => ({ artist, plays }))
      .sort((a, b) => b.plays - a.plays);

    const foundIndex = ranked.findIndex(r => r.artist === artistName);
    if (foundIndex >= 0 && foundIndex < 20) {
      document.getElementById("rankInfo").innerHTML =
        `<strong>Ranking:</strong> <span class="highlight">${foundIndex + 1} out of top 20 artists by monthly listeners</span>`;
    }
  </script>
</body>
</html>
