    <!-- PWA Manifest Injection -->
    <script>
        const setupPWA = () => {
            const manifest = {
                name: "YourHot100 Charts",
                short_name: "Hot100",
                display: "standalone",
                background_color: "#000000",
                theme_color: "#000000",
                icons: [{ src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='black'/%3E%3Ctext y='50%' x='50%' dominant-baseline='middle' text-anchor='middle' font-size='40' fill='white'%3E100%3C/text%3E%3C/svg%3E", sizes: "192x192", type: "image/svg+xml" }]
            };
            const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);
            document.head.appendChild(link);
        };
        setupPWA();
    </script>

    <script>
        const LASTFM_API_KEY = "ed9c6dcac73ea1adcd3750efeea9b822";
        const artworkCache = new Map();

        const FORMULAS = {
            songUnits: (plays, points) => (plays * 50000) + (points * 500),
            albumUnits: (plays, points) => (plays * 5000) + (points * 500)
        };

        const MIN_ALBUM_TRACKS = 3;
        const WEEK_MS = 7 * 24 * 60 * 60 * 1000;

        const app = {
            state: {
                currentView: 'dashboard',
                weekOffset: 0,
                minOffset: 0,
                data: { songs: [], albums: [] },
                raw: { tracks: null, albums: null, artists: null, history: null },
                snapshots: { songs: {}, albums: {}, dates: {} },
                officialAlbumDebutsByOffset: {}
            },

            escapeHTML(value) {
                return String(value ?? '').replace(/[&<>"']/g, char => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                })[char]);
            },

            pageLink(type, id, label) {
                const pages = { track: 'track.html', album: 'album.html', artist: 'artist.html' };
                const safeLabel = this.escapeHTML(label || 'Unknown');
                if (!id || !pages[type]) return safeLabel;
                return `<a href="${pages[type]}?id=${encodeURIComponent(String(id))}" class="hover:text-white hover:underline transition-colors">${safeLabel}</a>`;
            },

            timestampSeconds(value) {
                if (value && typeof value === 'object') {
                    value = value.uts ?? value.timestamp ?? value.played_at ?? value.date ?? value['#text'];
                }
                if (typeof value === 'number' && Number.isFinite(value)) {
                    return value > 1e12 ? Math.floor(value / 1000) : Math.floor(value);
                }
                if (typeof value === 'string' && value.trim()) {
                    const numeric = Number(value);
                    if (Number.isFinite(numeric)) return numeric > 1e12 ? Math.floor(numeric / 1000) : Math.floor(numeric);
                    const parsed = Date.parse(value);
                    if (Number.isFinite(parsed)) return Math.floor(parsed / 1000);
                }
                return null;
            },

            getWeekStartMs(timestampSeconds) {
                const date = new Date(timestampSeconds * 1000);
                date.setUTCHours(0, 0, 0, 0);
                const daysSinceFriday = (date.getUTCDay() + 2) % 7;
                date.setUTCDate(date.getUTCDate() - daysSinceFriday);
                return date.getTime();
            },

            pointsForRank(rank) {
                if (rank === 1) return 100;
                if (rank === 2) return 98;
                return Math.max(1, Math.round(98 - ((rank - 2) * 97 / 98)));
            },

            async init() {
                await this.loadVaultData();
                this.navigate('dashboard');
            },

            async loadVaultData() {
                this.showLoading(true);
                try {
                    const paths = [
                        'vault/tracks.json',
                        'vault/albums.json',
                        'vault/artists.json',
                        'vault/listening_history.jsonl'
                    ];
                    const responses = await Promise.all(paths.map(path => fetch(path)));
                    const failed = responses.find((response, index) => !response.ok);
                    if (failed) {
                        const index = responses.indexOf(failed);
                        throw new Error(`Could not load ${paths[index]} (HTTP ${failed.status}).`);
                    }

                    const parseMap = data => {
                        if (Array.isArray(data)) {
                            return new Map(data.filter(item => item && item.id).map(item => [String(item.id), item]));
                        }
                        if (data && typeof data === 'object') {
                            return new Map(Object.entries(data).map(([id, item]) => [String(id), item]));
                        }
                        throw new Error('Unexpected vault JSON structure.');
                    };

                    this.state.raw.tracks = parseMap(await responses[0].json());
                    this.state.raw.albums = parseMap(await responses[1].json());
                    this.state.raw.artists = parseMap(await responses[2].json());

                    const historyText = await responses[3].text();
                    const parsedEvents = historyText.trim()
                        ? historyText.trim().split(/\r?\n/).filter(Boolean).map(line => JSON.parse(line))
                        : [];

                    this.state.raw.history = parsedEvents
                        .filter(event => event && event.track_id)
                        .map(event => ({ ...event, timestamp: this.timestampSeconds(event.timestamp) }))
                        .filter(event => event.timestamp !== null && Number.isFinite(event.timestamp))
                        .sort((a, b) => a.timestamp - b.timestamp);

                    if (this.state.raw.history.length === 0) {
                        throw new Error('No valid timestamped listening events were found in listening_history.jsonl.');
                    }

                    this.buildAllSnapshots();
                } catch (error) {
                    console.error(error);
                    const container = document.getElementById('content-container');
                    container.innerHTML = `<div class="p-10 text-center text-red-400 font-bold border border-red-900 bg-red-950/30 rounded">Unable to load charts: ${this.escapeHTML(error.message)}</div>`;
                } finally {
                    this.showLoading(false);
                }
            },

            canonicalArtistId(idRef) {
                if (!idRef) return null;
                const id = Array.isArray(idRef) ? idRef[0] : idRef;
                const obj = this.state.raw.artists.get(String(id));
                return obj?.canonical_artist_id
                    ? String(obj.canonical_artist_id)
                    : String(id);
            },

            getArtistName(idRef) {
                const id = this.canonicalArtistId(idRef);
                if (!id) return 'Unknown Artist';
                const obj = this.state.raw.artists.get(String(id));
                if (obj && (obj.name || obj.title)) return obj.name || obj.title;
                return 'Unknown Artist';
            },

            getTrackAlbumIds(track) {
                const ids = Array.isArray(track?.album_ids) ? track.album_ids : [];
                if (ids.length) return [...new Set(ids.map(String))];
                return track?.album_id ? [String(track.album_id)] : [];
            },

            normalizeAlbumFamilyTitle(value) {
                let title = String(value || '').toLowerCase().replace(/[’']/g, '');
                title = title.replace(/\([^)]*\)|\[[^\]]*\]/g, ' ');
                title = title.replace(/\b(?:scary hours|deluxe|expanded|special|anniversary|bonus tracks?|remaster(?:ed)?|reissue|collector(?:'s)?|complete|legacy|edition|version)\b/gi, ' ');
                return title.replace(/[^a-z0-9]+/g, ' ').trim().replace(/\s+/g, ' ');
            },

            isAlbumEditionOf(editionId, parentId) {
                const editionKey = String(editionId);
                const parentKey = String(parentId);
                if (editionKey === parentKey) return false;
                const edition = this.state.raw.albums.get(editionKey);
                const parent = this.state.raw.albums.get(parentKey);
                if (!edition || !parent) return false;
                const editionArtist = this.canonicalArtistId(edition.primary_artist_id || edition.artist_id);
                const parentArtist = this.canonicalArtistId(parent.primary_artist_id || parent.artist_id);
                if (!editionArtist || editionArtist !== parentArtist) return false;
                const editionTitle = this.normalizeAlbumFamilyTitle(edition.title);
                const parentTitle = this.normalizeAlbumFamilyTitle(parent.title);
                const editionHasReleaseCue = /\\b(?:deluxe|expanded|special|anniversary|bonus|remaster(?:ed)?|reissue|collector(?:'s)?|complete|legacy|edition|version|reloaded|scary hours|ep|single|cuffing season)\\b/i.test(edition.title || '');
                const sameTitleFamily = editionTitle === parentTitle ||
                    (editionHasReleaseCue && editionTitle.startsWith(parentTitle + ' '));
                if (!parentTitle || !sameTitleFamily) return false;
                const editionTracks = this.state.albumTrackCounts?.get(editionKey) || new Set();
                const parentTracks = this.state.albumTrackCounts?.get(parentKey) || new Set();
                let sharedTracks = 0;
                editionTracks.forEach(trackId => {
                    if (parentTracks.has(String(trackId))) sharedTracks++;
                });
                return sharedTracks >= MIN_ALBUM_TRACKS;
            },

            buildAllSnapshots() {
                const history = this.state.raw.history;
                if (!history || history.length === 0) {
                    document.getElementById('content-container').innerHTML = `<div class="p-10 text-center text-zinc-500">No listening history found.</div>`;
                    return;
                }

                const albumTrackSets = new Map();
                this.state.raw.albums.forEach((album, albumId) => {
                    albumTrackSets.set(String(albumId), new Set(
                        (Array.isArray(album.track_ids) ? album.track_ids : [])
                            .map(String)
                            .filter(trackId => this.state.raw.tracks.has(trackId))
                    ));
                });
                this.state.raw.tracks.forEach((track, trackId) => {
                    this.getTrackAlbumIds(track).forEach(albumId => {
                        if (!albumTrackSets.has(albumId)) return;
                        albumTrackSets.get(albumId).add(String(trackId));
                    });
                });

                // Rule A: Static Album Eligibility
                const eligibleAlbumIds = new Set();
                albumTrackSets.forEach((trackIds, albumId) => {
                    if (trackIds.size >= MIN_ALBUM_TRACKS) eligibleAlbumIds.add(albumId);
                });
                this.state.eligibleAlbumIds = eligibleAlbumIds;
                this.state.albumTrackCounts = albumTrackSets;

                const latestTimestamp = history[history.length - 1].timestamp;
                const latestWeekStart = this.getWeekStartMs(latestTimestamp);
                const latestWeekEnd = latestWeekStart + WEEK_MS - 1;

                const weeklyEvents = new Map();
                let minOffset = 0;

                history.forEach(event => {
                    const eventWeekStart = this.getWeekStartMs(event.timestamp);
                    const offset = Math.floor((eventWeekStart - latestWeekStart) / WEEK_MS);
                    if (offset > 0) return;
                    minOffset = Math.min(minOffset, offset);
                    if (!weeklyEvents.has(offset)) weeklyEvents.set(offset, []);
                    weeklyEvents.get(offset).push(event);
                });

                this.state.minOffset = minOffset;
                this.state.snapshots = { songs: {}, albums: {}, dates: {} };
                
                // Track one-time official album debuts (3 distinct Hot 100 tracks).
                this.state.debutedAlbums = new Set();
                this.state.officialAlbumDebutsByOffset = {};

                const songHistory = {};
                const albumHistory = {};

                for (let offset = minOffset; offset <= 0; offset++) {
                    const events = weeklyEvents.get(offset) || [];
                    const startMs = latestWeekStart + (offset * WEEK_MS);
                    const endMs = startMs + WEEK_MS - 1;
                    this.state.snapshots.dates[offset] = { start: startMs, end: endMs };

                    const trackPlays = new Map();
                    const albumPlays = new Map();

                    events.forEach(event => {
                        const trackId = String(event.track_id);
                        trackPlays.set(trackId, (trackPlays.get(trackId) || 0) + 1);

                        const track = this.state.raw.tracks.get(trackId);
                        if (!track) return;

                        this.getTrackAlbumIds(track).forEach(albumId => {
                            if (!eligibleAlbumIds.has(albumId)) return;
                            albumPlays.set(albumId, (albumPlays.get(albumId) || 0) + 1);
                        });
                    });

                    // 1. Compile the Hot 100 first
                    const currentSongs = this.compileBaseEntries(trackPlays, 'songs');

                    // 2. Rule B: Check for new Album Debuts based on this week's Hot 100 entries
                    const chartingTracksPerAlbum = new Map();
                    currentSongs.forEach(song => {
                        const track = this.state.raw.tracks.get(song.id);
                        if (!track) return;
                        this.getTrackAlbumIds(track).forEach(albumId => {
                            if (!chartingTracksPerAlbum.has(albumId)) chartingTracksPerAlbum.set(albumId, new Set());
                            chartingTracksPerAlbum.get(albumId).add(song.id);
                        });
                    });

                    // Identify every album that qualifies this week before recording debuts.
                    // This lets us suppress deluxe/expanded editions even when their IDs differ.
                    const qualifyingAlbumIds = [...chartingTracksPerAlbum.entries()]
                        .filter(([albumId, trackSet]) =>
                            this.state.eligibleAlbumIds.has(String(albumId)) &&
                            trackSet.size >= MIN_ALBUM_TRACKS
                        )
                        .map(([albumId]) => String(albumId));

                    // Prefer the base/original release in each same-artist album family.
                    qualifyingAlbumIds.sort((a, b) => {
                        const albumA = this.state.raw.albums.get(a);
                        const albumB = this.state.raw.albums.get(b);
                        return String(albumA?.title || '').length - String(albumB?.title || '').length;
                    });

                    qualifyingAlbumIds.forEach(id => {
                        if (this.state.debutedAlbums.has(id)) return;
                        const isEdition = [...this.state.eligibleAlbumIds].some(parentId => {
                            const parentKey = String(parentId);
                            if (parentKey === id) return false;
                            if (!this.state.debutedAlbums.has(parentKey) && !qualifyingAlbumIds.includes(parentKey)) return false;
                            return this.isAlbumEditionOf(id, parentKey);
                        });
                        if (isEdition) return;

                        this.state.debutedAlbums.add(id);
                        const album = this.state.raw.albums.get(id);
                        if (!album) return;
                        if (!this.state.officialAlbumDebutsByOffset[offset]) {
                            this.state.officialAlbumDebutsByOffset[offset] = [];
                        }
                        this.state.officialAlbumDebutsByOffset[offset].push({
                            id,
                            title: album.title || 'Unknown Album',
                            artist: this.getArtistName(album.primary_artist_id || album.artist_id)
                        });
                    });

                    // 3. Compile Top 100 Albums, allowing only officially debuted albums
                    const currentAlbums = this.compileBaseEntries(albumPlays, 'albums', this.state.debutedAlbums);

                    this.state.snapshots.songs[offset] = this.applyHistory(currentSongs, songHistory, offset);
                    this.state.snapshots.albums[offset] = this.applyHistory(currentAlbums, albumHistory, offset);
                }

                this.loadSnapshot(0);
            },

            compileBaseEntries(playCountsMap, type, allowedAlbums = null) {
                let entries = [];
                playCountsMap.forEach((plays, id) => {
                    let title, artist, artistId, albumTitle = null, trackCount = null;

                    if (type === 'songs') {
                        const track = this.state.raw.tracks.get(String(id));
                        if (!track) return;
                        const titleCandidates = [
                            track.title,
                            ...(Array.isArray(track.aliases) ? track.aliases : []),
                            ...(Array.isArray(track.source_titles) ? track.source_titles : [])
                        ];
                        const readTrackTitle = value => {
                            if (typeof value === 'string' || typeof value === 'number') {
                                const text = String(value).trim();
                                return text && !/^(unknown track|unknown|untitled|null|none)$/i.test(text) ? text : '';
                            }
                            if (Array.isArray(value)) {
                                for (const item of value) {
                                    const text = readTrackTitle(item);
                                    if (text) return text;
                                }
                            } else if (value && typeof value === 'object') {
                                for (const key of ['#text', '#TEXT', 'text', 'name', 'title', 'value']) {
                                    if (key in value) {
                                        const text = readTrackTitle(value[key]);
                                        if (text) return text;
                                    }
                                }
                            }
                            return '';
                        };
                        title = titleCandidates.map(readTrackTitle).find(Boolean) || 'Unknown Track';
                        artistId = this.canonicalArtistId(track.primary_artist_id || track.artist_id);
                        artist = this.getArtistName(artistId);
                    } else {
                        const albumId = String(id);
                        if (!this.state.eligibleAlbumIds?.has(albumId)) return;
                        
                        // Enforce album debut rule (only process if it has officially debuted)
                        if (allowedAlbums && !allowedAlbums.has(albumId)) return;

                        const album = this.state.raw.albums.get(albumId);
                        if (!album) return;
                        title = album.title || 'Unknown Album';
                        artistId = this.canonicalArtistId(album.primary_artist_id || album.artist_id);
                        artist = this.getArtistName(artistId);
                        albumTitle = title;
                        trackCount = this.state.albumTrackCounts?.get(albumId)?.size || 0;
                    }

                    entries.push({
                        id: String(id), title, artist, artist_id: artistId || null,
                        album: albumTitle, plays, track_count: trackCount
                    });
                });

                entries.sort((a, b) => b.plays - a.plays || a.title.localeCompare(b.title));
                entries = entries.slice(0, 100).map((entry, index) => {
                    const points = this.pointsForRank(index + 1);
                    const units_sold = type === 'songs'
                        ? FORMULAS.songUnits(entry.plays, points)
                        : FORMULAS.albumUnits(entry.plays, points);
                    return { ...entry, points, units_sold };
                });

                entries.sort((a, b) => b.units_sold - a.units_sold || b.plays - a.plays || a.title.localeCompare(b.title));
                return entries.map((entry, index) => ({ ...entry, rank: index + 1 }));
            },

            applyHistory(entries, historyTracker, currentOffset) {
                return entries.map(entry => {
                    const id = entry.id;
                    const trackData = historyTracker[id] || {
                        peak: 101, weeks_on_chart: 0, last_seen_offset: null, last_rank: null
                    };

                    const isNew = trackData.weeks_on_chart === 0;
                    const isReentry = !isNew && trackData.last_seen_offset !== currentOffset - 1;
                    const previousRank = !isNew && !isReentry ? trackData.last_rank : null;
                    const newPeak = Math.min(trackData.peak, entry.rank);
                    const newWeeks = trackData.weeks_on_chart + 1;

                    historyTracker[id] = {
                        peak: newPeak,
                        weeks_on_chart: newWeeks,
                        last_seen_offset: currentOffset,
                        last_rank: entry.rank
                    };

                    return {
                        ...entry,
                        is_new: isNew,
                        is_reentry: isReentry,
                        previous_rank: previousRank,
                        peak: newPeak,
                        weeks_on_chart: newWeeks
                    };
                });
            },

            loadSnapshot(offset) {
                this.state.weekOffset = offset;
                this.state.data.songs = this.state.snapshots.songs[offset] || [];
                this.state.data.albums = this.state.snapshots.albums[offset] || [];

                const dates = this.state.snapshots.dates[offset];
                if (dates) this.updateWeekUI(new Date(dates.start), new Date(dates.end));

                this.renderCurrentView();
            },

            changeWeek(direction) {
                const newOffset = this.state.weekOffset + direction;
                if (newOffset > 0 || newOffset < this.state.minOffset) return;
                this.loadSnapshot(newOffset);
            },

            updateWeekUI(startDate, endDate) {
                const nextBtn = document.getElementById('btn-next-week');
                const prevBtn = document.getElementById('btn-prev-week');
                const label = document.getElementById('week-display-label');
                const dateLabel = document.getElementById('week-date-label');

                const options = { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' };
                dateLabel.textContent = `${startDate.toLocaleDateString('en-US', options)} - ${endDate.toLocaleDateString('en-US', options)}`;

                if (this.state.weekOffset === 0) {
                    nextBtn.disabled = true;
                    nextBtn.classList.add('text-zinc-500', 'cursor-not-allowed');
                    nextBtn.classList.remove('text-white', 'hover:bg-zinc-700');
                    label.textContent = 'Latest Available Week';
                } else {
                    nextBtn.disabled = false;
                    nextBtn.classList.remove('text-zinc-500', 'cursor-not-allowed');
                    nextBtn.classList.add('text-white', 'hover:bg-zinc-700');
                    label.textContent = 'Historic Week';
                }

                if (this.state.weekOffset <= this.state.minOffset) {
                    prevBtn.disabled = true;
                    prevBtn.classList.add('text-zinc-500', 'cursor-not-allowed');
                    prevBtn.classList.remove('text-white', 'hover:bg-zinc-700');
                } else {
                    prevBtn.disabled = false;
                    prevBtn.classList.remove('text-zinc-500', 'cursor-not-allowed');
                    prevBtn.classList.add('text-white', 'hover:bg-zinc-700');
                }
            },

            showLoading(show) {
                document.getElementById('loading-state').style.display = show ? 'flex' : 'none';
                document.getElementById('content-container').style.display = show ? 'none' : 'block';
            },

            navigate(view) {
                this.state.currentView = view;
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('bg-zinc-900', 'text-white', 'font-semibold');
                    btn.classList.add('text-zinc-400');
                });
                const activeBtn = document.getElementById(`nav-${view}`);
                if (activeBtn) {
                    activeBtn.classList.remove('text-zinc-400');
                    activeBtn.classList.add('bg-zinc-900', 'text-white', 'font-semibold');
                }
                if (this.state.data.songs.length > 0 || this.state.data.albums.length > 0) this.renderCurrentView();
            },

            renderCurrentView() {
                const container = document.getElementById('content-container');
                container.innerHTML = '';
                if (this.state.currentView === 'dashboard') container.innerHTML = this.views.dashboard();
                if (this.state.currentView === 'songs') container.innerHTML = this.views.chartView('songs');
                if (this.state.currentView === 'albums') container.innerHTML = this.views.chartView('albums');

                container.classList.remove('fade-in');
                void container.offsetWidth;
                container.classList.add('fade-in');
                this.loadVisibleArtworks();
            },

            formatNumber: num => Number(num || 0).toLocaleString('en-US'),

            getMovementUI: (current, prev, isNew, isReentry) => {
                if (isNew) return `<div class="flex items-center justify-center gap-1 text-blue-400 font-bold text-xs"><i class="ph-fill ph-star"></i> NEW</div>`;
                if (isReentry) return `<div class="flex items-center justify-center gap-1 text-yellow-400 font-bold text-xs"><i class="ph-bold ph-arrow-u-up-left"></i> RE</div>`;
                if (!prev) return `<div class="flex items-center justify-center gap-1 text-zinc-600 font-bold text-xs"><i class="ph-bold ph-minus"></i> 0</div>`;
                if (current < prev) return `<div class="flex items-center justify-center gap-1 text-green-500 font-bold text-xs"><i class="ph-bold ph-arrow-up"></i> ${prev - current}</div>`;
                if (current > prev) return `<div class="flex items-center justify-center gap-1 text-red-500 font-bold text-xs"><i class="ph-bold ph-arrow-down"></i> ${current - prev}</div>`;
                return `<div class="flex items-center justify-center gap-1 text-zinc-600 font-bold text-xs"><i class="ph-bold ph-minus"></i> 0</div>`;
            },

            async loadVisibleArtworks() {
                const images = document.querySelectorAll('.dynamic-artwork');
                await Promise.all(Array.from(images).map(async img => {
                    const artist = img.dataset.artist || '';
                    const album = img.dataset.album || null;
                    const track = img.dataset.track || null;
                    const url = await this.fetchLastFmImage(artist, album, track);
                    if (url && img.isConnected) {
                        img.src = url;
                        img.classList.remove('loading-pulse');
                    }
                }));
            },

            async fetchLastFmImage(artist, album, track) {
                const clean = value => String(value || '').replace(/-/g, ' ').replace(/\s+/g, ' ').trim();
                const cleanArtist = clean(artist);
                const cleanAlbum = album && album !== 'null' ? clean(album) : null;
                const cleanTrack = track && track !== 'null' ? clean(track) : null;
                const cacheKey = `${cleanArtist}|${cleanAlbum || ''}|${cleanTrack || ''}`;

                if (artworkCache.has(cacheKey)) return artworkCache.get(cacheKey);

                const pickImage = images => {
                    if (!Array.isArray(images)) return null;
                    const preferred = images.find(image => image.size === 'extralarge' && image['#text']);
                    const fallback = [...images].reverse().find(image => image['#text']);
                    const result = preferred?.['#text'] || fallback?.['#text'] || null;
                    return result && /^https?:\/\//i.test(result) ? result : null;
                };

                const request = async (params) => {
                    const url = new URL('https://ws.audioscrobbler.com/2.0/');
                    Object.entries({ ...params, api_key: LASTFM_API_KEY, format: 'json' })
                        .forEach(([key, value]) => url.searchParams.set(key, value));
                    const response = await fetch(url.toString());
                    if (!response.ok) return null;
                    const data = await response.json();
                    if (data.error) return null;
                    return data;
                };

                try {
                    if (cleanTrack) {
                        const trackData = await request({ method: 'track.getInfo', artist: cleanArtist, track: cleanTrack });
                        const trackImage = pickImage(trackData?.track?.album?.image);
                        if (trackImage) {
                            artworkCache.set(cacheKey, trackImage);
                            return trackImage;
                        }

                        const discoveredAlbum = trackData?.track?.album?.title;
                        if (!cleanAlbum && discoveredAlbum) {
                            const albumData = await request({ method: 'album.getInfo', artist: cleanArtist, album: discoveredAlbum });
                            const albumImage = pickImage(albumData?.album?.image);
                            if (albumImage) {
                                artworkCache.set(cacheKey, albumImage);
                                return albumImage;
                            }
                        }
                    }

                    if (cleanAlbum) {
                        const albumData = await request({ method: 'album.getInfo', artist: cleanArtist, album: cleanAlbum });
                        const albumImage = pickImage(albumData?.album?.image);
                        if (albumImage) {
                            artworkCache.set(cacheKey, albumImage);
                            return albumImage;
                        }
                    }

                    const artistData = await request({ method: 'artist.getInfo', artist: cleanArtist });
                    const artistImage = pickImage(artistData?.artist?.image);
                    artworkCache.set(cacheKey, artistImage);
                    return artistImage;
                } catch (error) {
                    console.error('Artwork lookup failed:', error);
                    artworkCache.set(cacheKey, null);
                    return null;
                }
            },

            views: {
                dashboard: () => {
                    const topSong = app.state.data.songs[0] || {};
                    const topAlbum = app.state.data.albums[0] || {};
                    const songs = app.state.data.songs || [];
                    const albums = app.state.data.albums || [];

                    const reEntries = songs.filter(s => s.is_reentry);
                    const newAlbums = app.state.officialAlbumDebutsByOffset?.[app.state.weekOffset] || [];
                    
                    let highestClimber = null;
                    let biggestDropper = null;
                    let maxClimb = 0;
                    let maxDrop = 0;
                    let nonMovers = 0;
                    let mostWeeks = songs[0] || {};

                    songs.forEach(s => {
                        if (s.previous_rank) {
                            const diff = s.previous_rank - s.rank;
                            if (diff > maxClimb) { maxClimb = diff; highestClimber = s; }
                            if (diff < maxDrop) { maxDrop = diff; biggestDropper = s; }
                            if (diff === 0) nonMovers++;
                        }
                        if ((s.weeks_on_chart || 0) > (mostWeeks.weeks_on_chart || 0)) {
                            mostWeeks = s;
                        }
                    });

                    const top10 = songs.slice(0, 10);
                    const top10Up = top10.filter(s => s.previous_rank && s.rank < s.previous_rank).length;
                    const top10Down = top10.filter(s => s.previous_rank && s.rank > s.previous_rank).length;
                    
                    return `
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-12">
                            <div class="bg-zinc-900 border border-zinc-800 p-6 flex flex-col sm:flex-row gap-6 rounded-lg shadow-2xl">
                                <img src="https://placehold.co/400x400/18181b/ffffff?text=1" data-artist="${app.escapeHTML(topSong.artist || '')}" data-track="${app.escapeHTML(topSong.title || '')}" data-album="null" class="dynamic-artwork loading-pulse w-40 h-40 object-cover bg-black rounded" alt="Cover">
                                <div>
                                    <p class="text-xs uppercase tracking-widest text-zinc-400 font-bold mb-1"><i class="ph-fill ph-crown text-yellow-500"></i> #1 Song</p>
                                    <h3 class="text-3xl font-black text-white mb-1 line-clamp-2">${app.pageLink('track', topSong.id, (topSong.title || 'N/A').toUpperCase())}</h3>
                                    <p class="text-lg text-zinc-300">${app.pageLink('artist', topSong.artist_id, (topSong.artist || 'N/A').toUpperCase())}</p>
                                    <div class="mt-4 bg-black/50 p-3 rounded border border-zinc-800 inline-block">
                                        <p class="text-xs text-zinc-500 font-bold uppercase tracking-wider mb-1">Calculated Units</p>
                                        <p class="text-xl font-black text-white">${app.formatNumber(topSong.units_sold)}</p>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="bg-zinc-900 border border-zinc-800 p-6 flex flex-col sm:flex-row gap-6 rounded-lg shadow-2xl">
                                <img src="https://placehold.co/400x400/18181b/ffffff?text=1" data-artist="${app.escapeHTML(topAlbum.artist || '')}" data-album="${app.escapeHTML(topAlbum.album || '')}" class="dynamic-artwork loading-pulse w-40 h-40 object-cover bg-black rounded" alt="Cover">
                                <div>
                                    <p class="text-xs uppercase tracking-widest text-zinc-400 font-bold mb-1"><i class="ph-fill ph-vinyl-record text-zinc-300"></i> #1 Album</p>
                                    <h3 class="text-3xl font-black text-white mb-1 line-clamp-2">${app.pageLink('album', topAlbum.id, (topAlbum.title || 'N/A').toUpperCase())}</h3>
                                    <p class="text-lg text-zinc-300">${app.pageLink('artist', topAlbum.artist_id, (topAlbum.artist || 'N/A').toUpperCase())}</p>
                                    <div class="mt-4 bg-black/50 p-3 rounded border border-zinc-800 inline-block">
                                        <p class="text-xs text-zinc-500 font-bold uppercase tracking-wider mb-1">Calculated Units</p>
                                        <p class="text-xl font-black text-white">${app.formatNumber(topAlbum.units_sold)}</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mb-12">
                            <h3 class="text-xl font-bold mb-4 uppercase tracking-wider text-zinc-300 border-b border-zinc-800 pb-2">Week Insights</h3>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div class="bg-zinc-900/80 border border-zinc-800 p-4 rounded-lg">
                                    <p class="text-[10px] uppercase tracking-widest text-zinc-500 font-bold mb-1">Official Album Debuts</p>
                                    <p class="text-2xl font-black text-white">${newAlbums.length}</p>
                                    <p class="text-xs text-zinc-400 mt-1 truncate">${newAlbums.length > 0 ? 'Top: ' + app.escapeHTML(newAlbums[0].title) : 'No official album debuts'}</p>
                                </div>
                                <div class="bg-zinc-900/80 border border-zinc-800 p-4 rounded-lg">
                                    <p class="text-[10px] uppercase tracking-widest text-zinc-500 font-bold mb-1">Highest Climber</p>
                                    <p class="text-2xl font-black text-green-500">${maxClimb > 0 ? '+' + maxClimb : '-'}</p>
                                    <p class="text-xs text-zinc-400 mt-1 truncate">${highestClimber ? app.escapeHTML(highestClimber.title) : 'N/A'}</p>
                                </div>
                                <div class="bg-zinc-900/80 border border-zinc-800 p-4 rounded-lg">
                                    <p class="text-[10px] uppercase tracking-widest text-zinc-500 font-bold mb-1">Biggest Dropper</p>
                                    <p class="text-2xl font-black text-red-500">${maxDrop < 0 ? maxDrop : '-'}</p>
                                    <p class="text-xs text-zinc-400 mt-1 truncate">${biggestDropper ? app.escapeHTML(biggestDropper.title) : 'N/A'}</p>
                                </div>
                                <div class="bg-zinc-900/80 border border-zinc-800 p-4 rounded-lg">
                                    <p class="text-[10px] uppercase tracking-widest text-zinc-500 font-bold mb-1">Most Stable</p>
                                    <p class="text-2xl font-black text-zinc-300">${nonMovers}</p>
                                    <p class="text-xs text-zinc-400 mt-1">Non-moving songs</p>
                                </div>
                                <div class="bg-zinc-900/80 border border-zinc-800 p-4 rounded-lg">
                                    <p class="text-[10px] uppercase tracking-widest text-zinc-500 font-bold mb-1">Re-entries</p>
                                    <p class="text-2xl font-black text-yellow-500">${reEntries.length}</p>
                                    <p class="text-xs text-zinc-400 mt-1 truncate">Back on the chart</p>
                                </div>
                                <div class="bg-zinc-900/80 border border-zinc-800 p-4 rounded-lg col-span-2 md:col-span-1">
                                    <p class="text-[10px] uppercase tracking-widest text-zinc-500 font-bold mb-1">Most Weeks</p>
                                    <p class="text-2xl font-black text-white">${mostWeeks.weeks_on_chart || 0} <span class="text-sm font-normal text-zinc-500">Wks</span></p>
                                    <p class="text-xs text-zinc-400 mt-1 truncate">${mostWeeks.title ? app.escapeHTML(mostWeeks.title) : 'N/A'}</p>
                                </div>
                                <div class="bg-zinc-900/80 border border-zinc-800 p-4 rounded-lg col-span-2 md:col-span-1">
                                    <p class="text-[10px] uppercase tracking-widest text-zinc-500 font-bold mb-1">Top 10 Activity</p>
                                    <div class="flex gap-3 mt-1 items-center">
                                        <div class="text-sm" title="Up"><span class="text-green-500 font-black">▲</span> ${top10Up}</div>
                                        <div class="text-sm" title="Down"><span class="text-red-500 font-black">▼</span> ${top10Down}</div>
                                        <div class="text-sm" title="New"><span class="text-blue-400 font-black">★</span> ${top10New}</div>
                                    </div>
                                    <p class="text-xs text-zinc-400 mt-1 truncate">Movers in Top 10</p>
                                </div>
                            </div>
                        </div>

                        <div>
                            <h3 class="text-xl font-bold mb-4 uppercase tracking-wider text-zinc-300 border-b border-zinc-800 pb-2">Hot 100 Preview</h3>
                            <div class="flex flex-col bg-zinc-900/50 rounded-lg border border-zinc-800 overflow-hidden">
                                ${app.state.data.songs.slice(0, 5).map(song => `
                                    <div class="flex items-center gap-4 py-3 px-4 border-b border-zinc-800/50 hover:bg-zinc-800 transition">
                                        <div class="w-8 text-center font-black text-2xl text-zinc-300">${song.rank}</div>
                                        <img src="https://placehold.co/100x100/18181b/ffffff?text=${song.rank}" data-artist="${app.escapeHTML(song.artist)}" data-track="${app.escapeHTML(song.title)}" data-album="null" class="dynamic-artwork w-12 h-12 object-cover bg-black rounded-sm shadow">
                                        <div class="flex-1 min-w-0">
                                            <div class="font-bold text-white truncate">${app.pageLink('track', song.id, (song.title || '').toUpperCase())}</div>
                                            <div class="text-sm text-zinc-400 truncate">${app.pageLink('artist', song.artist_id, (song.artist || '').toUpperCase())}</div>
                                        </div>
                                        <div class="text-right hidden sm:block">
                                            <div class="text-sm font-bold text-white">${app.formatNumber(song.units_sold)}</div>
                                            <div class="text-[10px] text-zinc-500 uppercase tracking-widest font-bold">Units</div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                },

                chartView: (type) => {
                    const data = app.state.data[type];
                    if (!data || data.length === 0) return `<div class="p-10 text-center text-zinc-500">No chart data available for this week.</div>`;
                    
                    const unitLabel = type === 'songs' ? 'Track Units' : 'Album Units';

                    let html = `
                        <div class="hidden lg:grid grid-cols-12 gap-4 px-4 py-3 border-b border-zinc-800 text-xs font-bold uppercase tracking-widest text-zinc-500 sticky top-[72px] bg-black/95 backdrop-blur z-20">
                            <div class="col-span-1 text-center">Rank</div>
                            <div class="col-span-4">Information</div>
                            <div class="col-span-2 text-right">Metrics</div>
                            <div class="col-span-2 text-right text-zinc-300">${unitLabel}</div>
                            <div class="col-span-3 text-right">Chart History</div>
                        </div>
                    `;

                    data.forEach(item => {
                        const albumAttr = type === 'albums' ? `data-album="${app.escapeHTML(item.album || '')}"` : `data-album="null"`;
                        html += `
                            <div class="group grid grid-cols-1 lg:grid-cols-12 gap-4 items-center px-4 py-4 border-b border-zinc-900 hover:bg-zinc-900/40">
                                <div class="col-span-1 flex flex-row lg:flex-col items-center justify-between lg:justify-center gap-1 sm:gap-2">
                                    <span class="text-3xl font-black text-white w-10 text-center">${item.rank}</span>
                                    ${app.getMovementUI(item.rank, item.previous_rank, item.is_new, item.is_reentry)}
                                </div>
                                
                                <div class="col-span-4 flex items-center gap-4">
                                    <img src="https://placehold.co/200x200/18181b/ffffff?text=${item.rank}" data-artist="${app.escapeHTML(item.artist || '')}" data-track="${type === 'songs' ? app.escapeHTML(item.title || '') : ''}" ${albumAttr} class="dynamic-artwork loading-pulse w-16 h-16 object-cover rounded-sm bg-zinc-800 shrink-0">
                                    <div class="min-w-0">
                                        <h4 class="text-lg font-bold text-white truncate">${app.pageLink(type === 'songs' ? 'track' : 'album', item.id, (item.title || '').toUpperCase())}</h4>
                                        <p class="text-sm text-zinc-400 font-medium truncate">${app.pageLink('artist', item.artist_id, (item.artist || '').toUpperCase())}</p>
                                    </div>
                                </div>

                                <div class="hidden md:block lg:col-span-2 text-right">
                                    <div class="text-sm font-semibold text-zinc-300">${app.formatNumber(item.plays)} <span class="text-xs text-zinc-600 font-normal">Plays</span></div>
                                    <div class="text-sm font-semibold text-zinc-300">${item.points} <span class="text-xs text-zinc-600 font-normal">Pts</span></div>
                                </div>

                                <div class="col-span-2 text-left lg:text-right mt-1 lg:mt-0 flex lg:block items-baseline gap-2">
                                    <span class="lg:hidden text-[10px] text-zinc-500 uppercase font-bold tracking-widest">Units:</span>
                                    <span class="text-xl font-black text-white">${app.formatNumber(item.units_sold)}</span>
                                </div>

                                <div class="col-span-3 flex items-center justify-start lg:justify-end gap-6 text-sm mt-1 lg:mt-0 pt-3 lg:pt-0">
                                    <div class="text-center">
                                        <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest mb-0.5">Peak</p>
                                        <p class="font-bold text-zinc-300">${item.peak}</p>
                                    </div>
                                    <div class="text-center">
                                        <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest mb-0.5">Wks On</p>
                                        <p class="font-bold text-zinc-300">${item.weeks_on_chart}</p>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    return html;
                }
            }
        };

        window.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
