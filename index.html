<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Billboard Hot 100</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #000;
      padding: 2rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    select, button {
      padding: 0.4rem;
      margin: 0.2rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      padding: 0.6rem;
      border: 1px solid #ccc;
      text-align: left;
    }
    th {
      background: #f0f0f0;
    }
    .movement-up { color: green; }
    .movement-down { color: red; }
  </style>
</head>
<body>
  <h1>Billboard Hot 100</h1>

  <div>
    <button onclick="prevWeek()">⬅️</button>
    <select id="weekSelector" onchange="loadWeek(this.value)"></select>
    <button onclick="nextWeek()">➡️</button>
  </div>

  <div id="chartTabs">
    <button onclick="switchChart('tracks')">🎵 Tracks</button>
    <button onclick="switchChart('albums')">💿 Albums</button>
  </div>

  <div id="chartContainer"></div>

  <script src="weekdata.js"></script>
  <script>
    let currentWeek = "1";
    let currentChart = "tracks";
    let albumTrackCountMap = {};

    // Pre-compute how many unique songs each album has ever charted
    function buildAlbumTrackMap() {
      albumTrackCountMap = {};
      for (let week in weekData) {
        weekData[week].forEach(entry => {
          const album = entry.album?.trim();
          const key = `${entry.artist}__${album}`;
          if (album && album !== "NaN") {
            if (!albumTrackCountMap[key]) albumTrackCountMap[key] = new Set();
            albumTrackCountMap[key].add(entry.title);
          }
        });
      }
    }

    function renderTrackChart(data) {
      let html = `<table><thead><tr>
        <th>Rank</th><th>Move</th><th>Title</th><th>Artist</th>
        <th>Sales</th><th>Points</th><th>Weeks</th><th>Peak</th>
      </tr></thead><tbody>`;

      data.forEach(row => {
        const moveIcon = row.movement === "up" ? "🔺" :
                         row.movement === "down" ? "🔻" : "➡️";
        html += `<tr>
          <td>${row.rank}</td>
          <td class="movement-${row.movement}">${moveIcon}</td>
          <td>${row.title}</td>
          <td>${row.artist}</td>
          <td>${row.sales.toLocaleString()}</td>
          <td>${row.points}</td>
          <td>${row.weeks}</td>
          <td>${row.peak}</td>
        </tr>`;
      });

      html += "</tbody></table>";
      document.getElementById("chartContainer").innerHTML = html;
    }

    function renderAlbumChart(data) {
      const albumMap = {};

      data.forEach(row => {
        const album = row.album?.trim();
        const key = `${row.artist}__${album}`;
        if (!album || album === "NaN") return;

        // Only include albums with at least 2 songs ever charted
        const trackCount = albumTrackCountMap[key];
        if (!trackCount || trackCount.size < 2) return;

        if (!albumMap[key]) {
          albumMap[key] = {
            artist: row.artist,
            album: album,
            totalSales: 0,
            currentSales: 0,
            peak: row.rank,
            thisWeekRank: row.rank,
            weeks: 0,
            cover: row.cover || ""
          };
        }

        albumMap[key].currentSales += row.sales;
        albumMap[key].totalSales = row.totalSales;
        albumMap[key].weeks = row.weeks;
        albumMap[key].peak = Math.min(albumMap[key].peak, row.rank);
      });

      const albums = Object.values(albumMap).sort((a, b) => a.thisWeekRank - b.thisWeekRank);
      let html = `<table><thead><tr>
        <th>Rank</th><th>Album</th><th>Artist</th>
        <th>Sales</th><th>Weeks</th><th>Peak</th>
      </tr></thead><tbody>`;

      albums.forEach((a, index) => {
        html += `<tr>
          <td>${index + 1}</td>
          <td>${a.album}</td>
          <td>${a.artist}</td>
          <td>${a.currentSales.toLocaleString()}</td>
          <td>${a.weeks}</td>
          <td>${a.peak}</td>
        </tr>`;
      });

      html += "</tbody></table>";
      document.getElementById("chartContainer").innerHTML = html;
    }

    function loadWeek(week) {
      currentWeek = week;
      const data = weekData[week];
      if (!data) return;
      if (currentChart === "tracks") {
        renderTrackChart(data);
      } else {
        renderAlbumChart(data);
      }
      document.getElementById("weekSelector").value = week;
    }

    function switchChart(chart) {
      currentChart = chart;
      loadWeek(currentWeek);
    }

    function prevWeek() {
      const weeks = Object.keys(weekData).sort((a, b) => Number(b) - Number(a));
      const index = weeks.indexOf(currentWeek);
      if (index < weeks.length - 1) {
        loadWeek(weeks[index + 1]);
      }
    }

    function nextWeek() {
      const weeks = Object.keys(weekData).sort((a, b) => Number(b) - Number(a));
      const index = weeks.indexOf(currentWeek);
      if (index > 0) {
        loadWeek(weeks[index - 1]);
      }
    }

    function populateWeekSelector() {
      const selector = document.getElementById("weekSelector");
      const weeks = Object.keys(weekData).sort((a, b) => Number(b) - Number(a));
      weeks.forEach(week => {
        const option = document.createElement("option");
        option.value = week;
        option.textContent = `Week ${week}`;
        selector.appendChild(option);
      });
    }

    // Init
    buildAlbumTrackMap();
    populateWeekSelector();
    loadWeek(Object.keys(weekData).sort((a, b) => Number(b) - Number(a))[0]);
  </script>
</body>
</html>
