<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Billboard Hot 100</title>
  <style>
    body { background-color: #0f0f0f; color: #ffffff; font-family: 'Helvetica Neue', sans-serif; margin: 0; padding: 2rem; }
    nav { text-align: center; margin-bottom: 1rem; }
    nav a { color: #00ffff; text-decoration: none; margin: 0 1rem; font-weight: bold; font-size: 1.1rem; }
    nav a:hover { color: #ffffff; text-decoration: underline; }
    h1 { font-size: 2.5rem; font-weight: bold; color: #00ffff; text-align: center; margin-bottom: 2rem; text-transform: uppercase; letter-spacing: 2px; }
    .week-nav { display: flex; justify-content: center; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    #weekSelector { padding: 0.5rem; font-size: 1rem; background-color: #1a1a1a; color: #00ffff; border: 1px solid #00ffff; }
    button { padding: 0.5rem 1rem; font-size: 1rem; background-color: #00ffff; color: #0f0f0f; border: none; cursor: pointer; }
    button:hover { background-color: #00cccc; }
    .tabs { display: flex; justify-content: center; margin-top: 2rem; }
    .tab { background-color: #1a1a1a; color: #00ffff; padding: 0.5rem 1rem; margin: 0 0.25rem; cursor: pointer; border: 1px solid #00ffff; }
    .tab.active { background-color: #00ffff; color: #0f0f0f; font-weight: bold; }
    .table-container { max-height: 600px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead { background-color: #1a1a1a; position: sticky; top: 0; z-index: 1; }
    th, td { padding: 0.8rem; text-align: left; border-bottom: 1px solid #333; font-size: 0.95rem; }
    th { color: #00ffff; text-transform: uppercase; font-weight: 600; background-color: #1a1a1a; }
    tr:hover { background-color: #1f1f1f; }
    a { color: #ffffff; text-decoration: none; font-weight: 500; }
    a:hover { color: #00ffff; text-decoration: underline; }
    strong { color: #00ffff; }
    .move-up { color: #00ff00; }
    .move-down { color: #ff3333; }
    .move-stay { color: #cccccc; }
    #chart td:first-child:hover {
      text-decoration: underline;
      color: #00cccc;
      cursor: pointer;
    }
    /* Softer highlights */
    .highlight-sales { background-color: #32cd32 !important; color: #000 !important; font-weight: bold !important; }
    .highlight-sales td { font-weight: bold !important; color: #000 !important; }
    .highlight-radio { background-color: #ffcc00 !important; color: #000 !important; font-weight: bold !important; }
    .highlight-radio td { font-weight: bold !important; color: #000 !important; }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      margin-top: 1rem;
      gap: 0.5rem;
    }
    .page-btn {
      background-color: #1a1a1a;
      color: #00ffff;
      border: 1px solid #00ffff;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-weight: bold;
    }
    .page-btn.active {
      background-color: #00ffff;
      color: #0f0f0f;
    }
    .page-btn:hover {
      background-color: #00cccc;
      color: #0f0f0f;
    }
  </style>
  <script src="weekdata.js"></script>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="streams.html">Streams</a>
    <a href="records.html">Records</a>
  </nav>

  <h1>Billboard Hot 100</h1>

  <div class="week-nav">
    <button onclick="changeWeek(-1)">⬅️</button>
    <select id="weekSelector"></select>
    <button onclick="changeWeek(1)">➡️</button>
  </div>

  <div class="tabs">
    <div class="tab active" data-chart="tracks" onclick="switchChart('tracks')">Tracks</div>
    <div class="tab" data-chart="albums" onclick="switchChart('albums')">Albums</div>
  </div>

  <div class="table-container">
    <table id="chart">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Move</th>
          <th>Title</th>
          <th>Artist</th>
          <th>Sales</th>
          <th>Points</th>
          <th>Weeks</th>
          <th>Peak</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="pagination">
    <button class="page-btn active" onclick="switchPage(1)">Page 1</button>
    <button class="page-btn" onclick="switchPage(2)">Page 2</button>
  </div>

  <script>
    function normalize(text) {
      if (typeof text !== "string") text = String(text || "");
      return text.toLowerCase()
        .replace(/\(.*?\)/g, '')
        .replace(/\[.*?\]/g, '')
        .replace(/feat\..*/g, '')
        .replace(/[^a-z0-9]/g, '');
    }
    function getFuzzyKey(title, artist) {
      return normalize(title) + normalize(artist);
    }

    let currentWeek = 1;
    let currentChart = 'tracks';
    let currentPage = 1;

    function switchChart(type) {
      currentChart = type;
      document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.remove("active");
        if (tab.dataset.chart === type) tab.classList.add("active");
      });
      loadWeek(currentWeek);
    }
// Function to toggle the hidden details row
let expandedRow = null;

function toggleDetails(row, detailsHTML) {
  // If already expanded under this row, remove it
  if (expandedRow === row.nextSibling && row.nextSibling.classList.contains("details-row")) {
    row.parentNode.removeChild(row.nextSibling);
    expandedRow = null;
    return;
  }

  // Remove previous expanded row if any
  if (expandedRow) {
    expandedRow.parentNode.removeChild(expandedRow);
    expandedRow = null;
  }

  // Create new details row
  const tr = document.createElement("tr");
  tr.classList.add("details-row");
  tr.style.backgroundColor = "#1a1a1a";
  tr.style.color = "#00ffff";
  tr.innerHTML = `<td colspan="8">${detailsHTML}</td>`;

  // Insert after the clicked row
  row.parentNode.insertBefore(tr, row.nextSibling);
  expandedRow = tr;
}
    function switchPage(page) {
      currentPage = page;
      document.querySelectorAll(".page-btn").forEach(btn => btn.classList.remove("active"));
      document.querySelector(`.page-btn:nth-child(${page})`).classList.add("active");
      loadWeek(currentWeek);
    }

    function loadWeek(weekNumber) {
      currentWeek = weekNumber;
      const allEntries = weekData[weekNumber] || [];
      const tbody = document.querySelector("#chart tbody");
      tbody.innerHTML = "";

      if (currentChart === "tracks") {
        renderTrackChart(allEntries, weekNumber, tbody);
      } else {
        renderAlbumChart(allEntries, weekNumber, tbody);
      }

      document.getElementById("weekSelector").value = weekNumber;
    }

    function renderTrackChart(entries, weekNumber, tbody) {
      const history = {};
      for (let i = 1; i < weekNumber; i++) {
        for (const row of weekData[i] || []) {
          const key = getFuzzyKey(row.title, row.artist);
          if (!history[key]) history[key] = [];
          history[key].push({ ...row });
        }
      }

      const currentTracks = entries.filter(row => row.title && row.artist);
      const enrichedTracks = currentTracks.map(row => {
        const key = getFuzzyKey(row.title, row.artist);
        const past = history[key] || [];
        const totalWeeks = past.length + 1;
        const bestPeak = Math.min(...past.map(r => parseInt(r.rank)).concat([parseInt(row.rank)]));
        return { ...row, totalWeeks, bestPeak, points: row.points };
      });

      const maxSales = Math.max(...enrichedTracks.map(r => r.sales || 0));
      const maxRadio = Math.max(...enrichedTracks.map(r => r.radio || 0));

      enrichedTracks.sort((a, b) => b.points - a.points);

      // Pagination slice
      const paginatedTracks = enrichedTracks.slice((currentPage - 1) * 100, currentPage * 100);

      paginatedTracks.forEach((row, index) => {
        const key = getFuzzyKey(row.title, row.artist);
        const past = history[key] || [];
        const lastWeek = weekData[weekNumber - 1] || [];
        const wasLastWeek = lastWeek.some(r => getFuzzyKey(r.title, r.artist) === key);

        let movementIcon = "➡️", movementText = "";
        if (past.length === 0) {
          movementIcon = "🆕";
        } else if (!wasLastWeek) {
          movementIcon = "🔄";
        } else {
          const lastRank = parseInt(past[past.length - 1].rank);
          const diff = lastRank - parseInt(row.rank);
          if (diff > 0) movementIcon = "⬆️", movementText = ` <span class="move-up">+${diff}</span>`;
          else if (diff < 0) movementIcon = "⬇️", movementText = ` <span class="move-down">${diff}</span>`;
        }

        const tr = document.createElement("tr");
        if (row.sales === maxSales) tr.classList.add("highlight-sales");
        if (row.radio === maxRadio) tr.classList.add("highlight-radio");

        tr.innerHTML = `
          <td>
  <span class="rank-click" onclick="showTrackDetails('${encodeURIComponent(row.title)}','${encodeURIComponent(row.artist)}', ${weekNumber}, ${row.sales}, ${row.radio}, ${row.streams}, ${row.points})">
    ${(currentPage - 1) * 100 + index + 1}
  </span>
</td>
          <td>${movementIcon}${movementText}</td>
          <td><a href="track_detail.html?title=${encodeURIComponent(row.title)}&artist=${encodeURIComponent(row.artist)}">${movementIcon === "🆕" ? `<strong>${row.title}</strong>` : row.title}</a></td>
          <td><a href="artist.html?artist=${encodeURIComponent(row.artist)}">${row.artist}</a></td>
          <td>${row.sales.toFixed(2)}</td>
          <td>${row.points.toFixed(2)}</td>
          <td>${row.totalWeeks}</td>
          <td>${row.bestPeak}</td>
        `;
        tbody.appendChild(tr);
      });
    }

function renderAlbumChart(entries, weekNumber, tbody) {
  const albumsMap = {};

  // Step 1: Collect album-level data from current week entries
  for (const row of entries) {
    if (!row.album || typeof row.album !== "string" || row.album.trim().toLowerCase() === "nan") continue;

    const albumName = row.album;
    const artistName = row.artist || "";
    const key = normalize(albumName) + '||' + normalize(artistName);

    if (!albumsMap[key]) {
      albumsMap[key] = { 
        album: albumName, 
        artist: artistName, 
        sales: 0, 
        tracks: new Set() 
      };
    }

    albumsMap[key].sales += row.sales;
    albumsMap[key].tracks.add(normalize(row.title));
  }

  // Step 2: Filter albums with at least 2 unique tracks charting
  let qualifiedAlbums = Object.values(albumsMap).filter(a => a.tracks.size >= 2);

  // Step 3: Build history
  const history = {};
  for (let i = 1; i < weekNumber; i++) {
    const weekAlbums = {};
    for (const row of (weekData[i] || [])) {
      if (!row.album || typeof row.album !== "string" || row.album.trim().toLowerCase() === "nan") continue;
      const key = normalize(row.album) + '||' + normalize(row.artist || "");
      if (!weekAlbums[key]) {
        weekAlbums[key] = { album: row.album, artist: row.artist, sales: 0, tracks: new Set() };
      }
      weekAlbums[key].sales += row.sales;
      weekAlbums[key].tracks.add(normalize(row.title));
    }
    for (const [key, album] of Object.entries(weekAlbums)) {
      if (album.tracks.size >= 2) {
        if (!history[key]) history[key] = [];
        history[key].push(i);
      }
    }
  }

  // Step 4: Get last week's album ranks
  const lastWeekAlbums = {};
  if (weekData[weekNumber - 1]) {
    const prevEntries = {};
    for (const row of weekData[weekNumber - 1]) {
      if (!row.album || typeof row.album !== "string" || row.album.trim().toLowerCase() === "nan") continue;
      const key = normalize(row.album) + '||' + normalize(row.artist || "");
      if (!prevEntries[key]) {
        prevEntries[key] = { album: row.album, artist: row.artist, sales: 0, tracks: new Set() };
      }
      prevEntries[key].sales += row.sales;
      prevEntries[key].tracks.add(normalize(row.title));
    }
    const prevQualified = Object.values(prevEntries).filter(a => a.tracks.size >= 2).sort((a, b) => b.sales - a.sales);
    prevQualified.forEach((a, i) => {
      const key = normalize(a.album) + '||' + normalize(a.artist);
      lastWeekAlbums[key] = i + 1;
    });
  }

  // Step 5: Enrich albums
  qualifiedAlbums = qualifiedAlbums.map(album => {
    const key = normalize(album.album) + '||' + normalize(album.artist);
    const appearances = history[key] || [];
    const totalWeeks = appearances.length + 1;
    return { ...album, key, totalWeeks };
  });

  // Step 6: Sort by sales
  qualifiedAlbums.sort((a, b) => b.sales - a.sales);

  // Step 7: Pagination
  const paginatedAlbums = qualifiedAlbums.slice((currentPage - 1) * 100, currentPage * 100);

  // Step 8: Render rows
  paginatedAlbums.forEach((album, index) => {
    const currentRank = (currentPage - 1) * 100 + index + 1;
    const pastWeeks = history[album.key] || [];
    const wasLastWeek = album.key in lastWeekAlbums;

    let movementIcon = "➡️";
    let movementText = "";
    let isNew = false;

    if (pastWeeks.length === 0) {
      movementIcon = "🆕";
      isNew = true;
    } else if (!wasLastWeek) {
      movementIcon = "🔄";
    } else {
      const lastRank = lastWeekAlbums[album.key];
      const diff = lastRank - currentRank;
      if (diff > 0) movementIcon = "⬆️", movementText = ` <span class="move-up">+${diff}</span>`;
      else if (diff < 0) movementIcon = "⬇️", movementText = ` <span class="move-down">${diff}</span>`;
    }

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>
  <span class="rank-click" onclick="showAlbumDetails('${encodeURIComponent(album.album)}','${encodeURIComponent(album.artist)}', ${weekNumber}, ${album.sales})">
    ${currentRank}
  </span>
</td>
      <td>${movementIcon}${movementText}</td>
      <td><a href="album_data.html?album=${encodeURIComponent(album.album)}&artist=${encodeURIComponent(album.artist)}">${isNew ? `<strong>${album.album}</strong>` : album.album}</a></td>
      <td><a href="artist.html?artist=${encodeURIComponent(album.artist)}">${album.artist}</a></td>
      <td>${album.sales.toFixed(2)}</td>
      <td>—</td>
      <td>${album.totalWeeks}</td>
      <td>—</td>
    `;
    tbody.appendChild(tr);
  });
}

    function getDateRange(weekNum) {
      const start = new Date(2018, 1, 23);
      start.setDate(start.getDate() + (weekNum - 1) * 7);
      const end = new Date(start);
      end.setDate(start.getDate() + 6);
      const options = { day: 'numeric', month: 'short', year: 'numeric' };
      return `${start.toLocaleDateString('en-GB', options)} - ${end.toLocaleDateString('en-GB', options)}`;
    }

    function populateWeekSelector() {
      const selector = document.getElementById("weekSelector");
      const weeks = Object.keys(weekData)
        .map(k => parseInt(k))
        .filter(k => !isNaN(k))
        .sort((a, b) => b - a);
      for (const w of weeks) {
        const opt = document.createElement("option");
        opt.value = w;
        opt.textContent = getDateRange(w);
        selector.appendChild(opt);
      }
      selector.addEventListener("change", () => loadWeek(Number(selector.value)));
      loadWeek(weeks[0]);
    }

    function changeWeek(delta) {
      const weeks = Object.keys(weekData)
        .map(k => parseInt(k))
        .filter(k => !isNaN(k))
        .sort((a, b) => a - b);
      const index = weeks.indexOf(currentWeek);
      const newIndex = index + delta;
      if (newIndex >= 0 && newIndex < weeks.length) {
        loadWeek(weeks[newIndex]);
      }
    }
function showTrackDetails(title, artist, weekNumber, sales, radio, streams, points) {
  title = decodeURIComponent(title);
  artist = decodeURIComponent(artist);
  const key = getFuzzyKey(title, artist);

  // Find last week's entry
  const lastWeek = weekData[weekNumber - 1] || [];
  const prev = lastWeek.find(r => getFuzzyKey(r.title, r.artist) === key);

  let lastRank = prev ? prev.rank : "—";
  let percentChange = prev ? (((points - prev.points) / prev.points) * 100).toFixed(1) + "%" : "—";

  // Find the table row for this track
  const rows = document.querySelectorAll("#chart tbody tr");
  let row = null;
  rows.forEach(r => {
    const titleCell = r.children[2];
    if (titleCell && titleCell.textContent.trim() === title) row = r;
  });
  if (!row) return;

  const detailsHTML = `
    <div style="display:flex; justify-content:space-between; flex-wrap:wrap;">
      <div>Sales: ${sales.toFixed(2)}K</div>
      <div>Radio: ${(radio/1000000).toFixed(2)}M</div>
      <div>Streams: ${(streams/1000000).toFixed(2)}M</div>
      <div>Last Week Rank: ${lastRank}</div>
      <div>Change: ${percentChange}</div>
    </div>
  `;

  // Toggle details row
  toggleDetails(row, detailsHTML);
}
function showAlbumDetails(album, artist, weekNumber, sales, streams) {
  album = decodeURIComponent(album);
  artist = decodeURIComponent(artist);
  const key = normalize(album) + "||" + normalize(artist);

  // Last week's albums
  const lastWeekAlbums = {};
  if (weekData[weekNumber - 1]) {
    const prevEntries = {};
    for (const row of weekData[weekNumber - 1]) {
      if (!row.album) continue;
      const prevKey = normalize(row.album) + "||" + normalize(row.artist || "");
      if (!prevEntries[prevKey]) prevEntries[prevKey] = { sales: 0 };
      prevEntries[prevKey].sales += row.sales;
    }
    for (const [k, v] of Object.entries(prevEntries)) {
      lastWeekAlbums[k] = v;
    }
  }

  let prevSales = lastWeekAlbums[key] ? lastWeekAlbums[key].sales : null;
  let percentChange = prevSales ? (((sales - prevSales) / prevSales) * 100).toFixed(1) + "%" : "—";

  // Find the table row for this album
  const rows = document.querySelectorAll("#chart tbody tr");
  let row = null;
  rows.forEach(r => {
    const titleCell = r.children[2];
    if (titleCell && titleCell.textContent.trim() === album) row = r;
  });
  if (!row) return;

  const detailsHTML = `
    <div style="display:flex; justify-content:space-between; flex-wrap:wrap;">
      <div>Sales: ${sales.toFixed(2)}K</div>
      <div>Streams: ${(streams/1000000 || 0).toFixed(2)}M</div>
      <div>Last Week Sales: ${prevSales ? prevSales.toFixed(2) + "K" : "—"}</div>
      <div>Change: ${percentChange}</div>
    </div>
  `;

  // Toggle details row
  toggleDetails(row, detailsHTML);
}
    populateWeekSelector();
  </script>
</body>
</html>
