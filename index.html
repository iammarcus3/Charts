<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Billboard Hot 100</title>
  <style>
    /* Billboard-like styling */
    body {
      background-color: #ffffff;
      color: #000000;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    nav {
      text-align: center;
      padding: 1rem;
      background: #000000;
    }
    nav a {
      color: #ffffff;
      text-decoration: none;
      margin: 0 1rem;
      font-weight: bold;
      font-size: 1.1rem;
    }
    nav a:hover {
      color: #ff0050;
    }

    h1 {
      font-size: 3rem;
      font-weight: 900;
      text-align: center;
      margin: 2rem 0 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .week-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    #weekSelector {
      padding: 0.5rem;
      font-size: 1rem;
      background-color: #f5f5f5;
      border: 1px solid #ccc;
    }
    button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      background-color: #000000;
      color: #ffffff;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #ff0050;
    }

    .tabs {
      display: flex;
      justify-content: center;
      margin-top: 1.5rem;
    }
    .tab {
      background-color: #f5f5f5;
      color: #000000;
      padding: 0.5rem 1rem;
      margin: 0 0.25rem;
      cursor: pointer;
      border: 1px solid #ccc;
      font-weight: 500;
    }
    .tab.active {
      background-color: #000000;
      color: #ffffff;
      font-weight: bold;
    }

    .table-container {
      max-width: 1100px;
      margin: auto;
      padding: 1rem;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead {
      background-color: #000000;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    th, td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid #ddd;
      font-size: 1rem;
    }
    th {
      color: #ffffff;
      text-transform: uppercase;
      font-weight: 700;
    }
    td:first-child {
      font-weight: 900;
      font-size: 1.5rem;
    }
    tr:hover {
      background-color: #f0f0f0;
    }
    a {
      color: #000000;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover {
      color: #ff0050;
      text-decoration: underline;
    }

    strong {
      color: #000000;
      font-weight: 700;
    }

    .move-up {
      color: #00a650;
      font-weight: bold;
    }
    .move-down {
      color: #d90429;
      font-weight: bold;
    }
    .move-stay {
      color: #888888;
    }
  </style>
  <script src="weekdata.js"></script>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="streams.html">Streams</a>
    <a href="records.html">Records</a>
  </nav>

  <h1>Billboard Hot 100</h1>

  <div class="week-nav">
    <button onclick="changeWeek(-1)">⬅️</button>
    <select id="weekSelector"></select>
    <button onclick="changeWeek(1)">➡️</button>
  </div>

  <div class="tabs">
    <div class="tab active" data-chart="tracks" onclick="switchChart('tracks')">Tracks</div>
    <div class="tab" data-chart="albums" onclick="switchChart('albums')">Albums</div>
  </div>

  <div class="table-container">
    <table id="chart">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Move</th>
          <th>Title</th>
          <th>Artist</th>
          <th>Sales</th>
          <th>Points</th>
          <th>Weeks</th>
          <th>Peak</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    function normalize(text) {
      if (typeof text !== "string") text = String(text || "");
      return text.toLowerCase()
        .replace(/\(.*?\)/g, '')
        .replace(/\[.*?\]/g, '')
        .replace(/feat\..*/g, '')
        .replace(/[^a-z0-9]/g, '');
    }

    function getFuzzyKey(title, artist) {
      return normalize(title) + normalize(artist);
    }

    let currentWeek = 1;
    let currentChart = 'tracks';

    function switchChart(type) {
      currentChart = type;
      document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.remove("active");
        if (tab.dataset.chart === type) tab.classList.add("active");
      });
      loadWeek(currentWeek);
    }

    function loadWeek(weekNumber) {
      currentWeek = weekNumber;
      const allEntries = weekData[weekNumber] || [];
      const tbody = document.querySelector("#chart tbody");
      tbody.innerHTML = "";

      if (currentChart === "tracks") {
        renderTrackChart(allEntries, weekNumber, tbody);
      } else {
        renderAlbumChart(allEntries, weekNumber, tbody);
      }

      document.getElementById("weekSelector").value = weekNumber;
    }

    function renderTrackChart(entries, weekNumber, tbody) {
      const history = {};

      for (let i = 1; i < weekNumber; i++) {
        for (const row of weekData[i] || []) {
          const key = getFuzzyKey(row.title, row.artist);
          if (!history[key]) history[key] = [];
          history[key].push({ ...row });
        }
      }

      const currentTracks = entries.filter(row => row.title && row.artist);
      const enrichedTracks = currentTracks.map(row => {
        const key = getFuzzyKey(row.title, row.artist);
        const past = history[key] || [];
        const totalWeeks = past.length + 1;
        const bestPeak = Math.min(...past.map(r => parseInt(r.rank)).concat([parseInt(row.rank)]));
        return { ...row, totalWeeks, bestPeak, points: row.points };
      });

      enrichedTracks.sort((a, b) => b.points - a.points);

      enrichedTracks.forEach((row, index) => {
        const key = getFuzzyKey(row.title, row.artist);
        const past = history[key] || [];
        let movementIcon = "➡️", movementText = "";
        if (past.length === 0) {
          movementIcon = "🆕";
        } else {
          const lastRank = parseInt(past[past.length - 1].rank);
          const diff = lastRank - parseInt(row.rank);
          if (diff > 0) movementIcon = "⬆️", movementText = ` <span class="move-up">+${diff}</span>`;
          else if (diff < 0) movementIcon = "⬇️", movementText = ` <span class="move-down">${diff}</span>`;
        }

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${movementIcon}${movementText}</td>
          <td><a href="track_detail.html?title=${encodeURIComponent(row.title)}&artist=${encodeURIComponent(row.artist)}">${movementIcon === "🆕" ? `<strong>${row.title}</strong>` : row.title}</a></td>
          <td><a href="artist.html?artist=${encodeURIComponent(row.artist)}">${row.artist}</a></td>
          <td>${row.sales.toFixed(2)}</td>
          <td>${row.points.toFixed(2)}</td>
          <td>${row.totalWeeks}</td>
          <td>${row.bestPeak}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderAlbumChart(entries, weekNumber, tbody) {
      function getAlbumRanksByWeek(maxWeek) {
        const ranksByWeek = {};
        for (let w = 1; w <= maxWeek; w++) {
          const albumsMap = {};
          for (const row of weekData[w] || []) {
            if (!row.album || typeof row.album !== "string" || row.album.trim().toLowerCase() === "nan") continue;
            const albumKey = normalize(row.album) + '||' + normalize(row.artist || '');
            if (!albumsMap[albumKey]) {
              albumsMap[albumKey] = { album: row.album, artist: row.artist || "", sales: 0 };
            }
            albumsMap[albumKey].sales += row.sales;
          }
          const albumsArray = Object.values(albumsMap);
          albumsArray.sort((a, b) => b.sales - a.sales);
          ranksByWeek[w] = {};
          albumsArray.forEach((album, index) => {
            const key = normalize(album.album) + '||' + normalize(album.artist);
            ranksByWeek[w][key] = index + 1;
          });
        }
        return ranksByWeek;
      }

      const ranksByWeek = getAlbumRanksByWeek(weekNumber);

      const albumSongCounts = {};
      for (const week in weekData) {
        if (!weekData.hasOwnProperty(week)) continue;
        const w = parseInt(week);
        if (isNaN(w)) continue;
        for (const row of weekData[week] || []) {
          if (!row.album || typeof row.album !== "string" || row.album.trim().toLowerCase() === "nan") continue;
          const albumKey = normalize(row.album) + '||' + normalize(row.artist || '');
          if (!albumSongCounts[albumKey]) albumSongCounts[albumKey] = new Set();
          if (row.title) albumSongCounts[albumKey].add(row.title.toLowerCase());
        }
      }

      const albumsMap = {};
      for (const row of entries) {
        if (!row.album || typeof row.album !== "string" || row.album.trim().toLowerCase() === "nan") continue;
        const albumName = row.album;
        const artistName = row.artist || "";
        const key = normalize(albumName) + '||' + normalize(artistName);
        if (!albumsMap[key]) {
          albumsMap[key] = { album: albumName, artist: artistName, sales: 0 };
        }
        albumsMap[key].sales += row.sales;
      }

      const filteredAlbums = Object.entries(albumsMap).filter(([key, album]) => {
        return albumSongCounts[key] && albumSongCounts[key].size >= 2;
      }).map(([key, album]) => album);

      const enrichedAlbums = filteredAlbums.map(album => {
        const key = normalize(album.album) + '||' + normalize(album.artist);
        const allRanks = [];
        for (let i = 1; i <= weekNumber; i++) {
          if (ranksByWeek[i] && ranksByWeek[i][key]) {
            allRanks.push(ranksByWeek[i][key]);
          }
        }
        const bestPeak = allRanks.length > 0 ? Math.min(...allRanks) : null;
        const currentRank = ranksByWeek[weekNumber][key] || null;
        const lastWeekRank = ranksByWeek[weekNumber - 1] ? ranksByWeek[weekNumber - 1][key] : null;
        let movementIcon = "";
        let movementText = "";
        if (allRanks.length === 1) {
          movementIcon = "🆕";
        } else if (!lastWeekRank && allRanks.length > 1) {
          movementIcon = "↩️";
          movementText = ` <span class="move-stay">(Re-entry)</span>`;
        } else if (lastWeekRank && currentRank) {
          const diff = lastWeekRank - currentRank;
          if (diff > 0) {
            movementIcon = "⬆️";
            movementText = ` <span class="move-up">+${diff}</span>`;
          } else if (diff < 0) {
            movementIcon = "⬇️";
            movementText = ` <span class="move-down">${diff}</span>`;
          } else {
            movementIcon = "➡️";
          }
        } else {
          movementIcon = "➡️";
        }
        return {
          ...album,
          totalWeeks: allRanks.length,
          bestPeak,
          movementIcon,
          movementText,
          currentRank,
        };
      });

      enrichedAlbums.sort((a, b) => b.sales - a.sales);

      for (const album of enrichedAlbums) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${album.currentRank !== null ? album.currentRank : '—'}</td>
          <td>${album.movementIcon}${album.movementText}</td>
          <td><a href="album_data.html?album=${encodeURIComponent(album.album)}&artist=${encodeURIComponent(album.artist)}"><strong>${album.album}</strong></a></td>
          <td><a href="artist.html?artist=${encodeURIComponent(album.artist)}">${album.artist}</a></td>
          <td>${album.sales.toFixed(2)}</td>
          <td>—</td>
          <td>${album.totalWeeks}</td>
          <td>${album.bestPeak !== null ? album.bestPeak : '—'}</td>
        `;
        tbody.appendChild(tr);
      }
    }

    function getDateRange(weekNum) {
      const start = new Date(2018, 1, 23);
      start.setDate(start.getDate() + (weekNum - 1) * 7);
      const end = new Date(start);
      end.setDate(start.getDate() + 6);
      const options = { day: 'numeric', month: 'short', year: 'numeric' };
      return `${start.toLocaleDateString('en-GB', options)} - ${end.toLocaleDateString('en-GB', options)}`;
    }

    function populateWeekSelector() {
      const selector = document.getElementById("weekSelector");
      const weeks = Object.keys(weekData)
        .map(k => parseInt(k))
        .filter(k => !isNaN(k))
        .sort((a, b) => b - a);
      for (const w of weeks) {
        const opt = document.createElement("option");
        opt.value = w;
        opt.textContent = getDateRange(w);
        selector.appendChild(opt);
      }
      selector.addEventListener("change", () => loadWeek(Number(selector.value)));
      loadWeek(weeks[0]);
    }

    function changeWeek(delta) {
      const weeks = Object.keys(weekData)
        .map(k => parseInt(k))
        .filter(k => !isNaN(k))
        .sort((a, b) => a - b);
      const index = weeks.indexOf(currentWeek);
      const newIndex = index + delta;
      if (newIndex >= 0 && newIndex < weeks.length) {
        loadWeek(weeks[newIndex]);
      }
    }

    populateWeekSelector();
  </script>
</body>
</html>
