<!DOCTYPE html>
<html lang="en" class="bg-black text-zinc-100 antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YourHot100 | The Official Chart</title>
    
    <!-- PWA Manifest Injection -->
    <script>
        const setupPWA = () => {
            const manifest = {
                name: "YourHot100 Charts",
                short_name: "Hot100",
                display: "standalone",
                background_color: "#000000",
                theme_color: "#000000",
                icons: [{ src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='black'/%3E%3Ctext y='50%' x='50%' dominant-baseline='middle' text-anchor='middle' font-size='40' fill='white'%3E100%3C/text%3E%3C/svg%3E", sizes: "192x192", type: "image/svg+xml" }]
            };
            const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);
            document.head.appendChild(link);
        };
        setupPWA();
    </script>

    <!-- Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Icons: Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { zinc: { 900: '#18181b', 950: '#09090b' } }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .loading-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <!-- Navigation Sidebar -->
    <nav class="w-full md:w-64 bg-zinc-950 border-b md:border-b-0 md:border-r border-zinc-900 flex flex-col p-6 shrink-0 md:h-screen md:sticky top-0 z-50">
        <div class="mb-10">
            <h1 class="text-3xl font-black tracking-tighter text-white">YourHot<span class="text-zinc-500">100</span></h1>
            <p class="text-xs text-zinc-500 uppercase tracking-widest mt-1">Official Charts</p>
        </div>

        <div class="flex flex-row md:flex-col gap-2 overflow-x-auto md:overflow-visible pb-4 md:pb-0">
            <button onclick="app.navigate('dashboard')" id="nav-dashboard" class="nav-btn flex items-center gap-3 px-4 py-3 rounded-md text-zinc-400 hover:text-white hover:bg-zinc-900 transition-colors shrink-0 text-left">
                <i class="ph ph-squares-four text-xl"></i> Dashboard
            </button>
            <button onclick="app.navigate('songs')" id="nav-songs" class="nav-btn flex items-center gap-3 px-4 py-3 rounded-md text-zinc-400 hover:text-white hover:bg-zinc-900 transition-colors shrink-0 text-left">
                <i class="ph ph-music-notes text-xl"></i> Hot 100 Songs
            </button>
            <button onclick="app.navigate('albums')" id="nav-albums" class="nav-btn flex items-center gap-3 px-4 py-3 rounded-md text-zinc-400 hover:text-white hover:bg-zinc-900 transition-colors shrink-0 text-left">
                <i class="ph ph-vinyl-record text-xl"></i> Top 100 Albums
            </button>
        </div>
        
        <div class="mt-auto hidden md:block pt-8 border-t border-zinc-900">
            <p class="text-xs text-zinc-600 font-bold uppercase tracking-widest mb-2">Vault Status</p>
            <div class="flex items-center gap-2 text-sm text-green-500 font-semibold">
                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                Live Synced
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 md:p-10 max-w-7xl mx-auto w-full overflow-x-hidden flex flex-col">
        
        <!-- Global Chart Navigation -->
        <div class="flex flex-col sm:flex-row justify-between items-center bg-zinc-900/80 border border-zinc-800 rounded-lg p-4 mb-8 backdrop-blur-sm z-40 sticky top-4 shadow-xl">
            <button onclick="app.changeWeek(-1)" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-white rounded text-sm font-semibold transition flex items-center gap-2">
                <i class="ph-bold ph-arrow-left"></i> Prev Week
            </button>
            
            <div class="text-center my-3 sm:my-0">
                <h3 id="week-display-label" class="text-lg font-black text-white m-0">Current Week</h3>
                <p id="week-date-label" class="text-xs text-zinc-400 font-medium tracking-wide">Loading dates...</p>
            </div>
            
            <button id="btn-next-week" onclick="app.changeWeek(1)" class="px-4 py-2 bg-zinc-800 text-zinc-500 rounded text-sm font-semibold transition flex items-center gap-2 cursor-not-allowed" disabled>
                Next Week <i class="ph-bold ph-arrow-right"></i>
            </button>
        </div>

        <!-- Loader -->
        <div id="loading-state" class="hidden flex-col items-center justify-center flex-1 text-zinc-500 py-20">
            <i class="ph ph-spinner-gap animate-spin text-4xl mb-4"></i>
            <p class="font-medium uppercase tracking-widest text-sm">Compiling Vault Data...</p>
        </div>
        
        <!-- Content Container -->
        <div id="content-container" class="fade-in pb-20"></div>
    </main>

    <script>
        // --- Configuration & Constants ---
        const LASTFM_API_KEY = "ed9c6dcac73ea1adcd3750efeea9b822";
        const artworkCache = new Map();

        // Official YourHot100 Formulas
        const FORMULAS = {
            songUnits: (plays, points) => (plays * 500) + (points * 500),
            albumUnits: (plays, points) => (plays * 5000) + (points * 500)
        };

        const app = {
            state: {
                currentView: 'dashboard',
                weekOffset: 0, 
                data: { songs: [], albums: [] },
                raw: { tracks: null, albums: null, history: null }
            },
            
            async init() {
                this.navigate('dashboard');
                await this.loadVaultData();
            },

            async loadVaultData() {
                this.showLoading(true);
                try {
                    // Fetch raw canonical files from your vault
                    const [tracksRes, albumsRes, historyRes] = await Promise.all([
                        fetch('vault/tracks.json'),
                        fetch('vault/albums.json'),
                        fetch('vault/listening_history.jsonl')
                    ]);
                    
                    if (!tracksRes.ok) throw new Error("Failed to locate vault data. Ensure your files are pushed to GitHub Pages.");
                    
                    // Parse standard JSON
                    const tracksArray = await tracksRes.json();
                    const albumsArray = await albumsRes.json();
                    
                    // Convert arrays to lookup maps for performance
                    this.state.raw.tracks = new Map(tracksArray.map(t => [t.id, t]));
                    this.state.raw.albums = new Map(albumsArray.map(a => [a.id, a]));
                    
                    // Parse JSONL (Listening History)
                    const historyText = await historyRes.text();
                    this.state.raw.history = historyText.trim().split('\n').filter(line => line).map(line => JSON.parse(line));
                    
                    this.processWeeklyCharts();
                } catch (e) {
                    console.error(e);
                    document.getElementById('content-container').innerHTML = `<div class="p-10 text-center text-red-500 font-bold border border-red-900 bg-red-950/30 rounded">Error: ${e.message}</div>`;
                }
                this.showLoading(false);
            },

            processWeeklyCharts() {
                // Determine the most recent Friday-Thursday window based on the latest scrobble
                const latestEvent = this.state.raw.history[this.state.raw.history.length - 1];
                if (!latestEvent) {
                    document.getElementById('content-container').innerHTML = `<div class="p-10 text-center text-zinc-500">No listening history found.</div>`;
                    return;
                }

                // Unix timestamps to target specific weeks
                const latestDate = new Date(latestEvent.timestamp * 1000);
                const dayOfWeek = latestDate.getUTCDay(); // 0 = Sun, 5 = Fri
                const daysSinceFriday = (dayOfWeek + 2) % 7; 
                
                // Calculate chart boundaries based on user's weekOffset
                const endTimestamp = latestDate.setUTCHours(23, 59, 59, 999) - (daysSinceFriday * 86400000) - (Math.abs(this.state.weekOffset) * 7 * 86400000);
                const startTimestamp = endTimestamp - (6 * 86400000) - 86399000; 

                const unixStart = Math.floor(startTimestamp / 1000);
                const unixEnd = Math.floor(endTimestamp / 1000);

                // Filter listening history for the active week
                const weeklyEvents = this.state.raw.history.filter(e => e.timestamp >= unixStart && e.timestamp <= unixEnd);

                // Aggregate Plays
                const trackPlays = new Map();
                const albumPlays = new Map();

                weeklyEvents.forEach(event => {
                    const trackId = event.track_id;
                    trackPlays.set(trackId, (trackPlays.get(trackId) || 0) + 1);
                    
                    const track = this.state.raw.tracks.get(trackId);
                    if (track && track.album_id) {
                        albumPlays.set(track.album_id, (albumPlays.get(track.album_id) || 0) + 1);
                    }
                });

                // Generate Rankings & Units
                this.state.data.songs = this.compileChartEntries(trackPlays, 'songs');
                this.state.data.albums = this.compileChartEntries(albumPlays, 'albums');

                this.updateWeekUI(new Date(startTimestamp), new Date(endTimestamp));
                this.renderCurrentView();
            },

            compileChartEntries(playCountsMap, type) {
                let entries = [];
                
                playCountsMap.forEach((plays, id) => {
                    let title, artist, albumTitle = null, trackCount = null;
                    
                    if (type === 'songs') {
                        const track = this.state.raw.tracks.get(id);
                        if (!track) return;
                        title = track.title;
                        // Extract primary artist from deterministic ID logic format: "artist:name"
                        artist = track.primary_artist_id ? track.primary_artist_id.split(':')[1] || "Unknown Artist" : "Unknown Artist";
                    } else {
                        const album = this.state.raw.albums.get(id);
                        if (!album) return; // Ignores ineligible albums filtered out by build_vault.py
                        title = album.title;
                        artist = album.primary_artist_id ? album.primary_artist_id.split(':')[1] || "Unknown Artist" : "Unknown Artist";
                        albumTitle = title;
                    }

                    entries.push({ id, title, artist, album: albumTitle, plays, track_count: trackCount });
                });

                // 1. Initial sort by plays to determine Chart Points
                entries.sort((a, b) => b.plays - a.plays);
                
                // 2. Assign Points (1 = 100, 2 = 98, ..., 100 = 1)
                entries = entries.slice(0, 100).map((entry, index) => {
                    const rankForPoints = index + 1;
                    const points = rankForPoints === 1 ? 100 : rankForPoints === 2 ? 98 : Math.max(1, 100 - rankForPoints + 1);
                    
                    // 3. Calculate final Units Sold based on official formula
                    const units_sold = type === 'songs' ? FORMULAS.songUnits(entry.plays, points) : FORMULAS.albumUnits(entry.plays, points);
                    
                    return { ...entry, points, units_sold };
                });

                // 4. Final sort by Units Sold for official ranking
                entries.sort((a, b) => b.units_sold - a.units_sold);
                
                return entries.map((entry, index) => ({
                    ...entry,
                    rank: index + 1,
                    previous_rank: null, // Requires backend snapshot generation for historical delta
                    peak: index + 1,
                    weeks_on_chart: 1,
                    is_new: true
                }));
            },

            async changeWeek(direction) {
                if (direction > 0 && this.state.weekOffset >= 0) return; 
                this.state.weekOffset += direction;
                this.processWeeklyCharts(); // Re-process from loaded memory
            },

            updateWeekUI(startDate, endDate) {
                const nextBtn = document.getElementById('btn-next-week');
                const label = document.getElementById('week-display-label');
                const dateLabel = document.getElementById('week-date-label');
                
                const options = { month: 'short', day: 'numeric', year: 'numeric' };
                dateLabel.textContent = `${startDate.toLocaleDateString('en-US', options)} - ${endDate.toLocaleDateString('en-US', options)}`;
                
                if (this.state.weekOffset === 0) {
                    nextBtn.disabled = true;
                    nextBtn.classList.add('text-zinc-500', 'cursor-not-allowed');
                    nextBtn.classList.remove('text-white', 'hover:bg-zinc-700');
                    label.textContent = "Current Week";
                } else {
                    nextBtn.disabled = false;
                    nextBtn.classList.remove('text-zinc-500', 'cursor-not-allowed');
                    nextBtn.classList.add('text-white', 'hover:bg-zinc-700');
                    label.textContent = `Historic Week`;
                }
            },

            showLoading(show) {
                document.getElementById('loading-state').style.display = show ? 'flex' : 'none';
                document.getElementById('content-container').style.display = show ? 'none' : 'block';
            },

            navigate(view) {
                this.state.currentView = view;
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('bg-zinc-900', 'text-white', 'font-semibold');
                    btn.classList.add('text-zinc-400');
                });
                const activeBtn = document.getElementById(`nav-${view}`);
                if (activeBtn) {
                    activeBtn.classList.remove('text-zinc-400');
                    activeBtn.classList.add('bg-zinc-900', 'text-white', 'font-semibold');
                }
                if (this.state.data.songs.length > 0 || this.state.data.albums.length > 0) this.renderCurrentView();
            },

            renderCurrentView() {
                const container = document.getElementById('content-container');
                container.innerHTML = '';
                if (this.state.currentView === 'dashboard') container.innerHTML = this.views.dashboard();
                if (this.state.currentView === 'songs') container.innerHTML = this.views.chartView('songs');
                if (this.state.currentView === 'albums') container.innerHTML = this.views.chartView('albums');
                
                container.classList.remove('fade-in');
                void container.offsetWidth;
                container.classList.add('fade-in');
                this.loadVisibleArtworks();
            },

            formatNumber: (num) => num ? num.toLocaleString('en-US') : '0',
            
            getMovementUI: (current, prev, isNew) => {
                if (isNew || !prev) return `<div class="flex items-center gap-1 text-blue-400 font-bold text-xs"><i class="ph-fill ph-star"></i> NEW</div>`;
                if (current < prev) return `<div class="flex items-center gap-1 text-green-500 font-bold text-xs"><i class="ph-bold ph-arrow-up"></i> ${prev - current}</div>`;
                if (current > prev) return `<div class="flex items-center gap-1 text-red-500 font-bold text-xs"><i class="ph-bold ph-arrow-down"></i> ${current - prev}</div>`;
                return `<div class="flex items-center gap-1 text-zinc-600 font-bold text-xs"><i class="ph-bold ph-minus"></i> 0</div>`;
            },

            async loadVisibleArtworks() {
                const images = document.querySelectorAll('.dynamic-artwork');
                for (let img of images) {
                    const artist = img.dataset.artist;
                    const album = img.dataset.album;
                    this.fetchLastFmImage(artist, album).then(url => {
                        if (url) {
                            img.src = url;
                            img.classList.remove('loading-pulse');
                        }
                    });
                }
            },

            async fetchLastFmImage(artist, album) {
                // Decode the deterministic ID slug for Last.fm searching
                const cleanArtist = artist.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                const cleanAlbum = album ? album.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase()) : null;
                const cacheKey = `${cleanArtist}|${cleanAlbum || 'null'}`;
                
                if (artworkCache.has(cacheKey)) return artworkCache.get(cacheKey);

                try {
                    const method = cleanAlbum && cleanAlbum !== "null" ? "album.getinfo" : "artist.getinfo";
                    let url = `https://ws.audioscrobbler.com/2.0/?method=${method}&api_key=${LASTFM_API_KEY}&artist=${encodeURIComponent(cleanArtist)}&format=json`;
                    if (cleanAlbum && cleanAlbum !== "null") url += `&album=${encodeURIComponent(cleanAlbum)}`;

                    const res = await fetch(url);
                    if (!res.ok) return null;
                    const data = await res.json();
                    
                    let imgUrl = null;
                    if (method === "album.getinfo" && data.album && data.album.image) {
                        imgUrl = data.album.image.find(img => img.size === 'extralarge')?.['#text'];
                    } else if (method === "artist.getinfo" && data.artist && data.artist.image) {
                        imgUrl = data.artist.image.find(img => img.size === 'extralarge')?.['#text'];
                    }

                    if (imgUrl) {
                        artworkCache.set(cacheKey, imgUrl);
                        return imgUrl;
                    }
                } catch (e) { console.error(e); }
                return null;
            },

            views: {
                dashboard: () => {
                    const topSong = app.state.data.songs[0] || {};
                    const topAlbum = app.state.data.albums[0] || {};
                    
                    return `
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-12">
                            <div class="bg-zinc-900 border border-zinc-800 p-6 flex flex-col sm:flex-row gap-6 rounded-lg shadow-2xl">
                                <img src="https://placehold.co/400x400/18181b/ffffff?text=1" data-artist="${topSong.artist || ''}" data-album="null" class="dynamic-artwork loading-pulse w-40 h-40 object-cover bg-black rounded" alt="Cover">
                                <div>
                                    <p class="text-xs uppercase tracking-widest text-zinc-400 font-bold mb-1"><i class="ph-fill ph-crown text-yellow-500"></i> #1 Song</p>
                                    <h3 class="text-3xl font-black text-white mb-1 line-clamp-2">${(topSong.title || 'N/A').replace(/-/g, ' ').toUpperCase()}</h3>
                                    <p class="text-lg text-zinc-300">${(topSong.artist || 'N/A').replace(/-/g, ' ').toUpperCase()}</p>
                                    <div class="mt-4 bg-black/50 p-3 rounded border border-zinc-800 inline-block">
                                        <p class="text-xs text-zinc-500 font-bold uppercase tracking-wider mb-1">Calculated Units</p>
                                        <p class="text-xl font-black text-white">${app.formatNumber(topSong.units_sold)}</p>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="bg-zinc-900 border border-zinc-800 p-6 flex flex-col sm:flex-row gap-6 rounded-lg shadow-2xl">
                                <img src="https://placehold.co/400x400/18181b/ffffff?text=1" data-artist="${topAlbum.artist || ''}" data-album="${topAlbum.album || ''}" class="dynamic-artwork loading-pulse w-40 h-40 object-cover bg-black rounded" alt="Cover">
                                <div>
                                    <p class="text-xs uppercase tracking-widest text-zinc-400 font-bold mb-1"><i class="ph-fill ph-vinyl-record text-zinc-300"></i> #1 Album</p>
                                    <h3 class="text-3xl font-black text-white mb-1 line-clamp-2">${(topAlbum.title || 'N/A').replace(/-/g, ' ').toUpperCase()}</h3>
                                    <p class="text-lg text-zinc-300">${(topAlbum.artist || 'N/A').replace(/-/g, ' ').toUpperCase()}</p>
                                    <div class="mt-4 bg-black/50 p-3 rounded border border-zinc-800 inline-block">
                                        <p class="text-xs text-zinc-500 font-bold uppercase tracking-wider mb-1">Calculated Units</p>
                                        <p class="text-xl font-black text-white">${app.formatNumber(topAlbum.units_sold)}</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <h3 class="text-xl font-bold mb-4 uppercase tracking-wider text-zinc-300 border-b border-zinc-800 pb-2">Hot 100 Preview</h3>
                            <div class="flex flex-col bg-zinc-900/50 rounded-lg border border-zinc-800 overflow-hidden">
                                ${app.state.data.songs.slice(0, 5).map(song => `
                                    <div class="flex items-center gap-4 py-3 px-4 border-b border-zinc-800/50 hover:bg-zinc-800 transition">
                                        <div class="w-8 text-center font-black text-2xl text-zinc-300">${song.rank}</div>
                                        <img src="https://placehold.co/100x100/18181b/ffffff?text=${song.rank}" data-artist="${song.artist}" data-album="null" class="dynamic-artwork w-12 h-12 object-cover bg-black rounded-sm shadow">
                                        <div class="flex-1 min-w-0">
                                            <div class="font-bold text-white truncate">${(song.title || '').replace(/-/g, ' ').toUpperCase()}</div>
                                            <div class="text-sm text-zinc-400 truncate">${(song.artist || '').replace(/-/g, ' ').toUpperCase()}</div>
                                        </div>
                                        <div class="text-right hidden sm:block">
                                            <div class="text-sm font-bold text-white">${app.formatNumber(song.units_sold)}</div>
                                            <div class="text-[10px] text-zinc-500 uppercase tracking-widest font-bold">Units</div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                },

                chartView: (type) => {
                    const data = app.state.data[type];
                    if (!data || data.length === 0) return `<div class="p-10 text-center text-zinc-500">No chart data available for this week.</div>`;
                    
                    const unitLabel = type === 'songs' ? 'Track Units' : 'Album Units';

                    let html = `
                        <div class="hidden lg:grid grid-cols-12 gap-4 px-4 py-3 border-b border-zinc-800 text-xs font-bold uppercase tracking-widest text-zinc-500 sticky top-[72px] bg-black/95 backdrop-blur z-20">
                            <div class="col-span-1 text-center">Rank</div>
                            <div class="col-span-4">Information</div>
                            <div class="col-span-2 text-right">Metrics</div>
                            <div class="col-span-2 text-right text-zinc-300">${unitLabel}</div>
                            <div class="col-span-3 text-right">Chart History</div>
                        </div>
                    `;

                    data.forEach(item => {
                        const albumAttr = type === 'albums' ? `data-album="${item.album}"` : `data-album="null"`;
                        html += `
                            <div class="group grid grid-cols-1 lg:grid-cols-12 gap-4 items-center px-4 py-4 border-b border-zinc-900 hover:bg-zinc-900/40">
                                <div class="col-span-1 flex flex-row lg:flex-col items-center justify-between lg:justify-center gap-1 sm:gap-2">
                                    <span class="text-3xl font-black text-white w-10 text-center">${item.rank}</span>
                                    ${app.getMovementUI(item.rank, item.previous_rank, item.is_new)}
                                </div>
                                
                                <div class="col-span-4 flex items-center gap-4">
                                    <img src="https://placehold.co/200x200/18181b/ffffff?text=${item.rank}" data-artist="${item.artist}" ${albumAttr} class="dynamic-artwork loading-pulse w-16 h-16 object-cover rounded-sm bg-zinc-800 shrink-0">
                                    <div class="min-w-0">
                                        <h4 class="text-lg font-bold text-white truncate">${(item.title || '').replace(/-/g, ' ').toUpperCase()}</h4>
                                        <p class="text-sm text-zinc-400 font-medium truncate">${(item.artist || '').replace(/-/g, ' ').toUpperCase()}</p>
                                    </div>
                                </div>

                                <div class="hidden md:block lg:col-span-2 text-right">
                                    <div class="text-sm font-semibold text-zinc-300">${app.formatNumber(item.plays)} <span class="text-xs text-zinc-600 font-normal">Plays</span></div>
                                    <div class="text-sm font-semibold text-zinc-300">${item.points} <span class="text-xs text-zinc-600 font-normal">Pts</span></div>
                                </div>

                                <div class="col-span-2 text-left lg:text-right mt-1 lg:mt-0 flex lg:block items-baseline gap-2">
                                    <span class="lg:hidden text-[10px] text-zinc-500 uppercase font-bold tracking-widest">Units:</span>
                                    <span class="text-xl font-black text-white">${app.formatNumber(item.units_sold)}</span>
                                </div>

                                <div class="col-span-3 flex items-center justify-start lg:justify-end gap-6 text-sm mt-1 lg:mt-0 pt-3 lg:pt-0">
                                    <div class="text-center">
                                        <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest mb-0.5">Peak</p>
                                        <p class="font-bold text-zinc-300">${item.peak}</p>
                                    </div>
                                    <div class="text-center">
                                        <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest mb-0.5">Wks On</p>
                                        <p class="font-bold text-zinc-300">${item.weeks_on_chart}</p>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    return html;
                }
            }
        };

        window.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
