<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stream Rankings — Spotify-Style</title>
  <style>
    :root{
      --bg:#000;
      --panel:#121212;
      --panel-2:#181818;
      --ink:#fff;
      --muted:#b3b3b3;
      --accent:#1db954;
      --accent-2:#16a34a;
      --red:#ff5a5a;
      --green:#3ee58b;
      --row:#0f0f0f;
      --hover:#1c1c1c;
      --chip:#232323;
      --outline:#262626;
      --gold:#ffd66b;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;background:var(--bg);color:var(--ink);
      font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
      overflow:hidden;
    }
    /* Layout */
    .app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:auto 64px;grid-template-areas:
      "side main" "player player";height:100%}
    aside{
      grid-area:side;background:linear-gradient(180deg,#0a0a0a 0%, #0d0d0d 100%);
      border-right:1px solid var(--outline);display:flex;flex-direction:column
    }
    .logo{display:flex;align-items:center;gap:10px;padding:18px 16px 8px;font-weight:800;letter-spacing:.3px}
    .logo .dot{width:22px;height:22px;border-radius:50%;background:var(--accent)}
    .nav{padding:10px}
    .nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:6px;border-radius:8px;color:#eaeaea;text-decoration:none;background:transparent}
    .nav a.active,.nav a:hover{background:var(--panel-2)}
    .lib{margin-top:10px;padding:10px;border-top:1px solid var(--outline)}
    .pins{max-height:32vh;overflow:auto;margin-top:8px}
    .pin{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:6px;background:var(--chip);margin-bottom:6px}
    .pin b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
    .pin button{background:transparent;border:none;color:var(--muted);cursor:pointer}
    /* Main */
    main{grid-area:main;display:flex;flex-direction:column;height:100%;overflow:hidden}
    header{
      padding:14px 18px;border-bottom:1px solid var(--outline);background:
        linear-gradient(180deg,rgba(29,185,84,.12),transparent 60%), var(--panel);
      display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center
    }
    .searchbar{display:flex;align-items:center;gap:10px;background:#0d0d0d;border:1px solid var(--outline);
      border-radius:999px;padding:10px 14px;max-width:680px}
    .searchbar input{flex:1;background:transparent;border:none;outline:none;color:var(--ink);font:inherit}
    .pills{display:flex;gap:8px;flex-wrap:wrap}
    .pill{padding:8px 14px;border-radius:999px;background:var(--chip);border:1px solid var(--outline);
      color:#eaeaea;cursor:pointer;user-select:none}
    .pill.active,.pill:hover{background:var(--accent);border-color:transparent;color:#071b0f}
    .toolbar{display:flex;gap:10px;align-items:center}
    .toolbar .btn{
      background:var(--chip);border:1px solid var(--outline);color:#eaeaea;border-radius:10px;
      padding:10px 12px;cursor:pointer
    }
    .toolbar .btn:hover{background:var(--hover)}
    .tog{display:flex;align-items:center;gap:8px;background:var(--chip);border:1px solid var(--outline);padding:8px 10px;border-radius:10px}
    .tog input{accent-color:var(--accent)}
    .select{background:var(--chip);border:1px solid var(--outline);color:#eaeaea;border-radius:10px;padding:9px 10px}
    /* Tabs row */
    .tabs{display:flex;gap:8px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--outline);background:var(--panel)}
    .seg{display:flex;gap:6px;background:var(--chip);border:1px solid var(--outline);padding:5px;border-radius:12px}
    .seg button{background:transparent;border:none;color:#eaeaea;padding:8px 14px;border-radius:8px;cursor:pointer}
    .seg button.active,.seg button:hover{background:var(--panel-2)}
    .subtabs{display:flex;gap:6px;margin-left:auto}
    .subtabs button{background:transparent;border:1px solid var(--outline);color:#eaeaea;padding:8px 12px;border-radius:8px;cursor:pointer}
    .subtabs button.active,.subtabs button:hover{background:var(--panel-2)}
    /* Content */
    .contentWrap{flex:1;overflow:auto;background:radial-gradient(1200px 400px at 20% -20%,rgba(29,185,84,.12),transparent), var(--bg)}
    .summary{padding:12px 18px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--outline)}
    .grid{padding:14px 18px}
    table{width:100%;border-collapse:separate;border-spacing:0 8px}
    thead th{
      position:sticky;top:0;background:rgba(12,12,12,.85);backdrop-filter:saturate(160%) blur(4px);
      text-transform:uppercase;font-size:.78rem;padding:10px;border-bottom:1px solid var(--outline);z-index:1
    }
    tbody tr{background:var(--row);transition:background .2s}
    tbody tr:hover{background:var(--hover)}
    td{padding:12px;border-top:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a}
    td:first-child{border-left:1px solid #1a1a1a;border-top-left-radius:12px;border-bottom-left-radius:12px;width:56px;text-align:center}
    td:last-child{border-right:1px solid #1a1a1a;border-top-right-radius:12px;border-bottom-right-radius:12px}
    .rank{font-weight:700;color:var(--gold)}
    .item{display:flex;gap:12px;align-items:center;min-width:260px}
    .avatar{width:40px;height:40px;border-radius:6px;background:linear-gradient(135deg,#1db954,#198c42);display:flex;align-items:center;justify-content:center;font-weight:800;color:#071b0f}
    .meta{min-width:0}
    .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
    .subtitle{color:var(--muted);font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .streams b{font-variant-numeric:tabular-nums}
    .change.up{color:var(--green);font-weight:700}
    .change.down{color:var(--red);font-weight:700}
    .spark{width:90px;height:26px}
    .act{display:flex;gap:8px;justify-content:flex-end}
    .iconbtn{background:transparent;border:1px solid var(--outline);border-radius:8px;color:#eaeaea;padding:6px 8px;cursor:pointer}
    .iconbtn:hover{background:var(--panel-2)}
    .muted{color:var(--muted)}
    a{color:#eaeaea;text-decoration:none}
    a:hover{text-decoration:underline}
    /* Player */
    .player{
      grid-area:player;background:var(--panel);border-top:1px solid var(--outline);display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:16px
    }
    .now{display:flex;align-items:center;gap:10px;min-width:0}
    .progress{flex:1;display:flex;align-items:center;gap:8px}
    .range{flex:1;height:6px;background:#0a0a0a;border-radius:999px;overflow:hidden}
    .range > i{display:block;height:100%;background:var(--accent);width:0%}
    .controls button{background:var(--chip);border:1px solid var(--outline);border-radius:999px;color:#eaeaea;padding:8px 10px;cursor:pointer}
    @media(max-width:920px){
      .app{grid-template-columns:0 1fr}
      aside{display:none}
      .subtabs{display:none}
      .item .subtitle{display:none}
    }
  </style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside>
    <div class="logo"><span class="dot"></span> Stream<span style="color:var(--accent)">Board</span></div>
    <nav class="nav">
      <a class="active" href="#"><span>🏠</span>Home</a>
      <a href="#" id="goTopArtists"><span>👤</span>Top Artists</a>
      <a href="#" id="goTopTracks"><span>🎵</span>Top Tracks</a>
      <a href="#" id="goTopAlbums"><span>💿</span>Top Albums</a>
    </nav>
    <div class="lib">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <b>Your Library</b>
        <button id="clearPins" class="iconbtn" title="Clear pins">🗑</button>
      </div>
      <div class="pins" id="pins"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main>
    <header>
      <div class="searchbar">
        <span>🔎</span>
        <input id="q" placeholder="Search artists, tracks, albums…" autocomplete="off"/>
      </div>
      <div class="toolbar">
        <label class="tog" title="Include featured tracks in artist totals">
          <input type="checkbox" id="includeFeatures" checked/>
          <span>Include features</span>
        </label>
        <label class="tog" title="Show exact stream counts">
          <input type="checkbox" id="exactUnits"/>
          <span>Exact numbers</span>
        </label>
        <select id="sortBy" class="select" title="Sort">
          <option value="streams">Sort: Streams</option>
          <option value="name">Sort: Name A–Z</option>
          <option value="change">Sort: Change</option>
        </select>
        <button class="btn" id="exportCsv">Export CSV</button>
        <button class="btn" id="copyLink">Copy Link</button>
      </div>
    </header>

    <div class="tabs">
      <div class="seg" id="rangeSeg">
        <button data-range="7days" class="active">7 Days</button>
        <button data-range="30days">30 Days</button>
        <button data-range="alltime">All Time</button>
      </div>
      <div class="subtabs" id="typeSeg">
        <button data-type="artist" class="active">Artist</button>
        <button data-type="tracks">Tracks</button>
        <button data-type="album">Album</button>
      </div>
    </div>

    <div class="summary" id="summary">Loading…</div>

    <div class="contentWrap">
      <div class="grid">
        <table>
          <thead>
          <tr>
            <th style="width:56px">#</th>
            <th>Item</th>
            <th id="col-artist">Artist</th>
            <th>Streams</th>
            <th>Change</th>
            <th>Trend</th>
            <th style="text-align:right">Actions</th>
          </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- PLAYER -->
  <div class="player">
    <div class="now" id="nowPlaying">
      <div class="avatar" style="width:36px;height:36px">♪</div>
      <div style="min-width:0">
        <div class="title" id="npTitle">Nothing playing</div>
        <div class="subtitle muted" id="npSub">Select a track to preview (uses preview_url if present)</div>
      </div>
    </div>
    <div class="progress">
      <span class="muted" id="npTime">0:00</span>
      <div class="range"><i id="npProg"></i></div>
      <span class="muted" id="npDur">0:15</span>
    </div>
    <div class="controls">
      <button id="npPlay">▶</button>
      <button id="npStop">⏹</button>
    </div>
    <audio id="audio" preload="none"></audio>
  </div>
</div>

<!-- DATA -->
<script src="weekdata.js"></script>

<!-- APP -->
<script>
(() => {
  // ---------- Guards ----------
  const warnNoData = () => {
    const tbody = document.getElementById('rows');
    tbody.innerHTML = '<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">No dataset found. Ensure <b>weekdata.js</b> loads before this file and defines <code>weekData</code>.</td></tr>';
  };
  if (!window.weekData || typeof window.weekData !== 'object') {
    window.weekData = {};
    console.warn('weekData not found — using empty dataset.');
  }

  // ---------- State ----------
  const state = {
    range: getQueryParam('tab') || '7days', // 7days | 30days | alltime
    type: getQueryParam('sub') || 'artist', // artist | tracks | album
    q: getQueryParam('search') || '',
    includeFeatures: getQueryParam('feat') !== '0',
    exactUnits: getQueryParam('exact') === '1',
    sortBy: getQueryParam('sort') || 'streams',
    rows: [],
    lastWeeks: [],
    prevWeeks: []
  };

  // ---------- Elements ----------
  const el = {
    rows: document.getElementById('rows'),
    summary: document.getElementById('summary'),
    rangeSeg: document.getElementById('rangeSeg'),
    typeSeg: document.getElementById('typeSeg'),
    q: document.getElementById('q'),
    includeFeatures: document.getElementById('includeFeatures'),
    exactUnits: document.getElementById('exactUnits'),
    sortBy: document.getElementById('sortBy'),
    exportCsv: document.getElementById('exportCsv'),
    copyLink: document.getElementById('copyLink'),
    pins: document.getElementById('pins'),
    clearPins: document.getElementById('clearPins'),
    colArtist: document.getElementById('col-artist'),
    // Player
    audio: document.getElementById('audio'),
    npTitle: document.getElementById('npTitle'),
    npSub: document.getElementById('npSub'),
    npProg: document.getElementById('npProg'),
    npTime: document.getElementById('npTime'),
    npDur: document.getElementById('npDur'),
    npPlay: document.getElementById('npPlay'),
    npStop: document.getElementById('npStop')
  };

  // ---------- Init Controls ----------
  // set controls from state
  el.q.value = state.q;
  el.includeFeatures.checked = state.includeFeatures;
  el.exactUnits.checked = state.exactUnits;
  el.sortBy.value = state.sortBy;

  // Seg active
  [...el.rangeSeg.querySelectorAll('button')].forEach(b=>{
    b.classList.toggle('active', b.dataset.range===state.range);
    b.addEventListener('click', ()=>{
      state.range = b.dataset.range;
      setActive(el.rangeSeg,b);
      refresh();
    });
  });
  [...el.typeSeg.querySelectorAll('button')].forEach(b=>{
    b.classList.toggle('active', b.dataset.type===state.type);
    b.addEventListener('click', ()=>{
      state.type = b.dataset.type;
      setActive(el.typeSeg,b);
      refresh();
    });
  });

  // Quick nav
  document.getElementById('goTopArtists').addEventListener('click', (e)=>{e.preventDefault();state.type='artist';setActiveByData(el.typeSeg,'type','artist');refresh();});
  document.getElementById('goTopTracks').addEventListener('click', (e)=>{e.preventDefault();state.type='tracks';setActiveByData(el.typeSeg,'type','tracks');refresh();});
  document.getElementById('goTopAlbums').addEventListener('click', (e)=>{e.preventDefault();state.type='album';setActiveByData(el.typeSeg,'type','album');refresh();});

  // Filters
  el.q.addEventListener('input', debounce(()=>{state.q = el.q.value.trim(); render();}, 160));
  el.includeFeatures.addEventListener('change', ()=>{state.includeFeatures = el.includeFeatures.checked; refresh();});
  el.exactUnits.addEventListener('change', ()=>{state.exactUnits = el.exactUnits.checked; render();});
  el.sortBy.addEventListener('change', ()=>{state.sortBy = el.sortBy.value; render();});

  // Export & Link
  el.exportCsv.addEventListener('click', ()=> exportCurrentCSV());
  el.copyLink.addEventListener('click', ()=> {
    const url = currentPermalink();
    navigator.clipboard.writeText(url).then(()=> toast('Link copied'));
  });

  // Pins
  el.clearPins.addEventListener('click', ()=>{ localStorage.removeItem('streamPins'); renderPins(); });

  // Player
  let playTimer = null;
  el.npPlay.addEventListener('click', ()=> el.audio.paused ? el.audio.play() : el.audio.pause());
  el.npStop.addEventListener('click', ()=> { el.audio.pause(); el.audio.currentTime=0; });
  el.audio.addEventListener('play', ()=> { el.npPlay.textContent = '⏸'; tick(); });
  el.audio.addEventListener('pause', ()=> { el.npPlay.textContent = '▶'; if(playTimer) cancelAnimationFrame(playTimer); });
  el.audio.addEventListener('timeupdate', syncProgress);
  el.audio.addEventListener('ended', ()=> { el.npPlay.textContent='▶'; syncProgress(); });

  function tick(){ syncProgress(); playTimer = requestAnimationFrame(tick); }
  function syncProgress(){
    const cur = el.audio.currentTime, dur = el.audio.duration || 15;
    el.npTime.textContent = fmtTime(cur);
    el.npDur.textContent = isFinite(dur)? fmtTime(dur): '0:15';
    el.npProg.style.width = (cur/dur*100)+'%';
  }

  // ---------- Core ----------
  function refresh(){
    // compute weeks ranges
    const allWeeks = Object.keys(weekData).map(Number).sort((a,b)=>b-a);
    const cur = state.range==='7days' ? allWeeks.slice(0,1)
              : state.range==='30days' ? allWeeks.slice(0,4)
              : allWeeks;
    const prev = state.range==='7days' ? allWeeks.slice(1,2)
              : state.range==='30days' ? allWeeks.slice(4,8)
              : [];
    state.lastWeeks = cur;
    state.prevWeeks = prev;

    state.rows = aggregate(state.type, cur, prev, state.includeFeatures);
    render();
  }

  function render(){
    // col visibility
    el.colArtist.style.display = state.type==='artist' ? 'none' : '';
    // filter
    const q = state.q.toLowerCase();
    let rows = !q ? state.rows : state.rows.filter(r=>{
      return (r.name && r.name.toLowerCase().includes(q)) ||
             (r.artist && r.artist.toLowerCase().includes(q));
    });

    // sort
    rows = rows.slice();
    if (state.sortBy==='name'){
      rows.sort((a,b)=> a.name.localeCompare(b.name));
    } else if (state.sortBy==='change'){
      rows.sort((a,b)=> (b.changeVal||0) - (a.changeVal||0));
    } else {
      rows.sort((a,b)=> (b.streamsRaw||0) - (a.streamsRaw||0));
    }

    // render table
    el.rows.innerHTML = rows.map((r,i)=> rowHtml(r, i)).join('') || '<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">No results</td></tr>';

    // draw sparklines
    rows.forEach((r,idx)=>{
      const c = document.getElementById('spk-'+idx);
      if (c && r.series && r.series.length){ drawSpark(c, r.series); }
    });

    // row actions wiring
    rows.forEach((r,idx)=>{
      const pinBtn = document.getElementById('pin-'+idx);
      pinBtn && pinBtn.addEventListener('click', ()=> { addPin(r); });

      const playBtn = document.getElementById('play-'+idx);
      playBtn && playBtn.addEventListener('click', ()=> startPreview(r));
    });

    // summary + URL
    updateSummary(rows);
    history.replaceState({}, '', currentPermalink());
    renderPins();
  }

  function rowHtml(r, i){
    const rank = (i+1);
    const initials = getInitials(state.type==='artist'? r.name : (r.artist||r.name));
    const itemLink = linkify(r.name, r.artist || r.name, mapType(state.type));
    const artistLink = state.type==='artist' ? '' : `<div class="subtitle">${linkify(r.artist, r.artist, 'artist')}</div>`;
    const streamsTxt = state.exactUnits ? numberWithCommas(r.streamsRaw) : formatStreams(r.streamsRaw);
    const changeClass = r.changeVal>0 ? 'up' : (r.changeVal<0 ? 'down' : '');
    const playTip = r.preview ? 'Play preview' : 'No preview_url on data';
    return `
    <tr>
      <td class="rank">${rank}</td>
      <td>
        <div class="item">
          <div class="avatar">${initials}</div>
          <div class="meta">
            <div class="title">${itemLink}</div>
            ${artistLink}
          </div>
        </div>
      </td>
      <td style="${state.type==='artist'?'display:none':''}">${linkify(r.artist, r.artist, 'artist')}</td>
      <td class="streams"><b>${streamsTxt}</b></td>
      <td class="change ${changeClass}">${formatChangeLabel(r.changeVal)}</td>
      <td><canvas id="spk-${i}" class="spark" width="90" height="26"></canvas></td>
      <td class="act">
        <button id="play-${i}" class="iconbtn" title="${playTip}">▶</button>
        <button id="pin-${i}" class="iconbtn" title="Pin to library">📌</button>
      </td>
    </tr>`;
  }

  // ---------- Aggregation ----------
  function aggregate(type, curWeeks, prevWeeks, includeFeatures){
    const prevMap = seriesMap(type, prevWeeks, includeFeatures);
    const curMap  = seriesMap(type, curWeeks, includeFeatures);

    // build list
    const list = Object.keys(curMap).map(k=>{
      const item = curMap[k];
      const prevVal = (prevMap[k]?.total) || 0;
      const change = pctChange(item.total, prevVal);

      return {
        key:k,
        name:item.name,
        artist:item.artist,
        streamsRaw:item.total,
        changeVal:change,
        series:item.series, // per-week series for sparklines
        preview:item.preview_url||null
      };
    });

    // Top 200 before filters/sorts
    list.sort((a,b)=>b.streamsRaw-a.streamsRaw);
    return list.slice(0,200);
  }

  function seriesMap(type, weeks, includeFeatures){
    const map = {};
    weeks.forEach(week=>{
      const entries = (weekData[week]||[]);
      entries.forEach(e=>{
        const streams = safeNum(e.streams);
        if (!streams) return;

        let key, name, artist, preview=null;

        if (type==='artist'){
          name = (e.artist||'Unknown').trim();
          if (!includeFeatures && isFeaturingTitle(e.title||'')) return;
          key = 'ART::'+name;
          artist = name;
          preview = e.preview_url || null;
        } else if (type==='tracks'){
          const title = (e.title||'Unknown').trim();
          artist = (e.artist||'Unknown').trim();
          name = title;
          key = 'TRK::'+title+'|||'+artist;
          preview = e.preview_url || null;
        } else { // album
          const album = (e.album||'Unknown').trim();
          artist = (e.artist||'Unknown').trim();
          name = album;
          key = 'ALB::'+album+'|||'+artist;
          preview = e.preview_url || null;
        }

        if (!map[key]) map[key] = { name, artist, total:0, series:[], preview_url: preview };
        map[key].total += streams;
      });
    });

    // fill series per key across each requested week (for sparkline)
    const seriesWeeks = weeks.slice().reverse(); // oldest -> newest
    Object.keys(map).forEach(k=>{
      const s = [];
      seriesWeeks.forEach(week=>{
        const sum = (weekData[week]||[]).reduce((acc,e)=>{
          const streams = safeNum(e.streams);
          if (!streams) return acc;
          if (matchKey(k, e)) {
            if (k.startsWith('ART::') && (!state.includeFeatures && isFeaturingTitle(e.title||''))) {
              return acc; // respect current toggle during series too
            }
            return acc + streams;
          }
          return acc;
        },0);
        s.push(sum);
      });
      map[k].series = s;
    });
    return map;
  }

  function matchKey(key, e){
    if (key.startsWith('ART::')){
      const name = key.slice(5);
      return (e.artist||'').trim() === name;
    }
    if (key.startsWith('TRK::')){
      const [title, artist] = key.slice(5).split('|||');
      return ((e.title||'').trim()===title) && ((e.artist||'').trim()===artist);
    }
    if (key.startsWith('ALB::')){
      const [album, artist] = key.slice(5).split('|||');
      return ((e.album||'').trim()===album) && ((e.artist||'').trim()===artist);
    }
    return false;
  }

  // ---------- UI helpers ----------
  function updateSummary(rows){
    const total = rows.reduce((a,r)=>a+(r.streamsRaw||0),0);
    const weeks = state.lastWeeks.length;
    const label = state.range==='7days'?'7 Days': state.range==='30days'?'30 Days':'All Time';
    const typeLabel = state.type==='artist'?'Artists': state.type==='tracks'?'Tracks':'Albums';
    el.summary.innerHTML = `
      <div><b>${typeLabel}</b> • <span class="muted">${label}</span></div>
      <div><span class="muted">Items:</span> ${rows.length}</div>
      <div><span class="muted">Total Streams:</span> <b>${ state.exactUnits ? numberWithCommas(total) : formatStreams(total) }</b></div>
      <div><span class="muted">Weeks spanned:</span> ${weeks}</div>
      <div class="muted">Tip: click 📌 to pin; ▶ to preview (if your data has preview_url)</div>
    `;
  }

  function getInitials(name){
    const parts = (name||'').split(/\s+/).slice(0,2);
    return parts.map(p=>p[0]||'').join('').toUpperCase() || '•';
  }

  function linkify(name, artist, type){
    const en = encodeURIComponent(name||'');
    const ea = encodeURIComponent(artist||'');
    if (type==='artist') return `<a href="Artist_stream.html?name=${en}">${escapeHtml(name)}</a>`;
    if (type==='track')  return `<a href="track_detail.html?title=${en}&artist=${ea}">${escapeHtml(name)}</a>`;
    return `<a href="album_detail.html?album=${en}&artist=${ea}">${escapeHtml(name)}</a>`;
  }

  function mapType(t){ return t==='tracks'?'track': t; }

  // ---------- Export / Link ----------
  function exportCurrentCSV(){
    const headers = state.type==='artist' ? ['Rank','Artist','Streams','Change%']
                  : state.type==='tracks' ? ['Rank','Title','Artist','Streams','Change%']
                  : ['Rank','Album','Artist','Streams','Change%'];
    const rows = [...document.querySelectorAll('#rows tr')].map((tr,i)=>{
      const cells = [...tr.children].map(td=>td.innerText.trim());
      if (state.type==='artist'){
        return [i+1, cells[1], cells[3], cells[4]];
      } else {
        return [i+1, cells[1], cells[2], cells[4], cells[5]];
      }
    });
    const csv = toCSV([headers, ...rows]);
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `stream_rankings_${state.range}_${state.type}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function currentPermalink(){
    const url = new URL(window.location.href);
    url.searchParams.set('tab', state.range);
    url.searchParams.set('sub', state.type);
    if (state.q) url.searchParams.set('search', state.q); else url.searchParams.delete('search');
    url.searchParams.set('feat', state.includeFeatures ? '1':'0');
    url.searchParams.set('exact', state.exactUnits ? '1':'0');
    url.searchParams.set('sort', state.sortBy);
    return url.toString();
  }

  // ---------- Pins ----------
  function addPin(r){
    const pins = getPins();
    const id = `${state.type}:${r.key}`;
    if (!pins.find(p=>p.id===id)){
      pins.push({ id, name:r.name, artist:r.artist||'', type:state.type });
      savePins(pins);
      renderPins();
      toast('Pinned to library');
    } else {
      toast('Already pinned');
    }
  }
  function renderPins(){
    const pins = getPins();
    el.pins.innerHTML = pins.length? pins.map(p=>`
      <div class="pin">
        <b title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</b>
        <div>
          <button title="Open" onclick="location.href='${pinLink(p)}'">↗</button>
          <button title="Unpin" onclick="(${unpin})(\'${p.id}\')">✖</button>
        </div>
      </div>
    `).join('') : `<div class="muted" style="padding:8px">No pins yet</div>`;
  }
  function pinLink(p){
    const n = encodeURIComponent(p.name);
    const a = encodeURIComponent(p.artist||p.name);
    if (p.type==='artist') return `Artist_stream.html?name=${n}`;
    if (p.type==='tracks') return `track_detail.html?title=${n}&artist=${a}`;
    return `album_detail.html?album=${n}&artist=${a}`;
  }
  function unpin(id){
    const pins = getPins().filter(p=>p.id!==id);
    localStorage.setItem('streamPins', JSON.stringify(pins));
    document.querySelector('#pins').innerHTML = pins.length? pins.map(p=>`
      <div class="pin">
        <b title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</b>
        <div>
          <button title="Open" onclick="location.href='${pinLink(p)}'">↗</button>
          <button title="Unpin" onclick="(${unpin})(\'${p.id}\')">✖</button>
        </div>
      </div>`).join('') : `<div class="muted" style="padding:8px">No pins yet</div>`;
  }
  window.unpin = unpin; // expose for inline handler
  function getPins(){ try{return JSON.parse(localStorage.getItem('streamPins')||'[]')}catch{return[]} }
  function savePins(p){ localStorage.setItem('streamPins', JSON.stringify(p)); }

  // ---------- Mini Player ----------
  function startPreview(row){
    if (!row.preview){ toast('No preview_url in data for this item'); return; }
    el.audio.src = row.preview;
    el.npTitle.textContent = row.name || 'Unknown';
    el.npSub.textContent = row.artist || (state.type==='artist' ? 'Artist' : 'Unknown');
    el.audio.play().catch(()=> toast('Could not start audio (cross-origin or blocked).'));
  }

  // ---------- Utils ----------
  function getQueryParam(k){ return new URLSearchParams(location.search).get(k) || '' }
  function setActive(group, btn){ group.querySelectorAll('button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
  function setActiveByData(group, data, val){ group.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset[data]===val)); }
  function safeNum(v){ const n = Number(v); return isFinite(n)? n : 0; }
  function numberWithCommas(x){ return (x||0).toLocaleString('en-US'); }
  function formatStreams(v){
    const abs = Math.abs(v);
    if (abs>=1_000_000_000) return (v/1_000_000_000).toFixed(2)+'B';
    return (v/1_000_000).toFixed(2)+'M';
  }
  function pctChange(now, prev){ if (!prev) return 0; let d=((now-prev)/prev)*100; if(d>100)d=100; if(d<-100)d=-100; return d; }
  function formatChangeLabel(v){
    if (!v) return '<span class="muted">—</span>';
    const s = Math.abs(v).toFixed(1)+'%';
    return v>0? `<span class="change up">▲ ${s}</span>` : `<span class="change down">▼ ${s}</span>`;
  }
  function isFeaturingTitle(title){
    return /\b(feat\.|ft\.| x |,| & )/i.test(title);
  }
  function toCSV(rows){
    return rows.map(r=> r.map(cell => {
      const c = (''+cell).replace(/"/g,'""');
      return `"${c}"`;
    }).join(',')).join('\n');
  }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }
  function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
  function toast(msg){
    const d=document.createElement('div');
    d.textContent=msg; d.style.cssText='position:fixed;bottom:78px;right:16px;background:#111;border:1px solid #2a2a2a;border-radius:10px;padding:10px 12px;color:#eaeaea;z-index:9999';
    document.body.appendChild(d); setTimeout(()=>d.remove(),1600);
  }
  function fmtTime(sec){
    sec = Math.floor(sec||0); const m = Math.floor(sec/60), s = sec%60; return `${m}:${s.toString().padStart(2,'0')}`;
  }

  // Simple sparkline
  function drawSpark(canvas, series){
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0,0,w,h);
    if (!series.length) return;
    const max = Math.max(...series), min = Math.min(...series);
    const pad = 2, dx = (w- pad*2)/Math.max(1,(series.length-1));
    ctx.beginPath();
    series.forEach((v,i)=>{
      const x = pad + i*dx;
      const y = h - pad - (max===min ? h/2 : ((v-min)/(max-min))*(h-pad*2));
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.lineWidth = 2; ctx.strokeStyle = '#1db954'; ctx.stroke();
  }

  // ---------- Kickoff ----------
  if (Object.keys(weekData).length===0){ warnNoData(); }
  refresh();

})(); // IIFE End
</script>
</body>
