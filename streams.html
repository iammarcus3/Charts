<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charts — Clean Minimal</title>
<style>
  :root{
    --bg:#f9f9f9;
    --panel:#fff;
    --text:#111;
    --muted:#555;
    --accent:#0071e3;
    --row:#fff;
    --hover:#f0f0f0;
    --outline:#ddd;
    --gold:#f5a623;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  a{text-decoration:none;color:inherit;}
  a:hover{text-decoration:underline;}

  .app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  header{padding:16px 24px;background:var(--panel);border-bottom:1px solid var(--outline);}
  .searchbar{max-width:400px;display:flex;align-items:center;gap:8px;background:#eee;border-radius:12px;padding:6px 12px;}
  .searchbar input{flex:1;border:none;background:transparent;outline:none;font-size:0.95rem;color:var(--text);}

  .tabs{display:flex;gap:16px;margin:16px 24px;}
  .tabs button{padding:8px 16px;border:none;border-radius:8px;background:var(--row);cursor:pointer;font-weight:600;color:var(--text);}
  .tabs button.active{background:var(--accent);color:#fff;}

  .contentWrap{flex:1;overflow:auto;padding:0 24px 24px;}
  table{width:100%;border-collapse:collapse;margin-top:12px;}
  thead th{position:sticky;top:0;background:var(--panel);padding:12px;text-align:left;border-bottom:1px solid var(--outline);font-weight:700;font-size:0.9rem;}
  tbody tr{background:var(--row);}
  tbody tr:hover{background:var(--hover);}
  td{padding:12px;border-top:1px solid #eee;font-size:0.9rem;}
  td:first-child{width:40px;text-align:center;font-weight:700;color:var(--gold);}
  td:last-child{text-align:right;}
  .subtitle{color:var(--muted);font-size:0.85rem;}
  .summary{margin-top:8px;color:var(--muted);}
  .btn{padding:4px 8px;border:none;background:var(--accent);color:#fff;border-radius:6px;cursor:pointer;font-size:0.8rem;}
</style>
</head>
<body>

<div class="app">
  <!-- Header / Search -->
  <header>
    <div class="searchbar">
      🔎 <input id="q" placeholder="Search artists, tracks, albums…" autocomplete="off"/>
    </div>
  </header>

  <!-- Tabs -->
  <div class="tabs" id="rangeTabs">
    <button data-range="1" class="active">Week 1</button>
    <button data-range="2">Week 2</button>
    <button data-range="3">Week 3</button>
  </div>

  <div class="tabs" id="typeTabs">
    <button data-type="artist" class="active">Artist</button>
    <button data-type="tracks">Tracks</button>
    <button data-type="album">Album</button>
  </div>

  <!-- Content -->
  <div class="contentWrap">
    <div class="summary" id="summary">Loading…</div>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Title</th>
          <th>Artist</th>
          <th>Streams</th>
          <th>Movement</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<!-- WeekData first -->
<script src="weekdata.js"></script>

<script>
  function renderWeekData() {
    const rows = document.getElementById('rows');
    const summary = document.getElementById('summary');

    if (!window.weekData) {
      rows.innerHTML = '<tr><td colspan="6">No data loaded</td></tr>';
      return;
    }

    const range = window.currentRange || '1';
    const type = window.currentType || 'artist';

    const data = weekData[range] || [];
    rows.innerHTML = '';

    data.forEach(item => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${item.rank}</td>
        <td>
          ${item.title}
          <div class="subtitle">${item.album || ''}</div>
        </td>
        <td>${item.artist}</td>
        <td>${item.streams.toLocaleString()}</td>
        <td>${item.movement}</td>
        <td><button class="btn">Pin</button></td>
      `;
      rows.appendChild(tr);
    });

    summary.textContent = `Showing ${data.length} entries for Week ${range} (${type})`;
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderWeekData();

    document.querySelectorAll('#rangeTabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        window.currentRange = btn.dataset.range;
        document.querySelector('#rangeTabs button.active')?.classList.remove('active');
        btn.classList.add('active');
        renderWeekData();
      });
    });

    document.querySelectorAll('#typeTabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        window.currentType = btn.dataset.type;
        document.querySelector('#typeTabs button.active')?.classList.remove('active');
        btn.classList.add('active');
        renderWeekData();
      });
    });
  });
</script>

</body>
</html>
