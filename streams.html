<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weekly Data – Minimal View</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f7f9;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .controls {
      margin-bottom: 15px;
    }

    select {
      padding: 6px 10px;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #e0e0e0;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #fafafa;
      font-weight: bold;
    }

    tr:hover {
      background: #f2f4f7;
    }

    .summary {
      margin: 10px 0 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>Weekly Streams</h1>

  <div class="controls">
    <label>
      View:
      <select id="viewSelect">
        <option value="artist">Artist</option>
        <option value="track">Track</option>
      </select>
    </label>
  </div>

  <div class="summary" id="summary"></div>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Total Streams</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    // -----------------------------
    // SAFETY CHECK
    // -----------------------------
    if (typeof weekData === "undefined") {
      document.getElementById("summary").textContent =
        "No data found. weekData is not defined.";
      throw new Error("weekData is not defined");
    }

    // -----------------------------
    // AGGREGATION
    // -----------------------------
    function aggregate(data, keyField, valueField) {
      const map = new Map();

      data.forEach(row => {
        const key = row[keyField] || "Unknown";
        const value = Number(row[valueField]) || 0;
        map.set(key, (map.get(key) || 0) + value);
      });

      return Array.from(map.entries())
        .map(([name, total]) => ({ name, total }))
        .sort((a, b) => b.total - a.total);
    }

    // -----------------------------
    // RENDER
    // -----------------------------
    function render(view) {
      const tbody = document.getElementById("tableBody");
      const summary = document.getElementById("summary");
      tbody.innerHTML = "";

      const keyField =
        view === "artist" ? "artist_name" : "track_name";

      const rows = aggregate(weekData, keyField, "total_streams");

      let grandTotal = 0;

      rows.forEach(row => {
        grandTotal += row.total;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.name}</td>
          <td>${row.total.toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
      });

      summary.textContent =
        `Rows: ${rows.length} | Total Streams: ${grandTotal.toLocaleString()}`;
    }

    // -----------------------------
    // EVENTS
    // -----------------------------
    document
      .getElementById("viewSelect")
      .addEventListener("change", e => {
        render(e.target.value);
      });

    // -----------------------------
    // INIT
    // -----------------------------
    render("artist");
  </script>

</body>
</html>
