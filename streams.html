<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StreamBoard — Lightweight</title>
  <style>
    /* ===== Design goals =====
       - No backdrop-filter / heavy gradients
       - Fewer shadows/borders
       - Smaller DOM + event delegation
       - Optional pagination (50 per page)
       - Lazy sparkline drawing when rows enter the viewport
       - CSS containment where useful
    */

    :root{
      --bg:#000;
      --panel:#111;
      --panel-2:#151515;
      --ink:#fff;
      --muted:#a9a9a9;
      --accent:#1db954;
      --red:#ff5a5a;
      --green:#3ee58b;
      --row:#0e0e0e;
      --hover:#1a1a1a;
      --chip:#1a1a1a;
      --outline:#202020;
      --gold:#ffd66b;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;background:var(--bg);color:var(--ink);
      font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
      overflow:hidden;
    }

    /* Layout */
    .app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:auto 56px;grid-template-areas:
      "side main" "player player";height:100%}
    aside{grid-area:side;background:var(--panel);border-right:1px solid var(--outline);display:flex;flex-direction:column}
    .logo{padding:14px 12px;font-weight:800}
    .nav{padding:8px 8px}
    .nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;margin-bottom:6px;border-radius:8px;color:#eaeaea;text-decoration:none}
    .nav a.active,.nav a:hover{background:var(--panel-2)}
    .lib{margin-top:auto;padding:8px;border-top:1px solid var(--outline)}
    .pins{max-height:32vh;overflow:auto}
    .pin{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:6px;background:var(--chip);margin-bottom:6px}
    .pin b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
    .iconbtn{background:transparent;border:1px solid var(--outline);border-radius:8px;color:#eaeaea;padding:6px 8px;cursor:pointer}
    .iconbtn:hover{background:var(--panel-2)}

    /* Main */
    main{grid-area:main;display:flex;flex-direction:column;height:100%;overflow:hidden}
    header{
      padding:10px 12px;border-bottom:1px solid var(--outline);background:var(--panel);
      display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center
    }
    .searchbar{display:flex;align-items:center;gap:8px;background:#0d0d0d;border:1px solid var(--outline);
      border-radius:10px;padding:8px 12px;max-width:560px}
    .searchbar input{flex:1;background:transparent;border:none;outline:none;color:var(--ink);font:inherit}
    .toolbar{display:flex;gap:8px;align-items:center}
    .btn{background:var(--chip);border:1px solid var(--outline);color:#eaeaea;border-radius:8px;padding:8px 10px;cursor:pointer}
    .btn:hover{background:var(--hover)}
    .tog{display:flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--outline);padding:6px 8px;border-radius:8px}
    .tog input{accent-color:var(--accent)}
    .select{background:var(--chip);border:1px solid var(--outline);color:#eaeaea;border-radius:8px;padding:7px 8px}

    .tabs{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--outline);background:var(--panel)}
    .seg{display:flex;gap:6px;background:var(--chip);border:1px solid var(--outline);padding:4px;border-radius:10px}
    .seg button{background:transparent;border:none;color:#eaeaea;padding:6px 10px;border-radius:6px;cursor:pointer}
    .seg button.active,.seg button:hover{background:var(--panel-2)}
    .subtabs{display:flex;gap:6px;margin-left:auto}
    .subtabs button{background:transparent;border:1px solid var(--outline);color:#eaeaea;padding:6px 8px;border-radius:6px;cursor:pointer}
    .subtabs button.active,.subtabs button:hover{background:var(--panel-2)}

    .contentWrap{flex:1;overflow:auto;background:var(--bg)}
    .summary{padding:10px 12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--outline)}

    .grid{padding:10px 12px}
    table{width:100%;border-collapse:separate;border-spacing:0 6px}
    thead th{
      position:sticky;top:0;background:#0d0d0d;
      text-transform:uppercase;font-size:.78rem;padding:8px;border-bottom:1px solid var(--outline);z-index:1
    }
    tbody{contain:content} /* Helps huge lists */
    tbody tr{background:var(--row)}
    tbody tr:hover{background:var(--hover)}
    td{padding:10px;border-top:1px solid #151515;border-bottom:1px solid #151515}
    td:first-child{border-left:1px solid #151515;border-top-left-radius:10px;border-bottom-left-radius:10px;width:48px;text-align:center}
    td:last-child{border-right:1px solid #151515;border-top-right-radius:10px;border-bottom-right-radius:10px}
    .rank{font-weight:700;color:var(--gold)}
    .item{display:flex;gap:10px;align-items:center;min-width:240px}
    .avatar{width:36px;height:36px;border-radius:6px;background:#0d0d0d;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent)}
    .meta{min-width:0}
    .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
    .subtitle{color:var(--muted);font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .streams b{font-variant-numeric:tabular-nums}
    .change.up{color:var(--green);font-weight:700}
    .change.down{color:var(--red);font-weight:700}
    .spark{width:80px;height:24px}
    .act{display:flex;gap:6px;justify-content:flex-end}
    .muted{color:var(--muted)}
    a{color:#eaeaea;text-decoration:none}
    a:hover{text-decoration:underline}

    /* Player */
    .player{grid-area:player;background:var(--panel);border-top:1px solid var(--outline);display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:12px}
    .now{display:flex;align-items:center;gap:8px;min-width:0}
    .progress{flex:1;display:flex;align-items:center;gap:8px}
    .range{flex:1;height:6px;background:#0a0a0a;border-radius:999px;overflow:hidden}
    .range>i{display:block;height:100%;background:var(--accent);width:0%}
    .controls button{background:var(--chip);border:1px solid var(--outline);border-radius:999px;color:#eaeaea;padding:6px 8px;cursor:pointer}

    /* Responsive */
    @media(max-width:920px){
      .app{grid-template-columns:0 1fr}
      aside{display:none}
      .subtabs{display:none}
      .item .subtitle{display:none}
    }
  </style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside>
    <div class="logo">Stream<span style="color:var(--accent)">Board</span></div>
    <nav class="nav">
      <a class="active" href="#"><span>🏠</span>Home</a>
      <a href="#" id="goTopArtists"><span>👤</span>Top Artists</a>
      <a href="#" id="goTopTracks"><span>🎵</span>Top Tracks</a>
      <a href="#" id="goTopAlbums"><span>💿</span>Top Albums</a>
    </nav>
    <div class="lib">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <b>Your Library</b>
        <button id="clearPins" class="iconbtn" title="Clear pins">🗑</button>
      </div>
      <div class="pins" id="pins"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main>
    <header>
      <div class="searchbar">
        <span>🔎</span>
        <input id="q" placeholder="Search artists, tracks, albums…" autocomplete="off"/>
      </div>
      <div class="toolbar">
        <label class="tog" title="Include featured tracks in artist totals">
          <input type="checkbox" id="includeFeatures" checked/>
          <span>Features</span>
        </label>
        <label class="tog" title="Show exact stream counts">
          <input type="checkbox" id="exactUnits"/>
          <span>Exact</span>
        </label>
        <select id="sortBy" class="select" title="Sort">
          <option value="streams">Streams</option>
          <option value="name">Name A–Z</option>
          <option value="change">Change</option>
        </select>
        <button class="btn" id="exportCsv">Export CSV</button>
        <button class="btn" id="copyLink">Copy Link</button>
      </div>
    </header>

    <div class="tabs">
      <div class="seg" id="rangeSeg">
        <button data-range="7days" class="active">7 Days</button>
        <button data-range="30days">30 Days</button>
        <button data-range="alltime">All Time</button>
      </div>
      <div class="subtabs" id="typeSeg">
        <button data-type="artist" class="active">Artist</button>
        <button data-type="tracks">Tracks</button>
        <button data-type="album">Album</button>
      </div>
    </div>

    <div class="summary" id="summary">Loading…</div>

    <div class="contentWrap">
      <div class="grid">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div class="muted">Rows per page: <select id="pageSize" class="select"><option>50</option><option>100</option><option>200</option></select></div>
          <div id="pager" class="muted"></div>
        </div>
        <table>
          <thead>
          <tr>
            <th style="width:48px">#</th>
            <th>Item</th>
            <th id="col-artist">Artist</th>
            <th>Streams</th>
            <th>Change</th>
            <th>Trend</th>
            <th style="text-align:right">Actions</th>
          </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- PLAYER -->
  <div class="player">
    <div class="now" id="nowPlaying">
      <div class="avatar" style="width:32px;height:32px">♪</div>
      <div style="min-width:0">
        <div class="title" id="npTitle">Nothing playing</div>
        <div class="subtitle muted" id="npSub">Select a track to preview</div>
      </div>
    </div>
    <div class="progress">
      <span class="muted" id="npTime">0:00</span>
      <div class="range"><i id="npProg"></i></div>
      <span class="muted" id="npDur">0:15</span>
    </div>
    <div class="controls">
      <button id="npPlay">▶</button>
      <button id="npStop">⏹</button>
    </div>
    <audio id="audio" preload="none"></audio>
  </div>
</div>

<!-- DATA -->
<script src="weekdata.js"></script>

<!-- APP (performance-focused) -->
<script>
(() => {
  // ===== Guards =====
  const warnNoData = () => {
    const tbody = document.getElementById('rows');
    tbody.innerHTML = '<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">No dataset found. Ensure <b>weekdata.js</b> loads and defines <code>weekData</code>.</td></tr>';
  };
  if (!window.weekData || typeof window.weekData !== 'object') {
    window.weekData = {};
    console.warn('weekData not found — using empty dataset.');
  }

  // ===== State =====
  const state = {
    range: getQP('tab') || '7days',
    type: getQP('sub') || 'artist',
    q: getQP('search') || '',
    includeFeatures: getQP('feat') !== '0',
    exactUnits: getQP('exact') === '1',
    sortBy: getQP('sort') || 'streams',
    page: +(getQP('page')||1),
    pageSize: +(getQP('ps')||50),
    rows: [], lastWeeks: [], prevWeeks: []
  };

  // ===== Elements =====
  const el = {
    rows: byId('rows'), summary: byId('summary'), rangeSeg: byId('rangeSeg'), typeSeg: byId('typeSeg'),
    q: byId('q'), includeFeatures: byId('includeFeatures'), exactUnits: byId('exactUnits'), sortBy: byId('sortBy'),
    exportCsv: byId('exportCsv'), copyLink: byId('copyLink'), pins: byId('pins'), clearPins: byId('clearPins'), colArtist: byId('col-artist'),
    pageSize: byId('pageSize'), pager: byId('pager'),
    // Player
    audio: byId('audio'), npTitle: byId('npTitle'), npSub: byId('npSub'), npProg: byId('npProg'), npTime: byId('npTime'), npDur: byId('npDur'), npPlay: byId('npPlay'), npStop: byId('npStop')
  };

  // ===== Init controls =====
  el.q.value = state.q; el.includeFeatures.checked = state.includeFeatures; el.exactUnits.checked = state.exactUnits; el.sortBy.value = state.sortBy; el.pageSize.value = state.pageSize;

  // set active buttons
  [...el.rangeSeg.querySelectorAll('button')].forEach(b=>{ b.classList.toggle('active', b.dataset.range===state.range); b.addEventListener('click', ()=>{ state.range=b.dataset.range; setActive(el.rangeSeg,b); refresh(); }); });
  [...el.typeSeg.querySelectorAll('button')].forEach(b=>{ b.classList.toggle('active', b.dataset.type===state.type); b.addEventListener('click', ()=>{ state.type=b.dataset.type; setActive(el.typeSeg,b); refresh(); }); });

  // quick nav
  on('#goTopArtists','click', e=>{e.preventDefault(); state.type='artist'; setActiveByData(el.typeSeg,'type','artist'); refresh();});
  on('#goTopTracks','click', e=>{e.preventDefault(); state.type='tracks'; setActiveByData(el.typeSeg,'type','tracks'); refresh();});
  on('#goTopAlbums','click', e=>{e.preventDefault(); state.type='album'; setActiveByData(el.typeSeg,'type','album'); refresh();});

  // filters
  el.q.addEventListener('input', debounce(()=>{ state.q = el.q.value.trim(); state.page=1; render(); }, 120));
  el.includeFeatures.addEventListener('change', ()=>{ state.includeFeatures = el.includeFeatures.checked; state.page=1; refresh(); });
  el.exactUnits.addEventListener('change', ()=>{ state.exactUnits = el.exactUnits.checked; render(); });
  el.sortBy.addEventListener('change', ()=>{ state.sortBy = el.sortBy.value; render(); });
  el.pageSize.addEventListener('change', ()=>{ state.pageSize = +el.pageSize.value; state.page=1; render(); });

  // export & link (debounced permalink to reduce history churn)
  el.exportCsv.addEventListener('click', exportCurrentCSV);
  el.copyLink.addEventListener('click', ()=> { const url = currentPermalink(); navigator.clipboard.writeText(url).then(()=> toast('Link copied')); });

  // Pins
  el.clearPins.addEventListener('click', ()=>{ localStorage.removeItem('streamPins'); renderPins(); });

  // Player
  let playTimer = null;
  el.npPlay.addEventListener('click', ()=> el.audio.paused ? el.audio.play() : el.audio.pause());
  el.npStop.addEventListener('click', ()=> { el.audio.pause(); el.audio.currentTime=0; });
  el.audio.addEventListener('play', ()=> { el.npPlay.textContent = '⏸'; tick(); });
  el.audio.addEventListener('pause', ()=> { el.npPlay.textContent = '▶'; if(playTimer) cancelAnimationFrame(playTimer); });
  el.audio.addEventListener('timeupdate', syncProgress);
  el.audio.addEventListener('ended', ()=> { el.npPlay.textContent='▶'; syncProgress(); });

  function tick(){ syncProgress(); playTimer = requestAnimationFrame(tick); }
  function syncProgress(){ const cur = el.audio.currentTime, dur = el.audio.duration || 15; el.npTime.textContent = fmtTime(cur); el.npDur.textContent = isFinite(dur)? fmtTime(dur): '0:15'; el.npProg.style.width = (cur/dur*100)+'%'; }

  // ===== Core =====
  function refresh(){
    const allWeeks = Object.keys(weekData).map(Number).sort((a,b)=>b-a);
    const cur = state.range==='7days' ? allWeeks.slice(0,1) : state.range==='30days' ? allWeeks.slice(0,4) : allWeeks;
    const prev = state.range==='7days' ? allWeeks.slice(1,2) : state.range==='30days' ? allWeeks.slice(4,8) : [];
    state.lastWeeks = cur; state.prevWeeks = prev;
    state.rows = aggregate(state.type, cur, prev, state.includeFeatures);
    render();
  }

  function render(){
    // column visibility
    el.colArtist.style.display = state.type==='artist' ? 'none' : '';

    // filter & sort
    const query = state.q.toLowerCase();
    let rows = !query ? state.rows : state.rows.filter(r => (r.name && r.name.toLowerCase().includes(query)) || (r.artist && r.artist.toLowerCase().includes(query)));

    rows = rows.slice();
    if (state.sortBy==='name') rows.sort((a,b)=> a.name.localeCompare(b.name));
    else if (state.sortBy==='change') rows.sort((a,b)=> (b.changeVal||0) - (a.changeVal||0));
    else rows.sort((a,b)=> (b.streamsRaw||0) - (a.streamsRaw||0));

    // pagination
    const total = rows.length;
    const pages = Math.max(1, Math.ceil(total / state.pageSize));
    if (state.page>pages) state.page = pages;
    const start = (state.page-1)*state.pageSize;
    const pageRows = rows.slice(start, start + state.pageSize);

    // render table (single innerHTML write)
    el.rows.innerHTML = pageRows.map((r,i)=> rowHtml(r, start + i)).join('') || '<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">No results</td></tr>';

    // pager UI
    el.pager.innerHTML = pages>1 ? `Page ${state.page} / ${pages} <button class="btn" id="prevP" ${state.page===1?'disabled':''}>Prev</button> <button class="btn" id="nextP" ${state.page===pages?'disabled':''}>Next</button>` : '';
    on('#prevP','click', ()=>{ if(state.page>1){ state.page--; render(); } });
    on('#nextP','click', ()=>{ if(state.page<pages){ state.page++; render(); } });

    // lazy draw sparklines when visible
    lazySpark(pageRows, start);

    // event delegation for row actions
    el.rows.onclick = (e)=>{
      const btn = e.target.closest('button[data-act]');
      if(!btn) return;
      const idx = +btn.dataset.idx; const act = btn.dataset.act; const r = rows[idx];
      if (!r) return;
      if (act==='pin') addPin(r); else if (act==='play') startPreview(r);
    };

    // summary + URL (debounced)
    updateSummary(rows);
    debouncedPermalink();
    renderPins();
  }

  function rowHtml(r, i){
    const rank = (i+1);
    const initials = getInitials(state.type==='artist'? r.name : (r.artist||r.name));
    const itemLink = linkify(r.name, r.artist || r.name, mapType(state.type));
    const artistLink = state.type==='artist' ? '' : `<div class="subtitle">${linkify(r.artist, r.artist, 'artist')}</div>`;
    const streamsTxt = state.exactUnits ? numberWithCommas(r.streamsRaw) : formatStreams(r.streamsRaw);
    const changeClass = r.changeVal>0 ? 'up' : (r.changeVal<0 ? 'down' : '');
    const playTip = r.preview ? 'Play preview' : 'No preview_url in data';
    return `
    <tr>
      <td class="rank">${rank}</td>
      <td>
        <div class="item">
          <div class="avatar">${initials}</div>
          <div class="meta">
            <div class="title">${itemLink}</div>
            ${artistLink}
          </div>
        </div>
      </td>
      <td style="${state.type==='artist'?'display:none':''}">${linkify(r.artist, r.artist, 'artist')}</td>
      <td class="streams"><b>${streamsTxt}</b></td>
      <td class="change ${changeClass}">${formatChangeLabel(r.changeVal)}</td>
      <td><canvas id="spk-${i}" class="spark" width="80" height="24"></canvas></td>
      <td class="act">
        <button class="iconbtn" title="${playTip}" data-act="play" data-idx="${i}">▶</button>
        <button class="iconbtn" title="Pin to library" data-act="pin" data-idx="${i}">📌</button>
      </td>
    </tr>`;
  }

  // ===== Aggregation (same results, simpler) =====
  function aggregate(type, curWeeks, prevWeeks, includeFeatures){
    const prevMap = seriesMap(type, prevWeeks, includeFeatures);
    const curMap  = seriesMap(type, curWeeks, includeFeatures);

    const list = Object.keys(curMap).map(k=>{
      const item = curMap[k];
      const prevVal = (prevMap[k]?.total) || 0;
      const change = pctChange(item.total, prevVal);
      return { key:k, name:item.name, artist:item.artist, streamsRaw:item.total, changeVal:change, series:item.series, preview:item.preview_url||null };
    });

    list.sort((a,b)=>b.streamsRaw-a.streamsRaw);
    return list.slice(0,200);
  }

  function seriesMap(type, weeks, includeFeatures){
    const map = {};
    weeks.forEach(week=>{
      const entries = (weekData[week]||[]);
      for (let i=0;i<entries.length;i++){
        const e = entries[i];
        const streams = safeNum(e.streams); if (!streams) continue;
        let key, name, artist, preview=null;
        if (type==='artist'){
          name = (e.artist||'Unknown').trim();
          if (!includeFeatures && isFeaturingTitle(e.title||'')) continue;
          key = 'ART::'+name; artist = name; preview = e.preview_url || null;
        } else if (type==='tracks'){
          const title = (e.title||'Unknown').trim(); artist = (e.artist||'Unknown').trim(); name = title; key = 'TRK::'+title+'|||'+artist; preview = e.preview_url || null;
        } else {
          const album = (e.album||'Unknown').trim(); artist = (e.artist||'Unknown').trim(); name = album; key = 'ALB::'+album+'|||'+artist; preview = e.preview_url || null;
        }
        const slot = map[key] || (map[key] = { name, artist, total:0, series:[], preview_url: preview });
        slot.total += streams;
      }
    });

    // per-week series (oldest -> newest)
    const seriesWeeks = weeks.slice().reverse();
    const keys = Object.keys(map);
    for (let k of keys){
      const s = [];
      for (let w=0; w<seriesWeeks.length; w++){
        const week = seriesWeeks[w];
        const sum = (weekData[week]||[]).reduce((acc,e)=>{
          const streams = safeNum(e.streams); if (!streams) return acc;
          if (matchKey(k, e)){
            if (k.startsWith('ART::') && (!state.includeFeatures && isFeaturingTitle(e.title||''))) return acc;
            return acc + streams;
          }
          return acc;
        },0);
        s.push(sum);
      }
      map[k].series = s;
    }
    return map;
  }

  function matchKey(key, e){
    if (key.startsWith('ART::')){ const name = key.slice(5); return (e.artist||'').trim() === name; }
    if (key.startsWith('TRK::')){ const [title, artist] = key.slice(5).split('|||'); return ((e.title||'').trim()===title) && ((e.artist||'').trim()===artist); }
    if (key.startsWith('ALB::')){ const [album, artist] = key.slice(5).split('|||'); return ((e.album||'').trim()===album) && ((e.artist||'').trim()===artist); }
    return false;
  }

  // ===== UI helpers =====
  function updateSummary(allRows){
    const total = allRows.reduce((a,r)=>a+(r.streamsRaw||0),0);
    const weeks = state.lastWeeks.length;
    const label = state.range==='7days'?'7 Days': state.range==='30days'?'30 Days':'All Time';
    const typeLabel = state.type==='artist'?'Artists': state.type==='tracks'?'Tracks':'Albums';
    el.summary.innerHTML = `
      <div><b>${typeLabel}</b> • <span class="muted">${label}</span></div>
      <div><span class="muted">Items:</span> ${allRows.length}</div>
      <div><span class="muted">Total Streams:</span> <b>${ state.exactUnits ? numberWithCommas(total) : formatStreams(total) }</b></div>
      <div><span class="muted">Weeks spanned:</span> ${weeks}</div>
    `;
  }

  function getInitials(name){ const p=(name||'').split(/\s+/).slice(0,2); return p.map(x=>x[0]||'').join('').toUpperCase() || '•'; }
  function linkify(name, artist, type){ const en=encodeURIComponent(name||''); const ea=encodeURIComponent(artist||''); if (type==='artist') return `<a href="Artist_stream.html?name=${en}">${esc(name)}</a>`; if (type==='track') return `<a href="track_detail.html?title=${en}&artist=${ea}">${esc(name)}</a>`; return `<a href="album_detail.html?album=${en}&artist=${ea}">${esc(name)}</a>`; }
  function mapType(t){ return t==='tracks'?'track': t; }

  // ===== Export / Link =====
  function exportCurrentCSV(){
    const headers = state.type==='artist' ? ['Rank','Artist','Streams','Change%'] : state.type==='tracks' ? ['Rank','Title','Artist','Streams','Change%'] : ['Rank','Album','Artist','Streams','Change%'];
    const rows = [...document.querySelectorAll('#rows tr')].map((tr,i)=>{
      const cells = [...tr.children].map(td=>td.innerText.trim());
      if (state.type==='artist'){ return [i+1, cells[1], cells[2], cells[3]]; } else { return [i+1, cells[1], cells[2], cells[3], cells[4]]; }
    });
    const csv = toCSV([headers, ...rows]);
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `stream_rankings_${state.range}_${state.type}.csv`; a.click(); URL.revokeObjectURL(a.href);
  }

  const debouncedPermalink = debounce(()=>{ history.replaceState({}, '', currentPermalink()); }, 180);
  function currentPermalink(){ const url = new URL(location.href); url.searchParams.set('tab', state.range); url.searchParams.set('sub', state.type); state.q ? url.searchParams.set('search', state.q) : url.searchParams.delete('search'); url.searchParams.set('feat', state.includeFeatures ? '1':'0'); url.searchParams.set('exact', state.exactUnits ? '1':'0'); url.searchParams.set('sort', state.sortBy); url.searchParams.set('page', state.page); url.searchParams.set('ps', state.pageSize); return url.toString(); }

  // ===== Pins =====
  function addPin(r){ const pins = getPins(); const id = `${state.type}:${r.key}`; if (!pins.find(p=>p.id===id)){ pins.push({ id, name:r.name, artist:r.artist||'', type:state.type }); savePins(pins); renderPins(); toast('Pinned'); } else { toast('Already pinned'); } }
  function renderPins(){ const pins = getPins(); el.pins.innerHTML = pins.length? pins.map(p=>`<div class="pin"><b title="${esc(p.name)}">${esc(p.name)}</b><div><button title="Open" class="iconbtn" onclick="location.href='${pinLink(p)}'">↗</button><button title="Unpin" class="iconbtn" onclick="(${unpin})(\'${p.id}\')">✖</button></div></div>`).join('') : `<div class="muted" style="padding:8px">No pins yet</div>`; }
  function pinLink(p){ const n=encodeURIComponent(p.name); const a=encodeURIComponent(p.artist||p.name); if (p.type==='artist') return `Artist_stream.html?name=${n}`; if (p.type==='tracks') return `track_detail.html?title=${n}&artist=${a}`; return `album_detail.html?album=${n}&artist=${a}`; }
  function unpin(id){ const pins = getPins().filter(p=>p.id!==id); localStorage.setItem('streamPins', JSON.stringify(pins)); renderPins(); }
  window.unpin = unpin;
  function getPins(){ try{return JSON.parse(localStorage.getItem('streamPins')||'[]')}catch{return[]} }
  function savePins(p){ localStorage.setItem('streamPins', JSON.stringify(p)); }

  // ===== Mini Player =====
  function startPreview(row){ if (!row.preview){ toast('No preview_url in data'); return; } el.audio.src = row.preview; el.npTitle.textContent = row.name || 'Unknown'; el.npSub.textContent = row.artist || (state.type==='artist' ? 'Artist' : 'Unknown'); el.audio.play().catch(()=> toast('Could not start audio.')); }

  // ===== Utils =====
  function byId(id){ return document.getElementById(id); }
  function on(sel, evt, fn){ const n = typeof sel === 'string' ? document.querySelector(sel) : sel; if(n) n.addEventListener(evt, fn); }
  function getQP(k){ return new URLSearchParams(location.search).get(k) || ''; }
  function setActive(group, btn){ group.querySelectorAll('button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
  function setActiveByData(group, data, val){ group.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset[data]===val)); }
  function safeNum(v){ const n = Number(v); return isFinite(n)? n : 0; }
  function numberWithCommas(x){ return (x||0).toLocaleString('en-US'); }
  function formatStreams(v){ const abs=Math.abs(v); if (abs>=1_000_000_000) return (v/1_000_000_000).toFixed(2)+'B'; return (v/1_000_000).toFixed(2)+'M'; }
  function pctChange(now, prev){ if (!prev) return 0; let d=((now-prev)/prev)*100; if(d>100)d=100; if(d<-100)d=-100; return d; }
  function formatChangeLabel(v){ if (!v) return '<span class="muted">—</span>'; const s = Math.abs(v).toFixed(1)+'%'; return v>0? `<span class="change up">▲ ${s}</span>` : `<span class="change down">▼ ${s}</span>`; }
  function isFeaturingTitle(title){ return /\b(feat\.|ft\.| x |,| & )/i.test(title); }
  function toCSV(rows){ return rows.map(r=> r.map(cell => { const c = (''+cell).replace(/"/g,'""'); return `"${c}"`; }).join(',')).join('\n'); }
  function esc(s){ return (s||'').replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }
  function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
  function toast(msg){ const d=document.createElement('div'); d.textContent=msg; d.style.cssText='position:fixed;bottom:70px;right:12px;background:#111;border:1px solid #2a2a2a;border-radius:8px;padding:8px 10px;color:#eaeaea;z-index:9999'; document.body.appendChild(d); setTimeout(()=>d.remove(),1400); }
  function fmtTime(sec){ sec=Math.floor(sec||0); const m=Math.floor(sec/60), s=sec%60; return `${m}:${s.toString().padStart(2,'0')}`; }

  // Lightweight sparkline drawing only when visible
  function drawSpark(canvas, series){
    const ctx = canvas.getContext('2d', { alpha: false }); // faster
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0,0,w,h);
    if (!series.length) return;
    const max = Math.max(...series), min = Math.min(...series);
    const pad = 1, dx = (w- pad*2)/Math.max(1,(series.length-1));
    ctx.beginPath();
    for(let i=0;i<series.length;i++){
      const v=series[i]; const x= pad + i*dx; const y = h - pad - (max===min ? h/2 : ((v-min)/(max-min))*(h-pad*2));
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.lineWidth = 2; ctx.strokeStyle = '#1db954'; ctx.stroke();
  }

  function lazySpark(rows, startIdx){
    const io = new IntersectionObserver((entries, obs)=>{
      for (const entry of entries){
        if (entry.isIntersecting){
          const id = entry.target.id; // spk-<idx>
          const idx = +id.split('-')[1];
          const r = rows[idx - startIdx];
          if (r && r.series && r.series.length){ drawSpark(entry.target, r.series); }
          obs.unobserve(entry.target);
        }
      }
    }, { root: document.querySelector('.contentWrap'), threshold: 0 });

    // observe canvases in current page
    for (let i=0;i<rows.length;i++){
      const c = document.getElementById('spk-' + (startIdx + i));
      if (c) io.observe(c);
    }
  }

  // ===== Kickoff =====
  if (Object.keys(weekData).length===0){ warnNoData(); }
  refresh();
})();
</script>
