<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top 100 Streaming - Artists, Songs, Albums</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #121b2e;
      --muted: #9fb0d0;
      --text: #eaf0ff;
      --accent: #4aa3ff;
      --accent2: #22d3ee;
      --border: rgba(255,255,255,0.10);
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(1200px 600px at 10% 0%, rgba(74,163,255,0.20), transparent 60%),
                  radial-gradient(900px 500px at 90% 10%, rgba(34,211,238,0.16), transparent 55%),
                  var(--bg);
      color: var(--text);
    }
    header {
      padding: 24px 18px;
      text-align: center;
    }
    header h1 {
      margin: 0 0 6px;
      font-size: 1.6rem;
      letter-spacing: 0.3px;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 14px 40px;
    }

    .panel {
      background: rgba(18,27,46,0.85);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .tabs, .subtabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tabbtn {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.92rem;
      transition: transform 0.06s ease, background 0.2s ease, border 0.2s ease;
      user-select: none;
    }
    .tabbtn:hover { transform: translateY(-1px); border-color: rgba(255,255,255,0.18); }
    .tabbtn.active {
      background: linear-gradient(135deg, rgba(74,163,255,0.25), rgba(34,211,238,0.18));
      border-color: rgba(74,163,255,0.55);
    }

    .meta {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .content {
      padding: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,255,255,0.03);
    }
    .cardhead {
      padding: 12px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .cardhead h2 {
      margin: 0;
      font-size: 1.05rem;
    }
    .cardhead span {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .tablewrap {
      overflow: auto;
      max-height: 70vh;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }
    th, td {
      padding: 10px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      text-align: left;
      font-size: 0.92rem;
      vertical-align: top;
    }
    th {
      position: sticky;
      top: 0;
      background: rgba(18,27,46,0.98);
      z-index: 1;
      color: var(--muted);
      font-weight: 600;
    }

    .rank {
      width: 70px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .streams {
      width: 180px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    a.itemlink {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px dashed rgba(74,163,255,0.55);
    }
    a.itemlink:hover {
      color: white;
      border-bottom-color: rgba(34,211,238,0.8);
    }

    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--muted);
      font-size: 0.8rem;
      margin-left: 8px;
      white-space: nowrap;
    }

    .notice {
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .searchbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    input[type="search"] {
      width: min(360px, 100%);
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.18);
      color: var(--text);
      outline: none;
    }
    input[type="search"]::placeholder { color: rgba(159,176,208,0.7); }
    .smallbtn {
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>Top 100 Streaming</h1>
    <p>Artists • Songs • Albums — Last 7 Days, Last 30 Days, All Time</p>
  </header>

  <div class="wrap">
    <div class="panel">
      <div class="toolbar">
        <div class="tabs" id="timeTabs">
          <button class="tabbtn active" data-range="7">Last 7 days</button>
          <button class="tabbtn" data-range="30">Last 30 days</button>
          <button class="tabbtn" data-range="all">All time</button>
        </div>

        <div class="searchbar">
          <input id="searchInput" type="search" placeholder="Search (artist/song/album)..." />
          <button class="smallbtn" id="clearSearchBtn">Clear</button>
        </div>

        <div class="meta" id="metaText">Loading data…</div>
      </div>

      <div class="content">
        <div class="subtabs" id="typeTabs" style="margin-bottom: 12px;">
          <button class="tabbtn active" data-type="artists">Artists</button>
          <button class="tabbtn" data-type="songs">Songs</button>
          <button class="tabbtn" data-type="albums">Albums</button>
        </div>

        <div class="grid">
          <div class="card">
            <div class="cardhead">
              <h2 id="cardTitle">Top 100 Artists <span class="pill" id="rangePill">Last 7 days</span></h2>
              <span id="cardHint">Ranked by total streams in selected range</span>
            </div>
            <div class="tablewrap">
              <table>
                <thead>
                  <tr>
                    <th class="rank">Rank</th>
                    <th id="nameCol">Artist</th>
                    <th class="streams">Streams</th>
                    <th id="extraCol">Extra</th>
                  </tr>
                </thead>
                <tbody id="rows"></tbody>
              </table>
            </div>
          </div>

          <div class="notice" id="noticeBox" style="display:none;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- IMPORTANT: weekdata.js must define: const weekData = [...] -->
  <script src="weekdata.js"></script>

  <script>
    // ---- Helpers ----
    const fmtNumber = (n) => {
      if (!Number.isFinite(n)) return "0";
      return Math.round(n).toLocaleString(undefined);
    };

    // Safe read of weekData
    function getWeekDataSafe() {
      // supports: const weekData = [...]
      if (typeof weekData !== "undefined" && Array.isArray(weekData)) return weekData;

      // fallback: const weekData = { ... } etc (unlikely)
      return null;
    }

    // Convert "last N days" into number of weeks to include.
    // Because the dataset is weekly, we approximate:
    // 7 days => last 1 week
    // 30 days => last 4-5 weeks (we'll use 5 to be safer)
    function rangeToWeeks(range) {
      if (range === "7") return 1;
      if (range === "30") return 5;
      return null; // all time
    }

    // Extract chart items from each weekly record.
    // Expected shape (based on your dataset): weekData = [ [ {...}, {...} ], [ {...} ], ... ]
    // Each item includes at least: title, artist, album, streams
    function flattenWeeks(weeksSlice) {
      const out = [];
      for (const week of weeksSlice) {
        if (Array.isArray(week)) {
          for (const item of week) {
            if (item && typeof item === "object") out.push(item);
          }
        }
      }
      return out;
    }

    function toKey(s) {
      return (s ?? "").toString().trim();
    }

    function getStreams(item) {
      const v = Number(item?.streams);
      return Number.isFinite(v) ? v : 0;
    }

    // Aggregate
    function aggregateTop(items, mode) {
      // mode: "artists" | "songs" | "albums"
      const map = new Map();

      for (const it of items) {
        const streams = getStreams(it);
        if (streams <= 0) continue;

        if (mode === "artists") {
          const artist = toKey(it.artist);
          if (!artist) continue;

          const rec = map.get(artist) || { name: artist, streams: 0, extra: new Set() };
          rec.streams += streams;

          // store example titles as "extra"
          if (it.title) rec.extra.add(toKey(it.title));
          map.set(artist, rec);
        }

        if (mode === "songs") {
          const title = toKey(it.title);
          if (!title) continue;

          // use title + artist for uniqueness
          const artist = toKey(it.artist);
          const k = artist ? `${title} — ${artist}` : title;

          const rec = map.get(k) || { name: title, streams: 0, extra: artist || "" };
          rec.streams += streams;
          // prefer keeping artist in extra
          if (!rec.extra && artist) rec.extra = artist;
          map.set(k, rec);
        }

        if (mode === "albums") {
          const album = toKey(it.album);
          if (!album) continue;

          const artist = toKey(it.artist);
          const k = artist ? `${album} — ${artist}` : album;

          const rec = map.get(k) || { name: album, streams: 0, extra: artist || "" };
          rec.streams += streams;
          if (!rec.extra && artist) rec.extra = artist;
          map.set(k, rec);
        }
      }

      const arr = Array.from(map.values())
        .map(r => ({
          name: r.name,
          streams: r.streams,
          extra: r.extra instanceof Set ? Array.from(r.extra).slice(0, 3).join(", ") : (r.extra || "")
        }))
        .sort((a, b) => b.streams - a.streams)
        .slice(0, 100);

      return arr;
    }

    function buildLink(mode, name, extra) {
      const enc = encodeURIComponent;
      if (mode === "artists") return `artiststream.html?artist=${enc(name)}`;
      if (mode === "songs")   return `songstream.html?song=${enc(name)}&artist=${enc(extra || "")}`;
      if (mode === "albums")  return `albumstream.html?album=${enc(name)}&artist=${enc(extra || "")}`;
      return "#";
    }

    // ---- UI State ----
    let currentRange = "7";     // "7" | "30" | "all"
    let currentType  = "artists"; // "artists" | "songs" | "albums"
    let searchTerm   = "";

    const els = {
      metaText: document.getElementById("metaText"),
      rangePill: document.getElementById("rangePill"),
      cardTitle: document.getElementById("cardTitle"),
      rows: document.getElementById("rows"),
      noticeBox: document.getElementById("noticeBox"),
      timeTabs: document.getElementById("timeTabs"),
      typeTabs: document.getElementById("typeTabs"),
      searchInput: document.getElementById("searchInput"),
      clearSearchBtn: document.getElementById("clearSearchBtn"),
      nameCol: document.getElementById("nameCol"),
      extraCol: document.getElementById("extraCol"),
    };

    function setActiveButtons(container, attrName, value) {
      container.querySelectorAll(".tabbtn").forEach(btn => {
        const v = btn.getAttribute(attrName);
        btn.classList.toggle("active", v === value);
      });
    }

    function rangeLabel(r) {
      if (r === "7") return "Last 7 days";
      if (r === "30") return "Last 30 days";
      return "All time";
    }

    function typeLabel(t) {
      if (t === "artists") return "Artists";
      if (t === "songs") return "Songs";
      return "Albums";
    }

    function updateHeaders() {
      els.rangePill.textContent = rangeLabel(currentRange);

      const title = `Top 100 ${typeLabel(currentType)}`;
      els.cardTitle.innerHTML = `${title} <span class="pill" id="rangePill">${rangeLabel(currentRange)}</span>`;

      // Update column labels
      if (currentType === "artists") {
        els.nameCol.textContent = "Artist";
        els.extraCol.textContent = "Popular songs (sample)";
      } else if (currentType === "songs") {
        els.nameCol.textContent = "Song";
        els.extraCol.textContent = "Artist";
      } else {
        els.nameCol.textContent = "Album";
        els.extraCol.textContent = "Artist";
      }
    }

    function render() {
      const data = getWeekDataSafe();
      if (!data) {
        els.metaText.textContent = "weekData not found. Make sure weekdata.js is loaded and defines const weekData = [...]";
        els.noticeBox.style.display = "block";
        els.noticeBox.textContent =
          "I couldn’t find a global array called weekData. Please ensure your file is named weekdata.js and contains: const weekData = [...];";
        return;
      }

      // Choose weeks slice
      let weeksUsed = data;
      const weeksN = rangeToWeeks(currentRange);

      if (weeksN) {
        weeksUsed = data.slice(-weeksN);
      }

      const flat = flattenWeeks(weeksUsed);
      const top = aggregateTop(flat, currentType);

      // Search filter (client side)
      const term = (searchTerm || "").trim().toLowerCase();
      const filtered = term
        ? top.filter(r =>
            (r.name || "").toLowerCase().includes(term) ||
            (r.extra || "").toLowerCase().includes(term)
          )
        : top;

      // meta
      const weeksCount = Array.isArray(weeksUsed) ? weeksUsed.length : 0;
      els.metaText.textContent = `Weeks used: ${weeksCount} • Items scanned: ${flat.length} • Showing: ${Math.min(100, filtered.length)}${term ? " (filtered)" : ""}`;

      // rows
      els.rows.innerHTML = "";
      filtered.forEach((r, idx) => {
        const tr = document.createElement("tr");

        const tdRank = document.createElement("td");
        tdRank.className = "rank";
        tdRank.textContent = String(idx + 1);

        const tdName = document.createElement("td");
        const a = document.createElement("a");
        a.className = "itemlink";
        a.href = buildLink(currentType, r.name, r.extra);
        a.textContent = r.name || "(Unknown)";
        tdName.appendChild(a);

        const tdStreams = document.createElement("td");
        tdStreams.className = "streams";
        tdStreams.textContent = fmtNumber(r.streams);

        const tdExtra = document.createElement("td");
        tdExtra.textContent = r.extra || "";

        tr.appendChild(tdRank);
        tr.appendChild(tdName);
        tr.appendChild(tdStreams);
        tr.appendChild(tdExtra);

        els.rows.appendChild(tr);
      });

      els.noticeBox.style.display = filtered.length ? "none" : "block";
      els.noticeBox.textContent = filtered.length
        ? ""
        : "No results match your search. Try a different keyword or clear search.";

      updateHeaders();
    }

    // ---- Events ----
    els.timeTabs.addEventListener("click", (e) => {
      const btn = e.target.closest(".tabbtn");
      if (!btn) return;
      currentRange = btn.getAttribute("data-range");
      setActiveButtons(els.timeTabs, "data-range", currentRange);
      render();
    });

    els.typeTabs.addEventListener("click", (e) => {
      const btn = e.target.closest(".tabbtn");
      if (!btn) return;
      currentType = btn.getAttribute("data-type");
      setActiveButtons(els.typeTabs, "data-type", currentType);
      render();
    });

    els.searchInput.addEventListener("input", (e) => {
      searchTerm = e.target.value || "";
      render();
    });

    els.clearSearchBtn.addEventListener("click", () => {
      searchTerm = "";
      els.searchInput.value = "";
      render();
    });

    // ---- Boot ----
    // Default active state
    setActiveButtons(els.timeTabs, "data-range", currentRange);
    setActiveButtons(els.typeTabs, "data-type", currentType);
    render();
  </script>
</body>
</html>
