<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charts — Clean & Minimal</title>
<style>
:root {
  --bg:#f9f9f9;
  --panel:#ffffff;
  --text:#111;
  --muted:#666;
  --accent:#007aff;
  --row:#fff;
  --hover:#f0f0f0;
  --border:#ddd;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
a{text-decoration:none;color:inherit;}
a:hover{text-decoration:underline;}

.container{max-width:1200px;margin:20px auto;padding:0 20px;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.tabs{display:flex;gap:10px;margin-bottom:20px;}
.tabs button{background:transparent;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--muted);}
.tabs button.active{background:var(--accent);color:#fff;}
.table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
thead{background:#f2f2f2;}
thead th{padding:12px;text-align:left;font-weight:600;border-bottom:1px solid var(--border);}
tbody tr{background:var(--row);}
tbody tr:hover{background:var(--hover);}
td{padding:12px;border-bottom:1px solid var(--border);}
td:first-child{text-align:center;width:40px;}
td:last-child{text-align:right;}
.summary{margin-bottom:10px;color:var(--muted);}
select{padding:6px 10px;border-radius:6px;border:1px solid var(--border);}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Charts</h1>
    <div>
      <label>Rows per page: 
        <select id="pageSize">
          <option>50</option>
          <option>100</option>
          <option>200</option>
        </select>
      </label>
    </div>
  </div>

  <!-- Range Tabs -->
  <div class="tabs" id="rangeTabs">
    <button data-range="7days" class="active">7 Days</button>
    <button data-range="30days">30 Days</button>
    <button data-range="alltime">All Time</button>
  </div>

  <!-- Type Tabs -->
  <div class="tabs" id="typeTabs">
    <button data-type="artist" class="active">Artists</button>
    <button data-type="tracks">Tracks</button>
    <button data-type="album">Albums</button>
  </div>

  <div class="summary" id="summary">Loading…</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Item</th>
          <th>Artist</th>
          <th>Streams</th>
          <th>Change</th>
          <th>Trend</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<!-- Globals needed by weekdata.js -->
<script>
window.currentRange = '7days';
window.currentType = 'artist';
</script>

<!-- Load weekdata.js -->
<script src="weekdata.js"></script>

<!-- Tabs functionality -->
<script>
function setActiveTab(containerId, type='range') {
  document.querySelectorAll(`#${containerId} button`).forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelector(`#${containerId} .active`).classList.remove('active');
      btn.classList.add('active');
      if(type==='range') window.currentRange = btn.dataset.range;
      else window.currentType = btn.dataset.type;
      if(window.updateTable) updateTable();
    });
  });
}
setActiveTab('rangeTabs','range');
setActiveTab('typeTabs','type');
</script>

</body>
</html>
