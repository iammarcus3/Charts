<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Album Records 2018–2025</title>

<style>
  body {
    font-family: 'Arial', sans-serif;
    background-color: #121212;
    color: #f0f0f0;
    margin: 0;
    padding: 0;
  }
  h1 {
    text-align: center;
    padding: 1rem;
    color: #ff004c;
  }
  .tabs {
    display: flex;
    justify-content: center;
    background: #1f1f1f;
    border-bottom: 2px solid #ff004c;
    flex-wrap: wrap;
  }
  .tab {
    padding: 10px 20px;
    cursor: pointer;
    color: #fff;
    margin: 2px;
    transition: background 0.3s;
  }
  .tab:hover, .tab.active {
    background: #ff004c;
  }
  .tab-content {
    display: none;
    padding: 1rem 2rem;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 1rem;
    background-color: #1f1f1f;
  }
  th, td {
    padding: 8px 10px;
    border: 1px solid #333;
    text-align: center;
  }
  th {
    background-color: #2a2a2a;
    color: #ff004c;
    cursor: pointer;
  }
  tr:nth-child(even) {
    background: #1a1a1a;
  }
</style>

</head>
<body>

<h1>Album Records 2018–2025</h1>

<div class="tabs" id="yearTabs"></div>
<div id="tabContents"></div>

<script src="weekdata.js"></script>
<script>
// CONFIG
const week1Start = new Date("2018-02-23");
const saleMultiplier = 500;

// Normalizers (same as album_detail.html)
const normalize = s => typeof s === "string"
    ? s.toUpperCase().replace(/[^A-Z0-9]/g, "").trim()
    : "";

const normalizeAlbum = s =>
  typeof s === "string"
    ? s.toUpperCase()
        .replace(/\(.*?\)|\[.*?\]/g, "")
        .replace(/DELUXE|BONUS|VERSION|REMIX|EP|REMASTERED|EXPANDED/gi, "")
        .replace(/[^A-Z0-9]/g, "")
        .trim()
    : "";

const normalizeTitle = s =>
  typeof s === "string"
    ? s.toUpperCase()
        .replace(/\(.*?\)|\[.*?\]|REMIX|RADIO EDIT|FEAT\.?|FEATURING|VERSION|SINGLE/gi, "")
        .replace(/[^A-Z0-9]/g, "")
        .trim()
    : "";

// Week date
function getWeekStartDate(weekNumber) {
  const date = new Date(week1Start);
  date.setDate(week1Start.getDate() + (weekNumber - 1) * 7);
  return date.toISOString().split("T")[0];
}

// Flatten week data
const allTracks = [];
Object.keys(weekData).forEach(weekKey => {
  const weekNum = parseInt(weekKey.replace(/\D/g, ""));
  weekData[weekKey].forEach(entry => {
    allTracks.push({ ...entry, week: weekNum });
  });
});

// Build album ranks (same as album_detail.html)
function computeAlbumRanksByWeek() {
  const ranks = {};

  for (const weekKey in weekData) {
    const weekNum = parseInt(weekKey.replace(/\D/g, ""));
    const albumSalesMap = {};

    for (const entry of weekData[weekKey]) {
      if (!entry.album || !entry.artist) continue;

      const key = normalizeAlbum(entry.album) + "||" + normalize(entry.artist);
      const sales = parseFloat(entry.sales) || 0;

      albumSalesMap[key] = (albumSalesMap[key] || 0) + sales;
    }

    const sorted = Object.entries(albumSalesMap).sort((a, b) => b[1] - a[1]);
    ranks[weekNum] = {};
    sorted.forEach(([key], i) => {
      ranks[weekNum][key] = i + 1;
    });
  }
  return ranks;
}

const albumRanksByWeek = computeAlbumRanksByWeek();

// ---- MAIN: Process album totals USING EXACT album_detail logic ----
function processAlbums(data) {
  const albums = {};

  // Track-based accumulation
  data.forEach(entry => {
    if (!entry.album || !entry.artist) return;

    const normArtist = normalize(entry.artist);
    const normAlbum = normalizeAlbum(entry.album);
    const albumKey = normAlbum + "||" + normArtist;

    const rawSales = parseFloat(entry.sales) || 0;
    const streams = parseFloat(entry.streams) || 0;

    if (!albums[albumKey]) {
      albums[albumKey] = {
        key: albumKey,
        album: entry.album,
        artist: entry.artist,
        normAlbum,
        normArtist,
        weeksOnChart: 0,
        weeksAt1: 0,
        peakRank: Infinity,
        debutWeek: null,
        tracks: {},
        totalRawSales: 0,
        totalStreams: 0
      };
    }

    const alb = albums[albumKey];

    // EXACT album_detail.html accumulation
    alb.totalRawSales += rawSales;
    alb.totalStreams += streams;

    const tKey = normalizeTitle(entry.title || "");
    if (!alb.tracks[tKey]) {
      alb.tracks[tKey] = {
        title: entry.title,
        sales: 0,
        streams: 0
      };
    }

    alb.tracks[tKey].sales += rawSales;
    alb.tracks[tKey].streams += streams;
  });

  // Add chart-based stats (rank, debut, weeks at #1)
  Object.values(albums).forEach(alb => {
    for (const weekNum in albumRanksByWeek) {
      const rank = albumRanksByWeek[weekNum][alb.key];
      if (rank !== undefined) {
        alb.weeksOnChart++;

        const w = parseInt(weekNum);
        if (!alb.debutWeek || w < alb.debutWeek) alb.debutWeek = w;
        if (rank < alb.peakRank) alb.peakRank = rank;
        if (rank === 1) alb.weeksAt1++;
      }
    }
  });

  return albums;
}

// ---- Table Generator ----
function generateTable(albums) {
  let html = `
  <table>
  <thead>
    <tr>
      <th onclick="sortTable(this,0)">Rank</th>
      <th onclick="sortTable(this,1)">Album</th>
      <th onclick="sortTable(this,2)">Artist</th>
      <th onclick="sortTable(this,3)">Weeks on Chart</th>
      <th onclick="sortTable(this,4)">Weeks at #1</th>
      <th onclick="sortTable(this,5)">Peak Rank</th>
      <th onclick="sortTable(this,6)">Debut Week</th>
      <th onclick="sortTable(this,7)">Total Streams</th>
      <th onclick="sortTable(this,8)">Total Sales</th>
    </tr>
  </thead>
  <tbody>
  `;

  let r = 1;
  Object.values(albums).forEach(alb => {
    const totalSales = alb.totalRawSales * saleMultiplier;

    html += `
    <tr>
      <td>${r}</td>
      <td>${alb.album}</td>
      <td>${alb.artist}</td>
      <td>${alb.weeksOnChart}</td>
      <td>${alb.weeksAt1}</td>
      <td>${alb.peakRank}</td>
      <td>${alb.debutWeek || "-"}</td>
      <td>${Math.round(alb.totalStreams).toLocaleString()}</td>
      <td>${Math.round(totalSales).toLocaleString()}</td>
    </tr>
    `;
    r++;
  });

  html += "</tbody></table>";
  return html;
}

// ---- Sorting ----
function sortTable(header, colIndex) {
  const table = header.closest("table");
  const rows = [...table.querySelectorAll("tbody tr")];
  const asc = !header.asc;

  rows.sort((a, b) => {
    let A = a.children[colIndex].innerText;
    let B = b.children[colIndex].innerText;

    const numA = parseFloat(A.replace(/[^0-9.-]/g, ""));
    const numB = parseFloat(B.replace(/[^0-9.-]/g, ""));

    if (!isNaN(numA) && !isNaN(numB)) {
      return asc ? numA - numB : numB - numA;
    }

    return asc
      ? A.localeCompare(B)
      : B.localeCompare(A);
  });

  header.asc = asc;
  const tbody = table.querySelector("tbody");
  rows.forEach(r => tbody.appendChild(r));
}

// ---- Tabs ----
function generateTabs(data) {
  const albums = processAlbums(data);

  const tabContainer = document.getElementById("yearTabs");
  const contentContainer = document.getElementById("tabContents");

  // All Time
  const allTab = document.createElement("div");
  allTab.classList.add("tab", "active");
  allTab.textContent = "All-Time";
  tabContainer.appendChild(allTab);

  const allContent = document.createElement("div");
  allContent.classList.add("tab-content");
  allContent.style.display = "block";

  const sorted = Object.values(albums)
    .sort((a, b) => b.totalRawSales - a.totalRawSales)
    .slice(0, 100);

  const finalMap = {};
  sorted.forEach(a => finalMap[a.key] = a);

  allContent.innerHTML = generateTable(finalMap);
  contentContainer.appendChild(allContent);

  allTab.addEventListener("click", () => switchTab(allTab, allContent));
}

function switchTab(tab, content) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(c => c.style.display = "none");

  tab.classList.add("active");
  content.style.display = "block";
}

// Initialize everything
generateTabs(allTracks);

</script>
</body>
</html>
