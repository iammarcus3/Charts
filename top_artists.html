<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Top Radio Songs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      padding: 2rem;
      margin: 0;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .chart-container {
      max-height: 80vh;
      overflow-y: auto;
      border-top: 2px solid #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #222;
    }
    th, td {
      padding: 0.6rem;
      border-bottom: 1px solid #333;
      text-align: left;
    }
    th {
      background: #333;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    tr:hover {
      background: #2a2a2a;
    }
    .move-up { color: lime; }
    .move-down { color: red; }
    .no-change { color: deepskyblue; }
    .re-enter { color: gold; }
    .bold-new {
      font-weight: bold;
      color: orange;
    }
    select, button {
      margin-right: 1rem;
      padding: 0.5rem;
      background: #222;
      color: #fff;
      border: 1px solid #555;
    }
  </style>
</head>
<body>
  <h1>Top 100 Radio Songs (Audience-Based)</h1>
  <div style="margin-bottom: 1rem;">
    <button onclick="changeWeek(-1)">⬅️</button>
    <select id="weekSelector" onchange="renderWeek(this.value)"></select>
    <button onclick="changeWeek(1)">➡️</button>
  </div>
  <div class="chart-container">
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Move</th>
          <th>Title</th>
          <th>Artist</th>
          <th>Sales</th>
          <th>Audience</th>
          <th>Points</th>
          <th>#1 Count</th>
          <th>Peak</th>
        </tr>
      </thead>
      <tbody id="chartBody"></tbody>
    </table>
  </div>

  <script src="weekdata.js"></script>
  <script>
    const startDate = new Date("2018-02-23");
    const allWeeks = Object.keys(weekData).map(Number).sort((a, b) => b - a);
    let currentWeek = allWeeks[0];
    const numberOneCountsByWeek = {};

    // Build number one counts for each week (only current and past)
    allWeeks.forEach(week => {
      if (!numberOneCountsByWeek[week]) numberOneCountsByWeek[week] = {};
      const songs = weekData[week];
      if (!songs) return;

      const topRadio = songs.reduce((max, song) => {
        const lifetime = getWeeksCharted(song.title, song.artist, week);
        const mult = getMultiplier(lifetime);
        const aud = song.sales * mult;
        return (!max || aud > max.audience) ? { song, audience: aud } : max;
      }, null);

      if (topRadio) {
        const key = topRadio.song.title.toLowerCase() + "|" + topRadio.song.artist.toLowerCase();
        numberOneCountsByWeek[week][key] = true;
      }
    });

    function getNumberOneCount(key, upToWeek) {
      let count = 0;
      for (let w = 1; w <= upToWeek; w++) {
        if (numberOneCountsByWeek[w] && numberOneCountsByWeek[w][key]) {
          count++;
        }
      }
      return count;
    }

    function getWeekDateRange(week) {
      const start = new Date(startDate);
      start.setDate(start.getDate() + (week - 1) * 7);
      const end = new Date(start);
      end.setDate(end.getDate() + 6);
      return `${start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${end.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
    }

    const weekSelector = document.getElementById("weekSelector");
    allWeeks.forEach(w => {
      const opt = document.createElement("option");
      opt.value = w;
      opt.textContent = `Week ${w} - ${getWeekDateRange(w)}`;
      weekSelector.appendChild(opt);
    });

    function changeWeek(dir) {
      const idx = allWeeks.indexOf(currentWeek);
      const newIndex = idx - dir;
      if (newIndex >= 0 && newIndex < allWeeks.length) {
        currentWeek = allWeeks[newIndex];
        weekSelector.value = currentWeek;
        renderWeek(currentWeek);
      }
    }

    function getWeeksCharted(title, artist, upToWeek) {
      let count = 0;
      for (let w = 1; w <= upToWeek; w++) {
        if (!weekData[w]) continue;
        if (weekData[w].some(s =>
          s.title.toLowerCase() === title.toLowerCase() &&
          s.artist.toLowerCase() === artist.toLowerCase()
        )) {
          count++;
        }
      }
      return count;
    }

    function wasChartedBefore(title, artist, week) {
      for (let w = 1; w < week; w++) {
        const entries = weekData[w];
        if (!entries) continue;
        if (entries.some(s =>
          s.title.toLowerCase() === title.toLowerCase() &&
          s.artist.toLowerCase() === artist.toLowerCase()
        )) {
          return true;
        }
      }
      return false;
    }

    function getPreviousRank(song, lastWeekData) {
      const match = lastWeekData.find(s =>
        s.title.toLowerCase() === song.title.toLowerCase() &&
        s.artist.toLowerCase() === song.artist.toLowerCase()
      );
      return match ? parseInt(match.rank) : null;
    }

    function getMovementPercent(prevRank, currentRank) {
      if (!prevRank) return null;
      const change = prevRank - currentRank;
      let percent = (change / prevRank) * 100;
      percent = Math.min(100, Math.abs(Math.round(percent)));

      return change > 0 ? `▲ ${percent}%`
           : change < 0 ? `▼ ${percent}%`
           : `● 0%`;
    }

    function getMultiplier(weeks) {
      if (weeks <= 4) return 2890;
      if (weeks <= 10) return 8450;
      if (weeks <= 16) return 11040;
      if (weeks <= 20) return 8690;
      if (weeks <= 30) return 4540;
      if (weeks <= 40) return 3090;
      return 1010;
    }

    // Calculate peak rank for a song up to current week (lowest rank)
    function getPeakRank(title, artist, upToWeek) {
      let peak = 10000; // arbitrarily large number
      for (let w = 1; w <= upToWeek; w++) {
        if (!weekData[w]) continue;
        const entry = weekData[w].find(s =>
          s.title.toLowerCase() === title.toLowerCase() &&
          s.artist.toLowerCase() === artist.toLowerCase()
        );
        if (entry && entry.rank < peak) {
          peak = entry.rank;
        }
      }
      return peak === 10000 ? "—" : peak;
    }

    function renderWeek(weekNum) {
      const week = parseInt(weekNum);
      currentWeek = week;
      const currentSongs = weekData[week] || [];
      const lastWeekSongs = weekData[week - 1] || [];

      let enhanced = currentSongs.map(song => {
        const lifetimeWeeks = getWeeksCharted(song.title, song.artist, week);
        const multiplier = getMultiplier(lifetimeWeeks);
        const audience = song.sales * multiplier;
        const points = song.sales + audience;
        const key = (song.title.toLowerCase() + "|" + song.artist.toLowerCase());
        const timesAtOne = getNumberOneCount(key, week);
        const previousRank = getPreviousRank(song, lastWeekSongs);
        let movement = getMovementPercent(previousRank, song.rank);

        if (!previousRank) {
          movement = wasChartedBefore(song.title, song.artist, week) ? "🔁" : "🆕";
        }

        const peak = getPeakRank(song.title, song.artist, week);

        return {
          ...song,
          audience,
          points,
          timesAtOne,
          movement,
          peak,
          isNew: movement === "🆕"
        };
      });

      enhanced.sort((a, b) => b.points - a.points);
      const top100 = enhanced.slice(0, 100);

      const body = document.getElementById("chartBody");
      body.innerHTML = "";
      top100.forEach((song, i) => {
        let moveClass = "";
        if (typeof song.movement === "string" && song.movement.includes("▲")) moveClass = "move-up";
        else if (typeof song.movement === "string" && song.movement.includes("▼")) moveClass = "move-down";
        else if (song.movement === "● 0%") moveClass = "no-change";
        else if (song.movement === "🔁") moveClass = "re-enter";
        else if (song.movement === "🆕") moveClass = "move-up";

        const titleHTML = song.isNew ? `<span class="bold-new">${song.title}</span>` : song.title;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${i + 1}</td>
          <td class="${moveClass}">${song.movement}</td>
          <td>${titleHTML}</td>
          <td>${song.artist}</td>
          <td>${song.sales.toLocaleString()}</td>
          <td>${Math.round(song.audience).toLocaleString()}</td>
          <td>${Math.round(song.points / 1000).toLocaleString()}</td>
          <td>${song.timesAtOne}</td>
          <td>${song.peak}</td>
        `;
        body.appendChild(tr);
      });
    }

    weekSelector.value = currentWeek;
    renderWeek(currentWeek);
  </script>
</body>
</html>
