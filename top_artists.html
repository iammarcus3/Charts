<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Top Artists by Year</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 2rem;
      color: #222;
    }
    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 2rem;
    }
    section {
      margin-bottom: 3rem;
    }
    h2 {
      background: #333;
      color: white;
      padding: 0.5rem 1rem;
      margin-bottom: 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 0.7rem;
      border: 1px solid #ccc;
      text-align: left;
    }
    th {
      background: #eee;
      text-transform: uppercase;
      font-size: 0.85rem;
    }
    td a {
      color: #007acc;
      text-decoration: none;
    }
    td a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>🎤 Top 20 Artists by Year (Units Sold)</h1>

  <div id="container">
    <p>Loading data...</p>
  </div>

  <script src="weekdata.js"></script>
  <script>
    function formatNumber(n) {
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
      if (n >= 1_000) return (n / 1_000).toFixed(0) + 'K';
      return n.toString();
    }

    window.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("container");
      const yearlyArtistStats = {};

      for (const week in weekData) {
        const entries = weekData[week];
        const year = 2018 + Math.floor((parseInt(week) - 1) / 52);

        if (!yearlyArtistStats[year]) yearlyArtistStats[year] = {};

        entries.forEach(entry => {
          const sales = parseFloat(entry.sales) || 0;
          const rank = parseInt(entry.rank);
          const title = entry.title || "";
          const artists = (entry.artist || "").split(/,|&| and | with | feat\.? | featuring /i).map(s => s.trim());

          artists.forEach(artist => {
            const key = artist.toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (!yearlyArtistStats[year][key]) {
              yearlyArtistStats[year][key] = {
                name: artist,
                totalSales: 0,
                weeks: new Set(),
                num1TracksSet: new Set(),
                top10s: 0
              };
            }

            const artistObj = yearlyArtistStats[year][key];
            artistObj.totalSales += sales * 2000;
            artistObj.weeks.add(week);

            if (rank === 1) {
              const trackKey = title.toUpperCase().replace(/[^A-Z0-9]/g, '');
              artistObj.num1TracksSet.add(trackKey);
            }
            if (rank <= 20) artistObj.top20s++;
          });
        });
      }

      container.innerHTML = "";

      Object.keys(yearlyArtistStats).sort().forEach(year => {
        const artistArray = Object.values(yearlyArtistStats[year]).map(artistObj => ({
          name: artistObj.name,
          totalSales: artistObj.totalSales,
          weeks: artistObj.weeks.size,
          num1s: artistObj.num1TracksSet.size,
          top10s: artistObj.top10s
        }));

        artistArray.sort((a, b) => b.totalSales - a.totalSales);
        const top10 = artistArray.slice(0, 20);

        const section = document.createElement("section");
        const header = document.createElement("h2");
        header.textContent = year;
        section.appendChild(header);

        const table = document.createElement("table");
        const thead = document.createElement("thead");
        thead.innerHTML = `
          <tr>
            <th>Rank</th>
            <th>Artist</th>
            <th>Total Sales</th>
            <th>Weeks Charted</th>
            <th>#1s</th>
            <th>Top 10s</th>
          </tr>`;
        table.appendChild(thead);

        const tbody = document.createElement("tbody");
        top10.forEach((a, i) => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${i + 1}</td>
            <td><a href="artist.html?artist=${encodeURIComponent(a.name)}">${a.name}</a></td>
            <td>${formatNumber(a.totalSales)}</td>
            <td>${a.weeks}</td>
            <td>${a.num1s}</td>
            <td>${a.top10s}</td>
          `;
          tbody.appendChild(row);
        });

        table.appendChild(tbody);
        section.appendChild(table);
        container.appendChild(section);
      });
    });
  </script>
</body>
</html>
