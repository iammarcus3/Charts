<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Album Chart Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #fff; color: #000; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }
    .up { color: green; }
    .down { color: red; }
    .new { font-weight: bold; color: blue; }
  </style>
</head>
<body>
  <h1>Album Chart Test</h1>
  <label>Select Week:
    <select id="weekSelect"></select>
  </label>

  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>Move</th>
        <th>Album</th>
        <th>Artist</th>
        <th>Sales</th>
        <th>Total Sales</th>
        <th>Weeks</th>
        <th>Peak</th>
      </tr>
    </thead>
    <tbody id="albumTable"></tbody>
  </table>

  <script src="weekdata.js"></script>
  <script>
    const weekKeys = Object.keys(weekData).sort((a, b) => +a - +b);
    const weekSelect = document.getElementById("weekSelect");
    const tableBody = document.getElementById("albumTable");

    weekKeys.forEach(w => {
      const opt = document.createElement("option");
      opt.value = w;
      opt.textContent = `Week ${w}`;
      weekSelect.appendChild(opt);
    });

    weekSelect.value = weekKeys[0];
    weekSelect.addEventListener("change", () => render(+weekSelect.value));
    render(+weekSelect.value);

    function normalize(str) {
      return str?.toLowerCase().replace(/ *[\[\(].*?[\]\)] */g, '').replace(/[^a-z0-9]/g, '');
    }

    function getAlbumDataUpToWeek(targetWeek) {
      const albumMap = {};
      for (let w = 1; w <= targetWeek; w++) {
        const weekEntries = weekData[w];
        if (!weekEntries) continue;

        weekEntries.forEach(entry => {
          if (!entry.album || !entry.title || !entry.artist) return;
          const key = normalize(entry.album) + "|" + normalize(entry.artist);
          if (!albumMap[key]) {
            albumMap[key] = {
              album: entry.album,
              artist: entry.artist,
              totalSales: 0,
              salesByWeek: {},
              peaks: [],
              weeks: new Set()
            };
          }
          const album = albumMap[key];
          album.totalSales += entry.sales;
          album.salesByWeek[w] = (album.salesByWeek[w] || 0) + entry.sales;
          album.weeks.add(w);
        });
      }

      const currentWeekAlbums = Object.values(albumMap).map(album => {
        const salesThisWeek = album.salesByWeek[targetWeek] || 0;
        return {
          ...album,
          salesThisWeek,
          weeksCount: album.weeks.size
        };
      }).filter(a => a.salesThisWeek > 0);

      currentWeekAlbums.sort((a, b) => b.salesThisWeek - a.salesThisWeek);
      currentWeekAlbums.forEach((album, i) => album.rank = i + 1);

      // Track peaks
      Object.values(albumMap).forEach(album => {
        album.peak = Infinity;
        for (let w = 1; w <= targetWeek; w++) {
          const wk = weekData[w];
          if (!wk) continue;
          let sales = 0;
          wk.forEach(e => {
            const key = normalize(e.album) + "|" + normalize(e.artist);
            if (key === normalize(album.album) + "|" + normalize(album.artist)) {
              sales += e.sales;
            }
          });
          if (sales > 0) {
            // Rank for this week
            const allAlbums = {};
            wk.forEach(e => {
              const k = normalize(e.album) + "|" + normalize(e.artist);
              allAlbums[k] = (allAlbums[k] || 0) + e.sales;
            });
            const sorted = Object.entries(allAlbums).sort((a, b) => b[1] - a[1]);
            const currentRank = sorted.findIndex(([k]) => k === normalize(album.album) + "|" + normalize(album.artist)) + 1;
            if (currentRank && currentRank < album.peak) album.peak = currentRank;
          }
        }
      });

      return currentWeekAlbums;
    }

    function getLastWeekAlbumRanks(week) {
      const lastWeekAlbums = {};
      if (!weekData[week - 1]) return lastWeekAlbums;

      const prevAlbumMap = {};
      weekData[week - 1].forEach(entry => {
        const key = normalize(entry.album) + "|" + normalize(entry.artist);
        prevAlbumMap[key] = (prevAlbumMap[key] || 0) + entry.sales;
      });

      const sorted = Object.entries(prevAlbumMap).sort((a, b) => b[1] - a[1]);
      sorted.forEach(([key], i) => {
        lastWeekAlbums[key] = i + 1;
      });

      return lastWeekAlbums;
    }

    function render(week) {
      const albums = getAlbumDataUpToWeek(week);
      const lastRanks = getLastWeekAlbumRanks(week);

      tableBody.innerHTML = "";
      albums.forEach(album => {
        const key = normalize(album.album) + "|" + normalize(album.artist);
        let move = "";
        if (!lastRanks[key]) {
          move = `<span class="new">NEW</span>`;
        } else {
          const change = lastRanks[key] - album.rank;
          if (change > 0) move = `<span class="up">+${change}</span>`;
          else if (change < 0) move = `<span class="down">${change}</span>`;
          else move = `<span>=</span>`;
        }

        const row = `
          <tr>
            <td>${album.rank}</td>
            <td>${move}</td>
            <td>${album.album}</td>
            <td>${album.artist}</td>
            <td>${album.salesThisWeek.toLocaleString()}</td>
            <td>${album.totalSales.toLocaleString()}</td>
            <td>${album.weeksCount}</td>
            <td>${album.peak}</td>
          </tr>
        `;
        tableBody.insertAdjacentHTML("beforeend", row);
      });
    }
  </script>
</body>
</html>
