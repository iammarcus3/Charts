<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Album Chart Test</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff; color: #111; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    select, button { font-size: 1rem; margin: 0.5rem 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.5rem; text-align: left; border: 1px solid #ccc; }
    th { background: #f0f0f0; }
  </style>
</head>
<body>
  <h1>Album Chart Test</h1>
  <label for="weekSelector">Select Week:</label>
  <select id="weekSelector"></select>
  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>Move</th>
        <th>Album</th>
        <th>Artist</th>
        <th>Sales</th>
        <th>Weeks</th>
        <th>Peak</th>
      </tr>
    </thead>
    <tbody id="albumTableBody"></tbody>
  </table>

  <script src="weekdata.js"></script>
  <script>
    const weekSelector = document.getElementById('weekSelector');
    const tbody = document.getElementById('albumTableBody');
    const albumHistory = {};

    function normalize(str) {
      return str.toLowerCase().replace(/[\s\-–_(){}\[\]]+/g, '').replace(/(deluxe|bonus|edition|version)/gi, '');
    }

    const weekKeys = Object.keys(weekData).sort((a, b) => Number(a) - Number(b));
    weekKeys.forEach(week => {
      const opt = document.createElement('option');
      opt.value = week;
      opt.textContent = `Week ${week}`;
      weekSelector.appendChild(opt);
    });

    function getAlbumKey(title, artist) {
      return normalize(title) + '___' + normalize(artist);
    }

    function loadWeek(weekNum) {
      const currentWeek = weekData[weekNum];
      const prevWeek = weekData[weekKeys[weekKeys.indexOf(weekNum) - 1]] || [];

      const albums = {};
      const albumSongsCount = {};

      currentWeek.forEach(song => {
        if (!song.album || !song.artist || !song.sales) return;
        const key = getAlbumKey(song.album, song.artist);
        albums[key] = albums[key] || {
          album: song.album,
          artist: song.artist,
          sales: 0,
          songs: [],
        };
        albums[key].sales += song.sales;
        albums[key].songs.push(song);
      });

      // Filter out albums with fewer than 2 songs
      const filtered = Object.entries(albums).filter(([key, val]) => val.songs.length >= 2);

      const ranked = filtered.map(([key, data]) => ({
        key,
        ...data
      })).sort((a, b) => b.sales - a.sales);

      ranked.forEach((album, index) => {
        album.rank = index + 1;
        const hist = albumHistory[album.key] || { weeks: 0, peak: null, seen: false, lastRank: null };
        hist.weeks += 1;
        if (hist.peak === null || album.rank < hist.peak) hist.peak = album.rank;

        let move;
        if (!hist.seen) {
          move = "NEW";
          hist.seen = true;
        } else if (hist.lastRank == null) {
          move = "RE";
        } else if (album.rank < hist.lastRank) {
          move = `+${hist.lastRank - album.rank}`;
        } else if (album.rank > hist.lastRank) {
          move = `-${album.rank - hist.lastRank}`;
        } else {
          move = "=";
        }

        hist.lastRank = album.rank;
        album.move = move;
        album.weeks = hist.weeks;
        album.peak = hist.peak;
        albumHistory[album.key] = hist;
      });

      // Render
      tbody.innerHTML = "";
      ranked.forEach(album => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${album.rank}</td>
          <td>${album.move}</td>
          <td>${album.album}</td>
          <td>${album.artist}</td>
          <td>${album.sales.toLocaleString()}</td>
          <td>${album.weeks}</td>
          <td>${album.peak}</td>
        `;
        tbody.appendChild(row);
      });
    }

    weekSelector.addEventListener('change', e => {
      loadWeek(e.target.value);
    });

    weekSelector.value = weekKeys[0];
    loadWeek(weekKeys[0]);
  </script>
</body>
</html>
