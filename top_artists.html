<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Top Radio Songs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      padding: 2rem;
      margin: 0;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .chart-container {
      max-height: 80vh;
      overflow-y: auto;
      border-top: 2px solid #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #222;
    }
    th, td {
      padding: 0.6rem;
      border-bottom: 1px solid #333;
      text-align: left;
    }
    th {
      background: #333;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    tr:hover {
      background: #2a2a2a;
    }
    .move-up { color: lime; }
    .move-down { color: red; }
    .no-change { color: deepskyblue; }
    .re-enter-icon { color: gold; font-weight: bold; }
    .bold-new {
      font-weight: bold;
      color: #7FFF00; /* chartreuse green */
    }
    .percent-green {
      color: limegreen;
      font-weight: bold;
      margin-left: 3px;
    }
    .percent-red {
      color: orangered;
      font-weight: bold;
      margin-left: 3px;
    }
    .percent-blue {
      color: deepskyblue;
      font-weight: bold;
      margin-left: 3px;
    }
    select, button {
      margin-right: 1rem;
      padding: 0.5rem;
      background: #222;
      color: #fff;
      border: 1px solid #555;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Top 100 Radio Songs (Audience-Based)</h1>
  <div style="margin-bottom: 1rem;">
    <button onclick="changeWeek(-1)">⬅️</button>
    <select id="weekSelector" onchange="renderWeek(this.value)"></select>
    <button onclick="changeWeek(1)">➡️</button>
  </div>
  <div class="chart-container">
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Move</th>
          <th>Title</th>
          <th>Artist</th>
          <th>Sales</th>
          <th>Audience</th>
          <th>Points</th>
          <th>Peak</th>
          <th>#1 Count</th>
        </tr>
      </thead>
      <tbody id="chartBody"></tbody>
    </table>
  </div>

  <script src="weekdata.js"></script>
  <script>
    const startDate = new Date("2018-02-23");
    const allWeeks = Object.keys(weekData).map(Number).sort((a, b) => b - a);
    let currentWeek = allWeeks[0];
    const numberOneCountsByWeek = {};

    // Precompute #1 counts per song by week
    allWeeks.forEach(week => {
      if (!numberOneCountsByWeek[week]) numberOneCountsByWeek[week] = {};
      const songs = weekData[week];
      if (!songs) return;

      const topRadio = songs.reduce((max, song) => {
        const lifetime = getWeeksCharted(song.title, song.artist, week);
        const mult = getMultiplier(lifetime);
        const aud = song.sales * mult;
        return (!max || aud > max.audience) ? { song, audience: aud } : max;
      }, null);

      if (topRadio) {
        const key = topRadio.song.title.toLowerCase() + "|" + topRadio.song.artist.toLowerCase();
        numberOneCountsByWeek[week][key] = true;
      }
    });

    function getNumberOneCount(key, upToWeek) {
      let count = 0;
      for (let w = 1; w <= upToWeek; w++) {
        if (numberOneCountsByWeek[w] && numberOneCountsByWeek[w][key]) {
          count++;
        }
      }
      return count;
    }

    const weekSelector = document.getElementById("weekSelector");
    allWeeks.forEach(w => {
      const opt = document.createElement("option");
      const dateRange = getWeekDateRange(w);
      opt.value = w;
      opt.textContent = `Week ${w} - ${dateRange}`;
      weekSelector.appendChild(opt);
    });

    function getWeekDateRange(week) {
      const start = new Date(startDate);
      start.setDate(start.getDate() + (week - 1) * 7);
      const end = new Date(start);
      end.setDate(end.getDate() + 6);
      return `${start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${end.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
    }

    function changeWeek(dir) {
      const idx = allWeeks.indexOf(currentWeek);
      const newIndex = idx - dir;
      if (newIndex >= 0 && newIndex < allWeeks.length) {
        currentWeek = allWeeks[newIndex];
        weekSelector.value = currentWeek;
        renderWeek(currentWeek);
      }
    }

    function getWeeksCharted(title, artist, upToWeek) {
      let count = 0;
      for (let w = 1; w <= upToWeek; w++) {
        if (!weekData[w]) continue;
        const matched = weekData[w].find(s =>
          s.title.toLowerCase() === title.toLowerCase() &&
          s.artist.toLowerCase() === artist.toLowerCase()
        );
        if (matched) count++;
      }
      return count;
    }

    function getPeakPosition(title, artist, upToWeek) {
      let peak = Infinity;
      for (let w = 1; w <= upToWeek; w++) {
        if (!weekData[w]) continue;
        const songEntry = weekData[w].find(s =>
          s.title.toLowerCase() === title.toLowerCase() &&
          s.artist.toLowerCase() === artist.toLowerCase()
        );
        if (songEntry) {
          const rankNum = parseInt(songEntry.rank);
          if (rankNum < peak) peak = rankNum;
        }
      }
      return peak === Infinity ? "-" : peak;
    }

    function wasChartedBefore(title, artist, week) {
      for (let w = 1; w < week; w++) {
        const entries = weekData[w];
        if (!entries) continue;
        if (entries.some(s =>
          s.title.toLowerCase() === title.toLowerCase() &&
          s.artist.toLowerCase() === artist.toLowerCase()
        )) {
          return true;
        }
      }
      return false;
    }

    function getPreviousEntry(song, lastWeekData) {
      return lastWeekData.find(s =>
        s.title.toLowerCase() === song.title.toLowerCase() &&
        s.artist.toLowerCase() === song.artist.toLowerCase()
      );
    }

    // Main render function
    function renderWeek(weekNum) {
      const week = parseInt(weekNum);
      currentWeek = week;
      const currentSongs = weekData[week] || [];
      const lastWeekSongs = weekData[week - 1] || [];

      // Create enhanced song objects with calculations
      let enhanced = currentSongs.map(song => {
        const lifetimeWeeks = getWeeksCharted(song.title, song.artist, week);
        const multiplier = getMultiplier(lifetimeWeeks);
        const audience = song.sales * multiplier;
        const points = song.sales + audience;
        const key = (song.title.toLowerCase() + "|" + song.artist.toLowerCase());
        const timesAtOne = getNumberOneCount(key, week);
        const peak = getPeakPosition(song.title, song.artist, week);
        const prevEntry = getPreviousEntry(song, lastWeekSongs);
        const previousRank = prevEntry ? parseInt(prevEntry.rank) : null;
        const previousPoints = prevEntry ? (prevEntry.sales + (prevEntry.sales * getMultiplier(getWeeksCharted(prevEntry.title, prevEntry.artist, week - 1)))) : null;

        // Movement arrow based on rank change
        let movementArrow = "";
        if (previousRank === null) {
          movementArrow = wasChartedBefore(song.title, song.artist, week) ? "⚡" : "🆕";
        } else if (song.rank < previousRank) {
          movementArrow = "▲";
        } else if (song.rank > previousRank) {
          movementArrow = "▼";
        } else {
          movementArrow = "●";
        }

        // Points % difference and color
        let percentChangeText = "";
        if (previousPoints !== null) {
          let diff = points - previousPoints;
          let percentChange = previousPoints === 0 ? 0 : (Math.abs(diff) / previousPoints) * 100;
          percentChange = Math.min(100, Math.round(percentChange));
          const isUp = diff > 0;
          const isDown = diff < 0;
          const isSame = diff === 0;

          if (isUp) {
            percentChangeText = `<span class="percent-green">${percentChange}%</span>`;
          } else if (isDown) {
            percentChangeText = `<span class="percent-red">${percentChange}%</span>`;
          } else {
            percentChangeText = `<span class="percent-blue">0%</span>`;
          }
        } else {
          percentChangeText = ""; // no previous data, no %
        }

        // Final movement cell combining arrow and colored %
        let movementCell = "";
        if (movementArrow === "🆕") {
          movementCell = `<span class="move-up bold-new">${movementArrow}</span>`;
        } else if (movementArrow === "⚡") {
          movementCell = `<span class="re-enter-icon">${movementArrow}</span>`;
        } else {
          let arrowClass = "";
          if (movementArrow === "▲") arrowClass = "move-up";
          else if (movementArrow === "▼") arrowClass = "move-down";
          else arrowClass = "no-change";

          movementCell = `<span class="${arrowClass}">${movementArrow}</span> ${percentChangeText}`;
        }

        // Title styling: bold and green for new songs
        const titleStyled = movementArrow === "🆕"
          ? `<span class="bold-new">${song.title}</span>`
          : song.title;

        return {
          ...song,
          audience,
          points,
          timesAtOne,
          peak,
          movementCell,
          titleStyled,
          isNew: movementArrow === "🆕"
        };
      });

      // Sort descending by points
      enhanced.sort((a, b) => b.points - a.points);
      const top100 = enhanced.slice(0, 100);

      const body = document.getElementById("chartBody");
      body.innerHTML = "";

      top100.forEach((song, i) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${i + 1}</td>
          <td>${song.movementCell}</td>
          <td>${song.titleStyled}</td>
          <td>${song.artist}</td>
          <td>${song.sales.toLocaleString()}</td>
          <td>${Math.round(song.audience).toLocaleString()}</td>
          <td>${Math.round(song.points / 1000).toLocaleString()}</td>
          <td>${song.peak}</td>
          <td>${song.timesAtOne}</td>
        `;
        body.appendChild(tr);
      });
    }

    // Multiplier function based on weeks on chart
    function getMultiplier(weeks) {
      if (weeks <= 4) return 2890;
      if (weeks <= 10) return 8450;
      if (weeks <= 16) return 11040;
      if (weeks <= 20) return 8690;
      if (weeks <= 30) return 4540;
      if (weeks <= 40) return 3090;
      return 1010;
    }

    // Initialize selector and render first week
    weekSelector.value = currentWeek;
    renderWeek(currentWeek);
  </script>
</body>
</html>
