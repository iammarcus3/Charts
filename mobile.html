<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Billboard Hot 100 — Dark UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.json">
  <script src="weekdata.js"></script>
  <style>
    :root{
      --bg:#0b0b0c;
      --panel:#121214;
      --panel-2:#17171a;
      --ink:#eaeaea;
      --muted:#a7a7b1;
      --cyan:#00ffff;
      --cyan-600:#00d6d6;
      --mag:#f82aaa;
      --green:#33ff99;
      --red:#ff5a5a;
      --gold:#ffd66b;
      --row:#141417;
      --row-hover:#1a1a1f;
      --border:#23232a;
      --rank:#0e0e10;
      --chip:#1f2230;
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --radius:14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:linear-gradient(180deg,#0b0b0c 0%, #0d0d0f 30%, #101015 100%);
      color:var(--ink); font: 15px/1.5 "Inter","Helvetica Neue",Arial,system-ui,sans-serif;
    }

    .shell{max-width:1200px;margin:0 auto;padding:20px}
    .topbar{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
      padding:12px 16px; box-shadow:var(--shadow); position:sticky; top:0; z-index:50; backdrop-filter: blur(6px);
    }
    .brand{ display:flex; align-items:center; gap:12px; }
    .logo{
      width:40px;height:40px;border-radius:10px;background:conic-gradient(from 210deg,#00ffff,#f82aaa,#00ffff);
      box-shadow:0 0 0 2px #111, 0 8px 22px rgba(0,0,0,.45);
    }
    .title{ display:flex; flex-direction:column; }
    .title h1{ margin:0; font-size:1.25rem; letter-spacing:.18em; text-transform:uppercase; color:var(--cyan); }
    .subtitle{font-size:.82rem; color:var(--muted)}
    .controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
    .btn, .select, .input{
      height:36px; padding:0 12px; border-radius:10px; border:1px solid var(--border);
      background:var(--panel-2); color:var(--ink); outline:none; font-weight:600;
    }
    .btn{cursor:pointer}
    .btn.primary{background:var(--cyan); color:#0b0b0c; border-color:transparent; font-weight:800}
    .btn.primary:hover{background:var(--cyan-600)}
    .btn.ghost{background:transparent}
    .btn.ghost:hover{background:#17171d}
    .select{color:var(--cyan); font-weight:700}
    .pill{
      background:var(--chip); color:var(--muted); border:1px solid var(--border);
      padding:6px 10px; border-radius:999px; font-size:.78rem; letter-spacing:.04em;
    }

    /* Tabs */
    .tabs{ display:flex; gap:8px; margin:16px 0 10px; flex-wrap:wrap }
    .tab{
      cursor:pointer; user-select:none; padding:10px 14px; border-radius:12px;
      background:var(--panel); border:1px solid var(--border); color:var(--muted); font-weight:700;
    }
    .tab.active{background:var(--cyan); color:#081012; border-color:transparent; box-shadow: 0 4px 20px rgba(0,255,255,.25)}
    .tab span{opacity:.8}

    /* Board */
    .board{
      background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
      box-shadow:var(--shadow); overflow:hidden;
    }
    .board-head{
      display:flex; justify-content:space-between; align-items:center; padding:12px 16px;
      background:var(--panel-2); border-bottom:1px solid var(--border);
    }
    .date-range{font-weight:700; color:#cfe; letter-spacing:.04em}
    .legend{display:flex; gap:8px; flex-wrap:wrap}
    .key{display:flex; align-items:center; gap:6px; color:var(--muted); font-size:.85rem}
    .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
    .dot.reentry{background:#9aa}

    .table-wrap{max-height:68vh; overflow:auto}
    table{width:100%; border-collapse:collapse}
    thead th{
      position:sticky; top:0; z-index:2; background:var(--panel-2);
      color:#bff; font-size:.78rem; letter-spacing:.14em; text-transform:uppercase;
      border-bottom:1px solid var(--border); padding:12px 10px; text-align:left;
    }
    tbody td{
      border-bottom:1px solid var(--border); padding:12px 10px; vertical-align:middle; background:var(--row);
    }
    tbody tr:hover td{ background:var(--row-hover)}
    .rank{
      font-weight:900; width:1%; white-space:nowrap; color:#dff;
      display:inline-flex; align-items:center; justify-content:center; min-width:42px; height:32px;
      padding:0 10px; border-radius:999px; background:var(--rank); border:1px solid #202028;
      cursor:pointer;
    }
    .move{font-weight:800; font-size:.92rem}
    .move.up{color:var(--green)}
    .move.down{color:var(--red)}
    .move.flat{color:#9aa}
    .title-cell a,.artist-cell a{color:var(--ink); text-decoration:none; font-weight:700}
    .title-cell a:hover,.artist-cell a:hover{color:var(--cyan)}
    .badges{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
    .badge{
      font-size:.66rem; font-weight:900; letter-spacing:.08em; padding:6px 8px; border-radius:8px; text-transform:uppercase;
      border:1px solid var(--border); background:var(--chip); color:#cfd6ff;
    }
    .badge.hot{background:linear-gradient(90deg,#f82aaa,#ff8ad2); color:#0b0b0c}
    .badge.re{background:linear-gradient(90deg,#9aa,#d0d0da); color:#0b0b0c}

    .num{font-variant-numeric:tabular-nums; white-space:nowrap}
    .points-bar{
      height:8px; border-radius:999px; background:#1f1f26; overflow:hidden; border:1px solid #242432; width:120px
    }
    .points-bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--cyan),#7af8f8)}

    .details-row td{ background:#101419 !important; border-top:1px dashed #26303a; color:#bff}
    .detail-grid{display:grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap:10px}
    .detail-item{padding:8px 10px; border:1px solid #223; border-radius:10px; background:#0e1218; color:#cfe}

    .pager{
      display:flex; align-items:center; justify-content:center; gap:8px; padding:12px; background:var(--panel-2); border-top:1px solid var(--border)
    }
    .page-btn{
      min-width:40px; height:36px; padding:0 12px; border-radius:10px; border:1px solid var(--border);
      background:var(--panel); color:#cfe; font-weight:800; cursor:pointer;
    }
    .page-btn.active{background:var(--cyan); color:#021015; border-color:transparent}
    .page-btn:hover{background:#1a1f23}

    .hide{display:none !important}
    .right{ text-align:right }
    .muted{color:var(--muted)}
    .nowrap{white-space:nowrap}
    .spacer{flex:1}

    /* Mobile Helper */
    @media (max-width: 768px) {
      .mobile-helper { display: flex !important; }
    }
    .mobile-helper {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99;
      background: rgba(18, 18, 20, 0.95);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 8px 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
      align-items: center;
      gap: 10px;
    }

    /* Strong mobile layout */
    @media (max-width: 820px) {
      body{
        font-size:14px;
        min-width:0;
        overflow-x:hidden;
      }
      .shell{
        width:100%;
        max-width:100%;
        padding:10px;
        padding-bottom:88px;
      }
      .topbar{
        position:sticky;
        top:8px;
        flex-direction:column;
        align-items:stretch;
        padding:12px;
        border-radius:18px;
      }
      .brand{
        width:100%;
        min-width:0;
      }
      .logo{
        width:34px;
        height:34px;
        border-radius:9px;
        flex:0 0 auto;
      }
      .title{
        min-width:0;
      }
      .title h1{
        font-size:1rem;
        letter-spacing:.08em;
        white-space:normal;
        line-height:1.15;
      }
      .subtitle{
        font-size:.74rem;
        line-height:1.25;
      }
      .controls{
        display:grid;
        grid-template-columns:44px 1fr 44px;
        gap:8px;
        width:100%;
      }
      .controls .btn,
      .controls .select,
      .controls .input{
        min-height:44px;
        height:44px;
        border-radius:12px;
        font-size:.92rem;
      }
      #weekSelector{
        width:100%;
        min-width:0;
      }
      #metaCount,
      #metaType,
      #todayBtn{
        grid-column:span 1;
      }
      .controls .pill{
        display:flex;
        align-items:center;
        justify-content:center;
        min-height:38px;
        text-align:center;
        padding:6px 8px;
        font-size:.72rem;
      }
      #todayBtn{
        width:100%;
      }
      .tabs{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:8px;
        margin:12px 0 10px;
      }
      .tab{
        text-align:center;
        padding:12px 10px;
        border-radius:14px;
      }
      .board{
        border-radius:18px;
        overflow:visible;
      }
      .board-head{
        flex-direction:column;
        align-items:flex-start;
        gap:8px;
        padding:12px;
        border-radius:18px 18px 0 0;
      }
      .date-range{
        font-size:.92rem;
      }
      .legend{
        width:100%;
      }
      .table-wrap{
        max-height:none;
        overflow:visible;
      }
      table,
      thead,
      tbody,
      tr,
      th,
      td{
        display:block;
        width:100%;
      }
      thead{
        display:none;
      }
      tbody{
        padding:8px;
        background:var(--panel);
      }
      tbody tr{
        margin:0 0 10px;
        border:1px solid var(--border);
        border-radius:16px;
        overflow:hidden;
        background:var(--row);
        box-shadow:0 8px 24px rgba(0,0,0,.22);
      }
      tbody tr:hover td{
        background:var(--row);
      }
      tbody td{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:12px;
        padding:10px 12px;
        border-bottom:1px solid var(--border);
        background:transparent;
        text-align:right;
        min-width:0;
      }
      tbody td:last-child{
        border-bottom:0;
      }
      tbody td::before{
        content:'';
        color:var(--muted);
        font-size:.72rem;
        font-weight:900;
        letter-spacing:.12em;
        text-transform:uppercase;
        flex:0 0 86px;
        text-align:left;
      }
      tbody td:nth-child(1)::before{content:'Rank'}
      tbody td:nth-child(2)::before{content:'Move'}
      tbody td:nth-child(3)::before{content:'Title'}
      tbody td:nth-child(4)::before{content:'Artist'}
      tbody td:nth-child(5)::before{content:'Points'}
      tbody td:nth-child(6)::before{content:'Sales'}
      .rank{
        min-width:44px;
        height:34px;
      }
      .title-cell,
      .artist-cell{
        text-align:left;
      }
      .title-cell > div{
        justify-content:flex-end;
        max-width:100%;
        min-width:0;
      }
      .title-cell a,
      .artist-cell a{
        overflow-wrap:anywhere;
        line-height:1.25;
      }
      .badges{
        justify-content:flex-end;
      }
      .badge{
        font-size:.58rem;
        padding:5px 6px;
      }
      .points-bar{
        width:min(42vw,160px);
      }
      .details-row{
        border-style:dashed;
      }
      .details-row td{
        display:block;
        text-align:left;
      }
      .details-row td::before{
        content:none !important;
      }
      .detail-grid{
        grid-template-columns:1fr;
      }
      .pager{
        flex-wrap:wrap;
        gap:6px;
        padding:10px;
        border-radius:0 0 18px 18px;
      }
      .page-btn{
        min-width:44px;
        height:42px;
      }
      .mobile-helper{
        width:calc(100% - 24px);
        max-width:360px;
        justify-content:space-between;
        bottom:12px;
        padding:8px;
      }
      .mobile-helper .btn{
        min-height:42px;
        height:42px;
        flex:1;
      }
    }

    @media (max-width: 420px) {
      .controls{
        grid-template-columns:42px 1fr 42px;
      }
      #metaCount,
      #metaType{
        font-size:.66rem;
      }
      tbody td{
        align-items:flex-start;
        flex-direction:column;
        text-align:left;
      }
      tbody td::before{
        flex:auto;
        margin-bottom:2px;
      }
      .title-cell > div,
      .badges{
        justify-content:flex-start;
      }
      .points-bar{
        width:100%;
      }
      .right{
        text-align:left;
      }
    }

  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div class="title">
          <h1>Billboard Hot 100</h1>
          <div class="subtitle">Dark Edition • Keyboard: ←/→ week, 1–2 tabs</div>
        </div>
      </div>
      <div class="controls">
        <button class="btn ghost" id="prevWeek" title="Previous week">⟵</button>
        <select id="weekSelector" class="select" title="Select week"></select>
        <button class="btn ghost" id="nextWeek" title="Next week">⟶</button>
        <span class="pill" id="metaCount">—</span>
        <span class="pill" id="metaType">Tracks</span>
        <button class="btn primary" id="todayBtn" title="Jump to latest week">Latest</button>
      </div>
    </div>

    <div class="tabs" role="tablist" aria-label="Chart type">
      <div class="tab" data-chart="tracks" data-key="1" role="tab" aria-selected="true" tabindex="0"><span>Tracks</span></div>
      <div class="tab" data-chart="albums" data-key="2" role="tab" aria-selected="false" tabindex="0"><span>Albums</span></div>
    </div>

    <div class="board">
      <div class="board-head">
        <div class="date-range" id="dateRange">—</div>
        <div class="legend">
          <div class="key"><i class="dot reentry"></i> Re-Entry</div>
        </div>
      </div>

      <div class="table-wrap">
        <table id="chart" aria-describedby="dateRange">
          <thead id="thead">
            <tr>
              <th style="width:64px;">Rank</th>
              <th style="width:90px;">Move</th>
              <th>Title</th>
              <th>Artist</th>
              <th>Points</th>
              <th class="right">Sales</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="pager" id="pager"></div>
    </div>
  </div>

  <div class="mobile-helper" aria-hidden="true">
    <button class="btn ghost" onclick="document.getElementById('prevWeek').click()">⟵</button>
    <button class="btn primary" onclick="document.getElementById('todayBtn').click()">Latest</button>
    <button class="btn ghost" onclick="document.getElementById('nextWeek').click()">⟶</button>
  </div>

  <script>
    // ---------- Utils ----------
    const clamp = (n,min,max)=>Math.max(min,Math.min(max,n));
    const nz = (v, d=0)=> (Number.isFinite(+v) ? +v : d);
    const fmtK = n => {
      const x = nz(n);
      if (Math.abs(x) >= 1_000_000) return (x/1_000_000).toFixed(2)+'M';
      if (Math.abs(x) >= 1_000) return (x/1_000).toFixed(2)+'K';
      return x.toFixed(2);
    };
    const fmtInt = n => nz(n).toLocaleString('en-US');
    const fmtMove = diff => diff>0? {txt:`+${diff}`, cls:'up'} : diff<0? {txt:`${diff}`, cls:'down'} : {txt:'—', cls:'flat'};
    const normalize = (text)=> String(text ?? '').toLowerCase()
      .replace(/\(.*?\)|\[.*?\]|feat\..*/g,'')
      .replace(/[^a-z0-9]/g,'');
    const getFuzzyKey = (title,artist)=> normalize(title)+normalize(artist);

    // ---------- State ----------
    let currentWeek = 1;
    let currentChart = 'tracks';
    let currentPage = 1;
    const PAGE_SIZE = 100;

    const weekSel = document.getElementById('weekSelector');
    const dateRangeEl = document.getElementById('dateRange');
    const tbody = document.querySelector('#chart tbody');
    const pager = document.getElementById('pager');
    const metaCount = document.getElementById('metaCount');
    const metaType = document.getElementById('metaType');
    const thead = document.getElementById('thead');

    // ---------- Week/date helpers ----------
    function getDateRange(weekNum){
      const start = new Date(2018,1,23);
      start.setDate(start.getDate() + (weekNum - 1) * 7);
      const end = new Date(start); end.setDate(start.getDate()+6);
      const fmt = { day:'numeric', month:'short', year:'numeric' };
      return `${start.toLocaleDateString('en-GB',fmt)} – ${end.toLocaleDateString('en-GB',fmt)}`;
    }
    function allWeeks(){
      return Object.keys(weekData || {}).map(k => +k).filter(n=>!isNaN(n)).sort((a,b)=>a-b);
    }

    // ---------- Dynamic header (with Sales column) ----------
    function setTableHeader(kind){
      let cols;
      if(kind==='tracks'){
        cols = ['Rank','Move','Title','Artist','Points','Sales'];
      } else if(kind==='albums'){
        cols = ['Rank','Move','Album','Artist','Index','Sales'];
      } else {
        cols = ['Rank','Move','Title','Artist','Points','Sales'];
      }
      let html = `<tr>
        <th style="width:64px;">${cols[0]}</th>
        <th style="width:90px;">${cols[1]}</th>
        <th>${cols[2]}</th>
        <th>${cols[3]}</th>
        <th>${cols[4]}</th>`;
      if (cols[5]) html += `<th class="right">${cols[5]}</th>`;
      html += `</tr>`;
      thead.innerHTML = html;
    }

    // ---------- Tabs ----------
    function activateTab(tabEl){
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      tabEl.classList.add('active');
      currentChart = tabEl.dataset.chart;
      metaType.textContent = currentChart.charAt(0).toUpperCase()+currentChart.slice(1);
      currentPage = 1;
      saveState();
      loadWeek(currentWeek);
    }

    document.querySelectorAll('.tab').forEach(tab=>{
      tab.addEventListener('click', ()=> activateTab(tab));
      tab.addEventListener('keydown', (e)=>{
        if(e.key==='Enter' || e.key===' '){ tab.click(); e.preventDefault(); }
      });
    });

    // ---------- Week selector ----------
    function populateWeekSelector(){
      weekSel.innerHTML='';
      const weeks = allWeeks();
      for(const w of weeks){
        const opt = document.createElement('option');
        opt.value = w;
        opt.textContent = getDateRange(w);
        weekSel.appendChild(opt);
      }
      weekSel.addEventListener('change', ()=> loadWeek(+weekSel.value));
      return weeks;
    }

    document.getElementById('prevWeek').onclick = ()=> stepWeek(-1);
    document.getElementById('nextWeek').onclick = ()=> stepWeek(+1);
    document.getElementById('todayBtn').onclick = ()=> {
      const w = Math.max(...allWeeks());
      loadWeek(w);
    };

    // Keyboard shortcuts: week nav + number keys for tabs (1–2)
    window.addEventListener('keydown',(e)=>{
      if(e.key==='ArrowLeft') stepWeek(-1);
      if(e.key==='ArrowRight') stepWeek(+1);
      if(/^[1-2]$/.test(e.key)){
        const tab = document.querySelector(`.tab[data-key="${e.key}"]`);
        if(tab) activateTab(tab);
      }
    });

    function stepWeek(delta){
      const weeks = allWeeks();
      const idx = weeks.indexOf(currentWeek);
      const ni = clamp(idx+delta, 0, weeks.length-1);
      loadWeek(weeks[ni]);
    }

    // ---------- History cache for tracks ----------
    function buildTrackHistory(weekNumber){
      const history = {};
      for(let i=1;i<weekNumber;i++){
        for(const row of (weekData[i]||[])){
          const key = getFuzzyKey(row.title, row.artist);
          (history[key] ||= []).push({...row});
        }
      }
      return history;
    }

    // ---------- Render: Tracks ----------
    function renderTrackChart(entries, weekNumber){
      const history = buildTrackHistory(weekNumber);
      const currentTracks = (entries||[]).filter(r=>r && r.title && r.artist);
      const enriched = currentTracks.map(row=>{
        const key = getFuzzyKey(row.title,row.artist);
        const past = history[key]||[];
        const totalWeeks = past.length + 1;
        const bestPeak = Math.min(...past.map(r=>+r.rank).concat([+row.rank || 999])) || (row.rank||'—');
        return {
          ...row,
          totalWeeks,
          bestPeak: Number.isFinite(bestPeak) ? bestPeak : '—',
          points: nz(row.points),
          radio: nz(row.radio),
          streams: nz(row.streams),
          sales: nz(row.sales),
          _key:key
        };
      });

      enriched.sort((a,b)=> b.points - a.points);

      // Pagination
      metaCount.textContent = `${enriched.length.toLocaleString()} entries`;
      const totalPages = Math.max(1, Math.ceil(enriched.length / PAGE_SIZE));
      currentPage = clamp(currentPage, 1, totalPages);
      drawPager(totalPages);
      const slice = enriched.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE);

      const lastWeek = weekData[weekNumber-1] || [];
      const lastSet = new Set(lastWeek.map(r=> getFuzzyKey(r.title, r.artist)));

      tbody.innerHTML='';
      slice.forEach((row, i)=>{
        const wasLast = lastSet.has(row._key);
        const past = (buildTrackHistory(weekNumber)[row._key] || []);
        const lastRank = past.length ? nz(past[past.length-1].rank, null) : null;

        let move = {txt:'—', cls:'flat'};
        if(past.length===0) move = {txt:'NEW', cls:'flat'};
        else if(!wasLast) move = {txt:'RE', cls:'flat'};
        else {
          const diff = (Number.isFinite(lastRank) ? lastRank : nz(row.rank)) - nz(row.rank);
          move = fmtMove(diff);
        }

        const tr = document.createElement('tr');

        const rankDisplay = ((currentPage-1)*PAGE_SIZE + i + 1);
        const hotShot = past.length===0 ? `<span class="badge hot">Hot Shot Debut</span>` : '';
        const re = (past.length>0 && !wasLast) ? `<span class="badge re">Re-Entry</span>` : '';

        const barWidth = Math.max(2, Math.min(100, row.points>0 ? (row.points / (slice[0]?.points || row.points)) * 100 : 0));

        tr.innerHTML = `
          <td><span class="rank" title="Show details">${rankDisplay}</span></td>
          <td class="move ${move.cls}">${move.txt}</td>
          <td class="title-cell">
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap">
              <a href="track_detail.html?title=${encodeURIComponent(row.title)}&artist=${encodeURIComponent(row.artist)}">${row.title || '—'}</a>
              <span class="badges">${hotShot}${re}</span>
            </div>
          </td>
          <td class="artist-cell"><a href="artist.html?artist=${encodeURIComponent(row.artist)}">${row.artist || '—'}</a></td>
          <td>
            <div class="points-bar" title="${row.points.toFixed(2)} pts"><i style="width:${barWidth}%"></i></div>
          </td>
          <td class="right num">${nz(row.sales)>0 ? fmtInt(row.sales) : '—'}</td>
        `;
        tr.querySelector('.rank').addEventListener('click', ()=> showTrackDetails(row, weekNumber, tr));
        tbody.appendChild(tr);
      });
    }

    // ---------- Albums helpers: compute peak rank across weeks ----------
    function computeAlbumPeak(weekNumber, albumKey){
      let peak = Infinity;
      for(let i=1;i<=weekNumber;i++){
        const entries = weekData[i] || [];
        const m = {};
        for(const r of entries){
          if(!r || !r.album || typeof r.album!=='string' || r.album.trim().toLowerCase()==='nan') continue;
          const k = normalize(r.album)+'||'+normalize(r.artist||'');
          (m[k] ||= {sales:0, tracks:new Set()});
          m[k].sales += nz(r.sales);
          m[k].tracks.add(normalize(r.title));
        }
        const qualified = Object.entries(m)
          .filter(([,v])=> v.tracks.size>=2)
          .sort((a,b)=> b[1].sales - a[1].sales);
        const idx = qualified.findIndex(([k])=> k===albumKey);
        if(idx>=0) peak = Math.min(peak, idx+1);
      }
      return Number.isFinite(peak) ? peak : '—';
    }

    // ---------- Render: Albums ----------
    function renderAlbumChart(entries, weekNumber){
      const albumsMap = {};
      for(const row of (entries||[])){
        if(!row || !row.album || typeof row.album!=='string' || row.album.trim().toLowerCase()==='nan') continue;
        const key = normalize(row.album)+'||'+normalize(row.artist||'');
        (albumsMap[key] ||= { album: row.album, artist: row.artist || '', sales:0, tracks: new Set(), _key:key });
        albumsMap[key].sales += nz(row.sales);
        albumsMap[key].tracks.add(normalize(row.title));
      }
      let qualified = Object.values(albumsMap).filter(a => a.tracks.size >= 2);

      // History (weeks appeared with >=2 tracks)
      const history = {};
      for(let i=1;i<weekNumber;i++){
        const weekAlbums = {};
        for(const r of (weekData[i]||[])){
          if(!r.album || typeof r.album!=='string' || r.album.trim().toLowerCase()==='nan') continue;
          const k = normalize(r.album)+'||'+normalize(r.artist||'');
          (weekAlbums[k] ||= { sales:0, tracks:new Set() });
          weekAlbums[k].sales += nz(r.sales);
          weekAlbums[k].tracks.add(normalize(r.title));
        }
        for(const [k,v] of Object.entries(weekAlbums)){
          if(v.tracks.size >= 2) (history[k] ||= []).push(i);
        }
      }

      const lastWeekAlbums = {};
      if(weekData[weekNumber-1]){
        const prevEntries={};
        for(const r of weekData[weekNumber-1]){
          if(!r.album || typeof r.album!=='string' || r.album.trim().toLowerCase()==='nan') continue;
          const k = normalize(r.album)+'||'+normalize(r.artist||'');
          (prevEntries[k] ||= { sales:0, tracks:new Set() });
          prevEntries[k].sales += nz(r.sales);
          prevEntries[k].tracks.add(normalize(r.title));
        }
        const prevQualified = Object.values(prevEntries).filter(a=>a.tracks.size>=2).sort((a,b)=> b.sales - a.sales);
        prevQualified.forEach((a,i)=> lastWeekAlbums[a._key || (Object.keys(albumsMap).find(k=>k===k))] = i+1);
        prevQualified.forEach(a=>{
          const k = Object.keys(prevEntries).find(kk=>prevEntries[kk]===a);
          if(k) lastWeekAlbums[k]= lastWeekAlbums[k] || 1;
        });
      }

      qualified = qualified.map(a=>{
        const weeks = history[a._key] || [];
        return {...a, totalWeeks: weeks.length+1};
      }).sort((a,b)=> b.sales - a.sales);

      metaCount.textContent = `${qualified.length.toLocaleString()} albums`;
      const totalPages = Math.max(1, Math.ceil(qualified.length / PAGE_SIZE));
      currentPage = clamp(currentPage,1,totalPages);
      drawPager(totalPages);
      const slice = qualified.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE);

      tbody.innerHTML='';

      const prevOrder = {};
      if(weekData[weekNumber-1]){
        const prevMap={};
        for(const r of weekData[weekNumber-1]){
          if(!r.album || typeof r.album!=='string' || r.album.trim().toLowerCase()==='nan') continue;
          const k = normalize(r.album)+'||'+normalize(r.artist||'');
          (prevMap[k] ||= {sales:0, tracks:new Set()});
          prevMap[k].sales += nz(r.sales);
          prevMap[k].tracks.add(normalize(r.title));
        }
        const prevQualified = Object.entries(prevMap).filter(([,v])=> v.tracks.size>=2)
          .map(([k,v])=>({k, sales:v.sales})).sort((a,b)=> b.sales - a.sales);
        prevQualified.forEach((o,i)=> prevOrder[o.k] = i+1);
      }

      slice.forEach((a,idx)=>{
        const currentRank = (currentPage-1)*PAGE_SIZE + idx + 1;
        const wasLast = a._key in prevOrder;
        let move = {txt:'—', cls:'flat'};
        if((history[a._key]||[]).length===0) move = {txt:'NEW', cls:'flat'};
        else if(!wasLast) move = {txt:'RE', cls:'flat'};
        else {
          const diff = prevOrder[a._key] - currentRank;
          move = fmtMove(diff);
        }

        const hot = (history[a._key]||[]).length===0 ? `<span class="badge hot">Hot Shot Debut</span>` : '';
        const re = (!wasLast && (history[a._key]||[]).length>0) ? `<span class="badge re">Re-Entry</span>` : '';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><span class="rank" title="Show details">${currentRank}</span></td>
          <td class="move ${move.cls}">${move.txt}</td>
          <td class="title-cell">
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap">
              <a href="album_data.html?album=${encodeURIComponent(a.album)}&artist=${encodeURIComponent(a.artist)}">${a.album}</a>
              <span class="badges">${hot}${re}</span>
            </div>
          </td>
          <td class="artist-cell"><a href="artist.html?artist=${encodeURIComponent(a.artist)}">${a.artist || '—'}</a></td>
          <td>
            <div class="points-bar" title="Album index">
              <i style="width:${Math.max(2, (a.sales>0? (a.sales/(slice[0]?.sales||a.sales))*100:0))}%"></i>
            </div>
          </td>
          <td class="right num">${nz(a.sales)>0 ? fmtInt(a.sales) : '—'}</td>
        `;
        tr.querySelector('.rank').addEventListener('click', ()=> showAlbumDetails(a, weekNumber, tr));
        tbody.appendChild(tr);
      });
    }

    // ---------- Details (expand/collapse) ----------
    let expandedRow = null;
    function toggleDetails(rowEl, detailsHTML){
      if(expandedRow && expandedRow.previousSibling === rowEl){
        expandedRow.remove(); expandedRow = null; return;
      }
      if(expandedRow) { expandedRow.remove(); expandedRow = null; }
      const tr = document.createElement('tr');
      tr.className = 'details-row';
      const td = document.createElement('td');
      td.colSpan = document.querySelectorAll('#thead th').length; // span current column count
      td.innerHTML = detailsHTML;
      tr.appendChild(td);
      rowEl.parentNode.insertBefore(tr, rowEl.nextSibling);
      expandedRow = tr;
      tr.scrollIntoView({block:'nearest', behavior:'smooth'});
    }

    function showTrackDetails(row, weekNumber, trEl){
      const lastWeek = weekData[weekNumber-1] || [];
      const prev = lastWeek.find(r=> getFuzzyKey(r.title,r.artist) === getFuzzyKey(row.title,row.artist));
      const lastRank = prev ? prev.rank : '—';
      const pct = (prev && prev.points>0) ? (((row.points - prev.points)/prev.points)*100).toFixed(1)+'%' : '—';

      const html = `
        <div class="detail-grid">
          <div class="detail-item"><strong>Radio</strong><div>${(nz(row.radio)/1_000_000).toFixed(2)}M</div></div>
          <div class="detail-item"><strong>Streams</strong><div>${(nz(row.streams)/1_000_000).toFixed(2)}M</div></div>
          <div class="detail-item"><strong>Last Week Rank</strong><div>${lastRank}</div></div>
          <div class="detail-item"><strong>Change (pts)</strong><div>${pct}</div></div>
          <div class="detail-item"><strong>Weeks on Chart</strong><div>${fmtInt(row.totalWeeks)}</div></div>
          <div class="detail-item"><strong>Peak Position</strong><div>${fmtInt(row.bestPeak)}</div></div>
        </div>
      `;
      toggleDetails(trEl, html);
    }

    function showAlbumDetails(albumObj, weekNumber, trEl){
      const peak = computeAlbumPeak(weekNumber, albumObj._key);
      const html = `
        <div class="detail-grid">
          <div class="detail-item"><strong>Weeks qualified</strong><div>${fmtInt(albumObj.totalWeeks)}</div></div>
          <div class="detail-item"><strong>Peak Position</strong><div>${fmtInt(peak)}</div></div>
          <div class="detail-item"><strong>Tracks charting</strong><div>${albumObj.tracks?.size ?? '—'}</div></div>
        </div>
      `;
      toggleDetails(trEl, html);
    }

    // ---------- Pager ----------
    function drawPager(totalPages){
      pager.innerHTML='';
      const mk = (label, page, active=false)=>{
        const b = document.createElement('button');
        b.className = 'page-btn' + (active?' active':'');
        b.textContent = label;
        b.addEventListener('click', ()=> { currentPage = page; saveState(); loadWeek(currentWeek); });
        return b;
      };
      const prev = mk('Prev', clamp(currentPage-1,1,totalPages));
      const next = mk('Next', clamp(currentPage+1,1,totalPages));
      if(currentPage<=1) prev.disabled = true;
      if(currentPage>=totalPages) next.disabled = true;

      pager.appendChild(prev);
      const nums = [];
      const pushUnique = p=> { if(!nums.includes(p) && p>=1 && p<=totalPages) nums.push(p); };
      pushUnique(1);
      pushUnique(currentPage-1); pushUnique(currentPage); pushUnique(currentPage+1);
      pushUnique(totalPages);
      nums.sort((a,b)=>a-b);
      let last = 0;
      nums.forEach(p=>{
        if(p>last+1){ const gap = document.createElement('span'); gap.className='muted'; gap.textContent='…'; pager.appendChild(gap); }
        pager.appendChild(mk(p, p, p===currentPage)); last = p;
      });

      pager.appendChild(next);
    }

    // ---------- Load / Save UI state ----------
    function saveState(){
      try{
        localStorage.setItem('bb_state', JSON.stringify({ currentWeek, currentChart, currentPage }));
      }catch(e){}
    }
    function restoreState(){
      try{
        const s = JSON.parse(localStorage.getItem('bb_state')||'{}');
        if(s.currentChart) currentChart = s.currentChart;
        if(s.currentPage) currentPage = s.currentPage;
        if(s.currentWeek) currentWeek = s.currentWeek;
      }catch(e){}
      document.querySelectorAll('.tab').forEach(t=>{
        t.classList.toggle('active', t.dataset.chart===currentChart);
      });
      metaType.textContent = currentChart.charAt(0).toUpperCase()+currentChart.slice(1);
    }

    // ---------- Main load ----------
    function loadWeek(weekNumber){
      currentWeek = weekNumber;
      saveState();

      const entries = weekData[weekNumber] || [];
      dateRangeEl.textContent = getDateRange(weekNumber);
      weekSel.value = weekNumber;

      setTableHeader(currentChart);

      if(currentChart==='tracks') renderTrackChart(entries, weekNumber);
      else if(currentChart==='albums') renderAlbumChart(entries, weekNumber);
      else renderTrackChart(entries, weekNumber);
    }

    // ---------- Boot ----------
    (function init(){
      const weeks = populateWeekSelector();
      restoreState();
      if(!weeks.length){
        tbody.innerHTML = `<tr><td colspan="6" class="muted">No data found in <code>weekdata.js</code>.</td></tr>`;
        return;
      }
      if(!weeks.includes(currentWeek)) currentWeek = weeks[weeks.length-1];
      loadWeek(currentWeek);
    })();
  </script>
</body>
</html>
