<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090f">
  <title>Stats Paradise — YourHot100</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09090f;
      --panel: #11111b;
      --panel-2: #171725;
      --border: #28283a;
      --text: #f5f5fb;
      --muted: #9999b2;
      --accent: #b9a5ff;
      --accent-2: #f0a8df;
      --green: #65d6a0;
      --red: #ff858e;
      --yellow: #f3d17a;
      --radius: 16px;
      --shadow: 0 12px 35px rgb(0 0 0 / 22%);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(ellipse at 0% 0%, rgb(123 86 210 / 12%), transparent 38rem),
        radial-gradient(ellipse at 100% 5%, rgb(230 100 175 / 8%), transparent 34rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    button, input, select {
      font: inherit;
    }

    button, select, input {
      color: var(--text);
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .shell {
      width: min(1800px, 100%);
      margin: 0 auto;
      padding: 26px clamp(14px, 3vw, 42px) 60px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(24px, 4vw, 48px);
      border: 1px solid var(--border);
      border-radius: 24px;
      background:
        linear-gradient(120deg, rgb(114 85 184 / 22%), transparent 55%),
        linear-gradient(300deg, rgb(202 96 169 / 11%), transparent 50%),
        var(--panel);
      box-shadow: var(--shadow);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 250px;
      height: 250px;
      right: -80px;
      top: -120px;
      border-radius: 50%;
      background: rgb(185 165 255 / 13%);
      filter: blur(4px);
      pointer-events: none;
    }

    .eyebrow {
      color: var(--accent);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    h1 {
      margin: 7px 0 12px;
      font-size: clamp(2.2rem, 6vw, 4.8rem);
      line-height: 1;
      letter-spacing: -.055em;
    }

    .hero p {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
    }

    .hero-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 24px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      padding: 6px 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgb(255 255 255 / 3%);
      color: var(--muted);
      font-size: .78rem;
      overflow-wrap: anywhere;
    }

    .pill.good { color: var(--green); }
    .pill.warn { color: var(--yellow); }
    .pill.bad { color: var(--red); }

    .section-title {
      margin: 30px 0 14px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
    }

    .section-title h2 {
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 1.65rem);
      letter-spacing: -.035em;
    }

    .section-title p {
      color: var(--muted);
      margin: 5px 0 0;
      font-size: .86rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .stat-card,
    .record-card,
    .panel {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .stat-card {
      padding: 18px;
    }

    .stat-label {
      color: var(--muted);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .04em;
      overflow-wrap: anywhere;
    }

    .stat-value {
      margin-top: 8px;
      font-size: clamp(1.55rem, 3vw, 2.2rem);
      font-weight: 850;
      letter-spacing: -.045em;
      overflow-wrap: anywhere;
    }

    .stat-note {
      margin-top: 4px;
      color: var(--muted);
      font-size: .78rem;
      overflow-wrap: anywhere;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 25px 0 14px;
    }

    .nav button,
    .action-button {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel);
      color: var(--muted);
      font-weight: 750;
      cursor: pointer;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }

    .nav button:hover,
    .action-button:hover {
      color: var(--text);
      border-color: #555570;
    }

    .nav button.active {
      color: #171020;
      border-color: transparent;
      background: linear-gradient(105deg, var(--accent), var(--accent-2));
    }

    .filters {
      display: grid;
      grid-template-columns: minmax(180px, 2fr) repeat(3, minmax(130px, 1fr));
      gap: 10px;
      margin: 14px 0;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .field {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      color: var(--muted);
      font-size: .73rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .field input,
    .field select {
      width: 100%;
      min-width: 0;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0b0b13;
    }

    .date-filters {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .date-filters[hidden] { display: none; }

    .panel {
      padding: clamp(12px, 2vw, 22px);
    }

    .table-heading {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .table-heading h2 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: -.03em;
      overflow-wrap: anywhere;
    }

    .table-heading p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .82rem;
    }

    .table-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      flex-shrink: 0;
    }

    .action-button {
      padding: 8px 10px;
      font-size: .78rem;
    }

    .result-count {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: .82rem;
    }

    .table-wrap { min-width: 0; }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      font-size: .84rem;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 12px 9px;
      background: #1b1b2b;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      color: #d4d1e8;
      text-align: left;
      font-size: .72rem;
      letter-spacing: .035em;
      overflow-wrap: anywhere;
      white-space: normal;
    }

    thead th:first-child {
      border-left: 1px solid var(--border);
      border-top-left-radius: 9px;
    }

    thead th:last-child {
      border-right: 1px solid var(--border);
      border-top-right-radius: 9px;
    }

    tbody td {
      padding: 12px 9px;
      border-bottom: 1px solid #222234;
      vertical-align: top;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    tbody tr:hover td {
      background: rgb(255 255 255 / 2%);
    }

    .cell-main {
      display: block;
      color: var(--text);
      font-weight: 750;
    }

    .cell-sub {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: .76rem;
    }

    .rank {
      color: var(--accent);
      font-weight: 900;
      white-space: nowrap;
    }

    .trend-up { color: var(--green); font-weight: 800; }
    .trend-down { color: var(--red
