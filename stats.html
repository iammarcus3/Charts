    <!-- PWA Manifest Injection -->
    <script>
        const setupPWA = () => {
            const manifest = {
                name: "YourHot100 Charts",
                short_name: "Hot100",
                display: "standalone",
                background_color: "#000000",
                theme_color: "#000000",
                icons: [{ src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='black'/%3E%3Ctext y='50%' x='50%' dominant-baseline='middle' text-anchor='middle' font-size='40' fill='white'%3E100%3C/text%3E%3C/svg%3E", sizes: "192x192", type: "image/svg+xml" }]
            };
            const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);
            document.head.appendChild(link);
        };
        setupPWA();
    </script>

    <script>
        const LASTFM_API_KEY = "ed9c6dcac73ea1adcd3750efeea9b822";
        const artworkCache = new Map();

        const FORMULAS = {
            songUnits: (plays, points) => (plays * 50000) + (points * 500),
            albumUnits: (plays, points) => (plays * 5000) + (points * 500)
        };

        const MIN_ALBUM_TRACKS = 3;
        const WEEK_MS = 7 * 24 * 60 * 60 * 1000;

        const app = {
            state: {
                currentView: 'dashboard',
                weekOffset: 0,
                minOffset: 0,
                data: { songs: [], albums: [] },
                raw: { tracks: null, albums: null, artists: null, history: null },
                snapshots: { songs: {}, albums: {}, dates: {} },
                milestones: null
            },

            escapeHTML(value) {
                return String(value ?? '').replace(/[&<>"']/g, char => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                })[char]);
            },

            pageLink(type, id, label) {
                const pages = { track: 'track.html', album: 'album.html', artist: 'artist.html' };
                const safeLabel = this.escapeHTML(label || 'Unknown');
                if (!id || !pages[type]) return safeLabel;
                return `<a href="${pages[type]}?id=${encodeURIComponent(String(id))}" class="hover:text-white hover:underline transition-colors">${safeLabel}</a>`;
            },

            timestampSeconds(value) {
                if (value && typeof value === 'object') {
                    value = value.uts ?? value.timestamp ?? value.played_at ?? value.date ?? value['#text'];
                }
                if (typeof value === 'number' && Number.isFinite(value)) {
                    return value > 1e12 ? Math.floor(value / 1000) : Math.floor(value);
                }
                if (typeof value === 'string' && value.trim()) {
                    const numeric = Number(value);
                    if (Number.isFinite(numeric)) return numeric > 1e12 ? Math.floor(numeric / 1000) : Math.floor(numeric);
                    const parsed = Date.parse(value);
                    if (Number.isFinite(parsed)) return Math.floor(parsed / 1000);
                }
                return null;
            },

            getWeekStartMs(timestampSeconds) {
                const date = new Date(timestampSeconds * 1000);
                date.setUTCHours(0, 0, 0, 0);
                const daysSinceFriday = (date.getUTCDay() + 2) % 7;
                date.setUTCDate(date.getUTCDate() - daysSinceFriday);
                return date.getTime();
            },

            pointsForRank(rank) {
                if (rank === 1) return 100;
                if (rank === 2) return 98;
                // Smoothly interpolate from #2 = 98 to #100 = 1.
                return Math.max(1, Math.round(98 - ((rank - 2) * 97 / 98)));
            },

            async init() {
                await this.loadVaultData();
                this.navigate('dashboard');
            },

            async loadVaultData() {
                this.showLoading(true);
                try {
                    const paths = [
                        'vault/tracks.json',
                        'vault/albums.json',
                        'vault/artists.json',
                        'vault/listening_history.jsonl'
                    ];
                    const responses = await Promise.all(paths.map(path => fetch(path)));
                    const failed = responses.find((response, index) => !response.ok);
                    if (failed) {
                        const index = responses.indexOf(failed);
                        throw new Error(`Could not load ${paths[index]} (HTTP ${failed.status}).`);
                    }

                    const parseMap = data => {
                        if (Array.isArray(data)) {
                            return new Map(data.filter(item => item && item.id).map(item => [String(item.id), item]));
                        }
                        if (data && typeof data === 'object') {
                            return new Map(Object.entries(data).map(([id, item]) => [String(id), item]));
                        }
                        throw new Error('Unexpected vault JSON structure.');
                    };

                    this.state.raw.tracks = parseMap(await responses[0].json());
                    this.state.raw.albums = parseMap(await responses[1].json());
                    this.state.raw.artists = parseMap(await responses[2].json());

                    const historyText = await responses[3].text();
                    const parsedEvents = historyText.trim()
                        ? historyText.trim().split(/\r?\n/).filter(Boolean).map(line => JSON.parse(line))
                        : [];

                    this.state.raw.history = parsedEvents
                        .filter(event => event && event.track_id)
                        .map(event => ({ ...event, timestamp: this.timestampSeconds(event.timestamp) }))
                        .filter(event => event.timestamp !== null && Number.isFinite(event.timestamp))
                        .sort((a, b) => a.timestamp - b.timestamp);

                    if (this.state.raw.history.length === 0) {
                        throw new Error('No valid timestamped listening events were found in listening_history.jsonl.');
                    }

                    this.buildAllSnapshots();
                } catch (error) {
                    console.error(error);
                    const container = document.getElementById('content-container');
                    container.innerHTML = `<div class="p-10 text-center text-red-400 font-bold border border-red-900 bg-red-950/30 rounded">Unable to load charts: ${this.escapeHTML(error.message)}</div>`;
                } finally {
                    this.showLoading(false);
                }
            },

            getArtistName(idRef) {
                if (!idRef) return 'Unknown Artist';
                const id = Array.isArray(idRef) ? idRef[0] : idRef;
                const obj = this.state.raw.artists.get(String(id));
                if (obj && (obj.name || obj.title)) return obj.name || obj.title;
                return 'Unknown Artist';
            },

            getTrackArtistIds(track) {
                if (!track) return [];
                let idFields = track.artist_ids ?? track.artists_ids ?? track.artistIds ?? track.artist_id_list;
                if (typeof idFields === 'string' && idFields.trim().startsWith('[')) {
                    try { idFields = JSON.parse(idFields); } catch (_) {}
                }
                const rawIds = Array.isArray(idFields) ? idFields : (idFields ? [idFields] : []);
                const ids = [];

                const resolveArtistId = value => {
                    if (value && typeof value === 'object') {
                        return value.id ?? value.artist_id ?? value.artistId ?? value.mbid ?? null;
                    }
                    if (value === null || value === undefined || value === '') return null;
                    const candidate = String(value).trim();
                    if (this.state.raw.artists?.has(candidate)) return candidate;
                    const byName = [...(this.state.raw.artists?.entries() || [])]
                        .find(([, artist]) => String(artist?.name || artist?.title || '').trim().toLowerCase() === candidate.toLowerCase());
                    return byName ? byName[0] : null;
                };

                rawIds.forEach(value => {
                    const id = resolveArtistId(value);
                    if (id && !ids.includes(String(id))) ids.push(String(id));
                });

                // Supplement ID fields with every available artist credit/name field.
                let credits = track.artist_names ?? track.artists ?? track.artist_credits ?? track.artist;
                if (!Array.isArray(credits)) {
                    credits = typeof credits === 'string'
                        ? credits.split(/,\s*|\s+(?:feat\.?|ft\.?|&|x)\s+/i).filter(Boolean)
                        : [];
                }
                credits.forEach(value => {
                    const id = resolveArtistId(value);
                    if (id && !ids.includes(String(id))) ids.push(String(id));
                });

                const leadId = track.primary_artist_id ?? track.artist_id;
                if (leadId && this.state.raw.artists?.has(String(leadId)) && !ids.includes(String(leadId))) {
                    ids.unshift(String(leadId));
                }
                return ids;
            },

            getTrackArtistNames(track) {
                const ids = this.getTrackArtistIds(track);
                if (ids.length) return ids.map(id => this.getArtistName(id));
                let credits = track?.artist_names ?? track?.artists ?? track?.artist_credits ?? track?.artist;
                if (!Array.isArray(credits)) {
                    credits = typeof credits === 'string'
                        ? credits.split(/,\s*|\s+(?:feat\.?|ft\.?|&|x)\s+/i).filter(Boolean)
                        : [];
                }
                const names = credits.map(value => typeof value === 'object'
                    ? (value.name || value.artist_name || value.title || '')
                    : String(value || '')).filter(Boolean);
                if (names.length) return [...new Set(names)];
                return [this.getArtistName(track?.primary_artist_id || track?.artist_id)];
            },

            artistCreditHTML(ids, fallbackId, fallbackName) {
                const uniqueIds = [...new Set((Array.isArray(ids) ? ids : []).filter(Boolean).map(String))];
                if (!uniqueIds.length && fallbackId) uniqueIds.push(String(fallbackId));
                if (uniqueIds.length) {
                    return uniqueIds.map(id => this.pageLink('artist', id, this.getArtistName(id))).join(', ');
                }
                return this.escapeHTML(fallbackName || 'Unknown Artist');
            },

            getTrackAlbumIds(track) {
                const ids = Array.isArray(track?.album_ids) ? track.album_ids : [];
                if (ids.length) return [...new Set(ids.map(String))];
                return track?.album_id ? [String(track.album_id)] : [];
            },

            buildAllSnapshots() {
                const history = this.state.raw.history;
                if (!history || history.length === 0) {
                    document.getElementById('content-container').innerHTML = `<div class="p-10 text-center text-zinc-500">No listening history found.</div>`;
                    return;
                }

                // Rebuild distinct album membership from both sides of the vault relationship.
                const albumTrackSets = new Map();
                this.state.raw.albums.forEach((album, albumId) => {
                    albumTrackSets.set(String(albumId), new Set(
                        (Array.isArray(album.track_ids) ? album.track_ids : [])
                            .map(String)
                            .filter(trackId => this.state.raw.tracks.has(trackId))
                    ));
                });
                this.state.raw.tracks.forEach((track, trackId) => {
                    this.getTrackAlbumIds(track).forEach(albumId => {
                        if (!albumTrackSets.has(albumId)) return;
                        albumTrackSets.get(albumId).add(String(trackId));
                    });
                });

                // Only releases with at least three distinct canonical tracks qualify.
                const eligibleAlbumIds = new Set();
                albumTrackSets.forEach((trackIds, albumId) => {
                    if (trackIds.size >= MIN_ALBUM_TRACKS) eligibleAlbumIds.add(albumId);
                });
                this.state.eligibleAlbumIds = eligibleAlbumIds;
                this.state.albumTrackCounts = albumTrackSets;

                // The latest available scrobble determines the latest chart week.
                const latestTimestamp = history[history.length - 1].timestamp;
                const latestWeekStart = this.getWeekStartMs(latestTimestamp);
                const latestWeekEnd = latestWeekStart + WEEK_MS - 1;

                const weeklyEvents = new Map();
                let minOffset = 0;

                history.forEach(event => {
                    const eventWeekStart = this.getWeekStartMs(event.timestamp);
                    const offset = Math.floor((eventWeekStart - latestWeekStart) / WEEK_MS);
                    if (offset > 0) return;
                    minOffset = Math.min(minOffset, offset);
                    if (!weeklyEvents.has(offset)) weeklyEvents.set(offset, []);
                    weeklyEvents.get(offset).push(event);
                });

                this.state.minOffset = minOffset;
                this.state.snapshots = { songs: {}, albums: {}, dates: {} };

                const songHistory = {};
                const albumHistory = {};

                for (let offset = minOffset; offset <= 0; offset++) {
                    const events = weeklyEvents.get(offset) || [];
                    const startMs = latestWeekStart + (offset * WEEK_MS);
                    const endMs = startMs + WEEK_MS - 1;
                    this.state.snapshots.dates[offset] = { start: startMs, end: endMs };

                    const trackPlays = new Map();
                    const albumPlays = new Map();

                    events.forEach(event => {
                        const trackId = String(event.track_id);
                        trackPlays.set(trackId, (trackPlays.get(trackId) || 0) + 1);

                        const track = this.state.raw.tracks.get(trackId);
                        if (!track) return;

                        // A play contributes to each eligible release containing this track.
                        this.getTrackAlbumIds(track).forEach(albumId => {
                            if (!eligibleAlbumIds.has(albumId)) return;
                            albumPlays.set(albumId, (albumPlays.get(albumId) || 0) + 1);
                        });
                    });

                    const currentSongs = this.compileBaseEntries(trackPlays, 'songs');
                    const currentAlbums = this.compileBaseEntries(albumPlays, 'albums');

                    this.state.snapshots.songs[offset] = this.applyHistory(currentSongs, songHistory, offset);
                    this.state.snapshots.albums[offset] = this.applyHistory(currentAlbums, albumHistory, offset);
                }

                this.buildMilestonesData();
                this.loadSnapshot(0);
            },

            buildMilestonesData() {
                const offsets = Object.keys(this.state.snapshots.dates).map(Number).sort((a, b) => a - b);
                const songs = new Map();
                const albums = new Map();
                const artists = new Map();
                const weeks = [];

                const ensureArtist = id => {
                    if (!id) return null;
                    const key = String(id);
                    if (!artists.has(key)) {
                        artists.set(key, {
                            id: key,
                            name: this.getArtistName(key),
                            songUnits: 0, songPoints: 0, songPlays: 0,
                            songChartAppearances: 0, songNo1Weeks: 0, songTop10Appearances: 0,
                            songIds: new Set(), no1SongIds: new Set(), top10Weeks: new Set(),
                            maxTop10SongsInWeek: 0,
                            albumUnits: 0, albumPoints: 0, albumPlays: 0,
                            albumChartAppearances: 0, albumNo1Weeks: 0,
                            albumIds: new Set(), no1AlbumIds: new Set()
                        });
                    }
                    return artists.get(key);
                };

                const ensureSong = entry => {
                    const key = String(entry.id);
                    if (!songs.has(key)) {
                        songs.set(key, {
                            id: key, title: entry.title || 'Unknown Track',
                            artist: entry.artist || 'Unknown Artist',
                            artist_id: entry.artist_id || null,
                            artist_ids: entry.artist_ids || (entry.artist_id ? [String(entry.artist_id)] : []),
                            peak: 101, peakOffset: null, debutOffset: null, lastOffset: null,
                            weeksOnChart: 0, weeksAtNo1: 0, weeksTop10: 0,
                            totalPlays: 0, totalPoints: 0, totalUnits: 0,
                            currentNo1Streak: 0, maxNo1Streak: 0,
                            currentChartStreak: 0, maxChartStreak: 0,
                            lastNo1Offset: null, bestWeek: null, history: []
                        });
                    }
                    return songs.get(key);
                };

                const ensureAlbum = entry => {
                    const key = String(entry.id);
                    if (!albums.has(key)) {
                        albums.set(key, {
                            id: key, title: entry.title || 'Unknown Album',
                            artist: entry.artist || 'Unknown Artist',
                            artist_id: entry.artist_id || null,
                            peak: 101, peakOffset: null, debutOffset: null, lastOffset: null,
                            weeksOnChart: 0, weeksAtNo1: 0, weeksTop10: 0,
                            totalPlays: 0, totalPoints: 0, totalUnits: 0,
                            currentNo1Streak: 0, maxNo1Streak: 0,
                            currentChartStreak: 0, maxChartStreak: 0,
                            lastNo1Offset: null, bestWeek: null, history: []
                        });
                    }
                    return albums.get(key);
                };

                offsets.forEach(offset => {
                    const dates = this.state.snapshots.dates[offset];
                    const weekSongs = this.state.snapshots.songs[offset] || [];
                    const weekAlbums = this.state.snapshots.albums[offset] || [];
                    const weekStart = dates?.start ?? 0;
                    const weekEnd = dates?.end ?? weekStart;
                    const top10ArtistCounts = new Map();
                    const top10ArtistSet = new Set();

                    weekSongs.forEach(entry => {
                        const record = ensureSong(entry);
                        const wasSeenLastWeek = record.lastOffset === offset - 1;
                        record.debutOffset = record.debutOffset === null ? offset : record.debutOffset;
                        record.lastOffset = offset;
                        record.weeksOnChart += 1;
                        record.totalPlays += Number(entry.plays || 0);
                        record.totalPoints += Number(entry.points || 0);
                        record.totalUnits += Number(entry.units_sold || 0);
                        record.history.push({ offset, rank: entry.rank, points: entry.points || 0, plays: entry.plays || 0, units: entry.units_sold || 0 });
                        if (entry.rank < record.peak) {
                            record.peak = entry.rank;
                            record.peakOffset = offset;
                        }
                        if (entry.rank === 1) {
                            record.weeksAtNo1 += 1;
                            record.currentNo1Streak = record.lastNo1Offset === offset - 1 ? record.currentNo1Streak + 1 : 1;
                            record.lastNo1Offset = offset;
                            record.maxNo1Streak = Math.max(record.maxNo1Streak, record.currentNo1Streak);
                        } else {
                            record.currentNo1Streak = 0;
                            record.lastNo1Offset = null;
                        }
                        record.currentChartStreak = wasSeenLastWeek ? record.currentChartStreak + 1 : 1;
                        record.maxChartStreak = Math.max(record.maxChartStreak, record.currentChartStreak);
                        if (entry.rank <= 10) record.weeksTop10 += 1;
                        if (!record.bestWeek || Number(entry.points || 0) > Number(record.bestWeek.points || 0)) {
                            record.bestWeek = { offset, rank: entry.rank, points: entry.points || 0, plays: entry.plays || 0, units: entry.units_sold || 0 };
                        }

                        const creditIds = [...new Set((entry.artist_ids || (entry.artist_id ? [entry.artist_id] : [])).map(String))];
                        creditIds.forEach(id => {
                            const artist = ensureArtist(id);
                            if (!artist) return;
                            artist.songUnits += Number(entry.units_sold || 0);
                            artist.songPoints += Number(entry.points || 0);
                            artist.songPlays += Number(entry.plays || 0);
                            artist.songChartAppearances += 1;
                            artist.songIds.add(String(entry.id));
                            if (entry.rank === 1) {
                                artist.songNo1Weeks += 1;
                                artist.no1SongIds.add(String(entry.id));
                            }
                            if (entry.rank <= 10) {
                                artist.songTop10Appearances += 1;
                                top10ArtistSet.add(id);
                                top10ArtistCounts.set(id, (top10ArtistCounts.get(id) || 0) + 1);
                            }
                        });
                    });

                    top10ArtistCounts.forEach((count, id) => {
                        const artist = ensureArtist(id);
                        if (artist) {
                            artist.top10Weeks.add(offset);
                            artist.maxTop10SongsInWeek = Math.max(artist.maxTop10SongsInWeek, count);
                        }
                    });

                    weekAlbums.forEach(entry => {
                        const record = ensureAlbum(entry);
                        const wasSeenLastWeek = record.lastOffset === offset - 1;
                        record.debutOffset = record.debutOffset === null ? offset : record.debutOffset;
                        record.lastOffset = offset;
                        record.weeksOnChart += 1;
                        record.totalPlays += Number(entry.plays || 0);
                        record.totalPoints += Number(entry.points || 0);
                        record.totalUnits += Number(entry.units_sold || 0);
                        record.history.push({ offset, rank: entry.rank, points: entry.points || 0, plays: entry.plays || 0, units: entry.units_sold || 0 });
                        if (entry.rank < record.peak) {
                            record.peak = entry.rank;
                            record.peakOffset = offset;
                        }
                        if (entry.rank === 1) {
                            record.weeksAtNo1 += 1;
                            record.currentNo1Streak = record.lastNo1Offset === offset - 1 ? record.currentNo1Streak + 1 : 1;
                            record.lastNo1Offset = offset;
                            record.maxNo1Streak = Math.max(record.maxNo1Streak, record.currentNo1Streak);
                        } else {
                            record.currentNo1Streak = 0;
                            record.lastNo1Offset = null;
                        }
                        record.currentChartStreak = wasSeenLastWeek ? record.currentChartStreak + 1 : 1;
                        record.maxChartStreak = Math.max(record.maxChartStreak, record.currentChartStreak);
                        if (entry.rank <= 10) record.weeksTop10 += 1;
                        if (!record.bestWeek || Number(entry.points || 0) > Number(record.bestWeek.points || 0)) {
                            record.bestWeek = { offset, rank: entry.rank, points: entry.points || 0, plays: entry.plays || 0, units: entry.units_sold || 0 };
                        }

                        // Albums receive chart/sales credit only for their lead album artist.
                        const leadArtist = ensureArtist(entry.artist_id);
                        if (leadArtist) {
                            leadArtist.albumUnits += Number(entry.units_sold || 0);
                            leadArtist.albumPoints += Number(entry.points || 0);
                            leadArtist.albumPlays += Number(entry.plays || 0);
                            leadArtist.albumChartAppearances += 1;
                            leadArtist.albumIds.add(String(entry.id));
                            if (entry.rank === 1) {
                                leadArtist.albumNo1Weeks += 1;
                                leadArtist.no1AlbumIds.add(String(entry.id));
                            }
                        }
                    });

                    const newEntries = weekSongs.filter(entry => entry.is_new).length;
                    const reentries = weekSongs.filter(entry => entry.is_reentry).length;
                    weeks.push({
                        offset, start: weekStart, end: weekEnd,
                        songCount: weekSongs.length, albumCount: weekAlbums.length,
                        topSong: weekSongs[0] || null, topAlbum: weekAlbums[0] || null,
                        newEntries, reentries, top10ArtistCount: top10ArtistSet.size
                    });
                });

                const dateForOffset = offset => {
                    const dates = this.state.snapshots.dates[offset];
                    return dates ? new Date(dates.start).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' }) : '—';
                };

                const songRecords = [...songs.values()].map(record => ({
                    ...record,
                    debutDate: dateForOffset(record.debutOffset),
                    peakDate: dateForOffset(record.peakOffset),
                    lastDate: dateForOffset(record.lastOffset),
                    weeksToPeak: record.debutOffset !== null && record.peakOffset !== null ? Math.abs(record.peakOffset - record.debutOffset) + 1 : null
                }));
                const albumRecords = [...albums.values()].map(record => ({
                    ...record,
                    debutDate: dateForOffset(record.debutOffset),
                    peakDate: dateForOffset(record.peakOffset),
                    lastDate: dateForOffset(record.lastOffset),
                    weeksToPeak: record.debutOffset !== null && record.peakOffset !== null ? Math.abs(record.peakOffset - record.debutOffset) + 1 : null
                }));
                const artistRecords = [...artists.values()].map(record => ({
                    ...record,
                    songCount: record.songIds.size,
                    songNo1Count: record.no1SongIds.size,
                    top10WeeksCount: record.top10Weeks.size,
                    albumCount: record.albumIds.size,
                    albumNo1Count: record.no1AlbumIds.size
                }));

                this.state.milestones = {
                    offsets, weeks, songs: songRecords, albums: albumRecords, artists: artistRecords,
                    totalWeeks: offsets.length,
                    earliestDate: offsets.length ? dateForOffset(offsets[0]) : '—',
                    latestDate: offsets.length ? dateForOffset(offsets[offsets.length - 1]) : '—'
                };
            },

            compileBaseEntries(playCountsMap, type) {
                let entries = [];
                playCountsMap.forEach((plays, id) => {
                    let title, artist, artistId, albumTitle = null, trackCount = null;

                    if (type === 'songs') {
                        const track = this.state.raw.tracks.get(String(id));
                        if (!track) return;
                        title = track.title || 'Unknown Track';
                        const trackArtistIds = this.getTrackArtistIds(track);
                        artistId = track.primary_artist_id || track.artist_id || trackArtistIds[0];
                        artist = this.getTrackArtistNames(track).join(', ');
                    } else {
                        const albumId = String(id);
                        if (!this.state.eligibleAlbumIds?.has(albumId)) return;
                        const album = this.state.raw.albums.get(albumId);
                        if (!album) return;
                        title = album.title || 'Unknown Album';
                        artistId = album.primary_artist_id || album.artist_id;
                        artist = this.getArtistName(artistId);
                        albumTitle = title;
                        trackCount = this.state.albumTrackCounts?.get(albumId)?.size || 0;
                    }

                    const sourceTrack = type === 'songs' ? this.state.raw.tracks.get(String(id)) : null;
                    entries.push({
                        id: String(id), title, artist, artist_id: artistId || null,
                        artist_ids: type === 'songs'
                            ? this.getTrackArtistIds(sourceTrack)
                            : (artistId ? [String(artistId)] : []),
                        album: albumTitle, plays, track_count: trackCount
                    });
                });

                // Points are based on play rank; calculated units then determine the displayed rank.
                entries.sort((a, b) => b.plays - a.plays || a.title.localeCompare(b.title));
                entries = entries.slice(0, 100).map((entry, index) => {
                    const points = this.pointsForRank(index + 1);
                    const units_sold = type === 'songs'
                        ? FORMULAS.songUnits(entry.plays, points)
                        : FORMULAS.albumUnits(entry.plays, points);
                    return { ...entry, points, units_sold };
                });

                entries.sort((a, b) => b.units_sold - a.units_sold || b.plays - a.plays || a.title.localeCompare(b.title));
                return entries.map((entry, index) => ({ ...entry, rank: index + 1 }));
            },

            applyHistory(entries, historyTracker, currentOffset) {
                return entries.map(entry => {
                    const id = entry.id;
                    const trackData = historyTracker[id] || {
                        peak: 101, weeks_on_chart: 0, last_seen_offset: null, last_rank: null
                    };

                    const isNew = trackData.weeks_on_chart === 0;
                    const isReentry = !isNew && trackData.last_seen_offset !== currentOffset - 1;
                    const previousRank = !isNew && !isReentry ? trackData.last_rank : null;
                    const newPeak = Math.min(trackData.peak, entry.rank);
                    const newWeeks = trackData.weeks_on_chart + 1;

                    historyTracker[id] = {
                        peak: newPeak,
                        weeks_on_chart: newWeeks,
                        last_seen_offset: currentOffset,
                        last_rank: entry.rank
                    };

                    return {
                        ...entry,
                        is_new: isNew,
                        is_reentry: isReentry,
                        previous_rank: previousRank,
                        peak: newPeak,
                        weeks_on_chart: newWeeks
                    };
                });
            },

            loadSnapshot(offset) {
                this.state.weekOffset = offset;
                this.state.data.songs = this.state.snapshots.songs[offset] || [];
                this.state.data.albums = this.state.snapshots.albums[offset] || [];

                const dates = this.state.snapshots.dates[offset];
                if (dates) this.updateWeekUI(new Date(dates.start), new Date(dates.end));

                this.renderCurrentView();
            },

            changeWeek(direction) {
                const newOffset = this.state.weekOffset + direction;
                if (newOffset > 0 || newOffset < this.state.minOffset) return;
                this.loadSnapshot(newOffset);
            },

            updateWeekUI(startDate, endDate) {
                const nextBtn = document.getElementById('btn-next-week');
                const prevBtn = document.getElementById('btn-prev-week');
                const label = document.getElementById('week-display-label');
                const dateLabel = document.getElementById('week-date-label');

                const options = { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' };
                dateLabel.textContent = `${startDate.toLocaleDateString('en-US', options)} - ${endDate.toLocaleDateString('en-US', options)}`;

                if (this.state.weekOffset === 0) {
                    nextBtn.disabled = true;
                    nextBtn.classList.add('text-zinc-500', 'cursor-not-allowed');
                    nextBtn.classList.remove('text-white', 'hover:bg-zinc-700');
                    label.textContent = 'Latest Available Week';
                } else {
                    nextBtn.disabled = false;
                    nextBtn.classList.remove('text-zinc-500', 'cursor-not-allowed');
                    nextBtn.classList.add('text-white', 'hover:bg-zinc-700');
                    label.textContent = 'Historic Week';
                }

                if (this.state.weekOffset <= this.state.minOffset) {
                    prevBtn.disabled = true;
                    prevBtn.classList.add('text-zinc-500', 'cursor-not-allowed');
                    prevBtn.classList.remove('text-white', 'hover:bg-zinc-700');
                } else {
                    prevBtn.disabled = false;
                    prevBtn.classList.remove('text-zinc-500', 'cursor-not-allowed');
                    prevBtn.classList.add('text-white', 'hover:bg-zinc-700');
                }
            },

            showLoading(show) {
                document.getElementById('loading-state').style.display = show ? 'flex' : 'none';
                document.getElementById('content-container').style.display = show ? 'none' : 'block';
            },

            navigate(view) {
                this.state.currentView = view;
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('bg-zinc-900', 'text-white', 'font-semibold');
                    btn.classList.add('text-zinc-400');
                });
                const activeBtn = document.getElementById(`nav-${view}`);
                if (activeBtn) {
                    activeBtn.classList.remove('text-zinc-400');
                    activeBtn.classList.add('bg-zinc-900', 'text-white', 'font-semibold');
                }
                if (this.state.data.songs.length > 0 || this.state.data.albums.length > 0 || (view === 'milestones' && this.state.milestones)) this.renderCurrentView();
            },

            renderCurrentView() {
                const container = document.getElementById('content-container');
                const weeklyNavigation = document.getElementById('global-chart-navigation');
                if (weeklyNavigation) weeklyNavigation.classList.toggle('hidden', this.state.currentView === 'milestones');
                container.innerHTML = '';
                if (this.state.currentView === 'dashboard') container.innerHTML = this.views.dashboard();
                if (this.state.currentView === 'songs') container.innerHTML = this.views.chartView('songs');
                if (this.state.currentView === 'albums') container.innerHTML = this.views.chartView('albums');
                if (this.state.currentView === 'milestones') container.innerHTML = this.milestonesView();

                container.classList.remove('fade-in');
                void container.offsetWidth;
                container.classList.add('fade-in');
                this.loadVisibleArtworks();
            },

            filterMilestones(query) {
                const value = String(query || '').trim().toLowerCase();
                document.querySelectorAll('[data-milestone-search]').forEach(row => {
                    row.classList.toggle('hidden', value && !(row.dataset.search || '').includes(value));
                });
            },

            milestonesView() {
                const data = this.state.milestones;
                if (!data) return `<div class="p-8 text-zinc-400">Milestones are being compiled from your chart archive…</div>`;

                const duration = weeks => `${fmt(weeks)} ${weeks === 1 ? 'week' : 'weeks'}`;

                const albumLink = album => album ? this.pageLink('album', album.id, album.title) : '—';
                const artistLink = (id, name) => id ? this.pageLink('artist', id, name || this.getArtistName(id)) : this.escapeHTML(name || 'Unknown Artist');
                const creditedArtists = record => this.artistCreditHTML(record.artist_ids, record.artist_id, record.artist);
                const recordCard = (label, main, detail, link = '') => `
                    <div class="bg-zinc-900 border border-zinc-800 rounded-lg p-5 min-w-0">

                const statCard = (label, value, note, icon) => `

                        <p class="text-2xl md:text-3xl font-black text-white">${value}</p>
                        <p class="text-xs text-zinc-500 mt-1">${note}</p>
                    </div>`;

                const songs = [...data.songs];
                const albums = [...data.albums];
                const artists = [...data.artists];
                const topSong = (list, compare) => [...list].sort(compare)[0] || null;
                const longestNo1 = topSong(songs, (a, b) => b.maxNo1Streak - a.maxNo1Streak || b.weeksAtNo1 - a.weeksAtNo1);
                const mostNo1Weeks = topSong(songs, (a, b) => b.weeksAtNo1 - a.weeksAtNo1 || a.peak - b.peak);
                const longestSongRun = topSong(songs, (a, b) => b.maxChartStreak - a.maxChartStreak || b.weeksOnChart - a.weeksOnChart);
                const slowBurn = topSong(songs.filter(song => song.peak < 100), (a, b) => (b.weeksToPeak || 0) - (a.weeksToPeak || 0));

                const mostNo1Artist = topSong(artists, (a, b) => b.songNo1Count - a.songNo1Count || b.songNo1Weeks - a.songNo1Weeks);
                const mostTop10Artist = topSong(artists, (a, b) => b.maxTop10SongsInWeek - a.maxTop10SongsInWeek || b.top10WeeksCount - a.top10WeeksCount);
                const longestAlbumNo1 = topSong(albums, (a, b) => b.maxNo1Streak - a.maxNo1Streak || b.weeksAtNo1 - a.weeksAtNo1);
                const mostAlbumNo1 = topSong(albums, (a, b) => b.weeksAtNo1 - a.weeksAtNo1 || a.peak - b.peak);
                const bestSongByPoints = topSong(songs, (a, b) => b.totalPoints - a.totalPoints || b.weeksOnChart - a.weeksOnChart);
                const bestAlbumByPoints = topSong(albums, (a, b) => b.totalPoints - a.totalPoints || b.weeksOnChart - a.weeksOnChart);

                const artistRows = [...artists].sort((a, b) => b.songUnits - a.songUnits || b.songPoints - a.songPoints).slice(0, 15).map((artist, index) => `
                    <tr data-milestone-search data-search="${this.escapeHTML(`${artist.name} ${artist.id}`.toLowerCase())}" class="border-b border-zinc-800/70 hover:bg-zinc-800/40">

                    </tr>`).join('');

                const songRows = [...songs].sort((a, b) => b.totalPoints - a.totalPoints || b.weeksOnChart - a.weeksOnChart).slice(0, 12).map((song, index) => `
                    <tr data-milestone-search data-search="${this.escapeHTML(`${song.title} ${song.artist}`.toLowerCase())}" class="border-b border-zinc-800/70 hover:bg-zinc-800/40">

                            <div class="font-bold text-white">${this.pageLink('album', album.id, album.title)}</div>

                        <td class="px-4 py-3 text-right text-white font-semibold">${fmt(album.totalPoints)}</td>
                        <td class="px-4 py-3 text-right text-zinc-300">${fmt(album.weeksAtNo1)}</td>
                        <td class="px-4 py-3 text-right text-zinc-300">${fmt(album.weeksOnChart)}</td>
                        <td class="px-4 py-3 text-right text-zinc-300">#${album.peak}</td>

                const recentWeeks = [...data.weeks].reverse().slice(0, 12).map(week => {

                            <div class="min-w-0"><p class="text-[10px] uppercase tracking-widest text-zinc-500 mb-1">#1 Album</p><p class="font-bold text-white truncate">${topRelease ? this.pageLink('album', topRelease.id, topRelease.title) : '—'}</p><p class="text-xs text-zinc-500 truncate">${topRelease ? artistLink(topRelease.artist_id, topRelease.artist) : ''}</p></div>
                            <div class="flex gap-3 text-xs text-zinc-400"><span><b class="text-white">${week.newEntries}</b> new</span><span><b class="text-white">${week.reentries}</b> re-entry</span></div>
                        </div>`;
                }).join('');

                return `
                    <div class="space-y-10">
                        <section class="relative overflow-hidden rounded-xl border border-zinc-800 bg-gradient-to-br from-zinc-900 via-black to-zinc-950 p-6 md:p-8">
                            <div class="absolute -right-8 -top-12 text-[180px] leading-none text-white/[0.025] pointer-events-none"><i class="ph ph-trophy"></i></div>
                            <p class="text-xs uppercase tracking-[.25em] text-zinc-500 font-black mb-3">YourHot100 · The Record Book</p>
                            <div class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-5">
                                <div><h2 class="text-3xl md:text-5xl font-black tracking-tight text-white">Milestones <span class="text-zinc-500">&</span> Stats</h2>
                                    <p class="text-zinc-400 mt-3 max-w-2xl">The all-time story of your charts — legendary runs, artist dominance, record-breaking songs and albums, calculated from your archived weekly charts.</p>
                                </div>
                                <div class="text-xs text-zinc-500 lg:text-right"><p>Archive: <span class="text-zinc-300">${data.earliestDate}</span> – <span class="text-zinc-300">${data.latestDate}</span></p><p class="mt-1">${fmt(data.totalWeeks)} chart weeks analysed</p></div>
                            </div>
                        </section>

                        <section>
                            <div class="flex items-end justify-between gap-4 mb-4"><div><p class="text-xs uppercase tracking-widest text-zinc-500 font-bold">At a glance</p><h3 class="text-xl font-black text-white mt-1">Your chart history</h3></div></div>
                            <div class="grid grid-cols-2 xl:grid-cols-4 gap-3">
                                ${statCard('Chart Weeks', fmt(data.totalWeeks), `${data.earliestDate} – ${data.latestDate}`, 'ph-calendar-blank')}
                                ${statCard('Songs Charted', fmt(songs.length), 'Distinct track records', 'ph-music-notes')}
                                ${statCard('Albums Charted', fmt(albums.length), 'Eligible album records', 'ph-vinyl-record')}
                                ${statCard('Artists Credited', fmt(artists.length), 'Song credits + lead album artists', 'ph-users-three')}
                            </div>
                        </section>

                        <section>
                            <div class="mb-4"><p class="text-xs uppercase tracking-widest text-zinc-500 font-bold">Immortal records</p><h3 class="text-xl font-black text-white mt-1">The record book</h3><p class="text-sm text-zinc-500 mt-1">Records are derived from chart weeks available in the archive.</p></div>
                            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
                                ${recordCard('Longest No. 1 streak', longestNo1 ? `${duration(longestNo1.maxNo1Streak)}` : '—', longestNo1 ? `“${this.escapeHTML(longestNo1.title)}” · ${longestNo1.maxNo1Streak} consecutive week(s) at #1` : 'No record available', longestNo1 ? this.pageLink('track', longestNo1.id, longestNo1.title) : '')}
                                ${recordCard('Most weeks at No. 1', mostNo1Weeks ? duration(mostNo1Weeks.weeksAtNo1) : '—', mostNo1Weeks ? `${this.escapeHTML(mostNo1Weeks.title)} · ${mostNo1Weeks.weeksAtNo1} total No. 1 week(s)` : 'No record available', mostNo1Weeks ? this.pageLink('track', mostNo1Weeks.id, mostNo1Weeks.title) : '')}
                                ${recordCard('Longest chart run', longestSongRun ? duration(longestSongRun.maxChartStreak) : '—', longestSongRun ? `${this.escapeHTML(longestSongRun.title)} · longest uninterrupted chart run` : 'No record available', longestSongRun ? this.pageLink('track', longestSongRun.id, longestSongRun.title) : '')}
                                ${recordCard('The slow burn', slowBurn ? `${duration(slowBurn.weeksToPeak || 0)} to peak` : '—', slowBurn ? `${this.escapeHTML(slowBurn.title)} · eventually reached #${slowBurn.peak}` : 'No record available', slowBurn ? this.pageLink('track', slowBurn.id, slowBurn.title) : '')}
                                ${recordCard('Most song No. 1s', mostNo1Artist ? `${fmt(mostNo1Artist.songNo1Count)} songs` : '—', mostNo1Artist ? `${this.escapeHTML(mostNo1Artist.name)} · credited on the most distinct No. 1 songs` : 'No record available', mostNo1Artist ? artistLink(mostNo1Artist.id, mostNo1Artist.name) : '')}
                                ${recordCard('Most Top 10 songs in one week', mostTop10Artist ? `${fmt(mostTop10Artist.maxTop10SongsInWeek)} songs` : '—', mostTop10Artist ? `${this.escapeHTML(mostTop10Artist.name)} · highest simultaneous Top 10 count` : 'No record available', mostTop10Artist ? artistLink(mostTop10Artist.id, mostTop10Artist.name) : '')}
                                ${recordCard('Album No. 1 streak', longestAlbumNo1 ? duration(longestAlbumNo1.maxNo1Streak) : '—', longestAlbumNo1 ? `${this.escapeHTML(longestAlbumNo1.title)} · consecutive weeks at #1` : 'No record available', longestAlbumNo1 ? this.pageLink('album', longestAlbumNo1.id, longestAlbumNo1.title) : '')}

                        </section>

                        <section class="bg-zinc-950 border border-zinc-800 rounded-lg overflow-hidden">
                            <div class="p-5 border-b border-zinc-800"><p class="text-xs uppercase tracking-widest text-zinc-500 font-bold">Legendary songs</p><h3 class="text-xl font-black text-white mt-1">All-time Hot 100 leaders</h3><p class="text-sm text-zinc-500 mt-1">Ranked by cumulative chart points across all archived weeks.</p></div>
                            <div class="overflow-x-auto"><table class="w-full text-sm min-w-[760px]"><thead class="bg-zinc-900/70 text-[10px] uppercase tracking-widest text-zinc-500"><tr><th class="px-4 py-3 text-left">#</th><th class="px-4 py-3 text-left">Song / credited artists</th><th class="px-4 py-3 text-right">Points</th><th class="px-4 py-3 text-right">Weeks at #1</th><th class="px-4 py-3 text-right">Weeks charted</th><th class="px-4 py-3 text-right">Peak</th></tr></thead><tbody>${songRows || '<tr><td colspan="6" class="p-6 text-zinc-500">No song history available.</td></tr>'}</tbody></table></div>
                        </section>

                        <section class="bg-zinc-950 border border-zinc-800 rounded-lg overflow-hidden">
                            <div class="p-5 border-b border-zinc-800"><p class="text-xs uppercase tracking-widest text-zinc-500 font-bold">Legendary albums</p><h3 class="text-xl font-black text-white mt-1">All-time album leaders</h3><p class="text-sm text-zinc-500 mt-1">Album points and units are attributed only to each album’s lead artist.</p></div>
                            <div class="overflow-x-auto"><table class="w-full text-sm min-w-[760px]"><thead class="bg-zinc-900/70 text-[10px] uppercase tracking-widest text-zinc-500"><tr><th class="px-4 py-3 text-left">#</th><th class="px-4 py-3 text-left">Album / lead artist</th><th class="px-4 py-3 text-right">Points</th><th class="px-4 py-3 text-right">Weeks at #1</th><th class="px-4 py-3 text-right">Weeks charted</th><th class="px-4 py-3 text-right">Peak</th></tr></thead><tbody>${albumRows || '<tr><td colspan="6" class="p-6 text-zinc-500">No album history available.</td></tr>'}</tbody></table></div>
                        </section>

                        <section class="bg-zinc-950 border border-zinc-800 rounded-lg overflow-hidden">
                            <div class="p-5 border-b border-zinc-800"><p class="text-xs uppercase tracking-widest text-zinc-500 font-bold">Weekly timeline</p><h3 class="text-xl font-black text-white mt-1">Recent chart milestones</h3><p class="text-sm text-zinc-500 mt-1">Each week links directly to the song and album that led the charts.</p></div>
                            ${recentWeeks || '<div class="p-6 text-zinc-500">No weekly archive available.</div>'}
                        </section>

                        <p class="text-xs leading-relaxed text-zinc-600">Methodology: milestones use the archived weekly Top 100 snapshots available to this page. Song credit is shared across every credited song artist; album credit belongs only to the lead album artist. Calculated units use the existing YourHot100 formulas. Missing historical weeks cannot be inferred.</p>
                    </div>`;
            },

            formatNumber: num => Number(num || 0).toLocaleString('en-US'),

            getMovementUI: (current, prev, isNew, isReentry) => {
                if (isNew) return `<div class="flex items-center justify-center gap-1 text-blue-400 font-bold text-xs"><i class="ph-fill ph-star"></i> NEW</div>`;
                if (isReentry) return `<div class="flex items-center justify-center gap-1 text-yellow-400 font-bold text-xs"><i class="ph-bold ph-arrow-u-up-left"></i> RE</div>`;
                if (!prev) return `<div class="flex items-center justify-center gap-1 text-zinc-600 font-bold text-xs"><i class="ph-bold ph-minus"></i> 0</div>`;
                if (current < prev) return `<div class="flex items-center justify-center gap-1 text-green-500 font-bold text-xs"><i class="ph-bold ph-arrow-up"></i> ${prev - current}</div>`;
                if (current > prev) return `<div class="flex items-center justify-center gap-1 text-red-500 font-bold text-xs"><i class="ph-bold ph-arrow-down"></i> ${current - prev}</div>`;
                return `<div class="flex items-center justify-center gap-1 text-zinc-600 font-bold text-xs"><i class="ph-bold ph-minus"></i> 0</div>`;
            },

            async loadVisibleArtworks() {
                const images = document.querySelectorAll('.dynamic-artwork');
                await Promise.all(Array.from(images).map(async img => {
                    const artist = img.dataset.artist || '';
                    const album = img.dataset.album || null;
                    const track = img.dataset.track || null;
                    const url = await this.fetchLastFmImage(artist, album, track);
                    if (url && img.isConnected) {
                        img.src = url;
                        img.classList.remove('loading-pulse');
                    }
                }));
            },

            async fetchLastFmImage(artist, album, track) {
                const clean = value => String(value || '').replace(/-/g, ' ').replace(/\s+/g, ' ').trim();
                const cleanArtist = clean(artist);
                const cleanAlbum = album && album !== 'null' ? clean(album) : null;
                const cleanTrack = track && track !== 'null' ? clean(track) : null;
                const cacheKey = `${cleanArtist}|${cleanAlbum || ''}|${cleanTrack || ''}`;

                if (artworkCache.has(cacheKey)) return artworkCache.get(cacheKey);

                const pickImage = images => {
                    if (!Array.isArray(images)) return null;
                    const preferred = images.find(image => image.size === 'extralarge' && image['#text']);
                    const fallback = [...images].reverse().find(image => image['#text']);
                    const result = preferred?.['#text'] || fallback?.['#text'] || null;
                    return result && /^https?:\/\//i.test(result) ? result : null;
                };

                const request = async (params) => {
                    const url = new URL('https://ws.audioscrobbler.com/2.0/');
                    Object.entries({ ...params, api_key: LASTFM_API_KEY, format: 'json' })
                        .forEach(([key, value]) => url.searchParams.set(key, value));
                    const response = await fetch(url.toString());
                    if (!response.ok) return null;
                    const data = await response.json();
                    if (data.error) return null;
                    return data;
                };

                try {
                    // First try the actual track so the Hot 100 can use its album artwork.
                    if (cleanTrack) {
                        const trackData = await request({ method: 'track.getInfo', artist: cleanArtist, track: cleanTrack });
                        const trackImage = pickImage(trackData?.track?.album?.image);
                        if (trackImage) {
                            artworkCache.set(cacheKey, trackImage);
                            return trackImage;
                        }

                        // Last.fm track info may provide the album name even if it has no image.
                        const discoveredAlbum = trackData?.track?.album?.title;
                        if (!cleanAlbum && discoveredAlbum) {
                            const albumData = await request({ method: 'album.getInfo', artist: cleanArtist, album: discoveredAlbum });
                            const albumImage = pickImage(albumData?.album?.image);
                            if (albumImage) {
                                artworkCache.set(cacheKey, albumImage);
                                return albumImage;
                            }
                        }
                    }

                    if (cleanAlbum) {
                        const albumData = await request({ method: 'album.getInfo', artist: cleanArtist, album: cleanAlbum });
                        const albumImage = pickImage(albumData?.album?.image);
                        if (albumImage) {
                            artworkCache.set(cacheKey, albumImage);
                            return albumImage;
                        }
                    }

                    const artistData = await request({ method: 'artist.getInfo', artist: cleanArtist });
                    const artistImage = pickImage(artistData?.artist?.image);
                    artworkCache.set(cacheKey, artistImage);
                    return artistImage;
                } catch (error) {
                    console.error('Artwork lookup failed:', error);
                    artworkCache.set(cacheKey, null);
                    return null;
                }
            },

            views: {
                dashboard: () => {
                    const topSong = app.state.data.songs[0] || {};
                    const topAlbum = app.state.data.albums[0] || {};
                    
                    return `
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-12">
                            <div class="bg-zinc-900 border border-zinc-800 p-6 flex flex-col sm:flex-row gap-6 rounded-lg shadow-2xl">
                                <img src="https://placehold.co/400x400/18181b/ffffff?text=1" data-artist="${app.escapeHTML(topSong.artist || '')}" data-track="${app.escapeHTML(topSong.title || '')}" data-album="null" class="dynamic-artwork loading-pulse w-40 h-40 object-cover bg-black rounded" alt="Cover">
                                <div>
                                    <p class="text-xs uppercase tracking-widest text-zinc-400 font-bold mb-1"><i class="ph-fill ph-crown text-yellow-500"></i> #1 Song</p>
                                    <h3 class="text-3xl font-black text-white mb-1 line-clamp-2">${app.pageLink('track', topSong.id, (topSong.title || 'N/A').toUpperCase())}</h3>
                                    <p class="text-lg text-zinc-300">${app.artistCreditHTML(topSong.artist_ids, topSong.artist_id, (topSong.artist || 'N/A').toUpperCase())}</p>
                                    <div class="mt-4 bg-black/50 p-3 rounded border border-zinc-800 inline-block">
                                        <p class="text-xs text-zinc-500 font-bold uppercase tracking-wider mb-1">Calculated Units</p>

                                    </div>
                                </div>
                            </div>
                            
                            <div class="bg-zinc-900 border border-zinc-800 p-6 flex flex-col sm:flex-row gap-6 rounded-lg shadow-2xl">
                                <img src="https://placehold.co/400x400/18181b/ffffff?text=1" data-artist="${app.escapeHTML(topAlbum.artist || '')}" data-album="${app.escapeHTML(topAlbum.album || '')}" class="dynamic-artwork loading-pulse w-40 h-40 object-cover bg-black rounded" alt="Cover">
                                <div>
                                    <p class="text-xs uppercase tracking-widest text-zinc-400 font-bold mb-1"><i class="ph-fill ph-vinyl-record text-zinc-300"></i> #1 Album</p>
                                    <h3 class="text-3xl font-black text-white mb-1 line-clamp-2">${app.pageLink('album', topAlbum.id, (topAlbum.title || 'N/A').toUpperCase())}</h3>
                                    <p class="text-lg text-zinc-300">${app.pageLink('artist', topAlbum.artist_id, (topAlbum.artist || 'N/A').toUpperCase())}</p>
                                    <div class="mt-4 bg-black/50 p-3 rounded border border-zinc-800 inline-block">
                                        <p class="text-xs text-zinc-500 font-bold uppercase tracking-wider mb-1">Calculated Units</p>
                                        <p class="text-xl font-black text-white">${app.formatNumber(topAlbum.units_sold)}</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <h3 class="text-xl font-bold mb-4 uppercase tracking-wider text-zinc-300 border-b border-zinc-800 pb-2">Hot 100 Preview</h3>
                            <div class="flex flex-col bg-zinc-900/50 rounded-lg border border-zinc-800 overflow-hidden">
                                ${app.state.data.songs.slice(0, 5).map(song => `
                                    <div class="flex items-center gap-4 py-3 px-4 border-b border-zinc-800/50 hover:bg-zinc-800 transition">
                                        <div class="w-8 text-center font-black text-2xl text-zinc-300">${song.rank}</div>
                                        <img src="https://placehold.co/100x100/18181b/ffffff?text=${song.rank}" data-artist="${app.escapeHTML(song.artist)}" data-track="${app.escapeHTML(song.title)}" data-album="null" class="dynamic-artwork w-12 h-12 object-cover bg-black rounded-sm shadow">
                                        <div class="flex-1 min-w-0">
                                            <div class="font-bold text-white truncate">${app.pageLink('track', song.id, (song.title || '').toUpperCase())}</div>
                                            <div class="text-sm text-zinc-400 truncate">${app.artistCreditHTML(song.artist_ids, song.artist_id, (song.artist || '').toUpperCase())}</div>
                                        </div>
                                        <div class="text-right hidden sm:block">
                                            <div class="text-sm font-bold text-white">${app.formatNumber(song.units_sold)}</div>
                                            <div class="text-[10px] text-zinc-500 uppercase tracking-widest font-bold">Units</div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                },

                chartView: (type) => {
                    const data = app.state.data[type];
                    if (!data || data.length === 0) return `<div class="p-10 text-center text-zinc-500">No chart data available for this week.</div>`;
                    
                    const unitLabel = type === 'songs' ? 'Track Units' : 'Album Units';

                    let html = `
                        <div class="hidden lg:grid grid-cols-12 gap-4 px-4 py-3 border-b border-zinc-800 text-xs font-bold uppercase tracking-widest text-zinc-500 sticky top-[72px] bg-black/95 backdrop-blur z-20">
                            <div class="col-span-1 text-center">Rank</div>
                            <div class="col-span-4">Information</div>
                            <div class="col-span-2 text-right">Metrics</div>
                            <div class="col-span-2 text-right text-zinc-300">${unitLabel}</div>
                            <div class="col-span-3 text-right">Chart History</div>
                        </div>
                    `;

                    data.forEach(item => {
                        const albumAttr = type === 'albums' ? `data-album="${app.escapeHTML(item.album || '')}"` : `data-album="null"`;
                        html += `
                            <div class="group grid grid-cols-1 lg:grid-cols-12 gap-4 items-center px-4 py-4 border-b border-zinc-900 hover:bg-zinc-900/40">
                                <div class="col-span-1 flex flex-row lg:flex-col items-center justify-between lg:justify-center gap-1 sm:gap-2">
                                    <span class="text-3xl font-black text-white w-10 text-center">${item.rank}</span>
                                    ${app.getMovementUI(item.rank, item.previous_rank, item.is_new, item.is_reentry)}
                                </div>
                                
                                <div class="col-span-4 flex items-center gap-4">
                                    <img src="https://placehold.co/200x200/18181b/ffffff?text=${item.rank}" data-artist="${app.escapeHTML(item.artist)}" ${albumAttr} class="dynamic-artwork loading-pulse w-16 h-16 object-cover rounded-sm bg-zinc-800 shrink-0">
                                    <div class="min-w-0">
                                        <h4 class="text-lg font-bold text-white truncate">${app.pageLink(type === 'songs' ? 'track' : 'album', item.id, (item.title || '').toUpperCase())}</h4>
                                        <p class="text-sm text-zinc-400 font-medium truncate">${type === 'songs' ? app.artistCreditHTML(item.artist_ids, item.artist_id, (item.artist || '').toUpperCase()) : app.pageLink('artist', item.artist_id, (item.artist || '').toUpperCase())}</p>
                                    </div>
                                </div>

                                <div class="hidden md:block lg:col-span-2 text-right">
                                    <div class="text-sm font-semibold text-zinc-300">${app.formatNumber(item.plays)} <span class="text-xs text-zinc-600 font-normal">Plays</span></div>
                                    <div class="text-sm font-semibold text-zinc-300">${item.points} <span class="text-xs text-zinc-600 font-normal">Pts</span></div>
                                </div>

                                <div class="col-span-2 text-left lg:text-right mt-1 lg:mt-0 flex lg:block items-baseline gap-2">
                                    <span class="lg:hidden text-[10px] text-zinc-500 uppercase font-bold tracking-widest">Units:</span>
                                    <span class="text-xl font-black text-white">${app.formatNumber(item.units_sold)}</span>
                                </div>

                                <div class="col-span-3 flex items-center justify-start lg:justify-end gap-6 text-sm mt-1 lg:mt-0 pt-3 lg:pt-0">
                                    <div class="text-center">
                                        <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest mb-0.5">Peak</p>
                                        <p class="font-bold text-zinc-300">${item.peak}</p>
                                    </div>
                                    <div class="text-center">
                                        <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest mb-0.5">Wks On</p>
                                        <p class="font-bold text-zinc-300">${item.weeks_on_chart}</p>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    return html;
                }
            }
        };

        window.addEventListener('DOMContentLoaded', () => app.init());
