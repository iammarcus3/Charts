<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Top 100 Artists</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #f0f0f0;
      padding: 2rem;
      margin: 0;
    }
    nav { text-align: center; margin-bottom: 2rem; }
    nav a {
      margin: 0 1rem;
      text-decoration: none;
      font-weight: bold;
      color: #f0f0f0;
      transition: color 0.2s ease;
    }
    nav a:hover { color: #1DB954; }
    h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 1rem;
      font-size: 2.5rem;
    }
    .table-container {
      overflow: auto;
      max-height: 600px;
      border: 1px solid #333;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.6);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #1e1e1e;
      color: #f0f0f0;
      min-width: 1200px;
    }
    th, td {
      padding: 0.75rem;
      border: 1px solid #333;
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
    }
    th {
      background-color: #2a2a2a;
      text-transform: uppercase;
      font-size: 0.85rem;
      position: sticky;
      top: 0;
      z-index: 2;
      user-select: none;
    }
    th:first-child, td:first-child {
      position: sticky;
      left: 0;
      background: #222;
      z-index: 3;
    }
    a { color: #1DB954; text-decoration: none; }
    a:hover { text-decoration: underline; }
    th.asc::after { content: " ▲"; color: #1DB954; }
    th.desc::after { content: " ▼"; color: #1DB954; }
    tr:nth-child(even) { background-color: #181818; }
    tr:hover { background-color: #2a2a2a; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">🔥 Home</a>
    <a href="top_albums.html">💿 Top Albums</a>
    <a href="top_songs.html">🎵 Top Songs</a>
    <a href="top_artists.html">🎤 Top Artists</a>
    <a href="albumrecord.html">📀 Album Records</a> 
  </nav>

  <h1>🎤 Top 100 Artists</h1>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th data-sort="rank">Rank</th>
          <th data-sort="name">Artist</th>
          <th data-sort="totalStreams">Total Streams</th>
          <th data-sort="totalSales">Total Sales</th>
          <th data-sort="num1Songs">#1 Songs</th>
          <th data-sort="num1Pop">#1 POP</th>
          <th data-sort="num1Rnb">#1 RNB</th>
          <th data-sort="num1HipHop">#1 HIP-HOP</th>
          <th data-sort="top10Songs">Top 10 Songs</th>
          <th data-sort="num1Albums">#1 Albums</th>
          <th data-sort="top10Albums">Top 10 Albums</th>
          <th data-sort="songEntriesTop100">Song Entries (Top 100)</th>
          <th data-sort="weeksOnChart">Weeks on Chart</th>
          <th data-sort="top30Songs">Top 30 Records</th>
        </tr>
      </thead>
      <tbody id="artistTable">
        <tr><td colspan="14">Loading data...</td></tr>
      </tbody>
    </table>
  </div>

  <script src="weekdata.js"></script>
  <script>
  (() => {
    // use the dataset already loaded
    const data =
      window.__WEEKDATA__ ||
      (window.__WEEKDATA__ = (window.weekData || window.weekdata || window.WEEKDATA || {}));

    function formatNumber(n) {
      if (n >= 1_000_000_000) return (n / 1_000_000_000).toFixed(1) + 'B';
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
      if (n >= 1_000) return (n / 1_000).toFixed(0) + 'K';
      return n.toString();
    }

    // expand genres like the 5-genre chart
    function getBuckets(entry) {
      const tokens = [];
      if (entry.mainGenre) tokens.push(entry.mainGenre);
      if (Array.isArray(entry.subGenres)) tokens.push(...entry.subGenres);
      if (entry.genre) tokens.push(entry.genre);
      if (Array.isArray(entry.genres)) tokens.push(...entry.genres);

      const lows = tokens.map(t => String(t).toLowerCase().trim());
      const out = [];

      if (lows.some(t => t.includes('pop'))) out.push('POP');
      if (lows.some(t => t.includes('r&b') || t.includes('rnb') || t.includes('soul') || t.includes('neo-soul'))) out.push('RNB');
      if (lows.some(t => t.includes('hip') || t.includes('rap') || t.includes('trap'))) out.push('HIPHOP');

      // cannot be blank
      if (!out.length) out.push('POP');

      // only 3 buckets for this page
      return out;
    }

    // song key to dedupe per song per bucket
    function songKey(title, artist) {
      const t = String(title || '').toUpperCase().replace(/[^A-Z0-9]/g,'');
      const a = String(artist || '').toUpperCase().replace(/[^A-Z0-9]/g,'');
      return t + '//' + a;
    }

    // split artists the same way you do everywhere
    function splitArtists(str){
      return (str || "")
        .split(/,|&| and | with | feat\.? | featuring /i)
        .map(a => a.trim())
        .filter(Boolean);
    }

    window.addEventListener("DOMContentLoaded", () => {
      const tbody = document.getElementById('artistTable');
      const artistMap = {};
      const artistNameMap = {};

      // go week by week
      for (const week in data) {
        // 1) sort, trim 200, remove "sweep week"
        const rows = (data[week] || [])
          .slice()
          .sort((a,b)=>{
            const ra = Number(a.rank ?? a.position ?? a.pos ?? 9999);
            const rb = Number(b.rank ?? b.position ?? b.pos ?? 9999);
            return ra - rb;
          })
          .slice(0,200)
          .filter(r=>{
            const t = (r.title || r.song || '').toString();
            return !/sweep week/i.test(t);
          });

        // 2) expand with buckets for this week
        const expanded = rows.map(r => {
          const b = getBuckets(r);
          return { ...r, _buckets: b };
        });

        // 3) for each bucket, find THAT WEEK'S #1 (like your chart)
        ['POP','RNB','HIPHOP'].forEach(bucketName => {
          // filter rows that belong to this bucket
          const bucketRows = expanded.filter(r => r._buckets && r._buckets.includes(bucketName));

          if (!bucketRows.length) return;

          // sort like the chart: by points desc, fallback to rank asc
          bucketRows.sort((a,b)=>{
            const pa = Number(a.points || a.Points || 0);
            const pb = Number(b.points || b.Points || 0);
            if (pb !== pa) return pb - pa;
            const ra = Number(a.rank ?? a.position ?? a.pos ?? 9999);
            const rb = Number(b.rank ?? b.position ?? b.pos ?? 9999);
            return ra - rb;
          });

          const top = bucketRows[0]; // this is THE #1 for that genre that week
          const title = top.title || top.song || '';
          const artistStr = top.artist || top.Artist || '';
          const sKey = songKey(title, artistStr);
          const artists = splitArtists(artistStr);

          artists.forEach(rawName => {
            const normName = rawName.toUpperCase().replace(/[^A-Z0-9]/g,'');

            if (!artistMap[normName]) {
              artistMap[normName] = {
                rawSales: 0,
                weeks: new Set(),
                songs: {},
                albums: {},
                totalStreams: 0,
                num1Pop: 0,
                num1Rnb: 0,
                num1HipHop: 0,
                seenPop: new Set(),
                seenRnb: new Set(),
                seenHipHop: new Set()
              };
              artistNameMap[normName] = rawName;
            }

            const artistStats = artistMap[normName];

            // even though this is chart-based, still accumulate sales/streams from whole week
          });

          // also: add sales/streams to every artist from EVERY row (not only #1s)
          // we do that below outside this bucket loop
        });

        // 4) now do normal per-row accumulation (sales/streams/songs/albums)
        rows.forEach(entry => {
          const artists = splitArtists(entry.artist || entry.Artist || '');
          const album = entry.album || "";
          const title = entry.title || entry.song || "";
          const rank = parseInt(entry.rank);
          const sales = parseFloat(entry.sales) || 0;
          const streams = parseFloat(entry.streams) || 0;
          const buckets = getBuckets(entry);
          const sKey = songKey(title, entry.artist || entry.Artist || "");

          artists.forEach(rawName => {
            const normName = rawName.toUpperCase().replace(/[^A-Z0-9]/g,'');

            if (!artistMap[normName]) {
              artistMap[normName] = {
                rawSales: 0,
                weeks: new Set(),
                songs: {},
                albums: {},
                totalStreams: 0,
                num1Pop: 0,
                num1Rnb: 0,
                num1HipHop: 0,
                seenPop: new Set(),
                seenRnb: new Set(),
                seenHipHop: new Set()
              };
              artistNameMap[normName] = rawName;
            }

            const artistStats = artistMap[normName];
            artistStats.rawSales += sales;
            artistStats.weeks.add(week);
            artistStats.totalStreams += streams;

            // song-level peaks
            const songKeySimple = (title || "").toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (!artistStats.songs[songKeySimple]) artistStats.songs[songKeySimple] = Infinity;
            if (rank < artistStats.songs[songKeySimple]) artistStats.songs[songKeySimple] = rank;

            // album-level
            const albumKey = String(album || "").toUpperCase()
              .replace(/\(.*?\)|\[.*?\]|DELUXE|BONUS|VERSION|REMASTERED|EXPANDED|EP/gi, "")
              .replace(/[^A-Z0-9]/g, '');
            if (albumKey) {
              if (!artistStats.albums[albumKey]) artistStats.albums[albumKey] = Infinity;
              if (rank < artistStats.albums[albumKey]) artistStats.albums[albumKey] = rank;
            }
          });
        });

        // 5) important: actually give the #1-per-genre credit now (AFTER we know artists exist)
        ['POP','RNB','HIPHOP'].forEach(bucketName => {
          const bucketRows = expanded.filter(r => r._buckets && r._buckets.includes(bucketName));
          if (!bucketRows.length) return;
          bucketRows.sort((a,b)=>{
            const pa = Number(a.points || a.Points || 0);
            const pb = Number(b.points || b.Points || 0);
            if (pb !== pa) return pb - pa;
            const ra = Number(a.rank ?? a.position ?? a.pos ?? 9999);
            const rb = Number(b.rank ?? b.position ?? b.pos ?? 9999);
            return ra - rb;
          });
          const top = bucketRows[0];
          const title = top.title || top.song || '';
          const artistStr = top.artist || top.Artist || '';
          const sKey = songKey(title, artistStr);
          const artists = splitArtists(artistStr);

          artists.forEach(rawName => {
            const normName = rawName.toUpperCase().replace(/[^A-Z0-9]/g,'');
            const artistStats = artistMap[normName];
            if (!artistStats) return;
            if (bucketName === 'POP') {
              if (!artistStats.seenPop.has(sKey)) {
                artistStats.seenPop.add(sKey);
                artistStats.num1Pop += 1;
              }
            } else if (bucketName === 'RNB') {
              if (!artistStats.seenRnb.has(sKey)) {
                artistStats.seenRnb.add(sKey);
                artistStats.num1Rnb += 1;
              }
            } else if (bucketName === 'HIPHOP') {
              if (!artistStats.seenHipHop.has(sKey)) {
                artistStats.seenHipHop.add(sKey);
                artistStats.num1HipHop += 1;
              }
            }
          });
        });
      } // end weeks

      // turn into list
      const artistList = Object.entries(artistMap).map(([normName, stats]) => {
        const totalStreams = stats.totalStreams;
        const weeks = stats.weeks.size;

        let num1Songs = 0, top10Songs = 0, top30Songs = 0;
        Object.values(stats.songs).forEach(r => {
          if (r === 1) num1Songs++;
          if (r <= 10) top10Songs++;
          if (r <= 30) top30Songs++;
        });

        let num1Albums = 0, top10Albums = 0;
        Object.values(stats.albums).forEach(r => {
          if (r === 1) num1Albums++;
          if (r <= 10) top10Albums++;
        });

        return {
          name: artistNameMap[normName],
          totalStreams,
          totalSales: stats.rawSales * 1750,
          num1Songs,
          num1Pop: stats.num1Pop,
          num1Rnb: stats.num1Rnb,
          num1HipHop: stats.num1HipHop,
          top10Songs,
          num1Albums,
          top10Albums,
          songEntriesTop100: Object.keys(stats.songs).length,
          weeksOnChart: weeks,
          top30Songs,
          rank: 0
        };
      });

      // default sort
      artistList.sort((a,b) => b.totalStreams - a.totalStreams);
      artistList.forEach((a,i) => a.rank = i+1);

      function renderTable(data) {
        const tbody = document.getElementById('artistTable');
        tbody.innerHTML = "";
        data.forEach(a => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${a.rank}</td>
            <td><a href="artist.html?artist=${encodeURIComponent(a.name)}">${a.name}</a></td>
            <td>${formatNumber(a.totalStreams)}</td>
            <td>${formatNumber(a.totalSales)}</td>
            <td>${a.num1Songs}</td>
            <td>${a.num1Pop}</td>
            <td>${a.num1Rnb}</td>
            <td>${a.num1HipHop}</td>
            <td>${a.top10Songs}</td>
            <td>${a.num1Albums}</td>
            <td>${a.top10Albums}</td>
            <td>${a.songEntriesTop100}</td>
            <td>${a.weeksOnChart}</td>
            <td>${a.top30Songs}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      renderTable(artistList);

      // sorting
      let currentSort = { key: 'rank', asc: true };
      const headers = document.querySelectorAll("th[data-sort]");

      headers.forEach(header => {
        header.addEventListener("click", () => {
          const key = header.getAttribute("data-sort");
          if (currentSort.key === key) {
            currentSort.asc = !currentSort.asc;
          } else {
            currentSort.key = key;
            currentSort.asc = true;
            if (key !== 'name') currentSort.asc = false;
          }

          headers.forEach(h => h.classList.remove("asc", "desc"));
          header.classList.add(currentSort.asc ? "asc" : "desc");

          artistList.sort((a,b) => {
            const valA = a[key];
            const valB = b[key];
            if (typeof valA === "string") {
              return currentSort.asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
            } else {
              return currentSort.asc ? valA - valB : valB - valA;
            }
          });

          if (['rank','totalStreams','totalSales'].includes(currentSort.key)) {
            artistList.forEach((a,i)=> a.rank = i+1);
          }

          renderTable(artistList);
        });
      });
    });
  })();
  </script>

</body>
</html>
