<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Top 100 Artists</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7fb;
      padding: 2rem;
      color: #222;
    }
    nav {
      text-align: center;
      margin-bottom: 2rem;
    }
    nav a {
      margin: 0 1rem;
      text-decoration: none;
      font-weight: 600;
      color: #4a6cf7;
      transition: color 0.3s ease;
      font-size: 1.1rem;
    }
    nav a:hover {
      color: #1a3de1;
    }
    h1 {
      text-align: center;
      color: #34495e;
      margin-bottom: 1rem;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    .table-container {
      overflow-x: auto;
      max-height: 650px;
      border: 1px solid #d0d7e3;
      border-radius: 8px;
      background-color: #fff;
      box-shadow: 0 3px 8px rgb(0 0 0 / 0.1);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1050px;
    }
    th, td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #e3e8f0;
      text-align: left;
      white-space: nowrap;
      font-size: 0.95rem;
      user-select: none;
    }
    th {
      background-color: #f0f4ff;
      font-weight: 700;
      text-transform: uppercase;
      position: sticky;
      top: 0;
      z-index: 5;
      cursor: pointer;
      color: #3a4a91;
      border-bottom: 2px solid #4a6cf7;
      transition: background-color 0.3s ease;
    }
    th:hover {
      background-color: #d2d9ff;
    }
    th:first-child, td:first-child {
      position: sticky;
      left: 0;
      background: #f9fbff;
      font-weight: 700;
      border-right: 1px solid #d0d7e3;
      z-index: 6;
    }
    tbody tr:hover {
      background-color: #f9faff;
    }
    a {
      color: #4a6cf7;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      text-decoration: underline;
    }
    /* Sort arrow indicators */
    th.asc::after {
      content: " ▲";
      font-size: 0.7rem;
      color: #4a6cf7;
    }
    th.desc::after {
      content: " ▼";
      font-size: 0.7rem;
      color: #4a6cf7;
    }

    /* Tooltip styling */
    [data-tooltip] {
      position: relative;
      cursor: help;
      border-bottom: 1px dotted #4a6cf7;
    }
    [data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      background: #4a6cf7;
      color: white;
      padding: 5px 8px;
      border-radius: 5px;
      white-space: nowrap;
      font-size: 0.8rem;
      opacity: 0.95;
      pointer-events: none;
      z-index: 10;
    }

    /* Summary below table */
    .summary {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #556677;
      text-align: center;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">🔥 Home</a>
    <a href="top_albums.html">💿 Top Albums</a>
    <a href="top_songs.html">🎵 Top Songs</a>
    <a href="top_artists.html">🎤 Top Artists</a>
  </nav>

  <h1>🎤 Top 100 Artists</h1>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th data-sort="rank" title="Rank position">Rank</th>
          <th data-sort="artist" title="Artist name">Artist</th>
          <th data-sort="streams" title="Total streams (estimated)">Total Streams</th>
          <th data-sort="monthly" title="Average monthly streams">Avg Monthly Streams</th>
          <th data-sort="sales" title="Estimated total sales">Total Sales</th>
          <th data-sort="num1songs" title="Number of #1 songs">#1 Songs</th>
          <th data-sort="top10songs" title="Number of Top 10 songs">Top 10 Songs</th>
          <th data-sort="num1albums" title="Number of #1 albums">#1 Albums</th>
          <th data-sort="top10albums" title="Number of Top 10 albums">Top 10 Albums</th>
          <th data-sort="weekly" title="Average weekly streams">Avg Weekly Streams</th>
        </tr>
      </thead>
      <tbody id="artistTable">
        <tr><td colspan="10">Loading data...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="summary" id="summaryText" aria-live="polite" role="status"></div>

  <script src="weekdata.js"></script>
  <script>
    function formatNumber(n) {
      if (n >= 1_000_000_000) return (n / 1_000_000_000).toFixed(1) + 'B';
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
      if (n >= 1_000) return (n / 1_000).toFixed(0) + 'K';
      return n.toString();
    }

    function normalize(str) {
      return (str || '').toUpperCase().replace(/[^A-Z0-9]/g, '').trim();
    }

    function normalizeAlbum(str) {
      return normalize(
        String(str || "")
          .replace(/\(.*?\)|\[.*?\]|DELUXE|BONUS|VERSION|REMASTERED|EXPANDED|EP/gi, "")
      );
    }

    function splitArtists(str) {
      return String(str || "")
        .split(/,|&| and | with | feat\.? | featuring /i)
        .map(a => a.trim())
        .filter(Boolean);
    }

    window.addEventListener("DOMContentLoaded", () => {
      const tableBody = document.getElementById("artistTable");
      const summary = document.getElementById("summaryText");
      const artistMap = {};
      const artistNameMap = {};
      const albumSalesMap = {};
      const songSalesMap = {};

      for (const week in weekData) {
        weekData[week].forEach(entry => {
          const fullArtistList = splitArtists(entry.artist);
          const album = entry.album || "";
          const title = entry.title || "";
          const rank = parseInt(entry.rank);
          const sales = parseFloat(entry.sales) || 0;
          const songKey = normalize(title);
          const albumKey = normalizeAlbum(album);

          fullArtistList.forEach(rawName => {
            const normName = normalize(rawName);

            if (!artistMap[normName]) {
              artistMap[normName] = {
                rawSales: 0,
                weeks: new Set(),
                songs: {},
                albums: {},
                diamondSongs: new Set(),
                diamondAlbums: new Set()
              };
              artistNameMap[normName] = rawName;
            }

            const artistStats = artistMap[normName];
            artistStats.rawSales += sales;
            artistStats.weeks.add(week);

            // Track song sales and best rank
            const songID = songKey + "|" + normName;
            if (!songSalesMap[songID]) songSalesMap[songID] = 0;
            songSalesMap[songID] += sales;

            if (!artistStats.songs[songKey]) artistStats.songs[songKey] = Infinity;
            if (rank < artistStats.songs[songKey]) artistStats.songs[songKey] = rank;

            // Track album sales and best rank
            if (albumKey !== "NAN") {
              const albumID = albumKey + "|" + normName;
              if (!albumSalesMap[albumID]) albumSalesMap[albumID] = 0;
              albumSalesMap[albumID] += sales;

              if (!artistStats.albums[albumKey]) artistStats.albums[albumKey] = Infinity;
              if (rank < artistStats.albums[albumKey]) artistStats.albums[albumKey] = rank;
            }
          });
        });
      }

      // Assign diamond songs and albums
      for (const key in songSalesMap) {
        const [songKey, normName] = key.split("|");
        if (songSalesMap[key] >= 1000 && artistMap[normName]) {
          artistMap[normName].diamondSongs.add(songKey);
        }
      }

      for (const key in albumSalesMap) {
        const [albumKey, normName] = key.split("|");
        if (albumSalesMap[key] >= 1000 && artistMap[normName]) {
          artistMap[normName].diamondAlbums.add(albumKey);
        }
      }

      const artistList = Object.entries(artistMap)
        .map(([norm, a]) => {
          const totalStreams = a.rawSales * 0.927124 * 1_000_000;
          const totalSales = a.rawSales * 745;
          const months = a.weeks.size / 4.33;
          const weeks = a.weeks.size;
          const displayName = artistNameMap[norm].split(' ')
            .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
            .join(' ');

          let num1Songs = 0, top10Songs = 0;
          for (const r of Object.values(a.songs)) {
            if (r === 1) num1Songs++;
            if (r <= 10) top10Songs++;
          }

          let num1Albums = 0, top10Albums = 0;
          for (const r of Object.values(a.albums)) {
            if (r === 1) num1Albums++;
            if (r <= 10) top10Albums++;
          }

          return {
            name: displayName,
            totalStreams,
            totalSales,
            monthlyStreams: totalStreams / (months || 1),
            weeklyStreams:  totalStreams / (weeks || 1),
            num1Songs,
            top10Songs,
            num1Albums,
            top10Albums,
            diamondSongs: a.diamondSongs.size,
            diamondAlbums: a.diamondAlbums.size
          };
        })
        .sort((a, b) => b.totalStreams - a.totalStreams)
        .slice(0, 100);

      function renderTable(data) {
        tableBody.innerHTML = "";
        data.forEach((a, i) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${i + 1}</td>
            <td><a href="artist.html?artist=${encodeURIComponent(a.name)}" title="View artist profile">${a.name}</a></td>
            <td data-tooltip="Total estimated streams">${formatNumber(a.totalStreams)}</td>
            <td data-tooltip="Average monthly streams">${formatNumber(a.monthlyStreams)}</td>
            <td data-tooltip="Estimated total sales">${formatNumber(a.totalSales)}</td>
            <td data-tooltip="Number of #1 songs">${a.num1Songs}</td>
            <td data-tooltip="Number of Top 10 songs">${a.top10Songs}</td>
            <td data-tooltip="Number of #1 albums">${a.num1Albums}</td>
            <td data-tooltip="Number of Top 10 albums">${a.top10Albums}</td>
            <td data-tooltip="Average weekly streams">${formatNumber(a.weeklyStreams)}</td>
          `;
          tableBody.appendChild(tr);
        });

        // Update summary below table
        const totalArtists = data.length;
        const totalStreamsAll = data.reduce((sum, a) => sum + a.totalStreams, 0);
        const totalSalesAll = data.reduce((sum, a) => sum + a.totalSales, 0);
        summary.textContent = `Top ${totalArtists} artists combined have approximately ${formatNumber(totalStreamsAll)} streams and ${formatNumber(totalSalesAll)} sales.`;
      }

      renderTable(artistList);

      const headers = document.querySelectorAll("th[data-sort]");
      headers.forEach(header => {
        header.addEventListener("click", () => {
          const key = header.getAttribute("data-sort");
          const isAsc = header.classList.contains("asc");
          headers.forEach(h => h.classList.remove("asc", "desc"));
          header.classList.add(isAsc ? "desc" : "asc");

          artistList.sort((a, b) => {
            if (typeof a[key] === 'string') {
              return isAsc
                ? a[key].localeCompare(b[key])
                : b[key].localeCompare(a[key]);
            } else {
              return isAsc ? a[key] - b[key] : b[key] - a[key];
            }
          });

          renderTable(artistList);
        });
      });
    });
  </script>
</body>
</html>
