<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Top 100 Artists</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #f0f0f0;
      padding: 2rem;
      margin: 0;
    }
    nav { text-align: center; margin-bottom: 2rem; }
    nav a {
      margin: 0 1rem;
      text-decoration: none;
      font-weight: bold;
      color: #f0f0f0;
      transition: color 0.2s ease;
    }
    nav a:hover { color: #1DB954; }
    h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 1rem;
      font-size: 2.5rem;
    }
    .table-container {
      overflow: auto;
      max-height: 600px;
      border: 1px solid #333;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.6);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #1e1e1e;
      color: #f0f0f0;
      min-width: 1200px;
    }
    th, td {
      padding: 0.75rem;
      border: 1px solid #333;
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
    }
    th {
      background-color: #2a2a2a;
      text-transform: uppercase;
      font-size: 0.85rem;
      position: sticky;
      top: 0;
      z-index: 2;
      user-select: none;
    }
    th:first-child,
    td:first-child {
      position: sticky;
      left: 0;
      background: #222;
      z-index: 3;
    }
    a {
      color: #1DB954;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    th.asc::after { content: " ▲"; color: #1DB954; }
    th.desc::after { content: " ▼"; color: #1DB954; }
    tr:nth-child(even) { background-color: #181818; }
    tr:hover { background-color: #2a2a2a; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">🔥 Home</a>
    <a href="top_albums.html">💿 Top Albums</a>
    <a href="top_songs.html">🎵 Top Songs</a>
    <a href="top_artists.html">🎤 Top Artists</a>
    <a href="albumrecord.html">📀 Album Records</a>
  </nav>

  <h1>🎤 Top 100 Artists</h1>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th data-sort="rank">Rank</th>
          <th data-sort="name">Artist</th>
          <th data-sort="totalStreams">Total Streams</th>
          <th data-sort="totalSales">Total Sales</th>
          <th data-sort="num1Songs">#1 Songs</th>
          <th data-sort="num1Pop">#1 POP</th>
          <th data-sort="num1Rnb">#1 RNB</th>
          <th data-sort="num1HipHop">#1 HIP-HOP</th>
          <th data-sort="top10Songs">Top 10 Songs</th>
          <th data-sort="num1Albums">#1 Albums</th>
          <th data-sort="top10Albums">Top 10 Albums</th>
          <th data-sort="songEntriesTop100">Song Entries (Top 100)</th>
          <th data-sort="weeksOnChart">Weeks on Chart</th>
          <th data-sort="top30Songs">Top 30 Records</th>
        </tr>
      </thead>
      <tbody id="artistTable">
        <tr><td colspan="14">Loading data...</td></tr>
      </tbody>
    </table>
  </div>

  <script src="weekdata.js"></script>
  <script>
  (() => {
    const raw =
      window.__WEEKDATA__ ||
      (window.__WEEKDATA__ = (window.weekData || window.weekdata || window.WEEKDATA || {}));

    function genreTokensFromRow(r){
      const arr = [];
      if (r.mainGenre) arr.push(r.mainGenre);
      if (Array.isArray(r.subGenres)) arr.push(...r.subGenres);
      if (r.genre) arr.push(r.genre);
      if (Array.isArray(r.genres)) arr.push(...r.genres);
      // also support new fields you added
      if (r.genre5) arr.push(r.genre5);
      if (r.subgenre5) arr.push(r.subgenre5);
      return arr.map(x => String(x).trim()).filter(Boolean);
    }

    function tokensToBuckets(tokens){
      const buckets = new Set();
      const lows = tokens.map(t => t.toLowerCase());
      if (lows.some(t => t.includes('pop'))) buckets.add('POP');
      if (lows.some(t => t.includes('r&b') || t.includes('rnb') || t.includes('soul') || t.includes('neo-soul'))) buckets.add('RNB');
      if (lows.some(t => t.includes('hip') || t.includes('rap') || t.includes('trap'))) buckets.add('HIPHOP');
      if (lows.some(t => t.includes('rock') || t.includes('alt') || t.includes('indie'))) buckets.add('ROCK');
      if (lows.some(t => t.includes('dance') || t.includes('edm') || t.includes('electro'))) buckets.add('DANCE');
      if (!buckets.size) buckets.add('POP');
      return Array.from(buckets);
    }

    function getWeekRowsExpanded(weekNum, weekData){
      const base = (weekData[weekNum] || []).slice();
      base.sort((a,b)=>{
        const ra = Number(a.rank ?? a.position ?? a.pos ?? 9999);
        const rb = Number(b.rank ?? b.position ?? b.pos ?? 9999);
        return ra - rb;
      });
      const trimmed = base.slice(0,200).filter(r=>{
        const t = (r.title || r.song || '').toString();
        return !/sweep week/i.test(t);
      });
      return trimmed.map(r=>{
        const tokens = genreTokensFromRow(r);
        const buckets = tokensToBuckets(tokens);
        return { ...r, _buckets: buckets };
      });
    }

    function splitArtists(str){
      return (str || "")
        .split(/,|&| and | with | feat\.? | featuring /i)
        .map(a => a.trim())
        .filter(Boolean);
    }

    function formatNumber(n) {
      if (n >= 1_000_000_000) return (n / 1_000_000_000).toFixed(1) + 'B';
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
      if (n >= 1_000) return (n / 1_000).toFixed(0) + 'K';
      return n.toString();
    }

    window.addEventListener("DOMContentLoaded", () => {
      const tbody = document.getElementById('artistTable');

      let weekData = {};
      if (Array.isArray(raw)) {
        raw.forEach(r=>{
          const w = r.week || r.Week || r.w;
          if (!w) return;
          (weekData[w] ||= []).push(r);
        });
      } else {
        weekData = raw;
      }

      const weeks = Object.keys(weekData).map(n=>+n).filter(n=>!isNaN(n)).sort((a,b)=>a-b);

      const artistMap = {};
      const artistNameMap = {};

      // PASS 1: aggregate base stats
      for (const w of weeks) {
        const rows = getWeekRowsExpanded(w, weekData);

        rows.forEach(entry=>{
          const artists = splitArtists(entry.artist || entry.Artist || '');
          const album = entry.album || '';
          const title = entry.title || entry.song || '';
          const rank = Number(entry.rank ?? entry.position ?? entry.pos ?? 9999);
          const sales = parseFloat(entry.sales) || 0;
          const streams = parseFloat(entry.streams) || 0;

          artists.forEach(rawName=>{
            const normName = rawName.toUpperCase().replace(/[^A-Z0-9]/g,'');

            if (!artistMap[normName]) {
              artistMap[normName] = {
                rawSales: 0,
                weeks: new Set(),
                songs: {},
                albums: {},
                totalStreams: 0,
                num1Pop: 0,
                num1Rnb: 0,
                num1HipHop: 0
              };
              artistNameMap[normName] = rawName;
            }

            const st = artistMap[normName];
            st.rawSales += sales;
            st.totalStreams += streams;
            st.weeks.add(w);

            const songKeySimple = (title || "").toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (!st.songs[songKeySimple]) st.songs[songKeySimple] = Infinity;
            if (rank < st.songs[songKeySimple]) st.songs[songKeySimple] = rank;

            const albumKey = String(album || "").toUpperCase()
              .replace(/\(.*?\)|\[.*?\]|DELUXE|BONUS|VERSION|REMASTERED|EXPANDED|EP/gi, "")
              .replace(/[^A-Z0-9]/g,'');
            if (albumKey) {
              if (!st.albums[albumKey]) st.albums[albumKey] = Infinity;
              if (rank < st.albums[albumKey]) st.albums[albumKey] = rank;
            }
          });
        });
      }

      // PASS 2: per-week, per-genre #1 — NOW COUNTING PER WEEK (no song de-dupe)
      for (const w of weeks) {
        const rows = getWeekRowsExpanded(w, weekData);

        ['POP','RNB','HIPHOP'].forEach(bucketName => {
          const bucketRows = rows.filter(r => Array.isArray(r._buckets) && r._buckets.includes(bucketName));
          if (!bucketRows.length) return;

          bucketRows.sort((a,b)=>{
            const pa = Number(a.points || a.Points || 0);
            const pb = Number(b.points || b.Points || 0);
            if (pb !== pa) return pb - pa;
            const sa = Number(a.sales || a.Sales || 0);
            const sb = Number(b.sales || b.Sales || 0);
            if (sb !== sa) return sb - sa;
            return String(a.title||a.song||'').localeCompare(String(b.title||b.song||''));
          });

          const top = bucketRows[0];
          const artistStr = top.artist || top.Artist || '';
          const artists = splitArtists(artistStr);

          artists.forEach(rawName=>{
            const normName = rawName.toUpperCase().replace(/[^A-Z0-9]/g,'');
            const st = artistMap[normName];
            if (!st) return;
            if (bucketName === 'POP')      st.num1Pop += 1;     // count every POP week #1
            if (bucketName === 'RNB')      st.num1Rnb += 1;     // count every RNB week #1
            if (bucketName === 'HIPHOP')   st.num1HipHop += 1;  // count every HIP-HOP week #1
          });
        });
      }

      // build list
      const artistList = Object.entries(artistMap).map(([normName, st])=>{
        const weeksCount = st.weeks.size;

        let num1Songs = 0, top10Songs = 0, top30Songs = 0;
        Object.values(st.songs).forEach(r =>{
          if (r === 1) num1Songs++;
          if (r <= 10) top10Songs++;
          if (r <= 30) top30Songs++;
        });

        let num1Albums = 0, top10Albums = 0;
        Object.values(st.albums).forEach(r =>{
          if (r === 1) num1Albums++;
          if (r <= 10) top10Albums++;
        });

        return {
          name: artistNameMap[normName],
          totalStreams: st.totalStreams,
          totalSales: st.rawSales * 1750,
          num1Songs,
          num1Pop: st.num1Pop,
          num1Rnb: st.num1Rnb,
          num1HipHop: st.num1HipHop,
          top10Songs,
          num1Albums,
          top10Albums,
          songEntriesTop100: Object.keys(st.songs).length,
          weeksOnChart: weeksCount,
          top30Songs,
          rank: 0
        };
      });

      // default sort
      artistList.sort((a,b)=> b.totalStreams - a.totalStreams);
      artistList.forEach((a,i)=> a.rank = i+1);

      function renderTable(data){
        tbody.innerHTML = "";
        data.slice(0,100).forEach(a=>{
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${a.rank}</td>
            <td><a href="artist.html?artist=${encodeURIComponent(a.name)}">${a.name}</a></td>
            <td>${formatNumber(a.totalStreams)}</td>
            <td>${formatNumber(a.totalSales)}</td>
            <td>${a.num1Songs}</td>
            <td>${a.num1Pop}</td>
            <td>${a.num1Rnb}</td>
            <td>${a.num1HipHop}</td>
            <td>${a.top10Songs}</td>
            <td>${a.num1Albums}</td>
            <td>${a.top10Albums}</td>
            <td>${a.songEntriesTop100}</td>
            <td>${a.weeksOnChart}</td>
            <td>${a.top30Songs}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      renderTable(artistList);

      // sorting
      let currentSort = { key:'rank', asc:true };
      const headers = document.querySelectorAll("th[data-sort]");

      headers.forEach(header=>{
        header.addEventListener('click', ()=>{
          const key = header.getAttribute('data-sort');
          if (currentSort.key === key){
            currentSort.asc = !currentSort.asc;
          } else {
            currentSort.key = key;
            currentSort.asc = key === 'name' ? true : false;
          }

          headers.forEach(h=>h.classList.remove('asc','desc'));
          header.classList.add(currentSort.asc ? 'asc' : 'desc');

          artistList.sort((a,b)=>{
            const va = a[key], vb = b[key];
            if (typeof va === 'string') {
              return currentSort.asc ? va.localeCompare(vb) : vb.localeCompare(va);
            } else {
              return currentSort.asc ? va - vb : vb - va;
            }
          });

          if (['rank','totalStreams','totalSales'].includes(key)){
            artistList.forEach((a,i)=>a.rank=i+1);
          }

          renderTable(artistList);
        });
      });
    });
  })();
  </script>
</body>
</html>
