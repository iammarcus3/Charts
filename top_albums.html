<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Top Albums by Year</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      padding: 2rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    select {
      padding: 0.5rem;
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      padding: 0.6rem;
      text-align: left;
      border-bottom: 1px solid #333;
    }
    th {
      background: #222;
    }
    tr:hover {
      background: #1a1a1a;
    }
    .number {
      text-align: right;
    }
  </style>
</head>
<body>
  <h1>Top 20 Albums by Sales Per Year</h1>
  <label for="yearSelect">Select Year:</label>
  <select id="yearSelect"></select>

  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>Album</th>
        <th>Artist</th>
        <th class="number">Sales (That Year)</th>
        <th class="number">Sales to Date</th>
        <th class="number">Weeks</th>
        <th class="number">Peak</th>
      </tr>
    </thead>
    <tbody id="albumTable"></tbody>
  </table>

  <script src="weekdata.js"></script>
  <script>
    const yearSelect = document.getElementById('yearSelect');
    const tableBody = document.getElementById('albumTable');

    // Safe normalizeAlbum: only process strings, else empty string
    function normalizeAlbum(name) {
      if (typeof name !== 'string') return '';
      return name
        .toLowerCase()
        .replace(/\s*\(.*?\)|\[.*?]|[-–—_]/g, '')
        .replace(/[^a-z0-9 ]/g, '')
        .trim();
    }

    // Extract all years available from weekData
    const weekYears = Object.keys(weekData).map(Number).map(weekNum => {
      const entry = weekData[weekNum][0];
      if (entry && entry.date) return new Date(entry.date).getFullYear();
      // fallback estimate if date missing:
      return 2018 + Math.floor((weekNum - 1) / 52);
    });

    const uniqueYears = [...new Set(weekYears)].sort((a, b) => b - a);

    uniqueYears.forEach(year => {
      const option = document.createElement('option');
      option.value = year;
      option.textContent = year;
      yearSelect.appendChild(option);
    });

    function getTopAlbums(year) {
      const albumMap = new Map();

      for (const [weekKey, entries] of Object.entries(weekData)) {
        const weekNum = parseInt(weekKey);
        const entryYear = entries[0] && entries[0].date
          ? new Date(entries[0].date).getFullYear()
          : 2018 + Math.floor((weekNum - 1) / 52);

        for (const entry of entries) {
          if (!entry.album || !entry.artist) continue;

          const key = normalizeAlbum(entry.album) + '___' + entry.artist;
          const albumInfo = albumMap.get(key) || {
            album: entry.album,
            artist: entry.artist,
            salesThisYear: 0,
            totalSales: 0,
            weeks: 0,
            peak: entry.rank
          };

          if (entryYear === parseInt(year)) {
            albumInfo.salesThisYear += entry.sales || 0;
          }

          albumInfo.totalSales += entry.sales || 0;
          albumInfo.weeks += 1;
          if (entry.rank < albumInfo.peak) albumInfo.peak = entry.rank;

          albumMap.set(key, albumInfo);
        }
      }

      return [...albumMap.values()]
        .filter(a => a.salesThisYear > 0)
        .sort((a, b) => b.salesThisYear - a.salesThisYear)
        .slice(0, 20);
    }

    function renderTable(year) {
      const albums = getTopAlbums(year);
      tableBody.innerHTML = '';

      albums.forEach((album, index) => {
        const row = document.createElement('tr');

        row.innerHTML = `
          <td>${index + 1}</td>
          <td>${album.album}</td>
          <td>${album.artist}</td>
          <td class="number">${album.salesThisYear.toLocaleString()}</td>
          <td class="number">${album.totalSales.toLocaleString()}</td>
          <td class="number">${album.weeks}</td>
          <td class="number">${album.peak}</td>
        `;

        tableBody.appendChild(row);
      });
    }

    yearSelect.addEventListener('change', e => {
      renderTable(e.target.value);
    });

    // Load latest year by default
    renderTable(uniqueYears[0]);
    yearSelect.value = uniqueYears[0];
  </script>
</body>
</html>
