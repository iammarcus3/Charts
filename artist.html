<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Artist Profile</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #111; color: #fff; padding: 2rem; }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
    h2 { margin-top: 2rem; font-size: 1.5rem; border-bottom: 2px solid #fff; padding-bottom: 0.3rem; }
    .stats { font-size: 1rem; margin-top: 0.5rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; background-color: #1a1a1a; }
    th, td { padding: 0.8rem; border: 1px solid #444; text-align: left; font-size: 0.95rem; }
    th { background-color: #222; text-transform: uppercase; }
    a { color: #4DB8FF; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .cert-icon { height: 20px; vertical-align: middle; margin-right: 6px; }
    .summary { margin-top: 2rem; font-weight: bold; color: #ccc; }
    .pill { display:inline-block; padding:.2rem .5rem; border:1px solid #444; border-radius:999px; font-size:.9rem; margin-left:.6rem; background:#000; color:#4DB8FF; }
  </style>
</head>
<body>
  <h1 id="artistName">Artist Name</h1>
  <div class="stats" id="artistStats"></div>

  <h2>Albums</h2>
  <table id="albumsTable">
    <thead><tr><th>Album</th><th>Certification</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>Songs</h2>
  <table id="songsTable">
    <thead>
      <tr>
        <th>Title</th><th>Certification</th><th>Streams</th>
        <th>Weeks</th><th>Peak</th><th>#1s</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="summary" id="certTotals"></div>

  <script src="weekdata.js"></script>
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    // ─────────────── Config ───────────────
    const BASE_WEEK_START = new Date("2018-02-23T00:00:00Z");
    const SONG_SALE_MULTIPLIER  = 1750; // set 2000 if your ecosystem uses that
    const ALBUM_SALE_MULTIPLIER = 500;
    const TITLE_SIM_THRESHOLD   = 0.95; // merge song titles ≥95% similar
    const ALBUM_SIM_THRESHOLD   = 0.98; // merge album names ≥98% similar
    const INF_RANK = 999999;

    // ─────────────── Params ───────────────
    const params = new URLSearchParams(location.search);
    const artistParam = params.get("artist") || "";
    document.getElementById("artistName").textContent = artistParam;

    // ─────────────── Normalizers ───────────────
    const normalize = str => String(str || "").toUpperCase().replace(/[^A-Z0-9]/g, "").trim();
    const normalizeTitle = str => normalize(
      String(str || "")
        .replace(/\(.*?\)|\[.*?\]|REMIX|RADIO EDIT|FEAT\.?|FEATURING|VERSION|SINGLE/gi, "")
        .replace(/&/g, "AND")
    );
    const normalizeAlbum = str => normalize(
      String(str || "")
        .replace(/\(.*?\)|\[.*?\]|DELUXE|BONUS|VERSION|REMASTERED|EXPANDED|EP/gi, "")
    );

    // Prefer a display title that includes features; else longest
    function preferDisplayTitle(oldT, newT){
      const o = String(oldT||""); const n = String(newT||"");
      const oHasFeat = /\b(feat\.?|featuring| x | with | duet with )/i.test(o);
      const nHasFeat = /\b(feat\.?|featuring| x | with | duet with )/i.test(n);
      if (nHasFeat && !oHasFeat) return n;
      if (!nHasFeat && oHasFeat) return o;
      return n.length >= o.length ? n : o;
    }

    // ─────────────── Similarity (Levenshtein) ───────────────
    function levenshtein(a, b) {
      const m = a.length, n = b.length;
      if (!m) return n; if (!n) return m;
      const dp = new Array(n + 1);
      for (let j = 0; j <= n; j++) dp[j] = j;
      for (let i = 1; i <= m; i++) {
        let prev = dp[0]; dp[0] = i;
        for (let j = 1; j <= n; j++) {
          const tmp = dp[j];
          dp[j] = Math.min(
            dp[j] + 1,
            dp[j - 1] + 1,
            prev + (a[i - 1] === b[j - 1] ? 0 : 1)
          );
          prev = tmp;
        }
      }
      return dp[n];
    }
    function similarity(a, b) {
      a = String(a || ""); b = String(b || "");
      const maxLen = Math.max(a.length, b.length);
      if (!maxLen) return 1;
      return 1 - (levenshtein(a, b) / maxLen);
    }

    // ─────────────── Field mapping ───────────────
    const RANK_FIELDS      = ['rank', 'position', 'pos'];
    const WEEKLY_SALES_F   = ['sales', 'units', 'weeklySales', 'weekSales', 'points'];
    const CUME_SALES_F     = ['totalSales', 'cumulativeSales', 'cume', 'lifetimeSales', 'unitsTotal', 'total_units'];
    const WEEKLY_STREAMS_F = ['streams', 'weeklyStreams', 'plays', 'plays_million', 'plays_millions'];
    const CUME_STREAMS_F   = ['totalStreams', 'cumulativeStreams', 'streamsTotal'];

    function pick(obj, fields) { for (const f of fields) if (obj && obj[f] != null) return obj[f]; }
    function num(x){ const n = Number(x); return Number.isFinite(n) ? n : 0; }

    // ─────────────── Certification helpers ───────────────
    function trackCertLabel(salesBase) {
      const adj = salesBase * SONG_SALE_MULTIPLIER;
      if (adj >= 10_000_000) return "Diamond";
      if (adj >=  9_000_000) return "9× Platinum";
      if (adj >=  8_000_000) return "8× Platinum";
      if (adj >=  7_000_000) return "7× Platinum";
      if (adj >=  6_000_000) return "6× Platinum";
      if (adj >=  5_000_000) return "5× Platinum";
      if (adj >=  4_000_000) return "4× Platinum";
      if (adj >=  3_000_000) return "3× Platinum";
      if (adj >=  2_000_000) return "2× Platinum";
      if (adj >=  1_000_000) return "Platinum";
      if (adj >=    500_000) return "Gold";
      return "—";
    }
    function trackCertHTML(salesBase) {
      const label = trackCertLabel(salesBase);
      if (label === "—") return "—";
      const map = {
        "Diamond":"Diamond.png","9× Platinum":"9x Platinum.png","8× Platinum":"8x Platinum.png",
        "7× Platinum":"7x Platinum.png","6× Platinum":"6x Platinum.png","5× Platinum":"5x Platinum.png",
        "4× Platinum":"4x Platinum.png","3× Platinum":"3x Platinum.png","2× Platinum":"2x Platinum.png",
        "Platinum":"Platinum.png","Gold":"Gold.png"
      };
      return `<img src="${map[label] || 'Platinum.png'}" class="cert-icon" title="${label}"> ${label}`;
    }
    function albumCertLabel(salesBase) {
      const adj = salesBase * ALBUM_SALE_MULTIPLIER;
      if (adj >= 10_000_000) return `Diamond`;
      if (adj >=  9_000_000) return `9× Platinum`;
      if (adj >=  8_000_000) return `8× Platinum`;
      if (adj >=  7_000_000) return `7× Platinum`;
      if (adj >=  6_000_000) return `6× Platinum`;
      if (adj >=  5_000_000) return `5× Platinum`;
      if (adj >=  4_000_000) return `4× Platinum`;
      if (adj >=  3_000_000) return `3× Platinum`;
      if (adj >=  2_000_000) return `2× Platinum`;
      if (adj >=  1_000_000) return `Platinum`;
      if (adj >=    500_000) return `Gold`;
      return "—";
    }
    function albumCertHTML(salesBase) {
      const label = albumCertLabel(salesBase);
      if (label === "—") return "—";
      const map = {
        "Diamond":"Diamond.png","9× Platinum":"9x Platinum.png","8× Platinum":"8x Platinum.png",
        "7× Platinum":"7x Platinum.png","6× Platinum":"6x Platinum.png","5× Platinum":"5x Platinum.png",
        "4× Platinum":"4x Platinum.png","3× Platinum":"3x Platinum.png","2× Platinum":"2x Platinum.png",
        "Platinum":"Platinum.png","Gold":"Gold.png"
      };
      return `<img src="${map[label] || 'Platinum.png'}" class="cert-icon" title="${label}"> ${label}`;
    }

    const fmt = n => n >= 1_000_000_000 ? (n/1_000_000_000).toFixed(1)+'B'
                 : n >= 1_000_000 ? (n/1_000_000).toFixed(1)+'M'
                 : n >= 1_000 ? (n/1_000).toFixed(0)+'K'
                 : String(Math.round(n));

    // ─────────────── Artist participation (primary + features) ───────────────
    const artistKey = normalize(artistParam);

    function splitArtistList(str){
      return String(str || "")
        .split(/,|&| and | with | feat\.? | featuring | vs | x | presents | duet with /i)
        .map(a => normalize(a)).filter(Boolean);
    }

    function extractFeaturedFromTitle(title){
      const s = String(title || "");
      const found = [];
      // (feat. X), (with X), (x X)
      const reParens = /\((?:FEAT\.?|FEATURING|WITH|DUET WITH|X)\s+([^)]+)\)/gi;
      let m;
      while ((m = reParens.exec(s)) !== null) found.push(m[1]);
      // inline " - feat. X", "feat. X", "with X", "x X"
      const reInline = /(?:FEAT\.?|FEATURING|WITH|DUET WITH|X)\s+([^\-\(\)\[\]\|•]+)/gi;
      while ((m = reInline.exec(s)) !== null) found.push(m[1]);
      return found.flatMap(ch => ch.split(/,|&| and | x | with | vs /i)).map(normalize).filter(Boolean);
    }

    function trackInvolvesArtist(row){
      const inArtistField = splitArtistList(row.artist).includes(artistKey);
      if (inArtistField) return true;
      const inTitleFeat = extractFeaturedFromTitle(row.title).includes(artistKey);
      return inTitleFeat;
    }

    // ─────────────── Data structures ───────────────
    const albumsMap = {}; // canonAlbumKey -> { name, sales, tracks:Set }
    const songsMap  = {}; // canonSongKey  -> metrics object
    const songKeys  = []; // keep insertion order of canon keys for similarity scanning

    // To derive weekly deltas when only cumulative provided
    const runningCumeSales   = {}; // canonSongKey -> last cume
    const runningCumeStreams = {};

    // ─────────────── Iterate weeks (sorted) ───────────────
    const weekList = Object.keys(weekData).map(k => ({
      num: parseInt(String(k).replace(/\D/g,''), 10) || 0,
      entries: Array.isArray(weekData[k]) ? weekData[k] : []
    })).sort((a,b)=>a.num-b.num);

    for (const {num:weekNum, entries} of weekList) {
      for (const row of entries) {
        if (!trackInvolvesArtist(row)) continue;

        // Find / create canonical song key with fuzzy 95%
        const titleNorm = normalizeTitle(row.title);
        let canonSongKey = null;
        for (const k of songKeys) {
          if (similarity(titleNorm, k) >= TITLE_SIM_THRESHOLD) { canonSongKey = k; break; }
        }
        if (!canonSongKey) {
          canonSongKey = titleNorm || `UNTITLED_${songKeys.length+1}`;
          songKeys.push(canonSongKey);
          songsMap[canonSongKey] = {
            titleDisplay: row.title || 'Untitled',
            artistDisplay: row.artist || artistParam,
            salesBase: 0,
            streamsBase: 0,
            weeksSeen: new Set(),
            peak: INF_RANK,
            num1s: 0,
            firstWeek: null,
            firstRank: null
          };
        } else {
          // pick a display title that preserves features if present
          songsMap[canonSongKey].titleDisplay = preferDisplayTitle(songsMap[canonSongKey].titleDisplay, row.title);
        }

        // Flexible field picks
        const rankRaw = pick(row, RANK_FIELDS);
        const rank = Number.isFinite(Number(rankRaw)) ? Number(rankRaw) : INF_RANK;

        // Compute weekly sales base
        let weeklySalesBase = 0;
        const wSales = pick(row, WEEKLY_SALES_F);
        const cSales = pick(row, CUME_SALES_F);
        if (wSales != null) {
          weeklySalesBase = num(wSales);
        } else if (cSales != null) {
          const cumeNow = num(cSales);
          const prev = runningCumeSales[canonSongKey] || 0;
          weeklySalesBase = Math.max(0, cumeNow - prev);
          runningCumeSales[canonSongKey] = cumeNow;
        }

        // Compute weekly streams base
        let weeklyStreamsBase = 0;
        const wStreams = pick(row, WEEKLY_STREAMS_F);
        const cStreams = pick(row, CUME_STREAMS_F);
        if (wStreams != null) {
          weeklyStreamsBase = num(wStreams);
        } else if (cStreams != null) {
          const cumeNowS = num(cStreams);
          const prevS = runningCumeStreams[canonSongKey] || 0;
          weeklyStreamsBase = Math.max(0, cumeNowS - prevS);
          runningCumeStreams[canonSongKey] = cumeNowS;
        }

        // Update song metrics
        const S = songsMap[canonSongKey];
        S.salesBase += weeklySalesBase;
        S.streamsBase += weeklyStreamsBase;

        if (!S.firstWeek || weekNum < S.firstWeek) {
          S.firstWeek = weekNum;
          S.firstRank = (rank === INF_RANK ? null : rank);
        }
        S.weeksSeen.add(weekNum);
        if (rank < S.peak) S.peak = rank;
        if (rank === 1) S.num1s++;

        // Album aggregation (98% merge)
        const albNorm = normalizeAlbum(row.album);
        if (albNorm && albNorm !== "NAN") {
          let canonAlbKey = null;
          for (const k of Object.keys(albumsMap)) {
            if (similarity(albNorm, k) >= ALBUM_SIM_THRESHOLD) { canonAlbKey = k; break; }
          }
          if (!canonAlbKey) {
            canonAlbKey = albNorm;
            albumsMap[canonAlbKey] = { name: row.album || 'Unknown Album', salesBase: 0, tracks: new Set() };
          }
          albumsMap[canonAlbKey].salesBase += weeklySalesBase;
          albumsMap[canonAlbKey].tracks.add(canonSongKey);
        }
      }
    }

    // ─────────────── Render Albums (≥2 unique tracks) ───────────────
    const albumsTBody = document.querySelector("#albumsTable tbody");
    Object.values(albumsMap)
      .filter(a => a.tracks.size >= 2)
      .sort((a,b)=> b.salesBase - a.salesBase)
      .forEach(a => {
        const cert = albumCertHTML(a.salesBase);
        const url = `album_detail.html?album=${encodeURIComponent(a.name)}&artist=${encodeURIComponent(artistParam)}`;
        const tr = document.createElement("tr");
        tr.innerHTML = `<td><a href="${url}">${a.name}</a></td><td>${cert}</td>`;
        albumsTBody.appendChild(tr);
      });

    // ─────────────── Render Songs (Top 100 only) ───────────────
    const songsTBody = document.querySelector("#songsTable tbody");
    const allSongsRaw = Object.values(songsMap).map(S => ({
      ...S,
      weeks: S.weeksSeen.size,
      certLabel: trackCertLabel(S.salesBase),
      certHTML: trackCertHTML(S.salesBase),
      debutYear: S.firstWeek ? new Date(BASE_WEEK_START.getTime() + (S.firstWeek-1)*7*24*3600*1000).getFullYear() : '—'
    }));

    // filter: only songs whose best peak is within top 100
    const songsArr = allSongsRaw
      .filter(S => typeof S.peak === 'number' && S.peak <= 100)
      .sort((a,b) => (a.firstWeek||INF_RANK) - (b.firstWeek||INF_RANK));

    let lastYear = null;
    songsArr.forEach(S => {
      const year = S.debutYear;
      if (year !== lastYear) {
        const yearRow = document.createElement("tr");
        yearRow.innerHTML = `<td colspan="6" style="background:#000;color:#4DB8FF;font-weight:bold;">${year}</td>`;
        songsTBody.appendChild(yearRow);

        // Year mini-stats (only Top 100 entries)
        const yrSongs = songsArr.filter(x => x.debutYear === year);
        const songsCount = yrSongs.length;
        const distinctNum1s = yrSongs.filter(x => x.peak === 1).length;
        const top10s = yrSongs.filter(x => x.peak <= 10).length;
        const statsRow = document.createElement("tr");
        statsRow.innerHTML = `<td colspan="6" style="background:#111;color:#ccc;font-style:italic;">🎵 Songs: ${songsCount} | 🥇 #1 songs: ${distinctNum1s} | 🔟 Top 10s: ${top10s}</td>`;
        songsTBody.appendChild(statsRow);

        lastYear = year;
      }

      const url = `track_detail.html?title=${encodeURIComponent(S.titleDisplay)}&artist=${encodeURIComponent(S.artistDisplay)}`;
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><a href="${url}">${S.titleDisplay}</a></td>
        <td>${S.certHTML}</td>
        <td>${fmt(S.streamsBase)}</td>
        <td>${S.weeks}</td>
        <td>#${S.peak}</td>
        <td>${S.num1s}</td>
      `;
      songsTBody.appendChild(tr);
    });

    // ─────────────── Artist Stats (global, Top 100 only) ───────────────
    const statsEl = document.getElementById("artistStats");
    const totalSongs = songsArr.length;
    const distinctNum1Songs = songsArr.filter(x => x.peak === 1).length; // songs that reached #1
    const totalNum1Weeks = songsArr.reduce((s,x)=> s + x.num1s, 0);      // total weeks at #1
    const totalTop10s = songsArr.filter(x => x.peak <= 10).length;
    const debutAt1 = songsArr.filter(x => x.firstRank === 1).length;     // #1 debuts among Top 100 entries

    statsEl.innerHTML = `
      Songs Charted (Top 100): ${totalSongs}
      <span class="pill">#1 Songs: ${distinctNum1Songs}</span>
      <span class="pill">Weeks at #1: ${totalNum1Weeks}</span>
      <span class="pill">Top 10s: ${totalTop10s}</span>
      <span class="pill">#1 Debuts: ${debutAt1}</span>
    `;

    // ─────────────── Certification Totals
    const certTotalsEl = document.getElementById("certTotals");

    // Album certs (albums with ≥2 tracks)
    const albumCounts = {};
    Object.values(albumsMap)
      .filter(a => a.tracks.size >= 2)
      .forEach(a => {
        const label = albumCertLabel(a.salesBase);
        if (label !== "—") albumCounts[label] = (albumCounts[label] || 0) + 1;
      });

    // Track certs (Top 100 songs only)
    const trackCounts = {};
    songsArr.forEach(S => {
      const label = S.certLabel;
      if (label !== "—") trackCounts[label] = (trackCounts[label] || 0) + 1;
    });

    function toLine(obj){
      return Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k}: ${v}`).join(" | ");
    }

    const albumsLine = toLine(albumCounts);
    const tracksLine = toLine(trackCounts);

    certTotalsEl.innerHTML =
      (albumsLine ? `ALBUM CERTS — ${albumsLine}` : `ALBUM CERTS — None`) +
      ' &nbsp;&nbsp; | &nbsp;&nbsp; ' +
      (tracksLine ? `TRACK CERTS — ${tracksLine}` : `TRACK CERTS — None`);
  });
  </script>
</body>
</html>
