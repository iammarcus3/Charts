<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Artist Profile</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #111; color: #fff; padding: 2rem; }
    h1 { font-size: 2.5rem; }
    h2 { margin-top: 2rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.6rem; border-bottom: 1px solid #444; text-align: left; }
    th { background-color: #222; }
    .cert-icon { font-size: 1.2rem; }
    .gold { color: goldenrod; }
    .platinum { color: lightgray; }
    .diamond { color: skyblue; }
    .group-year { background: #222; font-weight: bold; font-size: 1.1rem; }
  </style>
</head>
<body>
  <h1 id="artistName">Artist Name</h1>

  <div id="stats"></div>

  <h2>Albums</h2>
  <table id="albumsTable">
    <thead>
      <tr>
        <th>Cover</th>
        <th>Album</th>
        <th>Certification</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>Songs</h2>
  <table id="songsTable">
    <thead>
      <tr>
        <th>Title</th>
        <th>Weeks</th>
        <th>Peak</th>
        <th>#1s</th>
        <th>Certification</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="certTotals" style="margin-top: 2rem;"></div>

  <script src="weekdata.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const artist = decodeURIComponent(params.get("artist")).toLowerCase();
    document.getElementById("artistName").textContent = decodeURIComponent(params.get("artist"));

    const allWeeks = Object.keys(weekData).map(w => +w).sort((a, b) => a - b);
    const songMap = {};
    const albumMap = {};
    const chartStats = { debuts: 0, top10: 0, number1s: 0 };
    const certCounts = {};

    function getCertification(total) {
      if (total >= 1000000) return { label: "💎 Diamond", class: "diamond", count: Math.floor(total / 1000000) };
      if (total >= 200000) return { label: `💿 x${Math.floor(total / 100000)}`, class: "platinum", count: Math.floor(total / 100000) };
      if (total >= 100000) return { label: "💿 Platinum", class: "platinum", count: 1 };
      if (total >= 50000) return { label: "🥇 Gold", class: "gold", count: 1 };
      return null;
    }

    for (const week of allWeeks) {
      for (const entry of weekData[week]) {
        if (!entry.artist || entry.artist.toLowerCase() !== artist) continue;

        // SONGS
        const key = (entry.title + "///" + entry.artist).toLowerCase();
        if (!songMap[key]) {
          songMap[key] = {
            title: entry.title,
            weeks: 0,
            peak: Infinity,
            total: 0,
            number1s: 0,
            debutWeek: week,
            album: entry.album,
          };
        }
        const song = songMap[key];
        song.weeks++;
        song.total += entry.sales;
        song.peak = Math.min(song.peak, +entry.rank);
        if (+entry.rank === 1) song.number1s++;
        if (week < song.debutWeek) song.debutWeek = week;
      }

      // ALBUMS
      for (const entry of weekData[week]) {
        if (!entry.album || !entry.artist || entry.artist.toLowerCase() !== artist) continue;
        const norm = entry.album.trim().toLowerCase().replace(/\s*\(.*?\)|\[.*?\]|deluxe|bonus|edition|version/gi, "").replace(/[^a-z0-9]/gi, "");
        if (!albumMap[norm]) {
          albumMap[norm] = {
            name: entry.album,
            total: 0,
            weeks: 0,
            peak: Infinity,
            cover: `https://dummyimage.com/100x100/222/fff.png&text=${encodeURIComponent(entry.album[0] || "A")}`
          };
        }
        albumMap[norm].total += entry.sales;
        albumMap[norm].weeks++;
        albumMap[norm].peak = Math.min(albumMap[norm].peak, +entry.rank);
      }
    }

    const songRowsByYear = {};
    for (const song of Object.values(songMap)) {
      const cert = getCertification(song.total);
      const year = 2018 + Math.floor((+song.debutWeek - 1) / 52);
      const row = `<tr>
        <td>${song.title}</td>
        <td>${song.weeks}</td>
        <td>${song.peak}</td>
        <td>${song.number1s}</td>
        <td>${cert ? `<span class="cert-icon ${cert.class}">${cert.label}</span>` : ""}</td>
      </tr>`;

      if (!songRowsByYear[year]) songRowsByYear[year] = [];
      songRowsByYear[year].push({ html: row, week: song.debutWeek });

      chartStats.debuts++;
      if (song.peak <= 10) chartStats.top10++;
      if (song.peak === 1) chartStats.number1s++;

      if (cert) {
        const key = cert.label;
        certCounts[key] = (certCounts[key] || 0) + 1;
      }
    }

    const tbody = document.querySelector("#songsTable tbody");
    const sortedYears = Object.keys(songRowsByYear).map(Number).sort((a, b) => a - b);
    for (const year of sortedYears) {
      tbody.innerHTML += `<tr class="group-year"><td colspan="5">${year}</td></tr>`;
      const rows = songRowsByYear[year].sort((a, b) => a.week - b.week);
      for (const r of rows) tbody.innerHTML += r.html;
    }

    // Albums table
    const albumRows = Object.values(albumMap)
      .sort((a, b) => b.total - a.total)
      .map(album => {
        const cert = getCertification(album.total);
        if (cert) {
          const key = cert.label;
          certCounts[key] = (certCounts[key] || 0) + 1;
        }
        return `<tr>
          <td><img src="${album.cover}" width="60" /></td>
          <td>${album.name}</td>
          <td>${cert ? `<span class="cert-icon ${cert.class}">${cert.label}</span>` : ""}</td>
        </tr>`;
      }).join("");
    document.querySelector("#albumsTable tbody").innerHTML = albumRows;

    // Stats
    document.getElementById("stats").innerHTML = `
      <p><strong>#1 Songs:</strong> ${chartStats.number1s}</p>
      <p><strong>Top 10 Hits:</strong> ${chartStats.top10}</p>
      <p><strong>Total Debuts:</strong> ${chartStats.debuts}</p>
    `;

    // Totals
    const certList = Object.entries(certCounts)
      .sort((a, b) => b[1] - a[1])
      .map(([label, count]) => `<p>${label}: ${count}</p>`).join("");
    document.getElementById("certTotals").innerHTML = `<h3>Total Certifications</h3>${certList}`;
  </script>
</body>
</html>
