<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Artist Profile</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #111; color: #fff; padding: 2rem; }
    h1 { font-size: 2rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #333; padding: 0.5rem; text-align: left; }
    th { background-color: #222; }
    img { height: 30px; vertical-align: middle; }
    .year-header { background: #333; font-weight: bold; text-align: center; color: #ccc; }
  </style>
</head>
<body>
  <h1 id="artist-name">Loading...</h1>

  <h2>Stats</h2>
  <ul id="stats"></ul>

  <h2>Albums</h2>
  <table id="albums-table">
    <thead>
      <tr>
        <th>Cover</th>
        <th>Album</th>
        <th>Certification</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>Songs</h2>
  <table id="songs-table">
    <thead>
      <tr>
        <th>Title</th>
        <th>Certification</th>
        <th>Weeks</th>
        <th>Peak</th>
        <th>#1s</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h3>Certification Totals</h3>
  <ul id="cert-totals"></ul>

  <script src="weekdata.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const artist = decodeURIComponent(urlParams.get("artist"));
    document.getElementById("artist-name").textContent = artist;

    const songMap = new Map();
    const albumMap = new Map();
    const songStats = {};
    const songDebuts = {};

    const certImages = (sales) => {
      if (sales >= 1000000) return "💎";
      if (sales >= 900000) return "💿 x9";
      if (sales >= 800000) return "💿 x8";
      if (sales >= 700000) return "💿 x7";
      if (sales >= 600000) return "💿 x6";
      if (sales >= 500000) return "💿 x5";
      if (sales >= 400000) return "💿 x4";
      if (sales >= 300000) return "💿 x3";
      if (sales >= 200000) return "💿 x2";
      if (sales >= 100000) return "💿";
      if (sales >= 50000) return "🥇";
      return "";
    };

    const certText = (sales) => {
      if (sales >= 1000000) return "Diamond";
      if (sales >= 100000) return `${Math.floor(sales / 100000)}x Platinum`;
      if (sales >= 50000) return "Gold";
      return "";
    };

    const parseWeek = (weekNum) => {
      const base = new Date(2018, 1, 23); // 23 Feb 2018
      return new Date(base.getTime() + (weekNum - 1) * 7 * 24 * 60 * 60 * 1000);
    };

    for (const [week, entries] of Object.entries(weekData)) {
      const weekNum = parseInt(week);
      for (const entry of entries) {
        const normArtist = entry.artist.trim().toLowerCase();
        if (normArtist !== artist.trim().toLowerCase()) continue;

        const key = `${entry.title}|||${entry.artist}`;
        const albumKey = `${entry.album || "Unknown"}|||${entry.artist}`;

        // Songs
        if (!songMap.has(key)) {
          songMap.set(key, {
            title: entry.title,
            sales: entry.totalSales,
            weeks: 1,
            peak: parseInt(entry.rank),
            numberOnes: entry.rank === "1" ? 1 : 0,
            debutWeek: weekNum
          });
        } else {
          const song = songMap.get(key);
          song.sales = entry.totalSales;
          song.weeks += 1;
          if (parseInt(entry.rank) < song.peak) song.peak = parseInt(entry.rank);
          if (entry.rank === "1") song.numberOnes += 1;
        }

        // Albums
        if (!albumMap.has(albumKey)) {
          albumMap.set(albumKey, {
            album: entry.album || "Unknown",
            sales: entry.totalSales
          });
        } else {
          albumMap.get(albumKey).sales = entry.totalSales;
        }
      }
    }

    // ALBUMS
    const albumBody = document.querySelector("#albums-table tbody");
    for (const album of albumMap.values()) {
      const row = document.createElement("tr");

      const imgCell = document.createElement("td");
      imgCell.textContent = certImages(album.sales);
      row.appendChild(imgCell);

      const nameCell = document.createElement("td");
      nameCell.textContent = album.album;
      row.appendChild(nameCell);

      const certCell = document.createElement("td");
      certCell.textContent = certText(album.sales);
      row.appendChild(certCell);

      albumBody.appendChild(row);
    }

    // SONGS
    const songBody = document.querySelector("#songs-table tbody");

    // Convert to array, sort by debut week, then group by year
    const songArray = Array.from(songMap.values());
    songArray.sort((a, b) => a.debutWeek - b.debutWeek);

    const songsByYear = {};
    for (const song of songArray) {
      const year = parseWeek(song.debutWeek).getFullYear();
      if (!songsByYear[year]) songsByYear[year] = [];
      songsByYear[year].push(song);
    }

    for (const year of Object.keys(songsByYear).sort()) {
      const yearRow = document.createElement("tr");
      yearRow.className = "year-header";
      const yearCell = document.createElement("td");
      yearCell.colSpan = 5;
      yearCell.textContent = year;
      yearRow.appendChild(yearCell);
      songBody.appendChild(yearRow);

      for (const song of songsByYear[year]) {
        const row = document.createElement("tr");

        const titleCell = document.createElement("td");
        const link = document.createElement("a");
        link.href = `track_detail.html?title=${encodeURIComponent(song.title)}&artist=${encodeURIComponent(artist)}`;
        link.textContent = song.title;
        link.style.color = "#9cf";
        titleCell.appendChild(link);
        row.appendChild(titleCell);

        const certCell = document.createElement("td");
        certCell.textContent = certImages(song.sales);
        row.appendChild(certCell);

        const weeksCell = document.createElement("td");
        weeksCell.textContent = song.weeks;
        row.appendChild(weeksCell);

        const peakCell = document.createElement("td");
        peakCell.textContent = song.peak;
        row.appendChild(peakCell);

        const onesCell = document.createElement("td");
        onesCell.textContent = song.numberOnes;
        row.appendChild(onesCell);

        songBody.appendChild(row);
      }
    }

    // STATS
    const statUl = document.getElementById("stats");
    const totalSongs = songMap.size;
    const num1s = [...songMap.values()].filter(s => s.peak === 1).length;
    const top10s = [...songMap.values()].filter(s => s.peak <= 10).length;
    const debuts = [...songMap.values()].filter(s => s.peak === parseInt(s.debutRank || s.peak)).length;

    statUl.innerHTML = `
      <li><strong>Number of Songs:</strong> ${totalSongs}</li>
      <li><strong>#1 Hits:</strong> ${num1s}</li>
      <li><strong>Top 10s:</strong> ${top10s}</li>
      <li><strong>Debuts:</strong> ${debuts}</li>
    `;

    // CERT TOTALS
    const certs = {
      Diamond: 0,
      "Platinum": 0,
      "Gold": 0
    };

    for (const s of songMap.values()) {
      if (s.sales >= 1000000) certs.Diamond++;
      else if (s.sales >= 100000) certs.Platinum += Math.floor(s.sales / 100000);
      else if (s.sales >= 50000) certs.Gold++;
    }

    const certUl = document.getElementById("cert-totals");
    certUl.innerHTML = `
      <li>💎 Diamond: ${certs.Diamond}</li>
      <li>💿 Platinum: ${certs.Platinum}</li>
      <li>🥇 Gold: ${certs.Gold}</li>
    `;
  </script>
</body>
</html>
