<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Artist Profile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
      padding: 2rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.2rem;
    }
    h2 {
      font-size: 1.2rem;
      margin-top: 2rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      padding: 0.5rem;
      border-bottom: 1px solid #444;
      text-align: left;
    }
    th {
      background-color: #222;
    }
    tr.year-row th {
      background-color: #333;
      font-size: 1.1rem;
    }
    a {
      color: #1DB954;
      text-decoration: none;
    }
    .cert-image {
      height: 40px;
    }
  </style>
</head>
<body>
  <h1 id="artist-name">Loading...</h1>
  <h2>Albums</h2>
  <table id="albums-table">
    <thead>
      <tr>
        <th>Cover</th>
        <th>Album</th>
        <th>Certification</th>
      </tr>
    </thead>
    <tbody id="albums-body"></tbody>
  </table>

  <h2>Songs</h2>
  <table id="songs-table">
    <thead>
      <tr>
        <th>Title</th>
        <th>Certification</th>
        <th>Weeks</th>
        <th>Peak</th>
        <th>#1s</th>
      </tr>
    </thead>
    <tbody id="songs-body"></tbody>
  </table>

  <h2>Certifications Summary</h2>
  <ul id="cert-summary"></ul>

  <script src="weekdata.js"></script>
  <script>
    function getCertification(sales) {
      if (sales >= 1000000) return "💎 Diamond";
      if (sales >= 900000) return "💿 x9 Platinum";
      if (sales >= 800000) return "💿 x8 Platinum";
      if (sales >= 700000) return "💿 x7 Platinum";
      if (sales >= 600000) return "💿 x6 Platinum";
      if (sales >= 500000) return "💿 x5 Platinum";
      if (sales >= 400000) return "💿 x4 Platinum";
      if (sales >= 300000) return "💿 x3 Platinum";
      if (sales >= 200000) return "💿 x2 Platinum";
      if (sales >= 100000) return "💿 Platinum";
      if (sales >= 50000) return "🥇 Gold";
      return "";
    }

    function getCertificationIcon(sales) {
      if (sales >= 1000000) return "💎";
      if (sales >= 100000) return "💿";
      if (sales >= 50000) return "🥇";
      return "";
    }

    const params = new URLSearchParams(window.location.search);
    const artistName = decodeURIComponent(params.get("artist") || "").toLowerCase();
    document.getElementById("artist-name").textContent = decodeURIComponent(params.get("artist") || "");

    const artistData = {
      albums: {},
      songs: [],
    };

    const seenSongs = new Set();
    const certCounts = {};

    for (const week in weekData) {
      weekData[week].forEach(entry => {
        const entryArtist = entry.artist.toLowerCase();
        if (entryArtist !== artistName) return;

        // Albums
        const albumKey = `${entry.album}||${entry.artist}`;
        if (!artistData.albums[albumKey]) {
          artistData.albums[albumKey] = {
            name: entry.album,
            artist: entry.artist,
            totalSales: 0,
          };
        }
        artistData.albums[albumKey].totalSales += entry.sales;

        // Songs
        const songKey = `${entry.title}||${entry.artist}`;
        if (!seenSongs.has(songKey)) {
          seenSongs.add(songKey);
          artistData.songs.push({
            title: entry.title,
            artist: entry.artist,
            totalSales: entry.totalSales,
            weeks: entry.weeks,
            peak: entry.peak,
            debutWeek: entry.debutWeek || parseInt(week),
            weeksOnChart: [parseInt(week)],
            weeksAtOne: entry.rank === 1 ? 1 : 0,
          });
        } else {
          const song = artistData.songs.find(s => s.title === entry.title && s.artist === entry.artist);
          song.weeksOnChart.push(parseInt(week));
          if (entry.rank === 1) song.weeksAtOne++;
        }
      });
    }

    // === SONGS GROUPED BY YEAR OF DEBUT ===
    const songsByYear = {};
    const baseDate = new Date("2018-01-01");

    artistData.songs.forEach(song => {
      const firstWeek = parseInt(song.weeksOnChart[0]);
      const debutDate = new Date(baseDate);
      debutDate.setDate(baseDate.getDate() + (firstWeek - 1) * 7);
      const year = debutDate.getFullYear();
      if (year < 2018) return;

      if (!songsByYear[year]) songsByYear[year] = [];

      songsByYear[year].push({
        ...song,
        debutDate
      });
    });

    const sortedYears = Object.keys(songsByYear).sort((a, b) => b - a);
    const tbody = document.getElementById("songs-body");
    tbody.innerHTML = "";

    sortedYears.forEach(year => {
      const yearRow = document.createElement("tr");
      yearRow.classList.add("year-row");
      yearRow.innerHTML = `<th colspan="5">${year}</th>`;
      tbody.appendChild(yearRow);

      songsByYear[year].sort((a, b) => a.debutDate - b.debutDate);

      songsByYear[year].forEach(song => {
        const cert = getCertification(song.totalSales);
        const certIcon = getCertificationIcon(song.totalSales);
        const num1s = song.weeksAtOne || 0;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><a href="track_detail.html?title=${encodeURIComponent(song.title)}&artist=${encodeURIComponent(song.artist)}">${song.title}</a></td>
          <td>${certIcon} ${cert}</td>
          <td>${song.weeks}</td>
          <td>${song.peak}</td>
          <td>${num1s > 0 ? num1s : ""}</td>
        `;
        tbody.appendChild(tr);

        if (cert) {
          certCounts[cert] = (certCounts[cert] || 0) + 1;
        }
      });
    });

    // === ALBUMS ===
    const albumTbody = document.getElementById("albums-body");
    for (const key in artistData.albums) {
      const album = artistData.albums[key];
      const cert = getCertification(album.totalSales);
      const image = cert.includes("Diamond") ? "diamond.png"
                  : cert.includes("x9") ? "9x.png"
                  : cert.includes("x8") ? "8x.png"
                  : cert.includes("x7") ? "7x.png"
                  : cert.includes("x6") ? "6x.png"
                  : cert.includes("x5") ? "5x.png"
                  : cert.includes("x4") ? "4x.png"
                  : cert.includes("x3") ? "3x.png"
                  : cert.includes("x2") ? "2x.png"
                  : cert.includes("Platinum") ? "platinum.png"
                  : cert.includes("Gold") ? "gold.png"
                  : "";

      albumTbody.innerHTML += `
        <tr>
          <td>${image ? `<img src="certs/${image}" class="cert-image">` : ""}</td>
          <td>${album.name}</td>
          <td>${cert}</td>
        </tr>
      `;
    }

    // === CERTIFICATION SUMMARY ===
    const summary = document.getElementById("cert-summary");
    Object.keys(certCounts).sort((a, b) => certCounts[b] - certCounts[a]).forEach(cert => {
      const li = document.createElement("li");
      li.textContent = `${cert}: ${certCounts[cert]}`;
      summary.appendChild(li);
    });
  </script>
</body>
</html>
