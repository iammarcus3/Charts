<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Artist Profile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
      padding: 2rem;
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    h2 { margin-top: 2rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td {
      padding: 0.5rem;
      text-align: left;
      border-bottom: 1px solid #444;
    }
    th { background-color: #222; }
    a { color: #1db954; text-decoration: none; }
    .cert-icon { font-size: 1.2rem; margin-right: 4px; }
    .year-row th {
      background: #222;
      color: #fff;
      font-size: 1.1rem;
      padding-top: 1rem;
    }
  </style>
</head>
<body>
  <h1 id="artist-name">Artist</h1>
  <p><strong>#1 Hits:</strong> <span id="num1s">0</span> |
     <strong>Top 10s:</strong> <span id="top10s">0</span></p>

  <h2>Albums</h2>
  <table>
    <thead>
      <tr>
        <th>Cover</th>
        <th>Album</th>
        <th>Certification</th>
      </tr>
    </thead>
    <tbody id="albums-table"></tbody>
  </table>

  <h2>Songs</h2>
  <table id="songs-table">
    <thead>
      <tr>
        <th>Title</th>
        <th>Cert</th>
        <th>Weeks</th>
        <th>Peak</th>
        <th>#1s</th>
      </tr>
    </thead>
    <tbody id="songs-body">
      <!-- Populated by script -->
    </tbody>
  </table>

  <h2>Certifications Summary</h2>
  <ul id="cert-summary"></ul>

  <script src="weekdata.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const artist = params.get("artist");
    document.getElementById("artist-name").textContent = decodeURIComponent(artist);

    const artistData = {
      songs: [],
      albums: {}
    };

    // Cert logic
    function getCertification(sales) {
      if (sales >= 1000000) return "💎 Diamond";
      if (sales >= 100000) return `${sales / 100000}x Platinum`;
      if (sales >= 50000) return "🥇 Gold";
      return "";
    }

    function getCertificationIcon(sales) {
      if (sales >= 1000000) return "💎";
      if (sales >= 100000) return "💿";
      if (sales >= 50000) return "🥇";
      return "";
    }

    const certCounts = {};

    // Gather song data
    for (const week in weekData) {
      weekData[week].forEach(entry => {
        if (entry.artist.toLowerCase().includes(artist.toLowerCase())) {
          const key = entry.title + "___" + entry.artist;
          let song = artistData.songs.find(s => s.key === key);
          if (!song) {
            song = {
              key,
              title: entry.title,
              artist: entry.artist,
              totalSales: 0,
              weeks: 0,
              peak: Infinity,
              weeksAtOne: 0,
              weeksOnChart: [],
              album: entry.album
            };
            artistData.songs.push(song);
          }
          song.totalSales += entry.totalSales;
          song.weeks++;
          song.weeksOnChart.push(week);
          const rank = parseInt(entry.rank);
          if (rank === 1) song.weeksAtOne++;
          if (rank < song.peak) song.peak = rank;
        }
      });
    }

    // Count Top 10s and #1s
    let top10s = 0, num1s = 0;
    artistData.songs.forEach(song => {
      if (song.peak <= 10) top10s++;
      if (song.peak === 1) num1s++;
    });
    document.getElementById("num1s").textContent = num1s;
    document.getElementById("top10s").textContent = top10s;

    // Album table
    artistData.songs.forEach(song => {
      const album = song.album || "Unknown";
      if (!artistData.albums[album]) {
        artistData.albums[album] = { totalSales: 0, title: album };
      }
      artistData.albums[album].totalSales += song.totalSales;
    });

    const albumRows = Object.values(artistData.albums)
      .sort((a, b) => b.totalSales - a.totalSales);

    const albumTable = document.getElementById("albums-table");
    albumRows.forEach(album => {
      const cert = getCertification(album.totalSales);
      const icon = getCertificationIcon(album.totalSales);
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${icon}</td>
        <td><a href="album_detail.html?album=${encodeURIComponent(album.title)}&artist=${encodeURIComponent(artist)}">${album.title}</a></td>
        <td>${cert}</td>
      `;
      albumTable.appendChild(row);

      if (icon) {
        certCounts[cert] = (certCounts[cert] || 0) + 1;
      }
    });

    // Group songs by year of debut
    const songsByYear = {};
    artistData.songs.forEach(song => {
      const debutWeek = song.weeksOnChart[0];
      const debutDate = new Date(debutWeek);
      const year = debutDate.getFullYear();

      if (!songsByYear[year]) songsByYear[year] = [];

      songsByYear[year].push({
        ...song,
        debutDate
      });
    });

    // Sort years descending
    const sortedYears = Object.keys(songsByYear).sort((a, b) => b - a);

    const tbody = document.getElementById("songs-body");
    tbody.innerHTML = "";

    sortedYears.forEach(year => {
      const yearRow = document.createElement("tr");
      yearRow.classList.add("year-row");
      yearRow.innerHTML = `<th colspan="5">${year}</th>`;
      tbody.appendChild(yearRow);

      songsByYear[year].sort((a, b) => a.debutDate - b.debutDate);

      songsByYear[year].forEach(song => {
        const cert = getCertification(song.totalSales);
        const certIcon = getCertificationIcon(song.totalSales);
        const num1s = song.weeksAtOne || 0;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><a href="track_detail.html?title=${encodeURIComponent(song.title)}&artist=${encodeURIComponent(song.artist)}">${song.title}</a></td>
          <td>${certIcon} ${cert}</td>
          <td>${song.weeks}</td>
          <td>${song.peak}</td>
          <td>${num1s > 0 ? num1s : ""}</td>
        `;
        tbody.appendChild(tr);

        if (cert) {
          certCounts[cert] = (certCounts[cert] || 0) + 1;
        }
      });
    });

    // Summary
    const certList = document.getElementById("cert-summary");
    const sortedCerts = Object.entries(certCounts)
      .sort((a, b) => b[1] - a[1]);

    sortedCerts.forEach(([label, count]) => {
      const li = document.createElement("li");
      li.textContent = `${label}: ${count}`;
      certList.appendChild(li);
    });
  </script>
</body>
</html>
