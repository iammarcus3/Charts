<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Artist Profile</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #111; color: #fff; padding: 2rem; }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
    h2 { margin-top: 2rem; font-size: 1.5rem; border-bottom: 2px solid #fff; padding-bottom: 0.3rem; }
    .stats { font-size: 1rem; margin-top: 0.5rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; background-color: #1a1a1a; }
    th, td { padding: 0.8rem; border: 1px solid #444; text-align: left; font-size: 0.95rem; }
    th { background-color: #222; text-transform: uppercase; }
    a { color: #4DB8FF; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .cert-icon { height: 20px; vertical-align: middle; margin-right: 3px; }
    .summary { margin-top: 2rem; font-weight: bold; color: #ccc; }
  </style>
</head>
<body>
  <h1 id="artistName">Artist Name</h1>
  <div class="stats" id="artistStats"></div>

  <h2>Albums</h2>
  <table id="albumsTable">
    <thead><tr><th>Album</th><th>Certification</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>Songs</h2>
  <table id="songsTable">
    <thead>
      <tr>
        <th>Title</th><th>Certification</th><th>Streams</th>
        <th>Weeks</th><th>Peak</th><th>#1s</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="summary" id="certTotals"></div>

  <script src="weekdata.js"></script>
  <script>
  document.addEventListener("DOMContentLoaded", () => {

    const BASE_WEEK_START = new Date("2018-02-23");

    const params = new URLSearchParams(location.search);
    const artistParam = params.get("artist") || "";
    document.getElementById("artistName").textContent = artistParam;

    const normalize = str => String(str || "").toUpperCase().replace(/[^A-Z0-9]/g, "").trim();
    const normalizeTitle = str => normalize(
      String(str || "")
        .replace(/\(.*?\)|\[.*?\]|REMIX|RADIO EDIT|FEAT\.?|FEATURING|VERSION|SINGLE/gi, "")
        .replace(/AND|&|N/gi, "AND")
    );
    const normalizeAlbum = str => normalize(
      String(str || "")
        .replace(/\(.*?\)|\[.*?\]|DELUXE|BONUS|VERSION|REMASTERED|EXPANDED|EP/gi, "")
    );

    // -----------------------------
    // similarity function (Levenshtein)
    // -----------------------------
    function similarity(a, b) {
        a = String(a || "");
        b = String(b || "");
        if (a === b) return 1;
        const alen = a.length, blen = b.length;
        if (alen === 0 || blen === 0) return 0;
        // dp matrix of size (blen+1) x (alen+1)
        const dp = new Array(blen + 1);
        for (let i = 0; i <= blen; i++) {
            dp[i] = new Array(alen + 1).fill(0);
            dp[i][0] = i;
        }
        for (let j = 0; j <= alen; j++) dp[0][j] = j;
        for (let i = 1; i <= blen; i++) {
            for (let j = 1; j <= alen; j++) {
                dp[i][j] = (b.charAt(i - 1) === a.charAt(j - 1))
                    ? dp[i - 1][j - 1]
                    : Math.min(dp[i - 1][j - 1] + 1, dp[i][j - 1] + 1, dp[i - 1][j] + 1);
            }
        }
        const dist = dp[blen][alen];
        return 1 - dist / Math.max(alen, blen);
    }
    // -----------------------------
    // End similarity
    // -----------------------------

    const splitArtists = str => String(str || "")
      .split(/,|&| and | with | feat\.? | featuring /i)
      .map(a => normalize(a)).filter(Boolean);
    const formatNumber = n => n >= 1_000_000_000 ? (n / 1_000_000_000).toFixed(1) + "B" :
                          n >= 1_000_000 ? (n / 1_000_000).toFixed(1) + "M" :
                          n >= 1_000 ? (n / 1_000).toFixed(0) + "K" : n.toString();

    function getTrackCertIcon(sales) {
        const adjustedSales = sales * 1750;
        if (adjustedSales >= 10_000_000) return `<img src="Diamond.png" class="cert-icon" title="Diamond"> Diamond`;
        if (adjustedSales >= 9_000_000) return `<img src="9x Platinum.png" class="cert-icon" title="9× Platinum"> 9× Platinum`;
        if (adjustedSales >= 8_000_000) return `<img src="8x Platinum.png" class="cert-icon" title="8× Platinum"> 8× Platinum`;
        if (adjustedSales >= 7_000_000) return `<img src="7x Platinum.png" class="cert-icon" title="7× Platinum"> 7× Platinum`;
        if (adjustedSales >= 6_000_000) return `<img src="6x Platinum.png" class="cert-icon" title="6× Platinum"> 6× Platinum`;
        if (adjustedSales >= 5_000_000) return `<img src="5x Platinum.png" class="cert-icon" title="5× Platinum"> 5× Platinum`;
        if (adjustedSales >= 4_000_000) return `<img src="4x Platinum.png" class="cert-icon" title="4× Platinum"> 4× Platinum`;
        if (adjustedSales >= 3_000_000) return `<img src="3x Platinum.png" class="cert-icon" title="3× Platinum"> 3× Platinum`;
        if (adjustedSales >= 2_000_000) return `<img src="2x Platinum.png" class="cert-icon" title="2× Platinum"> 2× Platinum`;
        if (adjustedSales >= 1_000_000) return `<img src="Platinum.png" class="cert-icon" title="Platinum"> Platinum`;
        if (adjustedSales >= 500_000) return `<img src="Gold.png" class="cert-icon" title="Gold"> Gold`;
        return "—";
    }

    function getAlbumCertIcons(sales) {
        const adjustedSales = sales * 500;
        if (adjustedSales >= 10_000_000) return `<img src="Diamond.png" class="cert-icon" title="Diamond"> Diamond`;
        if (adjustedSales >= 9_000_000) return `<img src="9x Platinum.png" class="cert-icon" title="9× Platinum"> 9× Platinum`;
        if (adjustedSales >= 8_000_000) return `<img src="8x Platinum.png" class="cert-icon" title="8× Platinum"> 8× Platinum`;
        if (adjustedSales >= 7_000_000) return `<img src="7x Platinum.png" class="cert-icon" title="7× Platinum"> 7× Platinum`;
        if (adjustedSales >= 6_000_000) return `<img src="6x Platinum.png" class="cert-icon" title="6× Platinum"> 6× Platinum`;
        if (adjustedSales >= 5_000_000) return `<img src="5x Platinum.png" class="cert-icon" title="5× Platinum"> 5× Platinum`;
        if (adjustedSales >= 4_000_000) return `<img src="4x Platinum.png" class="cert-icon" title="4× Platinum"> 4× Platinum`;
        if (adjustedSales >= 3_000_000) return `<img src="3x Platinum.png" class="cert-icon" title="3× Platinum"> 3× Platinum`;
        if (adjustedSales >= 2_000_000) return `<img src="2x Platinum.png" class="cert-icon" title="2× Platinum"> 2× Platinum`;
        if (adjustedSales >= 1_000_000) return `<img src="Platinum.png" class="cert-icon" title="Platinum"> Platinum`;
        if (adjustedSales >= 500_000) return `<img src="Gold.png" class="cert-icon" title="Gold"> Gold`;
        return "—";
    }

    const artistKey = normalize(artistParam);
    const albumsMap = {}, songsMap = {}, songFirstWeek = {};

    for (const week in weekData) {
        const weekNum = parseInt(week);
        weekData[week].forEach(entry => {
            const allArtists = splitArtists(entry.artist);
            const isMatch = allArtists.includes(artistKey) || String(entry.title || "").toLowerCase().includes(artistParam.toLowerCase());
            if (!isMatch) return;

            const titleKey = normalizeTitle(entry.title);
            const albumKey = normalizeAlbum(entry.album);
            const sales = parseFloat(entry.sales) || 0;
            const totalSales = parseFloat(entry.totalSales) || 0;
            const rank = parseInt(entry.rank);
            const streams = parseFloat(entry.streams) || 0;

            // ---------- album handling with similarity-based merge ----------
            if (albumKey && albumKey !== "NAN") {
                // find an existing normalized album key with >= 98% similarity
                let existingKey = null;
                for (const key in albumsMap) {
                    if (similarity(albumKey, key) >= 0.98) {
                        existingKey = key;
                        break;
                    }
                }

                const finalKey = existingKey || albumKey;

                if (!albumsMap[finalKey]) {
                    // use the raw entry.album for display name on first creation
                    albumsMap[finalKey] = {
                        name: entry.album,
                        sales: 0,
                        tracks: new Set()
                    };
                }

                albumsMap[finalKey].sales += sales;
                albumsMap[finalKey].tracks.add(titleKey);
            }
            // ----------------------------------------------------------------

            if (!songsMap[titleKey]) {
                songsMap[titleKey] = { title: entry.title, artist: entry.artist, sales: 0, totalSales: 0, weeks: 0, peak: rank, num1s: 0, streams: 0 };
            }

            const song = songsMap[titleKey];
            song.sales += sales;
            song.totalSales += totalSales;
            song.weeks++;
            song.streams += streams;
            if (rank < song.peak) song.peak = rank;
            if (rank === 1) song.num1s++;

            if (!songFirstWeek[titleKey] || weekNum < songFirstWeek[titleKey]) {
                songFirstWeek[titleKey] = weekNum;
            }
        });
    }

    Object.entries(songsMap).forEach(([key, song]) => song.firstWeek = songFirstWeek[key] || 9999);

    // Populate Albums Table (only if ≥2 unique tracks)
    const albumsTable = document.querySelector("#albumsTable tbody");
    Object.values(albumsMap)
        .filter(album => album.tracks.size >= 2)
        .sort((a,b) => b.sales - a.sales)
        .forEach(album => {
            const cert = getAlbumCertIcons(album.sales);
            const url = `album_detail.html?album=${encodeURIComponent(album.name)}&artist=${encodeURIComponent(artistParam)}`;
            const row = document.createElement("tr");
            row.innerHTML = `<td><a href="${url}">${album.name}</a></td><td>${cert}</td>`;
            albumsTable.appendChild(row);
        });

    // Populate Songs Table
    const songsTable = document.querySelector("#songsTable tbody");
    const sortedSongs = Object.values(songsMap).sort((a,b) => a.firstWeek - b.firstWeek);

    let lastYear = null;
    sortedSongs.forEach(song => {
        if (song.peak > 100 || song.peak === Infinity) return;

        const firstDate = new Date(BASE_WEEK_START);
        firstDate.setDate(firstDate.getDate() + (song.firstWeek - 1) * 7);
        const year = firstDate.getFullYear();

        if (year !== lastYear) {
            const yearRow = document.createElement("tr");
            yearRow.innerHTML = `<td colspan="7" style="background:#000;color:#4DB8FF;font-weight:bold;">${year}</td>`;
            songsTable.appendChild(yearRow);

            const yearSongs = sortedSongs.filter(s => {
                if (s.peak > 100 || s.peak === Infinity) return false;
                const d = new Date(BASE_WEEK_START);
                d.setDate(d.getDate() + (s.firstWeek - 1) * 7);
                return d.getFullYear() === year;
            });
            const statsRow = document.createElement("tr");
            const songsCount = yearSongs.length;
            const num1s = yearSongs.filter(s => s.peak === 1).length;
            const top10s = yearSongs.filter(s => s.peak <= 10).length;
            statsRow.innerHTML = `<td colspan="7" style="background:#111;color:#ccc;font-style:italic;">🎵 Songs: ${songsCount} | 🥇 #1s: ${num1s} | 🔟 Top 10s: ${top10s}</td>`;
            songsTable.appendChild(statsRow);

            lastYear = year;
        }

        const cert = getTrackCertIcon(song.sales);
        const url = `track_detail.html?title=${encodeURIComponent(song.title)}&artist=${encodeURIComponent(song.artist)}`;
        const row = document.createElement("tr");
        row.innerHTML = `<td><a href="${url}">${song.title}</a></td>
                         <td>${cert}</td>
                         <td>${formatNumber(song.streams)}</td>
                         <td>${song.weeks}</td>
                         <td>#${song.peak}</td>
                         <td>${song.num1s}</td>`;
        songsTable.appendChild(row);
    });

    // Artist Stats
    const statsEl = document.getElementById("artistStats");
    if (statsEl) {
        const allSongs = Object.values(songsMap);
        const num1s = allSongs.filter(s => s.peak === 1).length;
        const top10s = allSongs.filter(s => s.peak <= 10).length;
        const debuts = allSongs.filter(s => s.firstWeek === Math.min(...Object.values(songFirstWeek))).length;
        statsEl.textContent = `Songs Charted: ${allSongs.length} | #1s: ${num1s} | Top 10s: ${top10s} | Debuts: ${debuts}`;
    }

    // Certification Totals (only albums with ≥2 tracks)
    const certTotals = document.getElementById("certTotals");
    const certCounts = {};
    Object.values(albumsMap)
        .filter(album => album.tracks.size >= 2)
        .forEach(album => {
            const label = getAlbumCertIcons(album.sales).replace(/<[^>]*>/g, "").trim();
            if (label !== "—") certCounts[label] = (certCounts[label] || 0) + 1;
        });
    certTotals.textContent = Object.entries(certCounts).map(([label, count]) => `${label}: ${count}`).join(" | ");

  });
  </script>
</body>
</html>
