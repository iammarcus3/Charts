<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Artist Profile</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #111; color: #fff; padding: 2rem; }
    h1 { font-size: 2rem; }
    h2 { margin-top: 2rem; color: gold; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #444; padding: 0.5rem; text-align: left; }
    th { background-color: #222; }
    .cert { font-size: 1.2em; }
    .gold { color: gold; }
    .platinum { color: lightblue; }
    .diamond { color: cyan; }
  </style>
</head>
<body>
  <h1 id="artistName">Loading...</h1>

  <div id="stats"></div>

  <div id="certSummary"></div>

  <div id="songsByYear"></div>

  <script src="weekdata.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const artistParam = urlParams.get('artist');
    const artist = decodeURIComponent(artistParam || '');

    document.getElementById('artistName').textContent = artist;

    const songMap = {};
    const allSongs = {};
    const certSummary = {};

    let numberOnes = 0;
    let top10s = 0;
    let debutCount = 0;

    function getCertIcon(sales) {
      if (sales >= 1_000_000) return '<span class="cert diamond">💎</span>';
      if (sales >= 900_000) return '<span class="cert platinum">💿 x9</span>';
      if (sales >= 800_000) return '<span class="cert platinum">💿 x8</span>';
      if (sales >= 700_000) return '<span class="cert platinum">💿 x7</span>';
      if (sales >= 600_000) return '<span class="cert platinum">💿 x6</span>';
      if (sales >= 500_000) return '<span class="cert platinum">💿 x5</span>';
      if (sales >= 400_000) return '<span class="cert platinum">💿 x4</span>';
      if (sales >= 300_000) return '<span class="cert platinum">💿 x3</span>';
      if (sales >= 200_000) return '<span class="cert platinum">💿 x2</span>';
      if (sales >= 100_000) return '<span class="cert platinum">💿</span>';
      if (sales >= 50_000) return '<span class="cert gold">🥇</span>';
      return '';
    }

    function formatCertText(sales) {
      if (sales >= 1_000_000) return 'Diamond';
      const platinumUnits = Math.floor(sales / 100_000);
      if (platinumUnits >= 2) return `${platinumUnits}× Platinum`;
      if (sales >= 100_000) return 'Platinum';
      if (sales >= 50_000) return 'Gold';
      return '';
    }

    function updateCertSummary(certText) {
      if (!certText) return;
      certSummary[certText] = (certSummary[certText] || 0) + 1;
    }

    const debutWeeks = {};

    for (const week in weekData) {
      const entries = weekData[week];
      for (const song of entries) {
        const match = song.artist === artist || song.artist.includes(artist);
        if (!match) continue;

        const key = `${song.title}|||${song.artist}`;

        if (!songMap[key]) {
          songMap[key] = {
            ...song,
            debut: parseInt(week),
            peak: parseInt(song.rank),
            weeks: 1,
            totalSales: parseFloat(song.totalSales)
          };
          debutWeeks[key] = parseInt(week);
        } else {
          const entry = songMap[key];
          entry.weeks += 1;
          entry.totalSales += parseFloat(song.sales);
          if (parseInt(song.rank) < entry.peak) {
            entry.peak = parseInt(song.rank);
          }
        }

        if (song.rank === 1) numberOnes++;
        if (song.rank <= 10) top10s++;
      }
    }

    // Count debut songs
    const seen = new Set();
    for (const week in weekData) {
      const entries = weekData[week];
      for (const song of entries) {
        if ((song.artist === artist || song.artist.includes(artist))) {
          const key = `${song.title}|||${song.artist}`;
          if (!seen.has(key)) {
            seen.add(key);
            debutCount++;
          }
        }
      }
    }

    // Group songs by debut year
    const grouped = {};
    for (const key in songMap) {
      const entry = songMap[key];
      const year = 2018 + Math.floor((entry.debut - 1) / 52);
      if (!grouped[year]) grouped[year] = [];
      grouped[year].push({ key, ...entry });
    }

    // Sort and display
    let html = '';
    const years = Object.keys(grouped).sort((a, b) => a - b);
    for (const year of years) {
      html += `<h2>${year}</h2>`;
      html += `<table><tr><th>Cert</th><th>Title</th><th>Weeks</th><th>Peak</th><th>#1s</th></tr>`;
      const songs = grouped[year].sort((a, b) => a.debut - b.debut);
      for (const song of songs) {
        const certIcon = getCertIcon(song.totalSales);
        const certText = formatCertText(song.totalSales);
        updateCertSummary(certText);
        const titleLink = `<a href="track_detail.html?title=${encodeURIComponent(song.title)}&artist=${encodeURIComponent(song.artist)}">${song.title}</a>`;
        const num1 = song.peak === 1 ? 1 : 0;
        html += `<tr><td>${certIcon}</td><td>${titleLink}</td><td>${song.weeks}</td><td>${song.peak}</td><td>${num1}</td></tr>`;
      }
      html += `</table>`;
    }

    document.getElementById('songsByYear').innerHTML = html;

    document.getElementById('stats').innerHTML = `
      <p><strong>#1 Hits:</strong> ${numberOnes}</p>
      <p><strong>Top 10s:</strong> ${top10s}</p>
      <p><strong>Total Debuts:</strong> ${debutCount}</p>
    `;

    let certHTML = `<h2>Certifications Summary</h2><ul>`;
    for (const cert in certSummary) {
      certHTML += `<li>${cert}: ${certSummary[cert]}</li>`;
    }
    certHTML += `</ul>`;
    document.getElementById('certSummary').innerHTML = certHTML;
  </script>
</body>
</html>
