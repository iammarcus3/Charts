<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Album Records 2018-2025</title>

<style>
    body {
        font-family: 'Arial', sans-serif;
        background-color: #121212;
        color: #f0f0f0;
        margin:0; padding:0;
    }
    h1 {
        text-align:center;
        padding:1rem;
        color:#ff004c;
    }
    .tabs {
        display:flex;
        justify-content:center;
        background:#1f1f1f;
        border-bottom:2px solid #ff004c;
        flex-wrap:wrap;
    }
    .tab {
        padding:10px 20px;
        cursor:pointer;
        color:#fff;
        transition: background 0.3s;
        margin:2px;
    }
    .tab:hover, .tab.active {
        background:#ff004c;
        color:#fff;
    }
    .tab-content {
        display:none;
        padding:1rem 2rem;
        max-height: calc(100vh - 140px);
        overflow:auto; /* scroll + sticky header */
    }
    table {
        width:100%;
        border-collapse:collapse;
        margin-top:1rem;
        background-color:#1f1f1f;
    }
    th, td {
        padding:8px 10px;
        border:1px solid #333;
        text-align:center;
        cursor:pointer;
    }
    th {
        background-color:#2a2a2a;
        color:#ff004c;
    }
    thead th {
        position: sticky;
        top: 0;
        z-index: 2;
        background-color:#2a2a2a;
        box-shadow: 0 2px 0 #00000040;
    }
    tr:nth-child(even) {
        background-color:#1a1a1a;
    }
</style>
</head>

<body>

<h1>Album Records 2018-2025</h1>
<div class="tabs" id="yearTabs"></div>
<div id="tabContents"></div>

<script src="weekdata.js"></script>
<script>
// ========== CONFIG ==========
const week1Start = new Date("2018-02-23");
const saleMultiplier = 500;

// ========== NORMALIZATION ==========
const normalize = s =>
    typeof s === "string" ? s.toUpperCase().replace(/[^A-Z0-9]/g, "").trim() : "";

const normalizeAlbum = s =>
    typeof s === "string" ? s.toUpperCase()
        .replace(/\(.*?\)|\[.*?\]/g, "")
        .replace(/DELUXE|BONUS|VERSION|REMIX|EP|REMASTERED|EXPANDED/gi, "")
        .replace(/[^A-Z0-9]/g, "")
        .trim() : "";

const normalizeTitle = s =>
    typeof s === "string" ? s.toUpperCase()
        .replace(/\(.*?\)|\[.*?\]|REMIX|RADIO EDIT|FEAT\.?|FEATURING|VERSION|SINGLE/gi, "")
        .replace(/[^A-Z0-9]/g, "")
        .trim() : "";

// ========== DATES ==========
function getWeekStartDate(weekNumber) {
    const date = new Date(week1Start);
    date.setDate(week1Start.getDate() + (weekNumber - 1) * 7);
    return date.toISOString().split("T")[0];
}

// ========== RANK HELPER (HOT 100) ==========
function getHot100Rank(entry) {
    let r;
    if (entry.rank != null) {
        r = parseInt(entry.rank, 10);
    } else if (entry.position != null) {
        r = parseInt(entry.position, 10);
    } else if (entry.pos != null) {
        r = parseInt(entry.pos, 10);
    }
    if (!Number.isFinite(r)) return NaN;
    return r;
}

// ========== TRACK-LEVEL STATS BY ALBUM & WEEK ==========
// - albumMeta[albumKey] = { album, artist }
// - albumTracks[albumKey][trackKey] = { title, everHot100, everTop10, everNum1 }
// - albumWeeks[albumKey][weekNum] = { chartingTracks:Set, top10Tracks:Set, num1Tracks:Set }
function computeAlbumWeekStats(weekDataObj) {
    const albumMeta = {};
    const albumTracks = {};
    const albumWeeks = {};

    if (!weekDataObj || typeof weekDataObj !== "object") {
        return { albumMeta, albumTracks, albumWeeks };
    }

    for (const weekKey in weekDataObj) {
        const entries = weekDataObj[weekKey];
        if (!Array.isArray(entries)) continue;

        const weekNum = parseInt(String(weekKey).replace(/\D/g, ""), 10);
        if (!Number.isFinite(weekNum)) continue;

        entries.forEach(entry => {
            if (!entry || !entry.album || !entry.artist || !entry.title) return;

            const rankVal = getHot100Rank(entry);
            if (!Number.isFinite(rankVal) || rankVal <= 0 || rankVal > 100) return; // only Hot 100

            const albumKey = normalizeAlbum(entry.album) + "||" + normalize(entry.artist);
            const trackKey = normalizeTitle(entry.title);

            if (!albumMeta[albumKey]) {
                albumMeta[albumKey] = {
                    album: entry.album,
                    artist: entry.artist
                };
            }

            if (!albumTracks[albumKey]) albumTracks[albumKey] = {};
            if (!albumTracks[albumKey][trackKey]) {
                albumTracks[albumKey][trackKey] = {
                    title: entry.title,
                    everHot100: false,
                    everTop10: false,
                    everNum1: false
                };
            }
            const tInfo = albumTracks[albumKey][trackKey];
            tInfo.everHot100 = true;
            if (rankVal <= 10) tInfo.everTop10 = true;
            if (rankVal === 1) tInfo.everNum1 = true;

            if (!albumWeeks[albumKey]) albumWeeks[albumKey] = {};
            if (!albumWeeks[albumKey][weekNum]) {
                albumWeeks[albumKey][weekNum] = {
                    chartingTracks: new Set(),
                    top10Tracks: new Set(),
                    num1Tracks: new Set()
                };
            }
            const wStats = albumWeeks[albumKey][weekNum];
            wStats.chartingTracks.add(trackKey);
            if (rankVal <= 10) wStats.top10Tracks.add(trackKey);
            if (rankVal === 1) wStats.num1Tracks.add(trackKey);
        });
    }

    return { albumMeta, albumTracks, albumWeeks };
}

// ========== ALBUM RANKS (WEEKLY SALES AGG) ==========
function computeAlbumRanksByWeek(weekDataObj) {
    const ranks = {};
    if (!weekDataObj || typeof weekDataObj !== "object") return ranks;

    for (const weekKey in weekDataObj) {
        const entries = weekDataObj[weekKey];
        if (!Array.isArray(entries)) continue;

        const weekNum = parseInt(String(weekKey).replace(/\D/g, ""), 10);
        if (!Number.isFinite(weekNum)) continue;

        const albumSalesMap = {};
        for (const entry of entries) {
            if (!entry || !entry.album || !entry.artist) continue;
            const key = normalizeAlbum(entry.album) + "||" + normalize(entry.artist);
            const sales = parseFloat(entry.sales) || 0;
            albumSalesMap[key] = (albumSalesMap[key] || 0) + sales;
        }

        const sorted = Object.entries(albumSalesMap)
            .sort(([, a], [, b]) => b - a);

        const weekRanks = {};
        sorted.forEach(([key, weekSales], idx) => {
            weekRanks[key] = { rank: idx + 1, weekSales };
        });

        ranks[weekNum] = weekRanks;
    }

    return ranks;
}

// ========== PROCESS ALBUMS (MERGE TRACK + ALBUM-CHART LOGIC) ==========
function processAlbums(albumMeta, albumTracks, albumWeeks, albumRanksByWeek) {
    const albums = {};
    const rankSource = albumRanksByWeek || {};

    for (const albumKey in albumMeta) {
        const meta = albumMeta[albumKey];
        const tracksMap = albumTracks[albumKey] || {};
        const weeksMap = albumWeeks[albumKey] || {};

        const alb = {
            key: albumKey,
            album: meta.album,
            artist: meta.artist,
            tracks: tracksMap,
            yearlyRawSales: {},
            totalRawSales: 0,
            weeksOnChart: 0,
            weeksTop10: 0,
            weeksAt1: 0,
            debutWeek: null,
            debutDate: null,
            debutSalesRaw: 0,
            peakRank: Infinity,
            peakSalesRaw: 0,
            peakDate: null,
            songsNum1: 0,
            songsTop10: 0,
            songsHot100: 0,
            dateHit1: null
        };

        // loop over album chart weeks
        for (const weekStr in rankSource) {
            const weekNum = parseInt(weekStr, 10);
            const weekRanks = rankSource[weekNum];
            if (!weekRanks) continue;

            const info = weekRanks[albumKey];
            if (!info) continue; // album not on chart this week

            const rank = info.rank;
            const weekSalesRaw = info.weekSales || 0;

            // album-level weekly stats
            alb.weeksOnChart++;
            if (rank <= 10) alb.weeksTop10++;
            if (rank === 1) {
                alb.weeksAt1++;
                if (!alb.dateHit1) alb.dateHit1 = getWeekStartDate(weekNum);
            }

            // peak stats
            if (rank < alb.peakRank) {
                alb.peakRank = rank;
                alb.peakSalesRaw = weekSalesRaw;
                alb.peakDate = getWeekStartDate(weekNum);
            }

            // DEBUT / "DEBT" SALES:
            // first week this album has 3+ songs charting on Hot 100
            const wStats = weeksMap[weekNum];
            const chartingCount = wStats ? wStats.chartingTracks.size : 0;
            if (alb.debutWeek === null && chartingCount >= 3) {
                alb.debutWeek = weekNum;
                alb.debutDate = getWeekStartDate(weekNum);
                alb.debutSalesRaw = weekSalesRaw;
            }

            // SALES TOTALS
            alb.totalRawSales += weekSalesRaw;
            const year = new Date(getWeekStartDate(weekNum)).getFullYear();
            alb.yearlyRawSales[year] =
                (alb.yearlyRawSales[year] || 0) + weekSalesRaw;
        }

        // SONG COUNTS (distinct songs over lifetime)
        const trackArr = Object.values(tracksMap);
        alb.songsHot100 = trackArr.filter(t => t.everHot100).length;
        alb.songsTop10  = trackArr.filter(t => t.everTop10).length;
        alb.songsNum1   = trackArr.filter(t => t.everNum1).length;

        albums[albumKey] = alb;
    }

    return albums;
}

// ========== FORMAT SALES ==========
function formatSales(n) {
    if (n === null || n === undefined || isNaN(n)) return "-";
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

// ========== GENERATE TABLE ==========
function generateTable(albums, year = null) {
    let html = `
    <table>
    <thead>
    <tr>
        <th onclick="sortTable(this,0)">Rank</th>
        <th onclick="sortTable(this,1)">Album</th>
        <th onclick="sortTable(this,2)">Artist</th>
        <th onclick="sortTable(this,3)">Weeks on Chart</th>
        <th onclick="sortTable(this,4)">Weeks Top 10</th>
        <th onclick="sortTable(this,5)">Weeks at #1</th>
        <th onclick="sortTable(this,6)">Debut Sales</th>
        <th onclick="sortTable(this,7)">Debut Date</th>
        <th onclick="sortTable(this,8)">Peak Sales</th>
        <th onclick="sortTable(this,9)">Peak Date</th>
        <th onclick="sortTable(this,10)">#Songs #1</th>
        <th onclick="sortTable(this,11)">#Songs Top 10</th>
        <th onclick="sortTable(this,12)">#Songs Hot 100</th>
        <th onclick="sortTable(this,13)">Date Hit #1</th>
        ${year ? `<th onclick="sortTable(this,14)">Sales (${year})</th>` : ""}
        <th onclick="sortTable(this,${year ? 15 : 14})">To-Date Sales</th>
    </tr>
    </thead>
    <tbody>
    `;

    let rank = 1;

    Object.values(albums).forEach(alb => {
        // require at least 2 Hot 100 songs to show
        if (alb.songsHot100 < 2) return;

        const debutSales = alb.debutWeek === null
            ? "-"
            : formatSales(Math.round(alb.debutSalesRaw * saleMultiplier));
        const peakSales  = formatSales(Math.round(alb.peakSalesRaw  * saleMultiplier));
        const totalSales = formatSales(Math.round(alb.totalRawSales * saleMultiplier));
        const yearlySales = year
            ? formatSales(Math.round((alb.yearlyRawSales[year] || 0) * saleMultiplier))
            : "";

        html += `
        <tr>
            <td>${rank}</td>
            <td>${alb.album}</td>
            <td>${alb.artist}</td>
            <td>${alb.weeksOnChart}</td>
            <td>${alb.weeksTop10}</td>
            <td>${alb.weeksAt1}</td>
            <td>${debutSales}</td>
            <td>${alb.debutDate || "-"}</td>
            <td>${peakSales}</td>
            <td>${alb.peakDate || "-"}</td>
            <td>${alb.songsNum1}</td>
            <td>${alb.songsTop10}</td>
            <td>${alb.songsHot100}</td>
            <td>${alb.dateHit1 || "-"}</td>
            ${year ? `<td>${yearlySales}</td>` : ""}
            <td>${totalSales}</td>
        </tr>
        `;
        rank++;
    });

    html += "</tbody></table>";
    return html;
}

// ========== SORTING ==========
function sortTable(header, colIdx) {
    const table = header.closest("table");
    const tbody = table.querySelector("tbody");
    const rows = Array.from(tbody.querySelectorAll("tr"));
    const asc = !header.asc;

    rows.sort((a, b) => {
        let A = a.children[colIdx].innerText;
        let B = b.children[colIdx].innerText;

        const numA = parseFloat(A.replace(/[^0-9.-]/g, ""));
        const numB = parseFloat(B.replace(/[^0-9.-]/g, ""));
        if (!isNaN(numA) && !isNaN(numB)) {
            A = numA;
            B = numB;
        } else {
            A = A.toLowerCase();
            B = B.toLowerCase();
        }

        if (A > B) return asc ? 1 : -1;
        if (A < B) return asc ? -1 : 1;
        return 0;
    });

    header.asc = asc;
    rows.forEach(r => tbody.appendChild(r));
}

// ========== TABS ==========
function generateTabs(albums) {
    const years = {};

    // group by debut year (only when we have a valid debut date)
    Object.values(albums).forEach(alb => {
        if (!alb.debutDate) return;
        const y = new Date(alb.debutDate).getFullYear();
        if (!years[y]) years[y] = {};
        if (alb.songsHot100 >= 2) years[y][alb.key] = alb;
    });

    const tabContainer = document.getElementById("yearTabs");
    const contentContainer = document.getElementById("tabContents");

    // ALL-TIME TAB
    const allTab = document.createElement("div");
    allTab.classList.add("tab", "active");
    allTab.innerText = "All-Time";
    tabContainer.appendChild(allTab);

    const allContent = document.createElement("div");
    allContent.classList.add("tab-content");
    allContent.style.display = "block";

    const top100 = Object.values(albums)
        .filter(a => a.songsHot100 >= 2)
        .sort((a, b) => b.totalRawSales - a.totalRawSales)
        .slice(0, 100);

    const topMap = {};
    top100.forEach(a => topMap[a.key] = a);
    allContent.innerHTML = generateTable(topMap);
    contentContainer.appendChild(allContent);
    allTab.addEventListener("click", () => switchTab(allTab, allContent));

    // YEAR TABS
    Object.keys(years).sort().forEach(year => {
        const tab = document.createElement("div");
        tab.classList.add("tab");
        tab.innerText = year;
        tabContainer.appendChild(tab);

        const content = document.createElement("div");
        content.classList.add("tab-content");

        const sorted = Object.values(years[year])
            .sort((a, b) => (b.yearlyRawSales[year] || 0) - (a.yearlyRawSales[year] || 0))
            .slice(0, 20);

        const map = {};
        sorted.forEach(a => map[a.key] = a);

        content.innerHTML = generateTable(map, year);
        contentContainer.appendChild(content);

        tab.addEventListener("click", () => switchTab(tab, content));
    });
}

function switchTab(tab, content) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.style.display = "none");
    tab.classList.add("active");
    content.style.display = "block";
}

// ========== INIT ==========
(function init() {
    if (typeof weekData === "undefined") {
        console.error("weekData not loaded");
        return;
    }

    const { albumMeta, albumTracks, albumWeeks } = computeAlbumWeekStats(weekData);
    const albumRanksByWeek = computeAlbumRanksByWeek(weekData);
    const albums = processAlbums(albumMeta, albumTracks, albumWeeks, albumRanksByWeek);
    generateTabs(albums);
})();
</script>

</body>
</html>
