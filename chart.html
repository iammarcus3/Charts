<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>5 Main Genre Charts — weekdata.js</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="weekdata.js"></script>
  <style>
    :root{
      --bg:#0b0b0c;
      --panel:#121214;
      --panel-2:#17171a;
      --ink:#eaeaea;
      --muted:#a7a7b1;
      --cyan:#00ffff;
      --cyan-600:#00d6d6;
      --row:#141417;
      --row-hover:#1a1a1f;
      --border:#23232a;
      --rank:#0e0e10;
      --chip:#1f2230;
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --radius:14px;
    }
    *{box-sizing:border-box}
    body{
      margin:0; background:linear-gradient(180deg,#0b0b0c 0%, #0d0d0f 30%, #101015 100%);
      color:var(--ink); font: 15px/1.5 "Inter","Helvetica Neue",Arial,system-ui,sans-serif;
    }
    .shell{max-width:1200px;margin:0 auto;padding:20px}
    .topbar{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
      padding:12px 16px; box-shadow:var(--shadow); position:sticky; top:0; z-index:50; backdrop-filter: blur(6px);
    }
    .brand{display:flex;align-items:center;gap:12px}
    .logo{
      width:40px;height:40px;border-radius:10px;background:conic-gradient(from 210deg,#00ffff,#ff89ff,#00ffff);
      box-shadow:0 0 0 2px #111, 0 8px 22px rgba(0,0,0,.45);
    }
    .title h1{margin:0;font-size:1.05rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
    .subtitle{font-size:.78rem;color:var(--muted)}
    .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .btn,.select{
      height:34px; padding:0 12px; border-radius:10px; border:1px solid var(--border);
      background:var(--panel-2); color:var(--ink); font-weight:600; cursor:pointer;
    }
    .btn.primary{background:var(--cyan); color:#02060a; border:none}
    .pill{background:var(--chip); color:var(--muted); border:1px solid var(--border); padding:5px 10px; border-radius:999px; font-size:.72rem}
    .tabs{display:flex;gap:8px;margin:16px 0 10px;flex-wrap:wrap}
    .tab{
      background:var(--panel); border:1px solid var(--border); border-radius:12px;
      padding:8px 14px; cursor:pointer; font-weight:700; color:var(--muted); font-size:.78rem;
    }
    .tab.active{background:var(--cyan); color:#05090c; border-color:transparent; box-shadow:0 4px 20px rgba(0,255,255,.25)}
    .board{
      background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
      box-shadow:var(--shadow); overflow:hidden;
    }
    .board-head{
      display:flex; justify-content:space-between; align-items:center; gap:12px;
      background:var(--panel-2); border-bottom:1px solid var(--border); padding:10px 14px;
    }
    .date-range{font-weight:700; color:#dff; letter-spacing:.04em}
    .table-wrap{max-height:66vh; overflow:auto}
    table{width:100%; border-collapse:collapse}
    thead th{
      position:sticky; top:0; background:var(--panel-2); z-index:2;
      text-align:left; padding:10px 8px; font-size:.68rem; text-transform:uppercase; letter-spacing:.12em; color:#c6f3ff;
      border-bottom:1px solid var(--border);
    }
    tbody td{
      padding:10px 8px; border-bottom:1px solid #1f1f25; background:var(--row); font-size:.78rem
    }
    tbody tr:hover td{background:var(--row-hover)}
    .rank-badge{
      background:var(--rank); border:1px solid #2f3a48; border-radius:999px;
      display:inline-flex; align-items:center; justify-content:center;
      min-width:38px; height:30px; font-weight:900; color:#eaffff;
    }
    .right{text-align:right; font-variant-numeric:tabular-nums}
    .empty{padding:50px 20px;text-align:center;color:var(--muted)}
    @media(max-width:800px){
      .topbar{flex-direction:column;align-items:flex-start}
      .table-wrap{max-height:60vh}
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <h1>5 Main Genre Charts</h1>
          <div class="subtitle">POP • RNB • HIP-HOP • ALT • DANCE — weekdata.js — top 20</div>
        </div>
      </div>
      <div class="controls">
        <button class="btn" id="prevWeek">⟵</button>
        <select id="weekSelector" class="select"></select>
        <button class="btn" id="nextWeek">⟶</button>
        <span class="pill" id="metaCount">—</span>
        <span class="pill" id="metaGenre">—</span>
        <button class="btn primary" id="latestBtn">Latest</button>
      </div>
    </div>

    <div class="tabs" id="genreTabs">
      <div class="tab" data-bucket="POP" data-key="1">Pop</div>
      <div class="tab" data-bucket="RNB" data-key="2">R&amp;B / Soul</div>
      <div class="tab" data-bucket="HIPHOP" data-key="3">Hip-Hop / Rap</div>
      <div class="tab" data-bucket="ROCK" data-key="4">Rock / Alt</div>
      <div class="tab" data-bucket="DANCE" data-key="5">Dance / Electronic</div>
    </div>

    <div class="board">
      <div class="board-head">
        <div class="date-range" id="dateRange">—</div>
        <div class="muted" id="status">Loaded from weekdata.js</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:70px;">Rank</th>
              <th>Title</th>
              <th>Artist</th>
              <th class="right">Points</th>
              <th class="right">Sales</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
(function(){
  const raw = window.weekdata || window.weekData || window.WEEKDATA || {};
  let weekData = {};
  if (Array.isArray(raw)){
    raw.forEach(r=>{
      const w = r.week || r.Week || r.w;
      if (!w) return;
      (weekData[w] ||= []).push(r);
    });
  } else {
    weekData = raw;
  }

  const weeks = Object.keys(weekData).map(n=>+n).filter(n=>!isNaN(n)).sort((a,b)=>a-b);
  const startDate = new Date(2018,1,23);

  const weekSel = document.getElementById('weekSelector');
  const prevBtn = document.getElementById('prevWeek');
  const nextBtn = document.getElementById('nextWeek');
  const latestBtn = document.getElementById('latestBtn');
  const tbody = document.getElementById('tbody');
  const dateRangeEl = document.getElementById('dateRange');
  const statusEl = document.getElementById('status');
  const metaCount = document.getElementById('metaCount');
  const metaGenre = document.getElementById('metaGenre');
  const tabs = document.querySelectorAll('.tab');

  if (!weeks.length){
    tbody.innerHTML = '<tr><td colspan="5" class="empty">No data in weekdata.js</td></tr>';
    statusEl.textContent = 'No weeks';
    return;
  }

  // fallback tokenizer for old data
  function genreTokensFromRow(r){
    const arr = [];
    if (r.mainGenre) arr.push(r.mainGenre);
    if (Array.isArray(r.subGenres)) arr.push(...r.subGenres);
    if (r.genre) arr.push(r.genre);
    if (Array.isArray(r.genres)) arr.push(...r.genres);
    return arr.map(x => String(x).trim()).filter(Boolean);
  }

  // use your new simple fields first (genre5 / subgenre5), then guess
  function rowToBuckets(r){
    const buckets = new Set();

    // 1) hard main
    const g5 = (r.genre5 || "").toUpperCase();
    if (g5 === "POP") buckets.add("POP");
    else if (g5 === "RNB") buckets.add("RNB");
    else if (g5 === "HIP-HOP") buckets.add("HIPHOP");
    else if (g5 === "HIPHOP") buckets.add("HIPHOP");
    else if (g5 === "ROCK") buckets.add("ROCK");
    else if (g5 === "DANCE") buckets.add("DANCE");

    // 2) subgenres string like "TRAP-SOUL;EDM"
    const sg = (r.subgenre5 || "").split(";").map(s=>s.trim().toUpperCase()).filter(Boolean);
    sg.forEach(code=>{
      if (code === "ALT-POP" || code === "AFRO-POP" || code === "ADULT-POP") buckets.add("POP");
      else if (code === "ALT-RNB" || code === "TRAP-SOUL" || code === "CLASSIC-RNB") buckets.add("RNB");
      else if (code === "TRAP" || code === "DRILL" || code === "BOOM-BAP") buckets.add("HIPHOP");
      else if (code === "ALT-ROCK" || code === "POP-ROCK" || code === "PUNK-EMO") buckets.add("ROCK");
      else if (code === "EDM" || code === "HOUSE" || code === "CLUB") buckets.add("DANCE");
    });

    // 3) if still empty, guess from old fields
    if (buckets.size === 0){
      const lows = genreTokensFromRow(r).map(t => t.toLowerCase());
      if (lows.some(t => t.includes('pop'))) buckets.add('POP');
      if (lows.some(t => t.includes('r&b') || t.includes('rnb') || t.includes('soul'))) buckets.add('RNB');
      if (lows.some(t => t.includes('hip') || t.includes('rap') || t.includes('trap') || t.includes('drill'))) buckets.add('HIPHOP');
      if (lows.some(t => t.includes('rock') || t.includes('alt') || t.includes('indie') || t.includes('punk') || t.includes('emo'))) buckets.add('ROCK');
      if (lows.some(t => t.includes('dance') || t.includes('edm') || t.includes('electro') || t.includes('house') || t.includes('club'))) buckets.add('DANCE');
    }

    // 4) still nothing → POP
    if (buckets.size === 0) buckets.add('POP');

    return Array.from(buckets);
  }

  function getWeekRowsExpanded(w){
    const base = (weekData[w] || []).slice();
    base.sort((a,b)=>{
      const ra = Number(a.rank ?? a.position ?? a.pos ?? 9999);
      const rb = Number(b.rank ?? b.position ?? b.pos ?? 9999);
      return ra - rb;
    });
    const trimmed = base.slice(0,200).filter(r=>{
      const t = (r.title || r.song || '').toString();
      return !/sweep week/i.test(t);
    });
    return trimmed.map(r=>{
      const buckets = rowToBuckets(r);
      return {...r, _buckets: buckets};
    });
  }

  function fmtRange(w){
    const d1 = new Date(startDate); d1.setDate(d1.getDate() + (w-1)*7);
    const d2 = new Date(d1); d2.setDate(d1.getDate()+6);
    const opt = {day:'numeric', month:'short', year:'numeric'};
    return d1.toLocaleDateString('en-GB',opt)+' – '+d2.toLocaleDateString('en-GB',opt);
  }

  function fillWeekSel(){
    weekSel.innerHTML = '';
    weeks.forEach(w=>{
      const opt = document.createElement('option');
      opt.value = w;
      opt.textContent = fmtRange(w);
      weekSel.appendChild(opt);
    });
  }

  let currentWeek = weeks[weeks.length-1];
  let currentBucket = 'POP';

  function renderTable(){
    const rows = getWeekRowsExpanded(currentWeek);
    const list = rows.filter(r => Array.isArray(r._buckets) && r._buckets.includes(currentBucket));

    list.sort((a,b)=>{
      const pa = Number(a.points || a.Points || 0);
      const pb = Number(b.points || b.Points || 0);
      if (pb !== pa) return pb - pa;
      const sa = Number(a.sales || a.Sales || 0);
      const sb = Number(b.sales || b.Sales || 0);
      if (sb !== sa) return sb - sa;
      return String(a.title||'').localeCompare(String(b.title||''));
    });

    const top20 = list.slice(0,20);

    tbody.innerHTML = '';
    if (!top20.length){
      tbody.innerHTML = '<tr><td colspan="5" class="empty">No tracks for this genre.</td></tr>';
    } else {
      top20.forEach((r,idx)=>{
        const title = r.title || r.song || '—';
        const artist = r.artist || r.Artist || '—';
        const pts = Number(r.points || r.Points || 0);
        const sales = Number(r.sales || r.Sales || 0);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><span class="rank-badge">${idx+1}</span></td>
          <td title="${title}">${title.length>42?title.slice(0,41)+'…':title}</td>
          <td title="${artist}">${artist.length>38?artist.slice(0,37)+'…':artist}</td>
          <td class="right">${pts?pts.toLocaleString():'—'}</td>
          <td class="right">${sales?sales.toLocaleString():'—'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    dateRangeEl.textContent = fmtRange(currentWeek);
    metaCount.textContent = `${top20.length}/20 • week ${currentWeek}`;
    const names = {
      POP:'Pop',
      RNB:'R&B / Soul',
      HIPHOP:'Hip-Hop / Rap',
      ROCK:'Rock / Alt',
      DANCE:'Dance / Electronic'
    };
    metaGenre.textContent = names[currentBucket] || currentBucket;
    statusEl.textContent = `Top 20 for ${metaGenre.textContent} • multi-chart via subgenre5`;

    tabs.forEach(t=> t.classList.toggle('active', t.dataset.bucket === currentBucket));
  }

  fillWeekSel();
  weekSel.value = currentWeek;
  renderTable();

  weekSel.addEventListener('change', ()=>{
    currentWeek = Number(weekSel.value);
    renderTable();
  });
  prevBtn.addEventListener('click', ()=>{
    const i = weeks.indexOf(currentWeek);
    if (i>0){ currentWeek = weeks[i-1]; weekSel.value = currentWeek; renderTable(); }
  });
  nextBtn.addEventListener('click', ()=>{
    const i = weeks.indexOf(currentWeek);
    if (i<weeks.length-1){ currentWeek = weeks[i+1]; weekSel.value = currentWeek; renderTable(); }
  });
  latestBtn.addEventListener('click', ()=>{
    currentWeek = weeks[weeks.length-1];
    weekSel.value = currentWeek;
    renderTable();
  });
  tabs.forEach(tab=>{
    tab.addEventListener('click', ()=>{
      currentBucket = tab.dataset.bucket;
      renderTable();
    });
  });
  window.addEventListener('keydown', (e)=>{
    if (e.key === 'ArrowLeft') prevBtn.click();
    if (e.key === 'ArrowRight') nextBtn.click();
    if (/^[1-5]$/.test(e.key)){
      const tab = document.querySelector(`.tab[data-key="${e.key}"]`);
      if (tab) tab.click();
    }
  });
})();
</script>
</body>
</html>
