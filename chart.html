<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Genre Charts — From weekdata.js</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="weekdata.js"></script>
  <style>
    :root{
      --bg:#0b0b0c;
      --panel:#121214;
      --panel-2:#17171a;
      --ink:#eaeaea;
      --muted:#a7a7b1;
      --cyan:#00ffff;
      --cyan-600:#00d6d6;
      --row:#141417;
      --row-hover:#1a1a1f;
      --border:#23232a;
      --rank:#0e0e10;
      --chip:#1f2230;
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --radius:14px;
      --danger:#ff5a5a;
    }
    *{box-sizing:border-box}
    body{
      margin:0; background:linear-gradient(180deg,#0b0b0c 0%, #0d0d0f 30%, #101015 100%);
      color:var(--ink); font: 15px/1.5 "Inter","Helvetica Neue",Arial,system-ui,sans-serif;
    }
    .shell{max-width:1200px;margin:0 auto;padding:20px}
    .topbar{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
      padding:12px 16px; box-shadow:var(--shadow); position:sticky; top:0; z-index:50; backdrop-filter: blur(6px);
    }
    .brand{display:flex;align-items:center;gap:12px}
    .logo{
      width:40px;height:40px;border-radius:10px;background:conic-gradient(from 210deg,#00ffff,#ff89ff,#00ffff);
      box-shadow:0 0 0 2px #111, 0 8px 22px rgba(0,0,0,.45);
    }
    .title h1{margin:0;font-size:1.05rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
    .subtitle{font-size:.78rem;color:var(--muted)}
    .controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
    .btn,.select{
      height:34px; padding:0 12px; border-radius:10px; border:1px solid var(--border);
      background:var(--panel-2); color:var(--ink); font-weight:600; cursor:pointer;
    }
    .btn.primary{background:var(--cyan); color:#02060a; border:none}
    .pill{background:var(--chip); color:var(--muted); border:1px solid var(--border);
      padding:5px 10px; border-radius:999px; font-size:.72rem}
    /* genre tabs */
    .tabs{display:flex; gap:8px; margin:16px 0 10px; flex-wrap:wrap}
    .tab{
      background:var(--panel); border:1px solid var(--border); border-radius:12px;
      padding:8px 14px; cursor:pointer; font-weight:700; color:var(--muted); font-size:.78rem;
    }
    .tab.active{background:var(--cyan); color:#05090c; border-color:transparent; box-shadow:0 4px 20px rgba(0,255,255,.25)}
    .board{
      background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
      box-shadow:var(--shadow); overflow:hidden;
    }
    .board-head{
      display:flex; justify-content:space-between; align-items:center; gap:12px;
      background:var(--panel-2); border-bottom:1px solid var(--border); padding:10px 14px;
    }
    .date-range{font-weight:700; color:#dff; letter-spacing:.04em}
    .table-wrap{max-height:66vh; overflow:auto}
    table{width:100%; border-collapse:collapse}
    thead th{
      position:sticky; top:0; background:var(--panel-2); z-index:2;
      text-align:left; padding:10px 8px; font-size:.68rem; text-transform:uppercase; letter-spacing:.12em; color:#c6f3ff;
      border-bottom:1px solid var(--border);
    }
    tbody td{
      padding:10px 8px; border-bottom:1px solid #1f1f25; background:var(--row); font-size:.78rem
    }
    tbody tr:hover td{background:var(--row-hover)}
    .rank-badge{
      background:var(--rank); border:1px solid #2f3a48; border-radius:999px;
      display:inline-flex; align-items:center; justify-content:center;
      min-width:38px; height:30px; font-weight:900; color:#eaffff;
    }
    .right{text-align:right; font-variant-numeric:tabular-nums}
    .muted{color:var(--muted)}
    .empty{padding:50px 20px;text-align:center;color:var(--muted)}
    .badge-sweep{color:var(--danger);font-weight:700}
    @media(max-width:800px){
      .topbar{flex-direction:column;align-items:flex-start}
      .board{max-height:none}
      .table-wrap{max-height:60vh}
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <h1>Genre Charts</h1>
          <div class="subtitle">Source: weekdata.js • Tabs = genres • Top 20 only</div>
        </div>
      </div>
      <div class="controls">
        <button class="btn" id="prevWeek">⟵</button>
        <select id="weekSelector" class="select"></select>
        <button class="btn" id="nextWeek">⟶</button>
        <span class="pill" id="metaCount">—</span>
        <span class="pill" id="metaGenre">—</span>
        <button class="btn primary" id="latestBtn">Latest</button>
      </div>
    </div>

    <div class="tabs" id="genreTabs"></div>

    <div class="board">
      <div class="board-head">
        <div class="date-range" id="dateRange">—</div>
        <div class="muted" id="status">Loaded from weekdata.js</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:70px;">Rank</th>
              <th>Title</th>
              <th>Artist</th>
              <th class="right">Points</th>
              <th class="right">Sales</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
(function(){
  // ---------- helpers ----------
  const nz = (v,d=0)=> {
    const n = Number(v);
    return Number.isFinite(n) ? n : d;
  };
  const trimText = (t, n=38)=> String(t||'').length>n ? String(t).slice(0,n-1)+'…' : t;
  const startDate = new Date(2018,1,23); // 23 Feb 2018
  const formatRange = (weekNum)=>{
    const d1 = new Date(startDate); d1.setDate(d1.getDate() + (weekNum-1)*7);
    const d2 = new Date(d1); d2.setDate(d1.getDate()+6);
    const opt = {day:'numeric', month:'short', year:'numeric'};
    return d1.toLocaleDateString('en-GB',opt) + ' – ' + d2.toLocaleDateString('en-GB',opt);
  };

  // ---------- load raw ----------
  const raw = window.weekdata || window.weekData || window.WEEKDATA || [];
  let weekData = {};
  if (Array.isArray(raw)) {
    // array -> group
    for (const row of raw){
      const w = row.week || row.Week || row.w;
      if (!w) continue;
      (weekData[w] ||= []).push(row);
    }
  } else if (typeof raw === 'object' && raw !== null) {
    weekData = raw;
  }

  const weekSelector = document.getElementById('weekSelector');
  const genreTabs = document.getElementById('genreTabs');
  const tbody = document.getElementById('tbody');
  const dateRangeEl = document.getElementById('dateRange');
  const statusEl = document.getElementById('status');
  const metaCount = document.getElementById('metaCount');
  const metaGenre = document.getElementById('metaGenre');
  const prevBtn = document.getElementById('prevWeek');
  const nextBtn = document.getElementById('nextWeek');
  const latestBtn = document.getElementById('latestBtn');

  const allWeeks = Object.keys(weekData).map(n=>+n).filter(n=>!isNaN(n)).sort((a,b)=>a-b);
  if (!allWeeks.length){
    statusEl.textContent = 'No weeks in weekdata.js';
    tbody.innerHTML = '<tr><td colspan="5" class="empty">No data</td></tr>';
    return;
  }

  // week state
  let currentWeek = allWeeks[allWeeks.length-1];
  let currentGenre = null;

  // fill week dropdown
  function fillWeekSelector(){
    weekSelector.innerHTML = '';
    for (const w of allWeeks){
      const opt = document.createElement('option');
      opt.value = w;
      opt.textContent = formatRange(w);
      weekSelector.appendChild(opt);
    }
  }

  // get week rows, trim 200, sort by rank
  function getWeekRows(weekNum){
    const rows = (weekData[weekNum] || []).slice();
    // sort by rank first
    rows.sort((a,b)=>{
      const ra = nz(a.rank ?? a.position ?? a.pos, 9999);
      const rb = nz(b.rank ?? b.position ?? b.pos, 9999);
      return ra - rb;
    });
    // keep 200
    return rows.slice(0,200).filter(r=>{
      const title = (r.title || r.song || '').toString();
      return !/sweep week/i.test(title); // remove sweep weeks
    });
  }

  // detect genres for week
  function detectGenres(rows){
    const counts = {};
    for (const r of rows){
      const g = r.genre || (Array.isArray(r.genres) && r.genres[0]) || 'Unknown';
      counts[g] = (counts[g]||0)+1;
    }
    // sort by count desc
    return Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([g])=>g);
  }

  // render genre tabs
  function renderTabs(genres){
    genreTabs.innerHTML = '';
    genres.forEach((g,idx)=>{
      const tab = document.createElement('div');
      tab.className = 'tab' + (g===currentGenre ? ' active' : '');
      tab.textContent = g;
      tab.dataset.genre = g;
      tab.dataset.key = (idx+1); // for keyboard
      tab.addEventListener('click', ()=>{
        currentGenre = g;
        renderTabs(genres);
        renderTable();
      });
      genreTabs.appendChild(tab);
    });
  }

  // render table for current week + genre
  function renderTable(){
    const rows = getWeekRows(currentWeek);
    // if no genre selected, pick first from detected
    const genres = detectGenres(rows);
    if (!currentGenre || !genres.includes(currentGenre)) currentGenre = genres[0] || 'Unknown';

    // filter by genre
    const filtered = rows.filter(r=>{
      const g = r.genre || (Array.isArray(r.genres) && r.genres[0]) || 'Unknown';
      return g === currentGenre;
    });

    // sort: points desc -> sales desc -> title
    filtered.sort((a,b)=>{
      const pa = nz(a.points || a.Points, 0);
      const pb = nz(b.points || b.Points, 0);
      if (pb !== pa) return pb - pa;
      const sa = nz(a.sales || a.Sales, 0);
      const sb = nz(b.sales || b.Sales, 0);
      if (sb !== sa) return sb - sa;
      return String(a.title||'').localeCompare(String(b.title||''));
    });

    const top20 = filtered.slice(0,20);

    tbody.innerHTML = '';
    if (!top20.length){
      tbody.innerHTML = '<tr><td colspan="5" class="empty">No songs for this genre in this week.</td></tr>';
    } else {
      top20.forEach((row,idx)=>{
        const tr = document.createElement('tr');
        const rank = idx+1;
        const title = row.title || row.song || '—';
        const artist = row.artist || row.Artist || '—';
        const pts = nz(row.points || row.Points, 0);
        const sales = nz(row.sales || row.Sales, 0);
        tr.innerHTML = `
          <td><span class="rank-badge">${rank}</span></td>
          <td title="${title}">${trimText(title,42)}</td>
          <td title="${artist}">${trimText(artist,38)}</td>
          <td class="right">${pts ? pts.toLocaleString() : '—'}</td>
          <td class="right">${sales ? sales.toLocaleString() : '—'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    dateRangeEl.textContent = formatRange(currentWeek);
    metaCount.textContent = `${top20.length}/20 • week ${currentWeek}`;
    metaGenre.textContent = currentGenre;
    statusEl.textContent = `Showing top 20 for ${currentGenre} — trimmed to 200 rows for this week`;
    renderTabs(genres);
  }

  // week change
  function loadWeek(weekNum){
    currentWeek = weekNum;
    weekSelector.value = weekNum;
    renderTable();
  }

  // controls
  prevBtn.addEventListener('click', ()=>{
    const idx = allWeeks.indexOf(currentWeek);
    if (idx>0) loadWeek(allWeeks[idx-1]);
  });
  nextBtn.addEventListener('click', ()=>{
    const idx = allWeeks.indexOf(currentWeek);
    if (idx<allWeeks.length-1) loadWeek(allWeeks[idx+1]);
  });
  latestBtn.addEventListener('click', ()=>{
    loadWeek(allWeeks[allWeeks.length-1]);
  });
  weekSelector.addEventListener('change', ()=>{
    loadWeek(+weekSelector.value);
  });

  // keyboard
  window.addEventListener('keydown', (e)=>{
    if (e.key === 'ArrowLeft'){ prevBtn.click(); }
    if (e.key === 'ArrowRight'){ nextBtn.click(); }
    if (/^[1-9]$/.test(e.key)){
      const tab = document.querySelector(`.tab[data-key="${e.key}"]`);
      if (tab) tab.click();
    }
  });

  // boot
  fillWeekSelector();
  loadWeek(currentWeek);
})();
</script>
</body>
</html>
