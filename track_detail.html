<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Track Detail</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
      --accent: #007aff;
      --box-bg: #f4f4f4;
      --border: #ccc;
    }
    body.dark {
      --bg: #121212;
      --text: #ffffff;
      --accent: #0a84ff;
      --box-bg: #1e1e1e;
      --border: #333;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem;
      transition: background 0.3s, color 0.3s;
    }
    nav {
      margin-bottom: 1rem;
    }
    nav a {
      margin-right: 1.5rem;
      font-weight: bold;
      color: var(--accent);
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.2rem;
    }
    h2 {
      margin-top: 2rem;
      font-size: 1.5rem;
      border-bottom: 2px solid var(--text);
      padding-bottom: 0.3rem;
    }
    p {
      font-size: 1rem;
      margin: 0.4rem 0;
    }
    ul {
      list-style: none;
      padding-left: 0;
      margin-top: 1rem;
    }
    ul li {
      margin-bottom: 0.4rem;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .cert-icon img {
      height: 20px;
      vertical-align: middle;
      margin-left: 4px;
    }
    .cert-label {
      font-weight: bold;
      margin-left: 8px;
      vertical-align: middle;
    }
    .error {
      color: red;
      font-weight: bold;
    }
    .data-box {
      background: var(--box-bg);
      border: 1px solid var(--border);
      padding: 1rem;
      margin: 1rem 0;
      border-radius: 8px;
    }
    .toggle-theme {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: var(--box-bg);
      border: 1px solid var(--border);
      padding: 0.4rem 1rem;
      cursor: pointer;
      border-radius: 20px;
      font-size: 0.9rem;
      color: var(--text);
    }
    .badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      border-radius: 6px;
      padding: 0.1rem 0.6rem;
      font-size: 0.8rem;
      margin-left: 0.5rem;
    }
    li a:hover {
      background-color: var(--accent);
      color: white;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <button class="toggle-theme" onclick="toggleTheme()">🌓 Toggle Theme</button>

  <nav>
    <a href="index.html">⬅️ Back to Hot 100</a>
    <a href="top_albums.html">🏆 Top Albums</a>
  </nav>

  <h1 id="trackTitle">Track Title</h1>
  <p><strong>Artist:</strong> <span id="trackArtist"></span></p>

  <div class="data-box">
    <p><strong>Debut Week:</strong> <span id="debutWeek"></span> <span class="badge" id="debutRank"></span></p>
    <p><strong>Peak Rank:</strong> <span id="peakRank"></span></p>
    <p><strong>Total Weeks on Chart:</strong> <span id="weeksOnChart"></span></p>
    <p><strong>Weeks at #1:</strong> <span id="weeksAtOne"></span></p>
    <p><strong>Weeks in Top 10:</strong> <span id="weeksTop10"></span></p>
  </div>

  <div class="data-box">
    <p><strong>Total Sales:</strong> <span id="totalSales"></span></p>
    <p><strong>Total Streams:</strong> <span id="totalStreams"></span></p>
  </div>

  <h2>📀 Appears On Albums</h2>
  <ul id="albumList"></ul>

  <script src="weekdata.js"></script>
  <script>
    function toggleTheme() {
      document.body.classList.toggle("dark");
      localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
    }
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark");
    }

    const params = new URLSearchParams(location.search);
    const titleParam = params.get("title");
    const artistParam = params.get("artist");

    const normalize = str =>
      typeof str === "string" ? str.toUpperCase().replace(/[^A-Z0-9]/g, "").trim() : "";

    const normalizeTitle = str =>
      typeof str === "string"
        ? str.toUpperCase()
            .replace(/\(.*?\)|\[.*?\]|REMIX|RADIO EDIT|FEAT\.?|FEATURING|VERSION|SINGLE/gi, "")
            .replace(/[^A-Z0-9]/g, "")
            .trim()
        : "";

    function getSongCertImages(sales) {
      const scaled = sales * 745.1;
      if (scaled >= 1_000_000) return `<img src="diamond.png" title="Diamond">`;
      if (scaled >= 900_000) return `<img src="9x_platinum.png" title="9× Platinum">`;
      if (scaled >= 800_000) return `<img src="8x_platinum.png" title="8× Platinum">`;
      if (scaled >= 700_000) return `<img src="7x_platinum.png" title="7× Platinum">`;
      if (scaled >= 600_000) return `<img src="6x_platinum.png" title="6× Platinum">`;
      if (scaled >= 500_000) return `<img src="5x_platinum.png" title="5× Platinum">`;
      if (scaled >= 400_000) return `<img src="4x_platinum.png" title="4× Platinum">`;
      if (scaled >= 300_000) return `<img src="3x_platinum.png" title="3× Platinum">`;
      if (scaled >= 200_000) return `<img src="2x_platinum.png" title="2× Platinum">`;
      if (scaled >= 100_000) return `<img src="platinum.png" title="Platinum">`;
      if (scaled >= 50_000) return `<img src="gold.png" title="Gold">`;
      return "";
    }

    function getSongCertLabel(sales) {
      const scaled = sales * 745.1;
      if (scaled >= 1_000_000) return "Diamond";
      if (scaled >= 900_000) return "9× Platinum";
      if (scaled >= 800_000) return "8× Platinum";
      if (scaled >= 700_000) return "7× Platinum";
      if (scaled >= 600_000) return "6× Platinum";
      if (scaled >= 500_000) return "5× Platinum";
      if (scaled >= 400_000) return "4× Platinum";
      if (scaled >= 300_000) return "3× Platinum";
      if (scaled >= 200_000) return "2× Platinum";
      if (scaled >= 100_000) return "Platinum";
      if (scaled >= 50_000) return "Gold";
      return "";
    }

    const streamMultiplier = 0.927124;
    const saleMultiplier = 745;

    const trackTitleEl = document.getElementById("trackTitle");
    const trackArtistEl = document.getElementById("trackArtist");
    const debutEl = document.getElementById("debutWeek");
    const debutRankEl = document.getElementById("debutRank");
    const peakEl = document.getElementById("peakRank");
    const weeksEl = document.getElementById("weeksOnChart");
    const weeksAtOneEl = document.getElementById("weeksAtOne");
    const weeksTop10El = document.getElementById("weeksTop10");
    const totalSalesEl = document.getElementById("totalSales");
    const totalStreamsEl = document.getElementById("totalStreams");
    const albumList = document.getElementById("albumList");

    trackTitleEl.textContent = titleParam;
    trackArtistEl.textContent = artistParam;

    const songKey = normalizeTitle(titleParam);
    const artistKey = normalize(artistParam);

    let debut = null, debutRank = null, peak = 999, weeks = 0, rawSales = 0, weeksAtOne = 0, weeksTop10 = 0;
    const albumMap = {};

    for (const week in weekData) {
      const entries = weekData[week];
      const weekNum = parseInt(week.replace(/\D/g, ""));

      entries.forEach(row => {
        const normArtist = normalize(row.artist);
        const normTitle = normalizeTitle(row.title);

        if (normArtist === artistKey && normTitle === songKey) {
          const rank = parseInt(row.rank);
          const weeklySales = parseFloat(row.sales) || 0;

          rawSales += weeklySales;
          weeks++;

          if (!debut || weekNum < debut.week) {
            debut = { week: weekNum, label: week };
            debutRank = rank;
          }

          if (rank < peak) peak = rank;
          if (rank === 1) weeksAtOne++;
          if (rank <= 10) weeksTop10++;

          const albumName = row.album || "Unknown Album";
          const albumKey = albumName.toUpperCase();

          if (!albumMap[albumKey]) {
            albumMap[albumKey] = {
              name: albumName,
              sales: 0,
              weeks: 0,
              peak: rank
            };
          }

          albumMap[albumKey].sales += weeklySales;
          albumMap[albumKey].weeks += 1;
          if (rank < albumMap[albumKey].peak) {
            albumMap[albumKey].peak = rank;
          }
        }
      });
    }

    const actualSales = rawSales * saleMultiplier;
    const calculatedStreams = rawSales * streamMultiplier;

    debutEl.textContent = debut ? debut.label : "—";
    debutRankEl.textContent = debutRank ? `#${debutRank}` : "—";
    peakEl.textContent = peak === 999 ? "—" : `#${peak}`;
    weeksEl.textContent = weeks;
    weeksAtOneEl.textContent = weeksAtOne;
    weeksTop10El.textContent = weeksTop10;
    totalSalesEl.textContent = actualSales.toLocaleString();
    totalStreamsEl.textContent = Math.round(calculatedStreams * 1_000_000).toLocaleString();

    const certIcons = getSongCertImages(rawSales);
    const certLabel = getSongCertLabel(rawSales);

    if (certIcons) {
      const certSpan = document.createElement("span");
      certSpan.className = "cert-icon";
      certSpan.innerHTML = certIcons;
      totalSalesEl.appendChild(certSpan);
    }
    if (certLabel) {
      const labelSpan = document.createElement("span");
      labelSpan.className = "cert-label";
      labelSpan.textContent = certLabel;
      totalSalesEl.appendChild(labelSpan);
    }

    const albums = Object.values(albumMap);
    if (albums.length === 0) {
      albumList.innerHTML = '<li class="error">No album data found for this track.</li>';
    } else {
      albums.sort((a, b) => b.sales - a.sales);
      albums.forEach(album => {
        const albumUrl = `album_detail.html?album=${encodeURIComponent(album.name)}&artist=${encodeURIComponent(artistParam)}`;
        const albumActualSales = album.sales * saleMultiplier;
        const li = document.createElement("li");
        li.innerHTML = `<a href="${albumUrl}">${album.name}</a> — ${album.weeks} weeks, Peak: #${album.peak}, Sales: ${albumActualSales.toLocaleString()}`;
        albumList.appendChild(li);
      });
    }
  </script>
</body>
</html>
