<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Artist Streams</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1020;
  color:#fff;
}
.wrap{max-width:1200px;margin:auto;padding:20px;}
input{
  padding:10px;border-radius:20px;border:none;width:250px;
}
button{
  padding:10px 15px;border-radius:20px;border:none;cursor:pointer;
}
.card{
  background:rgba(255,255,255,.05);
  padding:15px;
  border-radius:15px;
  margin-top:15px;
}
table{
  width:100%;
  border-collapse:collapse;
}
td,th{
  padding:8px;
  border-bottom:1px solid rgba(255,255,255,.1);
}
</style>
</head>

<body>
<div class="wrap">

<h1>Artist Analytics</h1>

<input id="artistInput" placeholder="Enter artist name"/>
<button onclick="loadArtist()">View</button>

<div id="output"></div>

</div>

<script src="weekdata.js"></script>

<script>
const $ = id => document.getElementById(id);

function norm(s){
  return (s || "").toLowerCase().trim();
}

function fmt(n){
  return Math.round(n).toLocaleString();
}

function loadArtist(){
  const artist = norm($("artistInput").value);
  if(!artist) return;

  const songMap = new Map();
  const albumMap = new Map();

  let totalStreams = 0;
  let peakWeek = 0;

  for(const week in weekData){
    let weekTotal = 0;

    for(const item of weekData[week]){

      if(norm(item.artist) !== artist) continue;

      const streams = Number(item.streams) || 0;

      totalStreams += streams;
      weekTotal += streams;

      // SONGS
      const songKey = item.title;
      songMap.set(songKey, (songMap.get(songKey)||0) + streams);

      // ALBUMS
      const albumKey = item.album;
      albumMap.set(albumKey, (albumMap.get(albumKey)||0) + streams);
    }

    if(weekTotal > peakWeek) peakWeek = weekTotal;
  }

  const songs = [...songMap.entries()]
    .map(([name,streams])=>({name,streams}))
    .sort((a,b)=>b.streams-a.streams);

  const albums = [...albumMap.entries()]
    .map(([name,streams])=>({name,streams}))
    .sort((a,b)=>b.streams-a.streams);

  // TOP LISTS
  const topSongs = songs.slice(0,30);
  const topAlbums = albums.slice(0,10);

  // MILESTONES
  const songs1B = songs.filter(s=>s.streams >= 1e9).length;
  const albums2B = albums.filter(a=>a.streams >= 2e9).length;

  // EXTRA INSIGHTS
  const avgSong = songs.length ? totalStreams / songs.length : 0;

  // YEARLY
  const yearMap = new Map();
  for(const week in weekData){
    const year = 2018 + Math.floor((week-1)/52);
    for(const item of weekData[week]){
      if(norm(item.artist)!==artist) continue;
      yearMap.set(year, (yearMap.get(year)||0) + (Number(item.streams)||0));
    }
  }

  let bestYear = null, bestYearVal = 0;
  for(const [y,v] of yearMap){
    if(v > bestYearVal){bestYear=y;bestYearVal=v;}
  }

  // OUTPUT
  $("output").innerHTML = `
  
  <div class="card">
    <h2>${artist.toUpperCase()}</h2>
    <p><b>Total Streams:</b> ${fmt(totalStreams)}</p>
    <p><b>Total Songs:</b> ${songs.length}</p>
    <p><b>Total Albums:</b> ${albums.length}</p>
    <p><b>Peak Week Streams:</b> ${fmt(peakWeek)}</p>
    <p><b>Average per Song:</b> ${fmt(avgSong)}</p>
    <p><b>Songs over 1B:</b> ${songs1B}</p>
    <p><b>Albums over 2B:</b> ${albums2B}</p>
    <p><b>Best Year:</b> ${bestYear} (${fmt(bestYearVal)})</p>
  </div>

  <div class="card">
    <h3>Top 30 Songs</h3>
    <table>
      <tr><th>#</th><th>Song</th><th>Streams</th></tr>
      ${topSongs.map((s,i)=>`
        <tr>
          <td>${i+1}</td>
          <td>${s.name}</td>
          <td>${fmt(s.streams)}</td>
        </tr>
      `).join("")}
    </table>
  </div>

  <div class="card">
    <h3>Top 10 Albums</h3>
    <table>
      <tr><th>#</th><th>Album</th><th>Streams</th></tr>
      ${topAlbums.map((a,i)=>`
        <tr>
          <td>${i+1}</td>
          <td>${a.name}</td>
          <td>${fmt(a.streams)}</td>
        </tr>
      `).join("")}
    </table>
  </div>
  `;
}
</script>

</body>
</html>
