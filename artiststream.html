<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Artist Streams</title>

<style>
:root{
  --bg:#070b14;
  --card:rgba(255,255,255,.05);
  --border:rgba(255,255,255,.12);
  --text:#eef3ff;
  --muted:rgba(238,243,255,.6);
}
body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
}
.wrap{max-width:1150px;margin:auto;padding:20px;}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px;
  margin-top:15px;
}
h1,h2,h3{margin:0 0 10px}
table{
  width:100%;
  border-collapse:collapse;
}
td,th{
  padding:10px;
  border-bottom:1px solid rgba(255,255,255,.08);
  font-size:.9rem;
}
th{color:var(--muted);text-align:left}
a{
  color:#4aa3ff;
  text-decoration:none;
}
a:hover{opacity:.8}
</style>
</head>

<body>
<div class="wrap">

<h1 id="artistTitle">Artist</h1>
<div id="output"></div>

</div>

<script src="weekdata.js"></script>

<script>
// ---------------- HELPERS ----------------
const $ = id => document.getElementById(id);

function norm(v){
  return (v || "").toString().toLowerCase().trim();
}

function fmt(n){
  return Math.round(n || 0).toLocaleString();
}

// ---------------- CLEAN + SIMILARITY ----------------
function cleanName(str){
  return (str || "")
    .toLowerCase()
    .replace(/\(.*?\)|\[.*?\]/g, "")
    .replace(/-.*$/g, "")
    .replace(/feat\.?.*/g, "")
    .replace(/[^a-z0-9 ]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function levenshtein(a, b){
  const matrix = [];
  for(let i=0;i<=b.length;i++){matrix[i]=[i];}
  for(let j=0;j<=a.length;j++){matrix[0][j]=j;}

  for(let i=1;i<=b.length;i++){
    for(let j=1;j<=a.length;j++){
      if(b[i-1] === a[j-1]){
        matrix[i][j] = matrix[i-1][j-1];
      } else {
        matrix[i][j] = Math.min(
          matrix[i-1][j-1]+1,
          matrix[i][j-1]+1,
          matrix[i-1][j]+1
        );
      }
    }
  }
  return matrix[b.length][a.length];
}

function similarity(a,b){
  if(!a || !b) return 0;
  const longer = a.length > b.length ? a : b;
  const shorter = a.length > b.length ? b : a;
  const dist = levenshtein(longer, shorter);
  return (longer.length - dist) / longer.length;
}

// GROUP SIMILAR
function groupSimilar(map){
  const grouped = new Map();

  for(const [name, streams] of map){

    const clean = cleanName(name);
    let foundKey = null;

    for(const key of grouped.keys()){
      if(similarity(clean, key) >= 0.99){
        foundKey = key;
        break;
      }
    }

    if(foundKey){
      grouped.set(foundKey, grouped.get(foundKey) + streams);
    } else {
      grouped.set(clean, streams);
    }
  }

  return grouped;
}

// ---------------- GET ARTIST ----------------
function getArtist(){
  const p = new URLSearchParams(location.search);
  return norm(p.get("artist"));
}

// ---------------- MAIN ----------------
function loadArtist(artist){

  const songMap = new Map();
  const albumMap = new Map();
  const yearMap = new Map();

  let totalStreams = 0;
  let peakWeek = 0;

  for(const week in weekData){

    let weeklyTotal = 0;

    for(const item of weekData[week]){

      if(norm(item.artist) !== artist) continue;

      const streams = Number(item.streams) || 0;

      totalStreams += streams;
      weeklyTotal += streams;

      const song = item.title || "Unknown";
      songMap.set(song, (songMap.get(song)||0) + streams);

      const album = item.album || "Unknown";
      albumMap.set(album, (albumMap.get(album)||0) + streams);

      const year = 2018 + Math.floor((week-1)/52);
      yearMap.set(year, (yearMap.get(year)||0) + streams);
    }

    if(weeklyTotal > peakWeek) peakWeek = weeklyTotal;
  }

  if(totalStreams === 0){
    $("output").innerHTML = "<div class='card'>No data found.</div>";
    return;
  }

  // 🔥 APPLY GROUPING
  const groupedSongsMap = groupSimilar(songMap);
  const groupedAlbumsMap = groupSimilar(albumMap);

  const songs = [...groupedSongsMap.entries()]
    .map(([name,streams])=>({name,streams}))
    .sort((a,b)=>b.streams-a.streams);

  const albums = [...groupedAlbumsMap.entries()]
    .map(([name,streams])=>({name,streams}))
    .sort((a,b)=>b.streams-a.streams);

  const topSongs = songs.slice(0,30);
  const topAlbums = albums.slice(0,10);

  const songs1B = songs.filter(s=>s.streams >= 1e9).length;
  const albums2B = albums.filter(a=>a.streams >= 2e9).length;

  let bestYear=null, bestVal=0;
  for(const [y,v] of yearMap){
    if(v>bestVal){bestVal=v;bestYear=y;}
  }

  const avgSong = songs.length ? totalStreams / songs.length : 0;

  $("artistTitle").textContent = artist.toUpperCase();

  $("output").innerHTML = `
  <div class="card">
    <h2>Overview</h2>
    <p><b>Total Streams:</b> ${fmt(totalStreams)}</p>
    <p><b>Total Songs:</b> ${songs.length}</p>
    <p><b>Total Albums:</b> ${albums.length}</p>
    <p><b>Peak Weekly Streams:</b> ${fmt(peakWeek)}</p>
    <p><b>Average per Song:</b> ${fmt(avgSong)}</p>
    <p><b>Songs over 1B:</b> ${songs1B}</p>
    <p><b>Albums over 2B:</b> ${albums2B}</p>
    <p><b>Best Year:</b> ${bestYear} (${fmt(bestVal)})</p>
  </div>

  <div class="card">
    <h3>Top 30 Songs (Grouped)</h3>
    <table>
      <tr><th>#</th><th>Song</th><th>Streams</th></tr>
      ${topSongs.map((s,i)=>`
        <tr>
          <td>${i+1}</td>
          <td>
            <a href="songstream.html?song=${encodeURIComponent(s.name)}&artist=${encodeURIComponent(artist)}">
              ${s.name}
            </a>
          </td>
          <td>${fmt(s.streams)}</td>
        </tr>
      `).join("")}
    </table>
  </div>

  <div class="card">
    <h3>Top 10 Albums (Grouped)</h3>
    <table>
      <tr><th>#</th><th>Album</th><th>Streams</th></tr>
      ${topAlbums.map((a,i)=>`
        <tr>
          <td>${i+1}</td>
          <td>
            <a href="albumstream.html?album=${encodeURIComponent(a.name)}&artist=${encodeURIComponent(artist)}">
              ${a.name}
            </a>
          </td>
          <td>${fmt(a.streams)}</td>
        </tr>
      `).join("")}
    </table>
  </div>
  `;
}

// INIT
(function(){
  const artist = getArtist();

  if(!artist){
    $("output").innerHTML = "<div class='card'>No artist selected.</div>";
    return;
  }

  loadArtist(artist);
})();
</script>

</body>
</html>
