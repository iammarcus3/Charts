<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Labels — Yearly from Weekly • Enhanced Debt & Budget Engine</title>
<style>
  :root { --bg:#0f172a; --panel:#111827; --ink:#e5e7eb; --muted:#94a3b8; --line:#1f2937; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:16px 24px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 6px; font-size:22px; }
  .muted { color:var(--muted); font-size:12px; }
  main { padding:16px 24px; max-width:1400px; margin:0 auto; }
  .row { display:grid; grid-template-columns: repeat(12, 1fr); gap:12px; }
  .col-3 { grid-column: span 3; } .col-4 { grid-column: span 4; } .col-5 { grid-column: span 5; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; }
  label.small { display:block; text-transform:uppercase; letter-spacing:.06em; font-size:11px; color:var(--muted); margin:0 0 6px; }
  select,input { width:100%; background:#0b1220; color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .controls .col-3, .controls .col-4, .controls .col-5 { min-width:220px; }
  .btn { padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:#0b1220; color:var(--ink); cursor:pointer; text-decoration:none; display:inline-block; }
  .btn:hover { background:#12213d; }
  .grid3 { display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; }
  .card { background:#0b1220; border:1px solid var(--line); border-radius:12px; padding:12px; }
  .card .k { font-size:11px; color:var(--muted); text-transform:uppercase; }
  .card .v { font-size:18px; font-weight:600; }
  table { width:100%; border-collapse: collapse; font-size:13px; }
  thead th { position:sticky; top:0; background:#0b1220cc; backdrop-filter: blur(4px); border-bottom:1px solid var(--line); text-transform:uppercase; letter-spacing:.06em; font-size:11px; text-align:left; padding:10px; cursor:default; }
  thead th.sort { cursor:pointer; }
  tbody td { border-bottom:1px solid var(--line); padding:8px 10px; }
  tbody tr:hover { background:#0b1220; }
  .mono { font-variant-numeric: tabular-nums; }
  .scroll { overflow:auto; max-height:60vh; }
  .flex { display:flex; gap:8px; align-items:center; }
  .warn { color:#fcd34d; }
  #noLabels { display:none; margin-top:8px; color:#fca5a5; }
</style>
</head>
<body>
  <header>
    <div class="flex" style="justify-content:space-between;">
      <div>
        <h1>Labels — Yearly from Weekly</h1>
        <div class="muted">Per year · Per record label · Artists overview · Budgets · Debt · Net · Units · Revenues</div>
      </div>
      <div class="flex">
        <a id="downloadCSV" class="btn" href="#">Download CSV</a>
        <button id="resetFilters" class="btn" type="button">Reset</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Controls -->
    <section class="row controls" style="margin-bottom:12px;">
      <div class="col-3">
        <label class="small">Year</label>
        <select id="yearSelect"></select>
      </div>
      <div class="col-5">
        <label class="small">Record Label</label>
        <select id="labelSelect"></select>
        <div id="noLabels">No labels found for this selection.</div>
      </div>
      <div class="col-4">
        <label class="small">Search Artist</label>
        <div class="flex">
          <input id="artistSearch" type="text" placeholder="Type to filter artists…"/>
          <select id="maxRows" style="width:140px;">
            <option>50</option><option selected>100</option><option>200</option><option>500</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Totals -->
    <section style="margin:12px 0;">
      <div class="grid3" id="totalsCards"></div>
    </section>

    <!-- Table -->
    <section class="panel" style="margin-top:12px;">
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>Rank</th><th>Artist</th><th>Active Weeks</th><th>Records</th>
              <th class="sort" data-key="units">Units</th>
              <th class="sort" data-key="gross">Gross $</th>
              <th class="sort" data-key="budget">Budget</th>
              <th class="sort" data-key="debt">Debt $</th>
              <th class="sort" data-key="net">Net $</th>
              <th class="sort" data-key="artist_revenue">Artist $</th>
              <th class="sort" data-key="label_revenue">Label $</th>
            </tr>
          </thead>
          <tbody id="artistRows"></tbody>
        </table>
      </div>
    </section>

    <p id="datasetWarning" class="muted" style="margin-top:10px;"></p>
  </main>

  <!-- Load dataset (must define window.labelYearData = { years: {...} }) -->
  <script src="./label_year_data.global.js"></script>

  <!-- Core Engine + App -->
  <script>
    // --------------------- Utilities ---------------------
    const nz = v => (typeof v === 'number' && isFinite(v)) ? v : 0;
    const clamp01 = x => Math.max(0, Math.min(1, x));

    // --------------------- Policy ------------------------
    const DEBT_RULES = {
      "Columbia Records": { artist: { fixedPerArtist: 150_000, yearlyPct: 0,    earlyPctOnce: 0.30 }, label: { fixedPerArtist: 85_000,  fixedPerYear: 0,      pctOfArtistDebt: 0.05 }},
      "Def Jam":          { artist: { fixedPerArtist: 0,       yearlyPct: 0.45, earlyPctOnce: 0    }, label: { fixedPerArtist: 120_000, fixedPerYear: 100_000, pctOfArtistDebt: 0    }},
      "Epic":             { artist: { fixedPerArtist: 100_000, yearlyPct: 0,    earlyPctOnce: 0    }, label: { fixedPerArtist: 50_000,  fixedPerYear: 0,      pctOfArtistDebt: 0.05 }},
      "Park Wood":        { artist: { fixedPerArtist: 45_000,  yearlyPct: 0.20, earlyPctOnce: 0    }, label: { fixedPerArtist: 45_000,  fixedPerYear: 0,      pctOfArtistDebt: 0    }},
      "Republic":         { artist: { fixedPerArtist: 0,       yearlyPct: 0.50, earlyPctOnce: 0    }, label: { fixedPerArtist: 0,       fixedPerYear: 165_000, pctOfArtistDebt: 0.10 }},
      "Sony Music":       { artist: { fixedPerArtist: 0,       yearlyPct: 0.10, earlyPctOnce: 0    }, label: { fixedPerArtist: 0,       fixedPerYear: 200_000, pctOfArtistDebt: 0,    pctOfArtistNet: 0.02 }},
      "Atlantic":         { artist: { fixedPerArtist: 0,       yearlyPct: 0.60, earlyPctOnce: 0    }, label: { fixedPerArtist: 35_000,  fixedPerYear: 0,      pctOfArtistDebt: 0    }}
    };
    const ALLOWED_LABELS = new Set(Object.keys(DEBT_RULES));

    // Scaling + floors
    const ARTIST_DEBT_SCALE = 0.9;
    const LABEL_DEBT_SCALE  = 1.1;
    const MIN_DEBT_ABS      = 1_000_000; // $1M floor
    const MIN_DEBT_GROSS_PCT= 0.40;      // 40% of gross
    const BUDGET_BOOST_PER_RANK = 10_000;

    // --------------------- Label Default Splits (Active) -----------------
    // Your requested defaults; we normalize so pairs always sum to 1.0.
    const REVENUE_SPLITS_RAW = {
      "Columbia Records": { artist: 0.45, label: 0.55 },
      "Park Wood":        { artist: 0.40, label: 0.60 },
      "Republic":         { artist: 0.35, label: 0.65 }, // fixed from 0.75
      "Sony Music":       { artist: 0.50, label: 0.50 },
      "Epic":             { artist: 0.22, label: 0.78 },
      "Def Jam":          { artist: 0.47, label: 0.53 },
      "Atlantic":         { artist: 0.35, label: 0.65 }  // fixed from 0.75
    };
    function normalizePair(p){
      const a0 = Number.isFinite(p?.artist) ? p.artist : 0.5;
      const l0 = Number.isFinite(p?.label)  ? p.label  : (1 - a0);
      const a  = clamp01(a0); const l = clamp01(l0);
      const s  = a + l;
      if (s <= 0) return { artist: 0.5, label: 0.5 };
      return { artist: a/s, label: l/s };
    }
    const REVENUE_SPLITS = Object.fromEntries(
      Object.entries(REVENUE_SPLITS_RAW).map(([k,v])=>[k, normalizePair(v)])
    );

    // --------------------- Split Parsing -----------------
    function parseArtistSplit(a){
      if (!a || typeof a !== 'object') return null;

      if (typeof a.split === 'string'){
        const s = a.split.trim();
        if (/^\d+(\.\d+)?\s*[%]$/.test(s)){ // "60%"
          const n = parseFloat(s)/100;
          return { artist: clamp01(n), label: clamp01(1-n) };
        }
        if (/^\d+(\.\d+)?$/.test(s)){ // "0.6" or "60"
          const n = parseFloat(s);
          if (n > 1) {
            const p = clamp01(n/100);
            return { artist: p, label: 1-p };
          }
          return { artist: clamp01(n), label: clamp01(1-n) };
        }
        if (/^\s*\d+(\.\d+)?\s*[:/]\s*\d+(\.\d+)?\s*$/.test(s)){ // "60/40" | "60:40"
          const [l, r] = s.split(/[:/]/).map(x=>parseFloat(x));
          const sum = (l||0)+(r||0);
          if (sum>0){
            const p = clamp01(l/sum);
            return { artist: p, label: 1-p };
          }
        }
      }

      if (a.split_artist_pct != null){
        let p = parseFloat(a.split_artist_pct);
        if (p > 1) p = p/100;
        return { artist: clamp01(p), label: clamp01(1-p) };
      }
      if (a.split_label_pct != null){
        let p = parseFloat(a.split_label_pct);
        if (p > 1) p = p/100;
        return { artist: clamp01(1-p), label: clamp01(p) };
      }
      return null;
    }

    function getSplitFor(label, artistObj){
      const artistSplit = parseArtistSplit(artistObj);
      if (artistSplit) return normalizePair(artistSplit);
      if (REVENUE_SPLITS && REVENUE_SPLITS[label]) return REVENUE_SPLITS[label];
      return { artist: 0.5, label: 0.5 };
    }

    // -------------------- Dataset gate -------------------
    const warn = document.getElementById('datasetWarning');
    if (!window.labelYearData || !window.labelYearData.years) {
      warn.innerHTML = '<span class="warn">Dataset not found. Make sure <code>label_year_data.global.js</code> is in the same folder and loads before this script.</span>';
      window.labelYearData = { meta:{}, years:{} };
    } else {
      warn.textContent = 'Loaded dataset' + (window.labelYearData.meta && window.labelYearData.meta.source_file ? ': ' + window.labelYearData.meta.source_file : '');
    }

    // Helper for label-block shape
    function isLabelBlock(node) {
      return node && typeof node === 'object' && !Array.isArray(node)
        && node.artists && typeof node.artists === 'object'
        && node.totals  && typeof node.totals  === 'object';
    }

    // ---------------- Debt + Budget + Split Engine ----------------
    function rollupLabelTotals(block){
      const artists = block.artists || {};
      const totals = {
        artists_count: Object.keys(artists).length,
        units:0, gross:0, budget:0, debt:0, net:0,
        artist_revenue:0, label_revenue:0
      };
      for (const a of Object.values(artists)){
        totals.units          += nz(a.units);
        totals.gross          += nz(a.gross);
        totals.budget         += nz(a.budget);
        totals.debt           += nz(a.debt);
        totals.net            += nz(a.net);
        totals.artist_revenue += nz(a.artist_revenue);
        totals.label_revenue  += nz(a.label_revenue);
      }
      block.totals = Object.assign(block.totals || {}, totals);
    }

    function recomputeDebt(policyData) {
      const yearsObj = (policyData && policyData.years) || {};
      const sortedYears = Object.keys(yearsObj).sort();
      const carry = {}; // per-label rolling state across years

      for (const year of sortedYears) {
        const labels = yearsObj[year] || {};
        for (const [label, block] of Object.entries(labels)) {
          if (!ALLOWED_LABELS.has(label)) continue;
          if (!isLabelBlock(block)) continue;

          const rule = DEBT_RULES[label];
          const artists = block.artists || {};
          const artistNames = Object.keys(artists);
          const artistCount = artistNames.length;

          if (!carry[label]) carry[label] = { artistDebt: 0, labelDebt: 0 };
          let prevArtistDebt = carry[label].artistDebt;
          let prevLabelDebt  = carry[label].labelDebt;

          // --- artist-side base (policy) ---
          let thisArtistDebt = prevArtistDebt * (1 + (rule.artist.yearlyPct || 0));
          thisArtistDebt += (rule.artist.fixedPerArtist || 0) * artistCount;
          if (prevArtistDebt === 0 && (rule.artist.earlyPctOnce || 0) > 0) {
            thisArtistDebt *= (1 + rule.artist.earlyPctOnce);
          }
          thisArtistDebt *= ARTIST_DEBT_SCALE;

          // distribution + rank-scaling refs
          const totalUnits = artistNames.reduce((acc, n)=> acc + nz((artists[n]||{}).units), 0);
          const ranks = artistNames.map(n => nz((artists[n]||{}).rank_best)).filter(x => x>0);
          const maxRankForScale = ranks.length ? Math.max(...ranks) : 100;

          // per-artist recompute
          for (const name of artistNames) {
            const a = artists[name] || {};
            const weight = totalUnits > 0 ? nz(a.units) / totalUnits : (artistCount > 0 ? 1/artistCount : 0);

            // proportional artist-side debt with hybrid floor
            let debtShare = thisArtistDebt * weight;
            const gross = nz(a.gross);
            const floor = Math.max(MIN_DEBT_ABS, gross * MIN_DEBT_GROSS_PCT);
            a.debt = Math.max(debtShare, floor);

            // rank-based budget boost
            const r = a.rank_best;
            if (r != null && isFinite(r) && r > 0) {
              const rankScore = Math.max(1, (maxRankForScale - r + 1));
              a.budget = nz(a.budget) + rankScore * BUDGET_BOOST_PER_RANK;
            } else {
              a.budget = nz(a.budget);
            }

            // recompute net (after budget & debt)
            a.net = nz(a.gross) - nz(a.budget) - nz(a.debt);

            // split ONLY positive net
            const profit = Math.max(0, a.net);
            const split = getSplitFor(label, a); // { artist, label }
            a.artist_revenue = profit * split.artist;
            a.label_revenue  = profit * split.label;

            artists[name] = a;
          }

          // --- label-side debt (policy + extras) ---
          let thisLabelDebt = prevLabelDebt;
          thisLabelDebt += (rule.label.fixedPerYear || 0);
          thisLabelDebt += (rule.label.fixedPerArtist || 0) * artistCount;

          if (rule.label.pctOfArtistDebt) {
            thisLabelDebt += thisArtistDebt * rule.label.pctOfArtistDebt; // already scaled artist debt
          }
          if (rule.label.pctOfArtistNet) {
            const sumArtistNet = artistNames.reduce((acc, n)=> acc + nz((artists[n]||{}).net), 0);
            thisLabelDebt += sumArtistNet * rule.label.pctOfArtistNet;
          }
          thisLabelDebt *= LABEL_DEBT_SCALE;

          // store total debt (artist+label)
          block.totals = block.totals || {};
          block.totals.debt = nz(thisArtistDebt) + nz(thisLabelDebt);

          // carry forward
          carry[label].artistDebt = thisArtistDebt;
          carry[label].labelDebt  = thisLabelDebt;

          // rebuild totals from artists so cards line up
          block.artists = artists;
          rollupLabelTotals(block);

          yearsObj[year][label] = block;
        }
      }
    }

    // Run engine once on load (before building All-Time)
    if (window.labelYearData && window.labelYearData.years) {
      recomputeDebt(window.labelYearData);
    } else {
      console.warn('labelYearData not found for recomputeDebt.');
    }

    // ---------------- All-Time Aggregation ----------------
    const ALL_TIME_KEY = 'All Time';
    let allTimeCache = null;

    function buildAllTime(yearsObj){
      const acc = {}; // label -> { artists:{}, totals:{} }
      const sumKeys = ['units','gross','budget','debt','net','artist_revenue','label_revenue','records_count'];

      for (const y of Object.keys(yearsObj || {})) {
        const yearObj = yearsObj[y] || {};
        for (const [label, block] of Object.entries(yearObj)) {
          if (!isLabelBlock(block)) continue;

          if (!acc[label]) acc[label] = { artists: {}, totals: { artists_count: 0, units:0, gross:0, budget:0, debt:0, net:0, artist_revenue:0, label_revenue:0 } };

          // merge artists
          for (const [artist, a] of Object.entries(block.artists || {})) {
            if (!acc[label].artists[artist]) {
              acc[label].artists[artist] = {
                rank_best: a.rank_best ?? null,
                active_weeks: a.active_weeks ?? null,
                records_count: 0, units:0, gross:0, budget:0, debt:0, net:0,
                artist_revenue:0, label_revenue:0
              };
            }
            const tgt = acc[label].artists[artist];
            if (a.rank_best != null) tgt.rank_best = (tgt.rank_best == null) ? a.rank_best : Math.min(tgt.rank_best, a.rank_best);
            if (a.active_weeks != null) tgt.active_weeks = (tgt.active_weeks == null) ? a.active_weeks : Math.max(tgt.active_weeks, a.active_weeks);
            for (const k of sumKeys) if (a[k] != null && !isNaN(a[k])) tgt[k] += Number(a[k]);
          }

          // roll-up label totals (sum across years)
          const t = block.totals || {};
          if (t.units != null) acc[label].totals.units += Number(t.units) || 0;
          if (t.gross != null) acc[label].totals.gross += Number(t.gross) || 0;
          if (t.budget != null) acc[label].totals.budget += Number(t.budget) || 0;
          if (t.debt != null) acc[label].totals.debt += Number(t.debt) || 0;
          if (t.net != null) acc[label].totals.net += Number(t.net) || 0;
          if (t.artist_revenue != null) acc[label].totals.artist_revenue += Number(t.artist_revenue) || 0;
          if (t.label_revenue != null) acc[label].totals.label_revenue += Number(t.label_revenue) || 0;
        }
      }
      for (const [label, block] of Object.entries(acc)) {
        block.totals.artists_count = Object.keys(block.artists || {}).length;
      }
      return acc;
    }

    function getYearObject(year){
      const years = (window.labelYearData && window.labelYearData.years) || {};
      if (year === ALL_TIME_KEY) {
        if (!allTimeCache) allTimeCache = buildAllTime(years);
        return allTimeCache;
      }
      return years[year] || {};
    }

    // -------------------- UI Elements --------------------
    const $year   = document.getElementById('yearSelect');
    const $label  = document.getElementById('labelSelect');
    const $search = document.getElementById('artistSearch');
    const $rows   = document.getElementById('artistRows');
    const $totals = document.getElementById('totalsCards');
    const $reset  = document.getElementById('resetFilters');
    const $download = document.getElementById('downloadCSV');
    const $maxRows  = document.getElementById('maxRows');
    const $noLabels = document.getElementById('noLabels');

    // -------------------- State --------------------------
    let state = { year:null, label:null, search:'', sortKey:'gross', sortDir:'desc', maxRows:100 };

    // -------------------- Helpers ------------------------
    const debounce = (fn, d=200) => { let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), d); }; };
    const fmtMoney = v => (v==null || isNaN(v)) ? '—' : new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(v);
    const fmtInt   = v => (v==null || isNaN(v)) ? '—' : new Intl.NumberFormat('en-US').format(Math.round(v));

    // -------------------- Populate years -----------------
    function initYears() {
      const years = Object.keys((window.labelYearData && window.labelYearData.years) || {}).sort();
      const yearsPlus = [ALL_TIME_KEY, ...years];
      $year.innerHTML = '';
      for (const y of yearsPlus) {
        const opt = document.createElement('option');
        opt.value = y; opt.textContent = y;
        $year.appendChild(opt);
      }
      state.year = yearsPlus[0] || ALL_TIME_KEY;
    }

    // -------------------- Labels for year ----------------
    function populateLabels(){
      $label.innerHTML = '';
      const yearObj = getYearObject(state.year) || {};

      const labels = Object.keys(yearObj)
        .filter(k => isLabelBlock(yearObj[k]))
        .sort((a,b)=> a.localeCompare(b));

      const filtered = labels.filter(l => ALLOWED_LABELS.has(l));
      const toUse = filtered.length ? filtered : labels;

      if (toUse.length === 0) {
        $noLabels.style.display = 'block';
        state.label = null;
        return;
      }
      $noLabels.style.display = 'none';

      for (const l of toUse){
        const opt = document.createElement('option');
        opt.value = l; opt.textContent = l;
        $label.appendChild(opt);
      }
      if (!toUse.includes(state.label)) state.label = toUse[0];
    }

    // ---------------- Current artist rows ----------------
    function currentArtists(){
      const y = getYearObject(state.year) || {};
      const l = y[state.label] || { artists: {} };
      return Object.entries(l.artists || {}).map(([name, obj])=> ({
        name,
        rank: obj.rank_best ?? null,
        active_weeks: obj.active_weeks ?? null,
        records_count: obj.records_count ?? null,
        units: obj.units ?? null,
        gross: obj.gross ?? null,
        budget: obj.budget ?? null,
        debt: obj.debt ?? null,
        net: obj.net ?? null,
        artist_revenue: obj.artist_revenue ?? null,
        label_revenue: obj.label_revenue ?? null
      }));
    }

    // ---------------- Filter / sort / render --------------
    function applyFilters(rows){
      if (!state.search) return rows;
      const q = state.search.toLowerCase();
      return rows.filter(r => r.name && r.name.toLowerCase().includes(q));
    }

    function sortRows(rows){
      const k = state.sortKey, dir = state.sortDir === 'desc' ? -1 : 1;
      return rows.sort((a,b)=>{
        const va = (a[k] ?? -Infinity), vb = (b[k] ?? -Infinity);
        return (va < vb ? -1 : va > vb ? 1 : 0) * dir;
      });
    }

    function renderTotals(){
      const y = getYearObject(state.year) || {};
      const t = (y[state.label]?.totals) || {};
      const card = (k,v)=>(
        `<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`
      );
      const nOrDash = (n)=> (n==null?'—':new Intl.NumberFormat('en-US').format(n));
      $totals.innerHTML = [
        card('Artists', nOrDash(t.artists_count)),
        card('Units', nOrDash(t.units)),
        card('Gross', fmtMoney(t.gross)),
        card('Budget', fmtMoney(t.budget)),
        card('Debt', fmtMoney(t.debt)),
        card('Net', fmtMoney(t.net)),
        card('Artist $', fmtMoney(t.artist_revenue)),
        card('Label $', fmtMoney(t.label_revenue))
      ].join('');
    }

    function renderTable(){
      let rows = currentArtists();
      rows = applyFilters(rows);
      rows = sortRows(rows).slice(0, state.maxRows);
      $rows.innerHTML = rows.map(r=>`
        <tr>
          <td class="mono">${r.rank ?? '—'}</td>
          <td>${r.name}</td>
          <td class="mono">${(r.active_weeks==null?'—':fmtInt(r.active_weeks))}</td>
          <td class="mono">${(r.records_count==null?'—':fmtInt(r.records_count))}</td>
          <td class="mono">${fmtInt(r.units)}</td>
          <td class="mono">${fmtMoney(r.gross)}</td>
          <td class="mono">${fmtMoney(r.budget)}</td>
          <td class="mono">${fmtMoney(r.debt)}</td>
          <td class="mono">${fmtMoney(r.net)}</td>
          <td class="mono">${fmtMoney(r.artist_revenue)}</td>
          <td class="mono">${fmtMoney(r.label_revenue)}</td>
        </tr>`).join('');
    }

    function toCSV(arr){
      const headers=['Artist','Rank','Active Weeks','Records','Units','Gross','Budget','Debt','Net','Artist $','Label $'];
      const lines=[headers.join(',')];
      for (const r of arr){
        lines.push([
          `"${(r.name??'').replace(/"/g,'""')}"`,
          r.rank??'',
          r.active_weeks??'',
          r.records_count??'',
          r.units??'',
          r.gross??'',
          r.budget??'',
          r.debt??'',
          r.net??'',
          r.artist_revenue??'',
          r.label_revenue??''
        ].join(','));
      }
      return lines.join('\n');
    }

    function updateCSVLink(){
      const rows = sortRows(applyFilters(currentArtists())).slice(0, state.maxRows);
      const csv = toCSV(rows);
      const url = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
      const safeLabel = (state.label || 'all').replace(/[^a-z0-9]+/gi,'_');
      const safeYear  = (state.year  || 'All_Time').replace(/[^a-z0-9]+/gi,'_');
      $download.href = url;
      $download.download = `label_${safeLabel}_${safeYear}.csv`;
    }

    function update(){ renderTotals(); renderTable(); updateCSVLink(); }

    // -------------------- Events -------------------------
    document.getElementById('yearSelect').addEventListener('change', e=>{
      state.year=e.target.value; populateLabels(); requestAnimationFrame(update);
    });
    document.getElementById('labelSelect').addEventListener('change', e=>{
      state.label=e.target.value; requestAnimationFrame(update);
    });
    document.getElementById('artistSearch').addEventListener('input', debounce(e=>{
      state.search=e.target.value; requestAnimationFrame(update);
    },200));
    document.querySelectorAll('.sort').forEach(th=>{
      th.addEventListener('click', ()=>{
        const k = th.dataset.key;
        if (state.sortKey === k) state.sortDir = (state.sortDir === 'desc' ? 'asc' : 'desc');
        else { state.sortKey = k; state.sortDir = 'desc'; }
        requestAnimationFrame(update);
      });
    });
    document.getElementById('resetFilters').addEventListener('click', ()=>{
      const year = state.year, label = state.label;
      state = { year, label, search:'', sortKey:'gross', sortDir:'desc', maxRows:100 };
      document.getElementById('artistSearch').value='';
      document.getElementById('maxRows').value='100';
      requestAnimationFrame(update);
    });
    document.getElementById('maxRows').addEventListener('change', e=>{
      state.maxRows=parseInt(e.target.value,10)||100; requestAnimationFrame(update);
    });

    // -------------------- Init ---------------------------
    (function init(){
      const hasYears = window.labelYearData && window.labelYearData.years && Object.keys(window.labelYearData.years).length>0;
      if (!hasYears) console.warn('No years found in dataset.');
      initYears();
      populateLabels();
      requestAnimationFrame(update);
    })();
  </script>
</body>
</html>
