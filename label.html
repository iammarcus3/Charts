<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Labels — Yearly from Weekly + Payouts + Albums</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    .sticky-th { position: sticky; top: 0; background: rgba(2,6,23,.85); backdrop-filter: blur(4px); }
    .scroll-thin::-webkit-scrollbar { width: 6px; height: 6px; }
    .scroll-thin::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.25); border-radius: 9999px; }
    .badge { font-size: 10px; padding: 2px 6px; border-radius: 9999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="max-w-[1500px] mx-auto px-4 py-6">
    <header class="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
      <div>
        <h1 class="text-3xl md:text-4xl font-black">Record Labels — Yearly from Weekly</h1>
        <p class="text-slate-400 text-sm">Week 1 = Fri 23 Feb 2018 • Weeks Fri→Thu • Feb-based years (Jan rolls back).</p>
        <div id="weeklyStatus" class="text-xs mt-1"></div>
      </div>
      <div class="flex flex-wrap gap-2 items-center">
        <input id="search" placeholder="Search labels..." class="w-56 px-3 py-2 rounded-xl bg-white/10 border border-white/10 focus:outline-none" />
        <select id="yearSelect" class="px-3 py-2 rounded-xl bg-white/10 border border-white/10">
          <option value="all" selected>All time (sheet)</option>
        </select>
        <select id="ratesSelect" class="px-3 py-2 rounded-xl bg-white/10 border border-white/10">
          <option value="effective" selected>Rates: Effective (match sheet)</option>
          <option value="policy">Rates: Policy (Record Labels)</option>
        </select>
        <button id="clear" class="px-3 py-2 rounded-xl bg-indigo-500 hover:bg-indigo-600">Clear</button>
      </div>
    </header>

    <section class="grid md:grid-cols-6 gap-4 mt-6">
      <div class="rounded-xl p-4 border border-white/10"><div class="text-xs text-slate-400">Artists</div><div id="gArtists" class="text-2xl font-bold">—</div></div>
      <div class="rounded-xl p-4 border border-white/10"><div class="text-xs text-slate-400">Sales (M units)</div><div id="gSales" class="text-2xl font-bold">—</div></div>
      <div class="rounded-xl p-4 border border-white/10"><div class="text-xs text-slate-400">Plays (M)</div><div id="gPlays" class="text-2xl font-bold">—</div></div>
      <div class="rounded-xl p-4 border border-white/10"><div class="text-xs text-slate-400">Revenue</div><div id="gRevenue" class="text-2xl font-bold">—</div></div>
      <div class="rounded-xl p-4 border border-white/10"><div class="text-xs text-slate-400">Debt</div><div id="gDebt" class="text-2xl font-bold">—</div></div>
      <div class="rounded-xl p-4 border border-white/10"><div class="text-xs text-slate-400">Net</div><div id="gNet" class="text-2xl font-bold">—</div></div>
    </section>

    <div class="grid grid-cols-1 xl:grid-cols-4 gap-6 mt-6">
      <aside class="bg-white/5 border border-white/10 rounded-2xl p-5 shadow-lg xl:col-span-1">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-lg font-semibold">Labels</h2>
          <span id="labelCount" class="text-xs px-2 py-1 rounded-full bg-white/10">—</span>
        </div>
        <div id="labels" class="space-y-1 max-h-[70vh] overflow-auto scroll-thin"></div>
      </aside>

      <main class="xl:col-span-3 space-y-6">
        <section class="bg-white/5 border border-white/10 rounded-2xl p-5 shadow-lg">
          <h3 class="text-lg font-semibold mb-3">Global Charts</h3>
          <div class="grid md:grid-cols-2 gap-6">
            <div><canvas id="chartDebt" height="170"></canvas></div>
            <div><canvas id="chartRevVsDebt" height="170"></canvas></div>
          </div>
        </section>

        <section id="detail" class="bg-white/5 border border-white/10 rounded-2xl p-5 shadow-lg hidden">
          <div class="flex items-start justify-between">
            <div>
              <h3 id="dTitle" class="text-2xl font-extrabold">—</h3>
              <p id="dSub" class="text-slate-400 text-sm">—</p>
            </div>
            <button id="dClose" class="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/20">Close</button>
          </div>

          <!-- Detail stats and tables unchanged -->
        </section>
      </main>
    </div>
  </div>
