<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Labels — Yearly from Weekly • No Charts (with All Time)</title>
<style>
  :root { --bg:#0f172a; --panel:#111827; --ink:#e5e7eb; --muted:#94a3b8; --line:#1f2937; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding:16px 24px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 6px; font-size:22px; }
  .muted { color:var(--muted); font-size:12px; }
  main { padding:16px 24px; max-width:1400px; margin:0 auto; }
  .row { display:grid; grid-template-columns: repeat(12, 1fr); gap:12px; }
  .col-3 { grid-column: span 3; } .col-4 { grid-column: span 4; } .col-5 { grid-column: span 5; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; }
  label.small { display:block; text-transform:uppercase; letter-spacing:.06em; font-size:11px; color:var(--muted); margin:0 0 6px; }
  select,input { width:100%; background:#0b1220; color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .controls .col-3, .controls .col-4, .controls .col-5 { min-width:220px; }
  .btn { padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:#0b1220; color:var(--ink); cursor:pointer; }
  .btn:hover { background:#12213d; }
  .grid3 { display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; }
  .card { background:#0b1220; border:1px solid var(--line); border-radius:12px; padding:12px; }
  .card .k { font-size:11px; color:var(--muted); text-transform:uppercase; }
  .card .v { font-size:18px; font-weight:600; }
  table { width:100%; border-collapse: collapse; font-size:13px; }
  thead th { position:sticky; top:0; background:#0b1220cc; backdrop-filter: blur(4px); border-bottom:1px solid var(--line); text-transform:uppercase; letter-spacing:.06em; font-size:11px; text-align:left; padding:10px; cursor:default; }
  thead th.sort { cursor:pointer; }
  tbody td { border-bottom:1px solid var(--line); padding:8px 10px; }
  tbody tr:hover { background:#0b1220; }
  .mono { font-variant-numeric: tabular-nums; }
  .scroll { overflow:auto; max-height:60vh; }
  .flex { display:flex; gap:8px; align-items:center; }
  .warn { color:#fcd34d; }
</style>
</head>
<body>
  <header>
    <div class="flex" style="justify-content:space-between;">
      <div>
        <h1>Labels — Yearly from Weekly</h1>
        <div class="muted">Per year · Per record label · Artists overview · Budgets · Debt · Net · Units · Revenues</div>
      </div>
      <div class="flex">
        <a id="downloadCSV" class="btn" href="#">Download CSV</a>
        <button id="resetFilters" class="btn">Reset</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Controls -->
    <section class="row controls" style="margin-bottom:12px;">
      <div class="col-3">
        <label class="small">Year</label>
        <select id="yearSelect"></select>
      </div>
      <div class="col-5">
        <label class="small">Record Label</label>
        <select id="labelSelect"></select>
      </div>
      <div class="col-4">
        <label class="small">Search Artist</label>
        <div class="flex">
          <input id="artistSearch" type="text" placeholder="Type to filter artists…"/>
          <select id="maxRows" style="width:140px;">
            <option>50</option><option selected>100</option><option>200</option><option>500</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Metric toggles (kept for context; page is table-only) -->
    <section class="panel" style="margin-bottom:12px;">
      <div class="flex" style="flex-wrap:wrap; gap:12px;">
        <span class="small" style="align-self:center;">Metrics</span>
        <label class="flex" style="gap:6px; align-items:center;"><input class="metricToggle" type="checkbox" data-metric="units" checked/> Units</label>
        <label class="flex" style="gap:6px; align-items:center;"><input class="metricToggle" type="checkbox" data-metric="gross" checked/> Gross $</label>
        <label class="flex" style="gap:6px; align-items:center;"><input class="metricToggle" type="checkbox" data-metric="budget" checked/> Budget</label>
        <label class="flex" style="gap:6px; align-items:center;"><input class="metricToggle" type="checkbox" data-metric="debt" checked/> Debt $</label>
        <label class="flex" style="gap:6px; align-items:center;"><input class="metricToggle" type="checkbox" data-metric="net" checked/> Net $</label>
        <label class="flex" style="gap:6px; align-items:center;"><input class="metricToggle" type="checkbox" data-metric="artist_revenue"/> Artist $</label>
        <label class="flex" style="gap:6px; align-items:center;"><input class="metricToggle" type="checkbox" data-metric="label_revenue"/> Label $</label>
      </div>
    </section>

    <!-- Totals -->
    <section style="margin:12px 0;">
      <div class="grid3" id="totalsCards"></div>
    </section>

    <!-- Table -->
    <section class="panel" style="margin-top:12px;">
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>Rank</th><th>Artist</th><th>Active Weeks</th><th>Records</th>
              <th class="sort" data-key="units">Units</th>
              <th class="sort" data-key="gross">Gross $</th>
              <th class="sort" data-key="budget">Budget</th>
              <th class="sort" data-key="debt">Debt $</th>
              <th class="sort" data-key="net">Net $</th>
              <th>Artist $</th><th>Label $</th>
            </tr>
          </thead>
          <tbody id="artistRows"></tbody>
        </table>
      </div>
    </section>

    <p id="datasetWarning" class="muted" style="margin-top:10px;"></p>
  </main>

  <!-- Load your uploaded dataset (defines window.labelYearData) -->
  <script src="./label_year_data.global.js"></script>

  <!-- App code (no charts) -->
  <script>
    // --- Utilities
    const debounce = (fn, d=200) => { let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), d); }; };
    const fmtMoney = v => (v==null || isNaN(v)) ? '—' : new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(v);
    const fmtInt   = v => (v==null || isNaN(v)) ? '—' : new Intl.NumberFormat('en-US').format(Math.round(v));

    // --- Dataset guard
    const warn = document.getElementById('datasetWarning');
    if (!window.labelYearData || !window.labelYearData.years) {
      warn.innerHTML = '<span class="warn">Dataset not found. Make sure <code>label_year_data.global.js</code> is in the same folder and loads before this script.</span>';
      window.labelYearData = { meta:{}, years:{} };
    } else {
      warn.textContent = 'Loaded dataset: ' + (window.labelYearData.meta && window.labelYearData.meta.source_file ? window.labelYearData.meta.source_file : '(unknown)');
    }

    // ---------- ALL-TIME AGGREGATION ----------
    const ALL_TIME_KEY = 'All Time';
    let allTimeCache = null;

    function buildAllTime(yearsObj){
      // yearsObj: { "2018": {<label>: {artists:{}, totals:{} }}, ... }
      const acc = {}; // label -> {artists, totals}
      const sumKeys = ['units','gross','budget','debt','net','artist_revenue','label_revenue','records_count'];

      for (const y of Object.keys(yearsObj || {})) {
        const yearObj = yearsObj[y] || {};
        for (const [label, block] of Object.entries(yearObj)) {
          if (!block || !block.artists) continue;

          if (!acc[label]) acc[label] = { artists: {}, totals: { artists_count: 0, units:0, gross:0, budget:0, debt:0, net:0, artist_revenue:0, label_revenue:0 } };

          // merge artists
          for (const [artist, a] of Object.entries(block.artists || {})) {
            if (!acc[label].artists[artist]) {
              acc[label].artists[artist] = {
                rank_best: a.rank_best ?? null,
                active_weeks: a.active_weeks ?? null,
                records_count: 0, units:0, gross:0, budget:0, debt:0, net:0,
                artist_revenue:0, label_revenue:0
              };
            }
            const tgt = acc[label].artists[artist];
            // best rank (min)
            if (a.rank_best != null) tgt.rank_best = (tgt.rank_best == null) ? a.rank_best : Math.min(tgt.rank_best, a.rank_best);
            // max active weeks
            if (a.active_weeks != null) tgt.active_weeks = (tgt.active_weeks == null) ? a.active_weeks : Math.max(tgt.active_weeks, a.active_weeks);
            // sums
            for (const k of sumKeys) if (a[k] != null && !isNaN(a[k])) tgt[k] += Number(a[k]);
          }

          // roll up label totals (sum across years)
          const t = block.totals || {};
          if (t.units != null) acc[label].totals.units += Number(t.units) || 0;
          if (t.gross != null) acc[label].totals.gross += Number(t.gross) || 0;
          if (t.budget != null) acc[label].totals.budget += Number(t.budget) || 0;
          if (t.debt != null) acc[label].totals.debt += Number(t.debt) || 0;
          if (t.net != null) acc[label].totals.net += Number(t.net) || 0;
          if (t.artist_revenue != null) acc[label].totals.artist_revenue += Number(t.artist_revenue) || 0;
          if (t.label_revenue != null) acc[label].totals.label_revenue += Number(t.label_revenue) || 0;
        }
      }
      // finalize artists_count from unique artists under each label
      for (const [label, block] of Object.entries(acc)) {
        block.totals.artists_count = Object.keys(block.artists || {}).length;
      }
      return acc;
    }

    function getYearObject(year){
      const years = (window.labelYearData && window.labelYearData.years) || {};
      if (year === ALL_TIME_KEY) {
        if (!allTimeCache) allTimeCache = buildAllTime(years);
        return allTimeCache; // shape matches a single-year object
      }
      return years[year] || {};
    }
    // -------------------------------------------

    // --- Elements
    const $year   = document.getElementById('yearSelect');
    const $label  = document.getElementById('labelSelect');
    const $search = document.getElementById('artistSearch');
    const $rows   = document.getElementById('artistRows');
    const $totals = document.getElementById('totalsCards');
    const $reset  = document.getElementById('resetFilters');
    const $download = document.getElementById('downloadCSV');
    const $maxRows  = document.getElementById('maxRows');

    // --- State
    let state = { year:null, label:null, search:'', sortKey:'gross', sortDir:'desc', maxRows:100 };

    // --- Populate years (with All Time first)
    function initYears() {
      const years = Object.keys((window.labelYearData && window.labelYearData.years) || {}).sort();
      const yearsPlus = [ALL_TIME_KEY, ...years];
      $year.innerHTML = '';
      for (const y of yearsPlus) {
        const opt = document.createElement('option');
        opt.value = y; opt.textContent = y;
        $year.appendChild(opt);
      }
      state.year = yearsPlus[0] || ALL_TIME_KEY;
    }

    // --- Labels-only for chosen year / all-time
    function populateLabels(){
      $label.innerHTML = '';
      const yearObj = getYearObject(state.year) || {};
      const labels = Object.entries(yearObj)
        .filter(([k,v]) => v && typeof v==='object' && v.artists && v.totals)
        .map(([k]) => k)
        .sort((a,b)=> a.localeCompare(b));
      for (const l of labels){
        const opt = document.createElement('option');
        opt.value = l; opt.textContent = l;
        $label.appendChild(opt);
      }
      state.label = labels[0] || null;
    }

    // --- Current table rows
    function currentArtists(){
      const y = getYearObject(state.year) || {};
      const l = y[state.label] || { artists: {} };
      return Object.entries(l.artists || {}).map(([name, obj])=> ({
        name,
        rank: obj.rank_best ?? null,
        active_weeks: obj.active_weeks ?? null,
        records_count: obj.records_count ?? null,
        units: obj.units ?? null,
        gross: obj.gross ?? null,
        budget: obj.budget ?? null,
        debt: obj.debt ?? null,
        net: obj.net ?? null,
        artist_revenue: obj.artist_revenue ?? null,
        label_revenue: obj.label_revenue ?? null
      }));
    }

    // --- Filter / sort / render
    function applyFilters(rows){
      if (!state.search) return rows;
      const q = state.search.toLowerCase();
      return rows.filter(r => r.name && r.name.toLowerCase().includes(q));
    }

    function sortRows(rows){
      const k = state.sortKey, dir = state.sortDir === 'desc' ? -1 : 1;
      return rows.sort((a,b)=>{
        const va = (a[k] ?? -Infinity), vb = (b[k] ?? -Infinity);
        return (va < vb ? -1 : va > vb ? 1 : 0) * dir;
      });
    }

    function renderTotals(){
      const y = getYearObject(state.year) || {};
      const t = (y[state.label]?.totals) || {};
      const tpl = (k,v)=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`;
      $totals.innerHTML = [
        tpl('Artists', (t.artists_count==null?'—':new Intl.NumberFormat('en-US').format(t.artists_count))),
        tpl('Units', fmtInt(t.units)),
        tpl('Gross', fmtMoney(t.gross)),
        tpl('Budget', fmtMoney(t.budget)),
        tpl('Debt', fmtMoney(t.debt)),
        tpl('Net', fmtMoney(t.net)),
        tpl('Artist $', fmtMoney(t.artist_revenue)),
        tpl('Label $', fmtMoney(t.label_revenue))
      ].join('');
    }

    function renderTable(){
      let rows = currentArtists();
      rows = applyFilters(rows);
      rows = sortRows(rows).slice(0, state.maxRows);
      $rows.innerHTML = rows.map(r=>`
        <tr>
          <td class="mono">${r.rank ?? '—'}</td>
          <td>${r.name}</td>
          <td class="mono">${(r.active_weeks==null?'—':fmtInt(r.active_weeks))}</td>
          <td class="mono">${(r.records_count==null?'—':fmtInt(r.records_count))}</td>
          <td class="mono">${fmtInt(r.units)}</td>
          <td class="mono">${fmtMoney(r.gross)}</td>
          <td class="mono">${fmtMoney(r.budget)}</td>
          <td class="mono">${fmtMoney(r.debt)}</td>
          <td class="mono">${fmtMoney(r.net)}</td>
          <td class="mono">${fmtMoney(r.artist_revenue)}</td>
          <td class="mono">${fmtMoney(r.label_revenue)}</td>
        </tr>`).join('');
    }

    function toCSV(arr){
      const headers=['Artist','Rank','Active Weeks','Records','Units','Gross','Budget','Debt','Net','Artist $','Label $'];
      const lines=[headers.join(',')];
      for (const r of arr){
        lines.push([
          `"${(r.name??'').replace(/"/g,'""')}"`,
          r.rank??'',
          r.active_weeks??'',
          r.records_count??'',
          r.units??'',
          r.gross??'',
          r.budget??'',
          r.debt??'',
          r.net??'',
          r.artist_revenue??'',
          r.label_revenue??''
        ].join(','));
      }
      return lines.join('\n');
    }

    function updateCSVLink(){
      const rows = sortRows(applyFilters(currentArtists())).slice(0, state.maxRows);
      const csv = toCSV(rows);
      const url = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
      const safeLabel = (state.label || 'all').replace(/[^a-z0-9]+/gi,'_');
      const safeYear  = (state.year  || 'All_Time').replace(/[^a-z0-9]+/gi,'_');
      $download.href = url; $download.download = `label_${safeLabel}_${safeYear}.csv`;
    }

    function update(){ renderTotals(); renderTable(); updateCSVLink(); }

    // --- Events
    $year.addEventListener('change', e=>{ state.year=e.target.value; populateLabels(); requestAnimationFrame(update); });
    $label.addEventListener('change', e=>{ state.label=e.target.value; requestAnimationFrame(update); });
    $search.addEventListener('input', debounce(e=>{ state.search=e.target.value; requestAnimationFrame(update); },200));
    document.querySelectorAll('.sort').forEach(th=>{
      th.addEventListener('click', ()=>{
        const k = th.dataset.key;
        if (state.sortKey === k) state.sortDir = (state.sortDir === 'desc' ? 'asc' : 'desc');
        else { state.sortKey = k; state.sortDir = 'desc'; }
        requestAnimationFrame(update);
      });
    });
    document.getElementById('resetFilters').addEventListener('click', ()=>{
      const year = state.year, label = state.label;
      state = { year, label, search:'', sortKey:'gross', sortDir:'desc', maxRows:100 };
      $search.value=''; $maxRows.value='100';
      requestAnimationFrame(update);
    });
    $maxRows.addEventListener('change', e=>{ state.maxRows=parseInt(e.target.value,10)||100; requestAnimationFrame(update); });

    // --- Init
    initYears();
    populateLabels();
    requestAnimationFrame(update);
  </script>
</body>
</html>
