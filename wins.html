<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Artist Nominations — By Year (JS Data)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Minimal dark styles, no external CDNs -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#0b0f1a; color:#e5e7eb; }
    header { padding:16px 20px; border-bottom:1px solid rgba(255,255,255,.08); background:#0b0f1a; position:sticky; top:0; z-index:20; }
    h1 { margin:0 0 6px; font-size:20px; letter-spacing:.2px; }
    .sub { font-size:12px; color:#94a3b8; }
    .wrap { max-width:1200px; margin:0 auto; padding:18px 20px; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin:10px 0 18px; }
    .pill { display:inline-flex; align-items:center; gap:8px; padding:10px 12px; border:1px solid rgba(255,255,255,.12); border-radius:10px; background:#0e1527; }
    .pill label { font-size:12px; color:#a3b2c7; }
    select, input[type="text"] { background:#0a1223; border:1px solid rgba(255,255,255,.15); color:#e5e7eb; padding:10px 12px; border-radius:8px; outline:none; }
    select:focus, input[type="text"]:focus { border-color:#4f46e5; }
    .kpis { display:grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap:10px; margin-bottom:14px; }
    .kpi { background:linear-gradient(180deg, rgba(79,70,229,.18), rgba(2,6,23,.6)); border:1px solid rgba(99,102,241,.35); border-radius:12px; padding:14px; }
    .kpi h4 { margin:0 0 6px; font-size:12px; color:#c7d2fe; font-weight:600; letter-spacing:.3px; text-transform:uppercase; }
    .kpi p { margin:0; font-size:22px; font-weight:700; }
    .grid2 { display:grid; grid-template-columns: 1fr; gap:14px; }
    @media (min-width: 1000px) { .grid2 { grid-template-columns: 1fr 1fr; } }
    .card { border:1px solid rgba(255,255,255,.1); border-radius:14px; background:#0b1224; overflow:hidden; }
    .card h3 { margin:0; padding:12px 14px; font-size:14px; letter-spacing:.2px; border-bottom:1px solid rgba(255,255,255,.07); background:rgba(2,6,23,.6); }
    .table-wrap { overflow:auto; max-height:70vh; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.06); vertical-align:top; }
    th { position:sticky; top:0; background:rgba(2,6,23,.85); backdrop-filter: blur(4px); text-align:left; z-index:1; }
    tbody tr:hover { background:rgba(255,255,255,.03); }
    .muted { color:#94a3b8; font-size:12px; }
    .ok { color:#86efac; }
    .warn { color:#fbbf24; }
    .err { color:#fca5a5; }
    .foot { margin-top:14px; font-size:12px; color:#94a3b8; }
    .badge { font-size:11px; padding:2px 6px; border:1px solid rgba(255,255,255,.18); border-radius:999px; background:#0a1223; }
  </style>
</head>
<body>
  <header>
    <h1>Artist Nominations — By Year</h1>
    <div class="sub" id="datasetStatus">Loading dataset…</div>
  </header>

  <div class="wrap">
    <div class="row">
      <div class="pill">
        <label for="year">Year</label>
        <select id="year">
          <option value="all">All years</option>
        </select>
      </div>
      <div class="pill" style="flex:1 1 260px;">
        <label for="q">Search</label>
        <input id="q" type="text" placeholder="Search artist, category or work…" style="width:100%;" />
      </div>
      <span class="badge" id="metaSpan"></span>
    </div>

    <div class="kpis">
      <div class="kpi"><h4>Total Artists</h4><p id="kpiArtists">—</p></div>
      <div class="kpi"><h4>Total Nominations</h4><p id="kpiNoms">—</p></div>
      <div class="kpi"><h4>Years Loaded</h4><p id="kpiYears">—</p></div>
      <div class="kpi"><h4>Sheets Read</h4><p id="kpiSheets">—</p></div>
    </div>

    <div class="grid2">
      <div class="card">
        <h3>Summary — per Year × Artist</h3>
        <div class="table-wrap">
          <table id="summary">
            <thead>
              <tr>
                <th>Year</th>
                <th>Artist</th>
                <th>Noms</th>
                <th>Wins</th>
                <th>Win %</th>
                <th>Categories</th>
                <th>Won Categories</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h3>Detail — every Nomination Row</h3>
        <div class="table-wrap">
          <table id="detail">
            <thead>
              <tr>
                <th>Year</th>
                <th>Artist</th>
                <th>Category</th>
                <th>Work</th>
                <th>Winner</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="foot muted" id="footnote"></div>
  </div>

  <!-- Load the JS DATA file first -->
  <script src="grammy_noms.js"></script>

  <!-- Viewer logic (works with the JS file above) -->
  <script>
  (function(){
    const statusEl = document.getElementById('datasetStatus');
    const metaSpan = document.getElementById('metaSpan');
    const yearSel = document.getElementById('year');
    const q = document.getElementById('q');
    const summaryBody = document.querySelector('#summary tbody');
    const detailBody = document.querySelector('#detail tbody');
    const kpiArtists = document.getElementById('kpiArtists');
    const kpiNoms = document.getElementById('kpiNoms');
    const kpiYears = document.getElementById('kpiYears');
    const kpiSheets = document.getElementById('kpiSheets');
    const footnote = document.getElementById('footnote');

    if (!window.grammyNoms || !window.grammyNoms.years) {
      statusEl.innerHTML = '<span class="err">Dataset not found.</span> Place <b>grammy_noms.js</b> next to this HTML and reload.';
      console.error('grammyNoms not found: ensure grammy_noms.js is loaded before this script.');
      return;
    }

    const data = window.grammyNoms;
    const years = data.years || {};
    const yearKeys = Object.keys(years).sort((a,b)=>Number(a)-Number(b));

    statusEl.innerHTML = '<span class="ok">Loaded dataset</span>' + (data.meta && data.meta.source_file ? ' — ' + data.meta.source_file : '');
    metaSpan.textContent = data.meta ? (data.meta.generated_utc ? ('Generated: ' + data.meta.generated_utc) : '') : '';

    // Populate dropdown
    for (const y of yearKeys) {
      const opt = document.createElement('option');
      opt.value = y; opt.textContent = y;
      yearSel.appendChild(opt);
    }

    // Build detail table
    let detailCount = 0;
    const rowsCacheDetail = [];
    const lower = (s)=> (s||'').toString().toLowerCase();

    const pushDetail = (y, item) => {
      const tr = document.createElement('tr');
      tr.dataset.year = y;
      const indexBlob = [y, item.artist||'', item.category||'', item.work||''].join(' ').toLowerCase();
      tr.dataset.index = indexBlob;
      tr.innerHTML =
        '<td>'+y+'</td>'+
        '<td>'+ (item.artist||'') +'</td>'+
        '<td>'+ (item.category||'') +'</td>'+
        '<td>'+ (item.work||'') +'</td>'+
        '<td>'+ (item.winner ? 'Yes' : 'No') +'</td>';
      rowsCacheDetail.push(tr);
      detailCount++;
    };

    const uniqueArtists = new Set();
    for (const y of yearKeys) {
      for (const item of years[y]) {
        uniqueArtists.add(item.artist);
        pushDetail(y, item);
      }
    }
    // Commit once for performance
    detailBody.append(...rowsCacheDetail);

    // Build summary per year × artist
    const byYearArtist = {};
    for (const y of yearKeys) {
      byYearArtist[y] = {};
      for (const d of years[y]) {
        const a = d.artist || '';
        if (!byYearArtist[y][a]) byYearArtist[y][a] = { noms:0, wins:0, cats:new Set(), wonCats:new Set() };
        byYearArtist[y][a].noms += 1;
        if (d.winner) byYearArtist[y][a].wins += 1;
        if (d.category) {
          byYearArtist[y][a].cats.add(d.category);
          if (d.winner) byYearArtist[y][a].wonCats.add(d.category);
        }
      }
    }

    const rowsCacheSummary = [];
    for (const y of yearKeys) {
      for (const [artist, stat] of Object.entries(byYearArtist[y])) {
        const winPct = stat.noms ? Math.round((stat.wins / stat.noms) * 100) : 0;
        const tr = document.createElement('tr');
        tr.dataset.year = y;
        tr.dataset.index = [y, artist, Array.from(stat.cats).join(','), Array.from(stat.wonCats).join(',')].join(' ').toLowerCase();
        tr.innerHTML =
          '<td>'+y+'</td>'+
          '<td>'+artist+'</td>'+
          '<td>'+stat.noms+'</td>'+
          '<td>'+stat.wins+'</td>'+
          '<td>'+winPct+'%</td>'+
          '<td>'+Array.from(stat.cats).join(', ')+'</td>'+
          '<td>'+Array.from(stat.wonCats).join(', ')+'</td>';
        rowsCacheSummary.push(tr);
      }
    }
    document.querySelector('#summary tbody').append(...rowsCacheSummary);

    // KPIs
    kpiArtists.textContent = uniqueArtists.size;
    kpiNoms.textContent = detailCount;
    kpiYears.textContent = yearKeys.length ? (yearKeys[0] + '–' + yearKeys[yearKeys.length-1]) : '—';
    kpiSheets.textContent = (data.meta && data.meta.sheets) ? data.meta.sheets.length : yearKeys.length;

    // Footnote
    footnote.textContent = data.meta
      ? ('Source: ' + (data.meta.source_file || 'JS data') + (data.meta.notes ? ' — ' + data.meta.notes : ''))
      : 'Source: JS data';

    // Filtering (year + free text across artist/category/work)
    function applyFilters(){
      const y = yearSel.value;
      const term = lower(q.value).trim();
      const match = (tr) => {
        const yearOk = (y === 'all') || (tr.dataset.year === y);
        const textOk = !term || tr.dataset.index.includes(term);
        return yearOk && textOk;
      };
      for (const tbody of [summaryBody, detailBody]) {
        for (const tr of tbody.rows) tr.style.display = match(tr) ? '' : 'none';
      }
    }
    yearSel.addEventListener('change', applyFilters);
    q.addEventListener('input', applyFilters);
    applyFilters(); // initial
  })();
  </script>
<script src="grammy_noms.winners.js"></script>
<script src="noms_viewer_winners.js"></script>
<script src="artist_click_enhancer.js"></script>
</body>
</html>
