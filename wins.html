<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artist Nominations — By Year (From Your Sheet)</title>
<style>
  body { margin:0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#0b0f1a; color:#e5e7eb; }
  header { padding:16px 20px; background:#0f172a; position:sticky; top:0; z-index:10; border-bottom:1px solid #1f2937; }
  h1 { margin:0; font-size:18px; letter-spacing:.2px; }
  main { padding: 18px; }
  .card { background:#0f172a; border:1px solid #1f2937; border-radius:14px; padding:14px; margin-bottom:16px; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  input[type="file"], button, select, input[type="search"] { background:#111827; border:1px solid #1f2937; color:#e5e7eb; padding:8px 10px; border-radius:8px; }
  .muted { color:#9ca3af; font-size:12px; }
  /* The module injects its own styles; nothing else needed */
</style>
</head>
<body>
<header><h1>Artist Nominations — By Year (from your sheet)</h1></header>

<main>
  <!-- Controls: choose local file OR load from a hosted URL -->
  <div class="card">
    <div class="controls">
      <input type="file" id="file" accept=".xlsx" title="Pick your Excel file" />
      <button id="loadFromUrl" title="Loads Excel from a hosted URL">Load from URL</button>
      <span class="muted">Tip: Using a local file is easiest when opening this page directly (no CORS).</span>
    </div>
  </div>

  <!-- The stats app renders here -->
  <div id="stats"></div>
</main>

<!-- 1) SheetJS XLSX (needed to read .xlsx in the browser) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.19.3/dist/xlsx.full.min.js"></script>

<!-- 2) Your stats module (must be in the same folder or update the path) -->
<script src="artist_nominations_stats.js"></script>

<script>
  // === Option A: Local file (recommended if opening this HTML from your computer) ===
  document.getElementById('file').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    ArtistNomsStats.render({
      container: '#stats',
      xlsxFile: file
    });
  });

  // === Option B: Hosted URL ===
  // Replace with the actual path where your Excel is hosted.
  // Example: const EXCEL_URL = 'https://your-domain.com/CopyOfGrammyNominations.xlsx';
  const EXCEL_URL = 'Copy of Grammy_Nominations_ByYear_ONEFILE_no_consecutive_repeats(AutoRecovered).xlsx';

  document.getElementById('loadFromUrl').addEventListener('click', () => {
    ArtistNomsStats.render({
      container: '#stats',
      xlsxUrl: EXCEL_URL
    });
  });
</script>
</body>
</html>
