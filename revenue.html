<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music Industry Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .tab { cursor: pointer; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .label-card { background:#1f1f1f; padding:1rem; border-radius:0.5rem; color:#fff; }
    .data-table { width:100%; border-collapse: collapse; margin-top: 1rem; }
    .data-table th, .data-table td { border: 1px solid #333; padding: 6px 10px; }
    .red { color: #ff4c4c; font-weight: bold; }
    .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); display:flex; justify-content:center; align-items:center; }
    .modal-content { background:#1f1f1f; padding:2rem; border-radius:0.5rem; width:80%; max-height:90%; overflow:auto; }
    .hidden { display:none; }
  </style>
</head>
<body class="bg-black text-white">

  <h1 class="text-3xl text-center font-bold my-6">Music Industry Dashboard</h1>

  <!-- Tabs -->
  <div class="flex justify-center space-x-4 mb-6">
    <div class="tab active px-4 py-2 bg-gray-800 rounded" data-tab="labels">Labels</div>
    <div class="tab px-4 py-2 bg-gray-800 rounded" data-tab="artists">Artists</div>
    <div class="tab px-4 py-2 bg-gray-800 rounded" data-tab="albums">Albums</div>
  </div>

  <!-- Labels Tab -->
  <div id="tab-labels" class="tab-panel active">
    <h2 class="text-xl font-bold mb-4">Record Labels</h2>
    <div id="labelsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
  </div>

  <!-- Artists Tab -->
  <div id="tab-artists" class="tab-panel">
    <h2 class="text-xl font-bold mb-4">Artists</h2>
    <table id="artistsTable" class="data-table">
      <thead>
        <tr><th>Artist</th><th>Sales</th><th>Plays</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Albums Tab -->
  <div id="tab-albums" class="tab-panel">
    <h2 class="text-xl font-bold mb-4">Albums</h2>
    <table id="albumsTable" class="data-table">
      <thead>
        <tr><th>Album</th><th>Artist</th><th>Sales</th><th>Plays</th><th>Label</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Artist Modal -->
  <div id="artistModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeArtistModal" class="bg-red-600 px-3 py-1 rounded float-right">Close</button>
      <h2 id="artistTitle" class="text-2xl font-bold mb-4">Artist</h2>
      <canvas id="artistYearlyChart" height="120"></canvas>
      <div id="artistYearlyTable" class="mt-4"></div>
    </div>
  </div>

  <!-- Label Modal -->
  <div id="labelModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeLabelModal" class="bg-red-600 px-3 py-1 rounded float-right">Close</button>
      <h2 id="labelTitle" class="text-2xl font-bold mb-4">Label</h2>
      <div id="labelYearlyTable" class="mt-4"></div>
    </div>
  </div>

  <!-- Your Data Files -->
  <script src="data.js"></script>
  <script src="pricing.js"></script>
  <script src="app.js"></script>
</body>
</html>
