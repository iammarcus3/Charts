<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Record Label Intelligence</title>

  <!-- Tailwind (stable CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- App styles -->
  <style>
    :root{
      --panel:#0f172a; --card:#0b1220; --muted:#94a3b8; --accent:#7c3aed; --accent2:#10b981; --danger:#ef4444;
      --border:#1f2937; --text:#e2e8f0; --bg:#0b0f16;
    }
    body{background:var(--bg); color:var(--text)}
    .glass{background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02)); backdrop-filter: blur(8px); border:1px solid var(--border)}
    .tab-btn{border-radius:999px; border:1px solid var(--border); background:#0f172a; color:#cbd5e1; padding:.5rem 1rem}
    .tab-btn.active{background:linear-gradient(90deg,var(--accent),var(--accent2)); color:white; border:none}
    .pill{display:inline-block; padding:.15rem .5rem; border-radius:999px; background:#0b1220; color:#cbd5e1; font-size:.75rem}
    .pill.red{background:rgba(239,68,68,.15); color:#fecaca}
    .neg{color:#fecaca}
    .modal{position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.6)}
    .modal.show{display:flex}
    .modal-card{width:min(1200px,96vw); max-height:92vh; overflow:auto; border:1px solid var(--border); border-radius:16px; background:var(--panel)}
    .subtabs button{border:1px solid var(--border); border-radius:10px; padding:.5rem .75rem; background:#0b1220; color:#cbd5e1}
    .subtabs button.active{background:linear-gradient(90deg,var(--accent),var(--accent2)); color:white; border:none}
    .tbl{width:100%; border-collapse:collapse; border:1px solid var(--border); border-radius:12px; overflow:hidden}
    .tbl th,.tbl td{padding:.6rem .75rem; border-bottom:1px solid var(--border)}
    .tbl thead{background:#0f172a}
    .tbl tbody tr:hover{background:rgba(124,58,237,.08)}
  </style>
</head>

<body class="min-h-screen">
  <!-- Header -->
  <header class="glass sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-violet-600 to-emerald-500"></div>
        <h1 class="text-xl md:text-2xl font-semibold">Record Label Intelligence</h1>
      </div>
      <div class="flex gap-2">
        <span class="pill">Week 1: 2018-02-23 → Week 396 (Fri-Thu)</span>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="max-w-7xl mx-auto px-4 pb-24">
    <!-- Tabs -->
    <div class="mt-6 flex flex-wrap gap-2">
      <button class="tab-btn active" data-tab="labels">Labels</button>
      <button class="tab-btn" data-tab="artists">Artists</button>
      <button class="tab-btn" data-tab="albums">Albums</button>
      <button class="tab-btn" data-tab="pricing">Pricing</button>
    </div>

    <!-- Global KPIs -->
    <section class="mt-6 grid grid-cols-2 md:grid-cols-4 gap-3">
      <div class="glass rounded-2xl p-4">
        <div class="text-sm text-slate-400">Total Sales</div>
        <div id="kpiSales" class="text-2xl font-bold">—</div>
      </div>
      <div class="glass rounded-2xl p-4">
        <div class="text-sm text-slate-400">Total Plays</div>
        <div id="kpiPlays" class="text-2xl font-bold">—</div>
      </div>
      <div class="glass rounded-2xl p-4">
        <div class="text-sm text-slate-400">Total Debt</div>
        <div id="kpiDebt" class="text-2xl font-bold">—</div>
      </div>
      <div class="glass rounded-2xl p-4">
        <div class="text-sm text-slate-400">Labels • Artists</div>
        <div id="kpiCounts" class="text-2xl font-bold">—</div>
      </div>
    </section>

    <!-- Filters -->
    <section class="mt-6 flex flex-wrap gap-2">
      <input id="searchInput" placeholder="Search label or artist…" class="glass rounded-xl px-3 py-2 outline-none w-72" />
      <select id="yearSelect" class="glass rounded-xl px-3 py-2 outline-none">
        <option value="">All Years</option>
      </select>
    </section>

    <!-- Panels -->
    <section id="panel-labels" class="mt-6 grid grid-cols-1 lg:grid-cols-3 gap-4"></section>
    <section id="panel-artists" class="mt-6 hidden">
      <table class="tbl" id="artistsTable">
        <thead><tr>
          <th>Artist</th><th>Label</th><th>Sales</th><th>Plays</th><th>Debt</th><th>Final</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </section>
    <section id="panel-albums" class="mt-6 hidden">
      <table class="tbl" id="albumsTable">
        <thead><tr>
          <th>Album</th><th>Artist</th><th>Label</th><th>Sales</th><th>Plays</th><th>Budget</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </section>
    <section id="panel-pricing" class="mt-6 hidden">
      <div id="pricingWrap" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>
  </main>

  <!-- Label Modal -->
  <div id="labelModal" class="modal">
    <div class="modal-card p-4 md:p-6">
      <div class="flex items-center justify-between">
        <h2 id="labelTitle" class="text-xl md:text-2xl font-semibold">Label</h2>
        <button id="closeLabelModal" class="pill">Close</button>
      </div>

      <div class="mt-4 subtabs flex flex-wrap gap-2">
        <button class="active" data-mtab="overview">Overview</button>
        <button data-mtab="artists">Artists</button>
        <button data-mtab="albums">Albums</button>
        <button data-mtab="pricing">Pricing</button>
      </div>

      <div id="mtab-overview" class="mt-4">
        <canvas id="labelStacked" height="130"></canvas>
        <div id="labelYearTable" class="mt-3 overflow-auto"></div>
      </div>

      <div id="mtab-artists" class="mt-4 hidden">
        <table class="tbl" id="labelArtistsTbl">
          <thead><tr><th>#</th><th>Artist</th><th>Sales</th><th>Plays</th><th>Debt</th><th>Final</th></tr></thead>
          <tbody></tbody>
        </table>
        <div class="mt-3 flex justify-center"><button id="loadMoreArtists" class="pill">Load more</button></div>
      </div>

      <div id="mtab-albums" class="mt-4 hidden">
        <table class="tbl" id="labelAlbumsTbl">
          <thead><tr><th>#</th><th>Album</th><th>Artist</th><th>Sales</th><th>Plays</th><th>Budget</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <div id="mtab-pricing" class="mt-4 hidden">
        <div id="labelPricingTbl" class="overflow-auto"></div>
      </div>
    </div>
  </div>

  <!-- Artist Modal -->
  <div id="artistModal" class="modal">
    <div class="modal-card p-4 md:p-6">
      <div class="flex items-center justify-between">
        <h2 id="artistTitle" class="text-xl md:text-2xl font-semibold">Artist</h2>
        <button id="closeArtistModal" class="pill">Close</button>
      </div>
      <div class="mt-4 grid grid-cols-1 lg:grid-cols-2 gap-4">
        <canvas id="artistWeekly" height="140"></canvas>
        <canvas id="artistYearly" height="140"></canvas>
      </div>
      <div id="artistMeta" class="mt-3 text-slate-400 text-sm"></div>
      <div id="artistAlbums" class="mt-3"></div>
    </div>
  </div>

  <!-- DATA (order matters) -->
  <script src="pricing.js"></script>
  <!-- Optional extras (debts/labels/albums). Safe if missing. -->
  <script>
    // guard if data.js not supplied
    window.artistsExtra = window.artistsExtra || {};   // { [artist]: { label?, debtUSD?, finalUSD? } }
    window.albumsData  = window.albumsData  || [];     // [ { album, artist, label?, sales?, plays?, totalBudgetM? } ]
  </script>
  <script src="data.js"></script>
  <script src="weekdata.js"></script>
  <script src="app.js"></script>
</body>
</html>
