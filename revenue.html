<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Record Label Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-gray-100">
  <header class="p-6 bg-gray-800 shadow-lg text-center">
    <h1 class="text-4xl font-bold text-pink-400">🎵 Record Label Dashboard</h1>
    <p class="text-gray-400">Data-driven insights from 2018 to Week 396</p>
  </header>

  <main class="p-6">
    <!-- Global stats -->
    <section id="global-stats" class="mb-12">
      <h2 class="text-2xl font-semibold mb-4">Global Overview</h2>
      <div id="globalCards" class="grid grid-cols-1 md:grid-cols-4 gap-6"></div>
    </section>

    <!-- Tabs for labels -->
    <section id="labels">
      <h2 class="text-2xl font-semibold mb-4">Record Labels</h2>
      <div id="labelTabs" class="flex flex-wrap space-x-2 mb-4"></div>
      <div id="labelContent"></div>
    </section>
  </main>

  <!-- Modal for artist details -->
  <div id="artistModal" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center">
    <div class="bg-gray-800 rounded-lg shadow-lg w-11/12 md:w-3/4 lg:w-1/2 p-6 relative">
      <button id="closeModal" class="absolute top-2 right-2 text-red-400 hover:text-red-600">✖</button>
      <h2 id="artistName" class="text-2xl font-bold mb-4"></h2>
      <canvas id="artistChart" height="200"></canvas>
      <div id="artistStats" class="mt-4"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="pricing.js"></script>
  <script src="weekdata.js"></script>
  <script src="app.js"></script>
</body>
</html>
